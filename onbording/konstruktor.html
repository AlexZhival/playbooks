<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Конструктор онбординга — A-Players</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Roboto+Slab:wght@500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>if(window.pdfjsLib)pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";</script>
<style>
  :root{
    --cream:#F4F1EA;--bg2:#EFE9D9;--card:#FCFAF4;--ink:#16201B;--muted:#5A6056;--line:#DCD4C2;
    --em:#143A2D;--em2:#1C4C3B;--gold:#B0822E;--gold-h:#977019;--gold2:#C79A45;
    --green:#3E8E5E;--red:#B23B2E;--amber:#C77A22;
    --serif:"Roboto Slab",Georgia,serif;--sans:"Manrope",system-ui,-apple-system,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--cream);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5}
  a{color:var(--em)}
  .app{display:grid;grid-template-columns:280px 1fr;min-height:100vh}
  /* sidebar */
  .side{background:var(--em);color:#EFE9DA;padding:22px 18px;position:sticky;top:0;height:100vh;overflow-y:auto}
  .brand{font-family:var(--serif);font-weight:800;font-size:18px;color:#fff;display:flex;align-items:center;gap:9px;margin-bottom:4px}
  .brand .dot{width:11px;height:11px;border-radius:3px;background:var(--gold2)}
  .side .sub{font-size:12px;color:#a9bcaf;margin-bottom:18px}
  .steps{display:flex;flex-direction:column;gap:3px}
  .snav{display:flex;gap:11px;align-items:flex-start;padding:9px 11px;border-radius:10px;cursor:pointer;color:#cdd8ce;transition:.12s}
  .snav:hover{background:rgba(255,255,255,.06)}
  .snav.on{background:rgba(199,154,69,.16);color:#fff}
  .snav .si{width:24px;height:24px;border-radius:7px;background:rgba(255,255,255,.1);display:grid;place-items:center;font-size:13px;font-weight:800;flex:none;font-family:var(--serif)}
  .snav.on .si{background:var(--gold);color:#19120A}
  .snav.done .si{background:var(--green);color:#fff}
  .snav.part .si{background:rgba(199,154,69,.35);color:#F4F1EA;box-shadow:inset 0 0 0 1px var(--gold)}
  .snav.part .sd{color:var(--gold)}
  .rqlist{margin-top:12px;display:flex;flex-direction:column;gap:8px}
  .rq{display:grid;grid-template-columns:minmax(260px,1.3fr) minmax(170px,.8fr) minmax(240px,1.2fr);gap:12px;align-items:start;border:1px solid var(--line);border-radius:12px;padding:11px 13px;background:#fff}
  @media(max-width:1000px){.rq{grid-template-columns:1fr}}
  .rq.ok{border-color:#bcd3c2;background:#F4F9F5}
  .rqm{display:flex;gap:10px;align-items:flex-start}
  .rqd{width:11px;height:11px;border-radius:50%;background:#d9d3c3;flex:none;margin-top:5px}
  .rq.ok .rqd{background:var(--green)}
  .rqtag{display:inline-block;margin-left:7px;font-size:10.5px;font-weight:800;letter-spacing:.03em;text-transform:uppercase;padding:2px 7px;border-radius:10px;background:#FBEFE0;color:#8A5A12;vertical-align:1px}
  .rqtag.opt{background:#EFEDE6;color:#6b6f66}
  .rql{display:block;font-size:11.5px;color:var(--gold);font-weight:700;margin-top:2px}
  .rqf{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .rqfile{font-size:12px;background:#EEF4EF;border:1px solid #cfe0d4;border-radius:7px;padding:3px 8px}
  .rqfile a{color:var(--muted);text-decoration:none;margin-left:4px}
  .rqlnk input,.lk input,.lk select{width:100%;font-family:var(--sans);font-size:13px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:#fff}
  .rqh{font-size:11.8px;line-height:1.4;margin-top:5px;color:var(--muted)}
  .rqk{font-weight:800;color:var(--em)}
  .rqw{color:var(--red);font-weight:700}
  .lklist{margin-top:12px;display:flex;flex-direction:column;gap:9px}
  .lk{display:grid;grid-template-columns:1fr 1.4fr 190px auto;gap:8px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:#fff}
  @media(max-width:900px){.lk{grid-template-columns:1fr}}
  .snav .st{font-size:13.5px;font-weight:600;line-height:1.25}
  .snav .sd{font-size:11px;color:#9fb0a4;margin-top:1px}
  .keybox{margin-top:18px;background:rgba(0,0,0,.16);border-radius:10px;padding:12px}
  .keybox label{font-size:11px;color:#a9bcaf;display:block;margin-bottom:5px}
  .keybox input,.keybox select{width:100%;background:rgba(255,255,255,.95);border:none;border-radius:7px;padding:8px 10px;font-size:13px;color:#16201B;margin-bottom:7px}
  /* main */
  .main{padding:34px 52px 90px;max-width:2400px;margin-inline:auto;width:100%}
  @media(min-width:2100px){.main{padding:44px 76px 120px}}
  .kick{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-h);font-weight:800}
  h1{font-family:var(--serif);font-weight:800;font-size:30px;letter-spacing:-.4px;margin:4px 0 6px}
  h2{font-family:var(--serif);font-weight:800;font-size:21px;color:var(--em);margin:22px 0 10px}
  h3{font-family:var(--serif);font-weight:700;font-size:16px;color:var(--em)}
  p.lead{color:var(--muted);font-size:16px;max-width:74ch}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-top:14px;box-shadow:0 6px 20px rgba(20,32,27,.05)}
  label.fl{font-size:13px;font-weight:600;color:var(--muted);display:block;margin-bottom:5px}
  input[type=text],input[type=number],textarea,select{width:100%;background:#fff;border:1.5px solid var(--line);border-radius:9px;padding:10px 12px;font-size:14.5px;font-family:inherit;color:var(--ink)}
  textarea{min-height:90px;resize:vertical}
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--em);box-shadow:0 0 0 3px rgba(20,58,45,.12)}
  .fg{margin-bottom:14px}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:820px){.app{grid-template-columns:1fr}.side{position:static;height:auto}.two{grid-template-columns:1fr}}
  .btn{display:inline-flex;align-items:center;gap:8px;border:none;border-radius:10px;padding:11px 18px;font-size:14.5px;font-weight:700;cursor:pointer;font-family:inherit;transition:.14s}
  .btn:hover{transform:translateY(-1px)}
  .btn.primary{background:var(--gold);color:#fff}
  .btn.dark{background:var(--em);color:#fff}
  .btn.ghost{background:#fff;border:1.5px solid var(--line);color:var(--em)}
  .btn.sm{padding:8px 13px;font-size:13px}
  .btn:disabled{opacity:.5;cursor:default;transform:none}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .rec{display:inline-flex;align-items:center;gap:7px;background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:9px 14px;font-weight:700;font-size:13.5px;cursor:pointer;color:var(--em)}
  .rec.on{background:#fbe9e6;border-color:var(--red);color:var(--red)}
  .rec .d{width:11px;height:11px;border-radius:50%;background:var(--red)}
  .rec.on .d{animation:pulse 1s infinite}
  @keyframes pulse{50%{opacity:.3}}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{border:1.5px solid var(--line);background:#fff;border-radius:20px;padding:7px 13px;font-size:13px;font-weight:600;cursor:pointer}
  .chip.on{border-color:var(--em);background:#EFF4EC;color:var(--em)}
  .statusbox{background:#fff;border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:10px;padding:12px 15px;font-size:14px;margin-top:12px;display:flex;align-items:center;gap:10px}
  .errbox{background:#fbecea;border:1px solid #e6c7c0;border-left:4px solid var(--red);border-radius:10px;padding:12px 15px;font-size:14px;margin-top:12px;color:#7a2318}
  .spin{width:16px;height:16px;border:2.5px solid var(--line);border-top-color:var(--gold);border-radius:50%;animation:sp .7s linear infinite;flex:none}
  @keyframes sp{to{transform:rotate(360deg)}}
  .note{background:#FBF6EC;border:1px solid var(--line);border-radius:10px;padding:11px 14px;font-size:13.5px;color:#6a4e17;margin-top:12px}
  .note.b{background:#EFF4EC;color:#1d3b2c;border-color:#c3d6c8}
  table.gt{width:100%;border-collapse:collapse;font-size:13.5px;background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-top:8px}
  table.gt th{background:var(--em);color:#EFE9DA;text-align:left;padding:8px 11px;font-size:12px;font-weight:700}
  table.gt td{padding:8px 11px;border-top:1px solid var(--line);vertical-align:top;min-width:112px}
  table.gt.narrow td{min-width:0}
  table.gt tr:nth-child(even) td{background:#faf7f0}
  .g{color:var(--green);font-weight:800}.y{color:var(--amber);font-weight:800}.r{color:var(--red);font-weight:800}
  ul.li{list-style:none;display:flex;flex-direction:column;gap:7px;margin-top:6px}
  ul.li li{position:relative;padding-left:22px;font-size:14px}
  ul.li li::before{content:"";position:absolute;left:0;top:8px;width:8px;height:8px;border-radius:2px;background:var(--gold);transform:rotate(45deg)}
  .brief-block{border:1px solid var(--line);border-radius:12px;margin-top:12px;overflow:hidden;background:#fff}
  .bb-h{background:var(--bg2);padding:11px 15px;font-weight:800;color:var(--em);font-size:14.5px;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
  .bb-body{padding:6px 15px 14px}
  .qa{padding:9px 0;border-bottom:1px dashed var(--line)}
  .qa:last-child{border-bottom:none}
  .qa .q{font-size:13px;color:var(--muted);font-weight:600;margin-bottom:4px}
  .skill{border:1px solid var(--line);border-radius:11px;padding:12px 14px;margin-top:10px;background:#fff}
  .skill .sh{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .skill .sname{font-weight:800;color:var(--em);font-size:14.5px}
  .grades{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:9px}
  .grade{border:1.5px solid var(--line);border-radius:9px;padding:9px 11px;font-size:12.5px;cursor:pointer;background:#fdfcf8}
  .grade .gl{font-weight:800;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--gold-h);margin-bottom:3px}
  .grade.on{border-color:var(--em);background:#EFF4EC}
  .grade.on .gl{color:var(--em)}
  .top5{margin-left:auto;font-size:12px;font-weight:700;color:var(--muted);display:flex;align-items:center;gap:6px;cursor:pointer}
  .top5 input{width:16px;height:16px}
  .pill{display:inline-block;font-size:11px;font-weight:800;border-radius:20px;padding:3px 9px}
  .pill.gold{background:rgba(176,130,46,.16);color:var(--gold-h)}
  .hidden{display:none}
  .out{margin-top:16px}
  .kmini{font-size:11px;color:var(--muted);margin-top:8px}
  /* устойчивая сетка статов */
  .statgrid{display:flex;flex-wrap:wrap;gap:14px;margin:12px 0}
  .stat-tile{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 18px;min-width:180px}
  .stat-tile .n{font-family:var(--serif);font-weight:800;font-size:30px;line-height:1.05}
  .stat-tile .l{font-size:12px;color:var(--muted)}
  /* рекомендация грейда */
  .recbadge{font-size:10.5px;font-weight:800;background:rgba(62,142,94,.16);color:var(--green);border-radius:20px;padding:2px 8px}
  .grade.grec{box-shadow:inset 0 0 0 2px var(--green);background:#EFF4EC}
  .grade.grec .gl{color:var(--green)}
  .reason{font-size:12px;color:var(--muted);margin-top:6px;font-style:italic}
  /* блок правок в каждом разделе */
  .fixbox{background:#FBF6EC;border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-top:14px}
  .fixbox h4{font-family:var(--serif);color:var(--em);font-size:15px;margin-bottom:8px}
  .fixbox textarea{min-height:64px}
  .card.edit{border:2px solid var(--gold2)}
  /* ---- скоркарта кандидатов ---- */
  table.sctable td{padding:6px 8px;min-width:0;vertical-align:middle}
  table.sctable th{white-space:nowrap}
  table.sctable td.scname input{width:150px;padding:7px 9px;font-size:13.5px;border:1px solid var(--line);border-radius:8px;font-family:inherit;font-weight:700;color:var(--em)}
  table.sctable td.sccell{padding:4px 5px}
  table.sctable td.sccell input{width:56px;padding:6px;font-size:13.5px;text-align:center;border:1px solid var(--line);border-radius:7px;font-family:inherit}
  table.sctable td.sccell input:focus,table.sctable td.scname input:focus{border-color:var(--gold);outline:none}
  table.sctable td.scsum,table.sctable td.scavg{font-family:var(--serif);font-weight:800;color:var(--em);text-align:center;background:#F4F1EA}
  table.sctable td.scnote textarea{width:210px;min-height:44px;padding:6px 8px;font-size:12.5px;border:1px solid var(--line);border-radius:8px;font-family:inherit;resize:vertical}
  .shortlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-top:6px}
  .b9x{display:flex;gap:11px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 13px}
  .b9x .nn{width:30px;height:30px;flex:none;border-radius:9px;background:linear-gradient(160deg,#C79A45,#B0822E);color:#fff;font-family:var(--serif);font-weight:800;display:flex;align-items:center;justify-content:center}
  .b9x b{display:block;color:var(--em);font-size:14.5px}
  .b9x span{display:block;font-size:11.5px;color:var(--muted);margin-top:2px}
  /* ---- отчётность: дашборд вакансий ---- */
  .vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px;margin-top:14px}
  .vcard2{background:#fff;border:1px solid var(--line);border-radius:14px;padding:15px 17px;cursor:pointer;transition:.15s;display:flex;flex-direction:column;gap:10px}
  .vcard2:hover{border-color:var(--gold2);transform:translateY(-2px);box-shadow:0 12px 30px rgba(20,32,27,.10)}
  .vc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .vc-name{font-family:var(--serif);font-weight:800;font-size:17px;color:var(--em);line-height:1.2}
  .vc-sub{font-size:11.5px;color:var(--muted);margin-top:3px}
  .vc-bars{display:flex;align-items:flex-end;gap:4px;height:38px;padding:2px 0;border-bottom:1px solid var(--line)}
  .vc-bars i{flex:1;background:linear-gradient(180deg,var(--gold2),var(--gold));border-radius:3px 3px 0 0;display:block}
  .vc-stats{display:flex;gap:16px}
  .vc-stats div{display:flex;flex-direction:column}
  .vc-stats b{font-family:var(--serif);font-size:20px;color:var(--em);line-height:1}
  .vc-stats span{font-size:11px;color:var(--muted);margin-top:2px}
  .vc-prog{height:6px;border-radius:4px;background:#EFE9D9;overflow:hidden}
  .vc-prog i{display:block;height:100%;background:linear-gradient(90deg,var(--gold2),var(--gold))}
  .vc-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:11.5px}
  .vc-foot .r{font-weight:700}
  .vc-open{color:var(--gold-h);font-weight:800;white-space:nowrap}
  /* ---- отчётность: дневной журнал ---- */
  .dayscroll{overflow-x:auto;margin-top:10px;border:1px solid var(--line);border-radius:10px;background:#fff}
  table.dayt{margin-top:0;border:none;border-radius:0}
  table.dayt th.stick,table.dayt td.stick{position:sticky;left:0;z-index:2;min-width:190px;background:#fff;font-weight:700;color:var(--em);box-shadow:1px 0 0 var(--line)}
  table.dayt th.stick{background:var(--em);color:#EFE9DA}
  table.dayt tr:nth-child(even) td.stick{background:#faf7f0}
  table.dayt th.dh{text-align:center;min-width:76px;white-space:nowrap}
  table.dayt th.dh span{display:block;font-size:10px;opacity:.55;cursor:pointer;font-weight:600}
  table.dayt th.dh span:hover{opacity:1;color:#ffb4a6}
  table.dayt td.dc{padding:4px 5px;min-width:0}
  table.dayt td.dc input{width:66px;padding:6px 7px;font-size:13px;text-align:center;border:1px solid var(--line);border-radius:7px;font-family:inherit}
  table.dayt td.dc input:focus{border-color:var(--gold);outline:none}
  table.dayt th.dtot,table.dayt td.dtot{background:#F4F1EA;font-weight:800;color:var(--em);text-align:center;min-width:74px}
  table.dayt th.dtot{background:var(--gold);color:#fff}
  .edblock{border:1px solid var(--line);border-radius:11px;padding:12px 14px;margin-top:12px;background:#fdfcf8}
  .edblock .edh{font-weight:800;color:var(--em);margin-bottom:2px}
  .edblock textarea{min-height:38px}
  .edlist .row textarea{flex:1}
  /* диктофон-модалка */
  .dov{position:fixed;inset:0;z-index:9999;background:rgba(14,27,21,.55);display:flex;align-items:center;justify-content:center}
  .doc{background:var(--card);border-radius:18px;padding:26px 26px 22px;width:520px;max-width:92vw;box-shadow:0 30px 80px rgba(0,0,0,.4);text-align:center}
  .doc h3{font-size:19px}
  .doc .sub{font-size:13px;color:var(--muted);margin:4px 0 16px}
  .mic{width:88px;height:88px;border-radius:50%;border:none;cursor:pointer;background:var(--em);color:#fff;font-size:34px;margin:0 auto;display:grid;place-items:center;transition:.15s}
  .mic.rec{background:var(--red);animation:mic 1.1s infinite}
  @keyframes mic{0%,100%{box-shadow:0 0 0 0 rgba(178,59,46,.5)}50%{box-shadow:0 0 0 16px rgba(178,59,46,0)}}
  .dtrans{background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;min-height:96px;max-height:200px;overflow-y:auto;text-align:left;font-size:14px;margin:16px 0 6px;white-space:pre-wrap}
  .dtrans .interim{color:var(--muted)}
  .dwrap{display:flex;gap:10px;justify-content:center;margin-top:12px}

  .hidden{display:none}
  .fchips{display:flex;gap:4px;flex-wrap:wrap}
    .fchip{width:24px;height:24px;border-radius:7px;border:1.5px solid var(--line);background:#fff;color:var(--muted);font-size:11.5px;font-weight:800;display:flex;align-items:center;justify-content:center;cursor:pointer}
    .fchip.on{background:var(--em);border-color:var(--em);color:#fff}
    .fmini{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px}
    .fmini span{font-size:12.5px;background:#F4F1EA;border:1px solid var(--line);border-radius:8px;padding:5px 10px;color:var(--em);font-weight:600}
    .covgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:9px;margin-top:6px}
    .covc{background:#fff;border:1px solid var(--line);border-radius:11px;padding:10px 12px;opacity:.55}
    .covc.has{opacity:1;border-color:#bcd3c2;background:#F5FAF6}
    .covc b{display:block;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--gold-h)}
    .covc span{display:block;font-family:var(--serif);font-size:15px;color:var(--em);margin-top:1px}
    .covc i{display:block;font-size:11.5px;color:var(--muted);font-style:normal;margin-top:3px}
    .lbgrid{display:flex;flex-direction:column;gap:9px;margin-top:10px}
    .lbq{background:#fff;border:1px solid var(--line);border-left:3px solid #bcd3c2;border-radius:10px;padding:10px 13px}
    .lbq.gap{border-left-color:var(--gold);background:#FBF6EC}
    .lbq.part{border-left-color:var(--amber)}
    .lbqh{font-size:13.5px;font-weight:700;color:var(--em);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
    .lbt{font-size:10px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;border-radius:20px;padding:2px 8px}
    .lbt.gap{background:rgba(176,130,46,.18);color:var(--gold-h)}
    .lbt.part{background:rgba(199,122,34,.16);color:var(--amber)}
    .lbt.ok{background:rgba(62,142,94,.14);color:var(--green)}

   {t:"3.3 JTBD: что клиент «нанимает» продукт делать",need:"3–5 «работ» с расшифровкой: функциональная, эмоциональная, социальная · за каждой работой — реальная фраза клиента · чем «работа» отличается от характеристики продукта",ask:"«Что на самом деле покупает клиент — не продукт, а что глубже?» у лучших менеджеров · дословные формулировки клиентов"},
   {t:"3.4 CJM: путь клиента к покупке",need:"5 ключевых этапов от осознания проблемы до покупки · что клиент думает, чувствует и делает на каждом · где он чаще всего отваливается · что менеджер делает на каждом этапе",ask:"Путь клиента от маркетинга · аналитика точек отвала · наблюдения РОПа"},
   {t:"3.5 Квалификация: определить «своего» за 5 минут",need:"Конкретные критерии квалифицированного лида, а не абстрактное описание · признаки горячего и холодного · ABC-логика с порогами · где фиксируется сегмент в CRM · вопросы, которые квалифицируют быстро",ask:"«По каким признакам за первые минуты понимаешь, что человек скорее купит?» у лучших МОП · критерии квала от РОПа"},
   {t:"3.6 Применение: как знание клиента меняет разговор",need:"Практический разбор: один и тот же продукт трём разным сегментам · как меняются первый вопрос, аргумент и темп · практическое задание: квалифицировать 3 реальных кейса",ask:"Реальные кейсы для разбора · примеры удачной подстройки под сегмент"},
   {t:"3.7 Сегментации A-Players: ABCDE, AABBCC и DISC",need:"Три разные сегментации под три разные задачи, их нельзя смешивать · ABCDE — сегментация входящих лидов по жару и потенциалу: определяет, кому звонить первым и с каким нормативом SLA 1 · AABBCC — сегментация существующей базы по связке «потенциал против факта»: показывает, где клиент покупает меньше, чем мог бы, и куда идти с апсейлом · DISC — психотип клиента: под него адаптируется темп речи, объём аргументации и формулировки каскада · по каждой сегментации: критерии отнесения, где фиксируется в CRM, что меняется в работе менеджера · RFM как отдельный взгляд на базу: давность, частота, сумма — кого возвращать первым",ask:"Какие сегментации уже используются и по каким критериям · где сегмент фиксируется в карточке · как отличается работа менеджера по сегментам · есть ли выгрузка базы для RFM"}],
  brief:["ICP: портрет идеального клиента детально", "Сегменты: чем отличаются, что ценят, как работать по-разному", "JTBD: какие «работы» клиент нанимает продукт выполнять", "CJM: путь от осознания проблемы до покупки", "ЛПР и ЛВР: кто решает, кто влияет", "Страхи и стоп-факторы перед покупкой", "Признаки горячего и холодного лида", "Анти-ICP: с кем не работаем и почему", "Сегментация входящих лидов: критерии A, B, C, D, E и приоритет работы", "Сегментация базы по потенциалу и факту (AABBCC): кто покупает меньше, чем может", "Используем ли DISC и как меняем разговор под психотип"],research:{topic:"аудитория, её боли и язык",brief:"Найди, как эта аудитория говорит о своей проблеме своими словами: формулировки из отзывов, форумов, обсуждений. Какие возражения и страхи звучат публично. Какие альтернативы люди рассматривают.",blocks:"(1) «Язык клиента: как он описывает проблему» — kind=list, дословные формулировки с указанием источника. (2) «Публичные страхи и возражения» — kind=table, columns=[Возражение, Как звучит дословно, Что за ним стоит]. (3) «Альтернативы, которые рассматривает клиент» — kind=table, columns=[Альтернатива, Почему выбирают, Наш контраргумент]. (4) «Что дописать в Слой 3» — kind=list."},practice:LPRACTICE.l3,kpi:["Назвать 3–5 сегментов с критериями квалификации","По каждому сегменту — 2–3 ключевых JTBD","Объяснить, чем мотивация ЛПР отличается от ЛВР","Определить категорию нового контакта за 5 минут","Определить сегмент клиента и объяснить, что в разговоре меняется"]},

 {id:"l4",n:4,title:"Продажи",sub:"Воронка · Discovery · Питч · Возражения · Закрытие · Follow-up",
  lessons:11,min:"120–150",quiz:22,thr:85,days:"День 10–15",bloom:"Все уровни, кроме «Создавать»",
  why:"Здесь знания превращаются в действие. Воронка — это общий язык команды: если менеджер не знает, на каком этапе сделка и что зафиксировать, его pipeline непрозрачен и для него самого, и для РОПа. Здесь же лежат две вещи, которые прямо двигают выручку на той же базе: продуктовый и финансовый каскад — порядок, в котором менеджер предлагает тарифы и способы оплаты. Средний чек растёт не от «уметь продавать», а от системы: без каскада каждый продаёт «как ему удобнее», и это всегда минимальный тариф и рассрочка. Порог 85% выше базового: ошибка на этом слое стоит сделки, а не оценки.",
  mistake:"Давать скрипт как текст для заучивания — скрипт это алгоритм с развилками, а не монолог, иначе менеджер ломается на первом нестандартном ответе. Описывать воронку в отрыве от CRM: если в обучении «этап X», а в системе он называется иначе — новичок путается. И самое дорогое: учить каскадам как «рекомендации». Каскад проверяется бинарно — соблюдён или не соблюдён; без ежедневного контроля через ОКК он через месяц превращается в декоративный документ, а команда возвращается к «как удобнее».",
  blocks:[
   {t:"4.1 Воронка продаж: этапы, переходы, обязательные поля",need:"Все этапы точно так, как называются в CRM · по каждому: что должно произойти для перехода, обязательные действия, обязательные поля, SLA, вероятность в Forecast · железное правило A-Players: этап фиксирует ФАКТ, произошедший с клиентом («Принят в работу», «Квалифицирован», «Получил предложение», «Подписал договор», «Оплатил»), а не состояние менеджера («Переговоры», «Интерес», «Согласование условий») · различие Воронки 1 и Воронки 2",ask:"Схема воронки из CRM с точными названиями · регламент ОП · SLA по этапам · проверить формулировки этапов на «факт, а не намерение»"},
   {t:"4.2 Как рождается наш скрипт: от прослушки лучших до калибровок",need:"Скрипт — не текст с сайта и не фантазия маркетолога, он собран из речи лучших менеджеров · процесс: бриф продукта и категории клиентов → прослушка звонков лучших (вопросы клиентов, возражения, сильные фразы, работа с голосом) → анализ конкурентов → структура скрипта → речевые модули по блокам · блоки скрипта: установление контакта · программирование · квалификация · выявление потребности · презентация · работа с возражениями · предзакрытие · закрытие в оплату · внутри модулей размечены паузы и акценты · кто верифицирует: директор по продукту, коммерческий директор, директор по маркетингу, фаундер · где живёт: сначала Excel, потом Call Helper или HyperScript · как обновляется: анализ конверсии по блокам скрипта, действия ОКК и руководителя · отдельные скрипты на 2-е и 3-е касание, шаблоны для почты и мессенджеров",ask:"Кто автор действующего скрипта и на чём он основан · записи звонков лучших менеджеров для разбора · кто подписывает финальную версию · где скрипт лежит и как часто обновлялся за последний год"},
   {t:"4.3 Discovery-звонок: выявление потребности",need:"Структура звонка по этапам · блок вопросов SPIN или аналог · вопросы, после которых клиент сам себя дожимает · как «раскачать» боль · дословные формулировки открытия · норматив разговора: менеджер говорит меньше, чем слушает",ask:"«Скажи дословно первые 2–3 фразы» и «какие вопросы задаёшь, чтобы понять боль» у лучших МОП · записи discovery-звонков"},
   {t:"4.4 Презентация и питч под конкретного ЛПР",need:"Как показывать продукт под боль конкретного человека, а не как рекламу · что акцентировать и что не говорить · как менять питч под сегмент · связка «характеристика → преимущество → выгода» на живом примере · две заученные устные версии рассказа о компании и продукте с жёстким лимитом: 3 минуты (до 400 слов) для телефона и 7 минут (до 900 слов) для встречи · обязательные блоки в обеих: проблема, решение, продукт, для кого, доказательство результата, условия, следующий шаг · короткая версия — отдельный текст, а не сокращённая длинная · тренируется вслух с секундомером до попадания в лимит; пока не уложился — не выходит на клиента",ask:"«Как показываешь продукт, чтобы било в боль?» у лучших МОП · записи презентаций · как фаундер и топы рассказывают о компании на встрече — запись или расшифровка · сколько в среднем длится наш первый звонок и первая встреча"},
   {t:"4.5 Продуктовый каскад: от флагмана вниз и только по возражению",need:"Каскад — это про ПОРЯДОК, а не про «что продавать»: зафиксированная последовательность, которую можно проверить, а не «на усмотрение менеджера» · четыре шага: (1) флагман — самый ПРИБЫЛЬНЫЙ продукт, а не самый дорогой, задаёт ценовой якорь; (2) средний тариф — только при возражении «дорого/избыточно», формулируется как «всё то же, но без функции, которая именно вам не нужна»; (3) базовый — только при возражении по среднему, с чётким обозначением ограничений; (4) апсейл и кросс-селл — обязательный шаг после согласования тарифа, даёт 15–30% чека · переход строится по принципу «следствие возражения», а не «а ещё у нас есть» · разные каскады под разные сегменты: у enterprise и SMB разный флагман · дословные формулировки каждого шага в ToV компании и разбор «слабая формулировка vs сильная» · главная ошибка: перечислить все тарифы снизу вверх и спросить «что вам больше подходит» — клиент выберет минимальный",ask:"Прайс со ВСЕМИ тарифами и маржинальностью по каждому — без маржи каскад не построить · какой продукт приоритетный для бизнеса · дословные фразы перехода между тарифами у лучших менеджеров · какие апсейлы и кросс-селлы существуют · разные ли каскады для разных сегментов"},
   {t:"4.6 Финансовый каскад: способ оплаты — это тоже продукт",need:"Порядок предложения оплаты: (1) полная оплата со стимулом; (2) рассрочка от банка; (3) кредит от банка; (4) внутренняя рассрочка — только крайний случай · экономика для бизнеса: полная оплата — деньги сразу без комиссии; рассрочка банка — комиссия 3–7%; кредит — 5–15%; внутренняя рассрочка — высокий churn по выплатам, дебиторка, кассовый разрыв · стимулы для полной оплаты: скидка 5–10% · бонусный модуль или обучение · ускоренный старт · приоритетный сервис · фиксация цены; стимул должен быть реальной ценностью, а не формальной плюшкой · сценарий при отказе банка: каскад банков-партнёров, а не сразу внутренняя рассрочка · главная ошибка: назвать все способы сразу «как вам удобнее» — клиент выберет удобный себе, а не выгодный бизнесу · AR (Approval Rate) — доля одобренных заявок от поданных, и это метрика МЕНЕДЖЕРА, а не банка: одобрение зависит от того, как заполнена анкета и как подготовлен клиент · «подстелить соломку» ДО подачи — заранее нормализовать возможный отказ: «решение принимает робот по скорингу, отказ первого банка — это не про вас лично, у нас есть ещё варианты»; без этого первый отказ читается как приговор и клиент выходит из сделки · ведение по анкете пошагово, а не «заполните и напишите»: авторизация, проверка данных, что указывать в доходе, страховка — на каждом шаге менеджер на линии · ограничения и запретные формулировки по каждому банку: возраст, стаж, тип занятости, автосписание — что обещать нельзя · при отказе — чек-лист «что можем изменить»: срок, сумма, первый взнос, созаёмщик, и переподача в следующий банк каскада, а не сразу внутренняя рассрочка · не выкладывать все альтернативы в первый звонок — держим запас на второе касание · внутренняя рассрочка только после отказа банков и с жёсткими рамками: 30–50% суммы сразу, остаток не более чем в 2 платежа за 60–90 дней, всё в договоре, и только повторным клиентам с историей платежей",ask:"Все способы оплаты и комиссия по каждому · текущий AR по каждому банку-партнёру и топ-3 причины отказов · что менеджеру произносить нельзя по каждому банку · доля сделок, потерянных на отказе банка, за последние 3 месяца · какая доля оплат сейчас полная и какая в рассрочку · какой churn по внутренней рассрочке и сколько сейчас дебиторки · какие стимулы для полной оплаты можно дать реально · банки-партнёры и порядок обращения к ним"},
   {t:"4.7 Возражения: топ-5 по продукту, цене и конкурентам",need:"Таблица: возражение → что за ним стоит → ответ дословно → пример · схема отработки (например «СУО»: согласие — уточнение — обработка) · отдельно ценовые и конкурентные · правило «ценность до цены» · связка с каскадом: возражение по флагману — это не отказ, а сигнал перейти на следующую ступень",ask:"Топ-5 возражений с дословными ответами у каждого из лучших менеджеров · записи отработки возражений"},
   {t:"4.8 Закрытие сделки: мягкие техники без давления",need:"3–5 рабочих техник с дословными формулировками и указанием, когда какую применять · разница между дожимом и давлением · что говорить, когда человек почти готов, но колеблется · работа с дедлайнами и ограничениями без «впаривания» · молчание после названной цены",ask:"«Какими приёмами дожимаешь до оплаты?» · «Вспомни сложную сделку, которую вытащил — что стало переломным?»"},
   {t:"4.9 Регламент касаний: TLT, SLA 1 и SLA 2",need:"Что считается касанием: любое действие менеджера по сделке — звонок, письмо, сообщение, задача · TLT (Time from Last Touch) — сколько дней сделка стоит без касания; норматив: не более 1 дня для горячих и 2 дней для тёплых · SLA 1 — время от появления лида до принятия в работу и первого звонка; бенчмарк не более 5 минут · SLA 2 — сколько сделка стоит на конкретном этапе; норматив свой на каждый этап (например «Принят в работу» — не более 2 дней) · ежедневный чек-лист менеджера: сделки с TLT выше нормы, сделки, зависшие на этапе, лиды без первого касания · follow-up: сколько касаний, в какие интервалы, по каким каналам, шаблоны сообщений · что делать, когда клиент сказал «подумаю» и пропал · модель компетенций: A — отслеживает TLT/SLA по каждому лиду и сам делает корректирующие действия; B — понимает метрики, но не использует; C — игнорирует сигналы · новичку нормативы вводятся плавно: первые дни мониторинг с мягкой обратной связью, затем спрос",ask:"Есть ли в CRM поля и фильтры TLT, SLA 1, SLA 2 · нормативы по каждому этапу · регламент касаний и шаблоны сообщений · где смотреть дашборд · считает ли CRM касания автоматически"},
   {t:"4.10 Критические ошибки продаж",need:"Топ-6 ошибок, которые ведут к потере сделки, с объяснением механики · отдельно ошибки каскада: начал с минимального тарифа и убил якорь · предложил все способы оплаты сразу · не дал стимул за полную оплату · сделал внутреннюю рассрочку основной альтернативой · не разделил каскады по сегментам · убрал апсейл после согласия клиента · как проверить себя · что делать, если ошибка уже допущена · пять групп критических ошибок, за которые сделка автоматически уходит в дожим — универсальный список, настраивается в речевой аналитике один раз: (1) КВАЛИФИКАЦИЯ НЕ ПРОВЕДЕНА — не выяснена главная потребность, не определена срочность, не понят бюджет, не понято ЛПР; (2) ВОЗРАЖЕНИЕ НЕ ЗАКРЫТО — ни одного встречного вопроса на возражение, общий ответ на конкретное возражение, клиент повторил одно возражение дважды и больше; (3) НЕТ ПРИЗЫВА К ОПЛАТЕ — разговор закончен без конкретного следующего шага, шаг не закреплён задачей и датой в CRM, клиент был готов, а предложения оплатить не прозвучало; (4) НЕЦЕЛЕВАЯ ПРЕЗЕНТАЦИЯ — рассказал о продукте, не связав с задачей клиента, презентовал не тот тариф, клиент не понял, за что платит; (5) НАРУШЕНИЕ СТАНДАРТОВ ОБЩЕНИЯ — перебивания сверх норматива, долгие паузы без объяснения, обещания не по регламенту, давление и манипуляции · по каждой группе: как это звучит в записи и что сказать вместо · на старте настраиваются не все триггеры, а 3–5 самых частых: слушаем 30–50 проигранных сделок, ранжируем по частоте и деньгам, берём ТОП-5 — избыточные триггеры превращают систему в шум",ask:"«Какие ошибки чаще всего совершают новички?» у лучших МОП и РОПа · разбор 3–5 звонков, где каскад был нарушен, с оценкой потерянных денег · 30–50 записей проигранных сделок, чтобы отобрать свои ТОП-5 ошибок · какие триггеры уже настроены в речевой аналитике"},
   {t:"4.11 Воронка дожима: сделка не умирает в «не реализовано»",need:"Дожим — отдельный управляемый контур возврата сделок со своими ответственными, скриптами и учётом, а не «давайте иногда вспоминать старые сделки» · экономика: 20–40% сделок из «не реализовано» возвращаемы, контур стабильно даёт +10–15% к месячной выручке без роста бюджета на маркетинг · работает при цикле сделки от 3 дней и чеке от 20 000 ₽ · два равноправных автоматических источника, оба ведут в ОДНУ воронку: (1) AI ОКК — речевая аналитика слышит критическую ошибку менеджера в день звонка, пока клиент ещё тёплый, конверсия дожима в 2–3 раза выше классической; (2) CRM-триггеры — сделка перестояла норматив на этапе или лежит в «не реализовано» · обязательное условие входа: клиенту уже сделано конкретное предложение с суммой — ссылка на оплату, счёт, КП или оферта; если оффера не было, это не дожим, а обычная работа по воронке · правило маршрутизации: дожимает НЕ тот, кто потерял — менеджер, сливший сделку, в 80% случаев сольёт и на повторе · приоритет передачи: отдельная группа дожима → сильнейшие действующие менеджеры → РОП лично по крупным чекам · скрипт дожима — это НОВЫЙ оффер под причину отказа, а не повтор прежнего аргумента · что это значит лично для новичка: твои непроработанные сделки уходят к другим, придержать их нельзя; причина закрытия важнее, чем кажется — от неё зависит, когда и с чем сделка вернётся; попасть в команду дожима — признание уровня, а не наказание",ask:"Есть ли воронка дожима, кто её ведёт и где она живёт в CRM · доля сделок в «не реализовано» за квартал и сколько из них возвращали · регламент передачи сделки и что менеджер обязан оставить в комментарии · подключена ли речевая аналитика и какие триггеры уже настроены"}],
  brief:["Этапы воронки с точными названиями из CRM", "Скрипт первого контакта: дословные формулировки открытия", "Вопросы выявления потребности", "Как показываем продукт под боль", "Работа с ценой: когда и как называем", "Топ-10 возражений и дословные ответы", "Техники закрытия, которые реально работают", "Follow-up: сколько касаний, через какие каналы, что пишем", "Записи эталонных звонков (ссылки)", "Прайс со всеми тарифами И маржинальностью по каждому — какой продукт самый прибыльный", "Продуктовый каскад: что предлагаем первым и в каком порядке идём вниз", "Разные ли каскады для разных сегментов клиентов и чем отличаются", "Все способы оплаты и комиссия по каждому; какая доля оплат сейчас полная", "Чем стимулируем полную оплату (скидка, бонус, ускоренный старт, фиксация цены)", "Нормативы TLT, SLA 1 и SLA 2: сколько дней без касания допустимо и за сколько берём лид в работу", "Кто автор действующего скрипта, на чём он основан и кто подписывает новую версию", "Есть ли воронка дожима: кто ведёт, какие сделки туда попадают, сколько возвращается", "Обязательное условие входа в дожим: что у нас считается отправленным оффером", "Кому передаётся сделка на дожим и по какому правилу", "Банки-партнёры: условия, текущий AR по каждому и топ-3 причины отказа", "Рамки внутренней рассрочки: стартовый платёж, число платежей, срок, кому не даём"],practice:LPRACTICE.l4,kpi:["Знать структуру воронки и критерии перехода","Провести discovery-звонок без подсказок","Отработать топ-5 возражений каждого типа","Соблюдать правило «ценность до цены» и отправлять КП в срок","Провести продуктовый каскад: начать с флагмана и спуститься только по возражению","Провести финансовый каскад: предложить полную оплату со стимулом до альтернатив","Держать TLT в норме: ни одной сделки без касания дольше норматива","Взять новый лид в работу за 5 минут и зафиксировать касание в CRM","Объяснить, что происходит с его сделкой после статуса «не реализовано»","Закрыть сделку корректной причиной отказа, по которой сработает нужный триггер дожима","Подготовить клиента к возможному отказу банка ДО подачи заявки и переподать в следующий банк каскада","Выдать питч на 3 минуты и на 7 минут, уложившись в лимит, без бумажки"]},

 {id:"l5",n:5,title:"CRM",sub:"Сущности · Воронки · Квалификация · SLA · Страйки",
  lessons:9,min:"60–90",quiz:18,thr:90,days:"День 3–7",bloom:"Запомнить · Понять · Применить",
  why:"CRM — операционная нервная система продаж. Менеджер, который не умеет в ней работать, теряет сделки, даже если отлично ведёт переговоры. Слой решает три задачи: операционная точность, прозрачность воронки для руководителя и культура данных — понимание, что CRM это не надзор, а инструмент собственного успеха. Порог 90%, самый высокий в программе.",
  mistake:"Писать «нажми кнопку Сохранить» вместо реальных названий полей и статусов конкретной системы. Инструкция должна дословно повторять интерфейс, иначе новичок не найдёт и начнёт делать по-своему.",
  blocks:[
   {t:"5.1 Архитектура CRM: четыре сущности",need:"Определение Лида, Сделки, Контакта, Компании · когда создаётся каждая и как они связаны · практический пример: один клиент на разных этапах · типичные ошибки путаницы и их последствия (дубли, потеря истории)",ask:"Логика и названия сущностей в вашей CRM · примеры правильно заведённых карточек"},
   {t:"5.2 Воронка 1: работа с новыми лидами",need:"Полный путь лида от создания до конвертации или брака · по каждому этапу: название, что происходит, обязательные действия и поля · критерий перехода · как создаётся лид автоматически и вручную · когда и как забраковывать с указанием причины · правило: лид не остаётся без следующего действия",ask:"Скриншоты воронки, список этапов, правила браковки"},
   {t:"5.3 Квалификация и ABC-сегментация",need:"Конкретные критерии квалифицированного лида · логика ABC для нового и действующего клиента · таблица критериев по сегментам · где в карточке фиксируется сегмент · связь сегмента с приоритетом работы",ask:"Критерии сегментации, поле в CRM, приоритеты по сегментам"},
   {t:"5.4 Воронка 2 и аккаунт-менеджмент",need:"Чем Воронка 2 отличается от первой: логика, цели, метрики · что поддерживается в карточке действующего клиента · правило последнего касания: максимум дней без контакта · апсейл-логика · как формировать прогноз",ask:"Регламент работы с базой, правило TLT, апсейл-матрица"},
   {t:"5.5 SLA, дела и задачи",need:"Нормативы времени по каждому этапу и что происходит при нарушении · TLT, SLA 1 и SLA 2 как единый язык отдела: не «долго не звонил», а конкретная цифра · разница между делом и задачей · правило следующего шага: каждый контакт = новое запланированное действие · как вести переписку через CRM · напоминания на закрытые сделки",ask:"Таблица SLA, регламент коммуникации, правила по мессенджерам"},
   {t:"5.6 Страйки и контроль качества",need:"Полный список нарушений, за которые начисляются страйки · порог и последствия · топ-6 критических ошибок с объяснением, почему ведут к потере сделки · признаки качественно заполненной карточки · как исправить уже допущенную ошибку",ask:"Политика страйков (если нет — сформулировать с РОПом), примеры нарушений"},
   {t:"5.7 Дашборд TLT и SLA: как за пять минут найти забытые сделки",need:"Три метрики, по которым отдел живёт ежедневно: TLT — дней без касания, SLA 1 — время взятия лида в работу, SLA 2 — время на этапе · нормативы: TLT не более 1 дня для горячих и 2 для тёплых; SLA 1 не более 5 минут по горячему, до 30 минут по среднему, до 2 часов по холодному; SLA 2 свой на каждый этап · что считается касанием: звонок, письмо, сообщение, задача — и это должно считаться автоматически · алгоритм разбора: смотрим воронку → находим этап со скоплением сделок → проваливаемся в дашборд → смотрим SLA 2 и TLT по каждой сделке → сортируем по TLT от большего → разбираем сверху · личный чек-лист менеджера на утро: сделки с TLT выше нормы, зависшие на этапе, лиды без первого касания · руководитель проходит по дашборду раз в 2–3 дня",ask:"Есть ли поля и фильтры TLT / SLA 1 / SLA 2 в CRM · где лежит дашборд и кто его смотрит · нормативы по каждому этапу · считает ли система касания автоматически или вручную"},
   {t:"5.8 Защитный пул новичка и маршрутизация лидов",need:"Первые 30 дней новичок работает на отдельном защитном пуле — горячие лиды на него не маршрутизируются, пока он не подтвердил результат · критерий выхода в общий поток фиксируется заранее: конверсия, число доведённых до КП сделок или сдача аттестации · как устроено автораспределение: два пула, round-robin, исключения · признаки горячего и холодного лида в нашем бизнесе · связка сегмента лида с приоритетом и с нормативом SLA 1 · правило: повторное обращение клиента — горячий лид по умолчанию",ask:"Как сейчас распределяются лиды и есть ли отдельный пул для новичков · по какому критерию новичок начнёт получать общий поток · признаки горячего лида в вашей нише · кто настраивает распределение в CRM"},
   {t:"5.9 Дожим в CRM: триггеры, причины отказа, передача сделки",need:"Где живёт воронка дожима: отдельная воронка или отдельный статус, у кого к ней доступ · триггеры по давности: «Квалифицирован» дольше 2 дней без движения · счёт выставлен, оплаты нет дольше 2 дней · ссылка на оплату отправлена, оплаты нет дольше 2 дней · КП отправлено, реакции нет дольше 3 дней · триггеры по причине отказа в «не реализовано», разные причины дают разные сроки: «не сейчас / подумаю» — 5 дней, «нет денег / дорого» — 5 дней с альтернативным тарифом или рассрочкой, недозвон после согласования — 5 дней, отказ банка — 14 дней, чтобы хватило на AR-сценарий и каскад банков · отсюда правило: причину отказа нельзя ставить наугад — от неё зависит, когда и с каким оффером сделка вернётся, и это самая частая ошибка новичка в карточке · финальные причины, после которых сделка в дожим НЕ идёт: жёсткий отказ, ушёл к конкуренту и купил, не наша ЦА, нет контакта — формулировки фиксированы списком, своих не придумываем · что менеджер обязан оставить при передаче: комментарий, на какой ступени каскада остановились и по какому возражению спустились · в карточке сделки — блок со скриптами продуктового и финансового каскада: формулировка нужна в момент разговора, а не после него",ask:"Точные формулировки причин отказа из CRM · какие триггеры дожима настроены и с какими сроками · где лежат скрипты каскадов и видны ли они прямо в карточке сделки · кто имеет доступ к воронке дожима и как оформляется передача"}],
  brief:["Какая CRM и как называются сущности", "Все статусы сделок с описанием", "Критерии перехода между этапами", "SLA по каждому этапу и последствия нарушения", "Обязательные поля карточки", "Политика страйков и критические ошибки", "Правило владения лидом: за кем закреплён и на сколько", "Как ведём переписку и напоминания", "Нормативы TLT, SLA 1 и SLA 2: сколько дней без касания допустимо, за сколько берём лид в работу", "Есть ли дашборд TLT/SLA, кто и как часто по нему проходит", "Правила распределения лидов: пулы, round-robin, исключения", "Работает ли новичок первые 30 дней на защитном пуле и как из него выходит", "Полный список причин отказа с точными формулировками из CRM", "Какие триггеры автодожима настроены и с какими сроками по каждой причине", "Где в карточке сделки менеджер видит скрипты каскадов"],practice:LPRACTICE.l5,kpi:["Создать лид, квалифицировать и конвертировать в сделку без подсказок","Знать все этапы и критерии перехода","Фиксировать каждое касание и соблюдать SLA","Объяснить разницу между Лидом, Сделкой, Контактом и Компанией","Найти по дашборду свои зависшие сделки и объяснить, что с каждой делать","Держать TLT в норме и брать новый лид в работу за 5 минут","Закрыть сделку с корректной причиной отказа и сказать, через сколько дней она вернётся в дожим"]},

 {id:"l6",n:6,title:"Конкуренты",sub:"Карта рынка · Отстройка · Боевые карточки · Возражения",
  lessons:4,min:"40–55",quiz:8,thr:80,days:"День 15–16",bloom:"Понять · Применить · Анализировать",
  why:"Слой стоит именно здесь не случайно. Менеджер, не знающий свой продукт, но знающий конкурентов, — продаёт конкурентов. Сначала Слои 2–5, и только тогда конкурентная карта становится инструментом, а не источником неуверенности. Цель не «разгромить конкурента», а честно объяснить, в каких задачах мы выигрываем и почему.",
  mistake:"Три ловушки: слишком много конкурентов — менеджер запомнит 3–4, остальное шум; сравнение по 20 параметрам вместо 3–5 решающих для клиента; и «говорить плохо о конкурентах» — клиент читает это как неуверенность и непрофессионализм.",
  blocks:[

/* ================= ЭТАЛОН ДИАГНОСТИКИ РОЛИ (менеджер ОП, платформа Завод) ================= */
const DIAG_REF=`Диагностика A-игрока для роли «Менеджер отдела продаж» — 18 моделей поведения, сгруппированных по 4 группам (Клиент и коммуникация · Процесс и дисциплина · Результат и деньги · Развитие и команда).
Шкала одинакова для всех моделей: A — делаю на уровне эксперта · B — делаю уверенно, сам · C — делаю по инструкции · D — нужна помощь · E — только с руководством.
Баллы: A=5, B=4, C=3, D=2, E=1. У каждой модели свой вес (0.8–1.5) — чем сильнее модель влияет на результат роли, тем выше вес.
Каждая модель содержит: группу, название навыка, вес, focus (одна фраза — что именно человек делает), пять развёрнутых формулировок A/B/C/D/E от лица сотрудника (не оценочно, а описательно: «за первые минуты считываю психотип…»), и dev — конкретное действие для роста на один уровень.
Итог: процент от максимума → уровень (A-Player ≥85% «эталон отдела, копируют тебя», B ≥70%, C ≥55%, D ≥40%, E ниже). Плюс loss_pct — сколько процентов результата теряется на каждом уровне (A=0, B=5, C=15, D=30, E=40).
Пример модели: группа «Клиент и коммуникация», навык «Сегментация клиента и подстройка», вес 1.3, focus «Определять психотип и сегмент клиента за первые минуты и менять под него подачу». Вариант A: «За первые минуты считываю психотип (доминантный/тщательный/постоянный/инициативный), теплоту и частоту, и осознанно меняю темп и аргументы». Вариант E: «Не разделяю клиентов по типам, подстройки под собеседника у меня почти нет». dev: «Разбирай 3 записи своих звонков в неделю с РОПом на предмет — какой это был психотип и где я не подстроился».`;

const COMMON_SCHEMA='Верни СТРОГО один валидный JSON и больше ничего: {"title":"","blocks":[{"h":"заголовок блока","kind":"list|table|text","items":["пункт"],"columns":["колонка"],"rows":[["ячейка"]],"text":"абзац"}]}. Для kind=list заполни items; для kind=table — columns и rows; для kind=text — text. Всё на русском, предметно, без воды. Максимум 9 блоков; в таблице до 20 строк, если этого требует задание (например, тест на 14 вопросов). В поле text не используй markdown: подзаголовок — отдельной строкой ЗАГЛАВНЫМИ, перечисление — тире в начале строки. Звёздочки и решётки не ставь — они будут видны пользователю как есть.';
const METHOD='Ты — методист по корпоративному обучению с опытом 10+ лет. Пишешь учебный контент для платформы онбординга. Правила: (1) пиши только то, что подтверждено брифом компании — ничего не выдумывай; (2) там, где данных не хватает, ставь пометку [НУЖНО УТОЧНИТЬ: что именно и у кого]; (3) язык клиента, а не маркетинга; (4) каждый урок заканчивается тем, что сотрудник УМЕЕТ, а не «ознакомился».';

        L.blocks.map((b,i)=>"УРОК "+(i+1)+" — "+b.t+"\n   обязательные элементы: "+b.need).join("\n"),
      "Параметры модуля: "+L.min+" минут прохождения, тест "+L.quiz+" вопросов, порог "+L.thr+"%, 3 попытки, место в плане — "+L.days+".",
      "ЗАЧЕМ ЭТОТ СЛОЙ (держи в голове при написании): "+L.why,
      "ТИПИЧНАЯ ОШИБКА, которую нельзя допустить: "+L.mistake,
      "ПОСЛЕ СЛОЯ сотрудник должен уметь: "+L.kpi.join("; ")+".",

/* ================= CLAUDE ================= */
async function callClaude({system,messages,max_tokens,effort,web}){
  const key=($("#apikey").value||"").trim();if(!key)throw new Error("no-key");
  const model=$("#model").value;
  const body={model,max_tokens:max_tokens||8000,system:[{type:"text",text:system,cache_control:{type:"ephemeral"}}],messages};
  if(effort&&(model==="claude-opus-5"||model==="claude-sonnet-5"))body.output_config={effort};
  if(web)body.tools=[{type:"web_search_20250305",name:"web_search",max_uses:8}];
  let res=null;
  for(let attempt=0;attempt<4;attempt++){
    try{
      res=await fetch(API_URL,{method:"POST",headers:{"content-type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify(body)});
    }catch(netErr){ if(attempt===3)throw netErr; await new Promise(r=>setTimeout(r,1200*Math.pow(2,attempt))); continue; }
    if(res.status===429||res.status>=500){
      if(attempt===3)break;
      const ra=parseInt(res.headers.get("retry-after")||"",10);
      await new Promise(r=>setTimeout(r,isFinite(ra)?ra*1000:1200*Math.pow(2,attempt)));
      continue;
    }
    break;
  }
  const data=await res.json().catch(()=>({}));
  if(!res.ok||data.type==="error")throw new Error((data.error&&data.error.message)||("HTTP "+res.status));
  const txt=(data.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("").trim();
  if(data.stop_reason==="max_tokens"){const e=new Error("truncated");e.truncated=true;e.partial=txt;throw e;}
  return txt;
}
function errText(e){if(e&&e.truncated)return "Модель не уложилась в лимит и оборвала ответ на середине. Собери этот раздел ещё раз — или разбей задачу: сначала собери слой, потом отдельно попроси правкой добавить недостающее.";
  if(e.message==="no-key")return "Вставь ключ Claude API слева.";if(/Failed to fetch|NetworkError/i.test(e.message))return "Нет связи с api.anthropic.com (открой в Chrome).";return e.message||"Ошибка.";}
/* устойчивый парсер с починкой обрыва */
function balanceClose(s){let inStr=false,esc=false;const st=[];for(let i=0;i<s.length;i++){const ch=s[i];if(inStr){if(esc)esc=false;else if(ch==="\\")esc=true;else if(ch==='"')inStr=false;continue;}if(ch==='"')inStr=true;else if(ch==='{'||ch==='[')st.push(ch==='{'?'}':']');else if(ch==='}'||ch===']')st.pop();}let o=s;if(inStr)o+='"';o=o.replace(/[,\s]+$/,"");for(let i=st.length-1;i>=0;i--)o+=st[i];return o.replace(/,\s*([}\]])/g,"$1");}
function lastTopComma(s){let inStr=false,esc=false,last=-1;for(let i=0;i<s.length;i++){const ch=s[i];if(inStr){if(esc)esc=false;else if(ch==="\\")esc=true;else if(ch==='"')inStr=false;continue;}if(ch==='"')inStr=true;else if(ch===',')last=i;}return last;}
function parseJSON(s){
  let t=String(s||"").replace(/^﻿/,"").trim().replace(/^```[a-z]*\s*/i,"").replace(/```\s*$/,"").trim();
  const a=t.indexOf("{");if(a>0)t=t.slice(a);
  const b=t.lastIndexOf("}");if(b>0){try{return JSON.parse(t.slice(0,b+1).replace(/,\s*([}\]])/g,"$1"));}catch(_){}}
  /* обрыв по токенам: отрезаем хвост до последней целой запятой и достраиваем скобки */
  let w=t;for(let k=0;k<500;k++){try{return JSON.parse(balanceClose(w));}catch(_){}const c=lastTopComma(w);if(c<0)break;w=w.slice(0,c);}
  /* запасной путь: модель написала фигурную скобку в преамбуле — пробуем следующие позиции */
  for(let p=t.indexOf("{",1);p>0&&p<600;p=t.indexOf("{",p+1)){
    const cand=t.slice(p);const b0=cand.lastIndexOf("}");
    if(b0>0){try{return JSON.parse(cand.slice(0,b0+1).replace(/,\s*([}\]])/g,"$1"));}catch(_){}}
  }
  throw new SyntaxError("не-JSON");}

/* ===== Диктофон (по кнопке, как диктофон — не Meet) ===== */
let DREC=null;
function openDictaphone(title,sub,onDone){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  const ov=document.createElement('div');ov.className='dov';
  ov.innerHTML='<div class="doc"><h3>'+esc(title||'Диктофон')+'</h3><div class="sub">'+esc(sub||'Нажми микрофон и говори — можно с паузами, запись не прервётся. Повторное нажатие — пауза. Потом «Вставить текст».')+'</div>'+
    '<button class="mic" id="dmic">🎙</button>'+
    '<div class="dtrans" id="dtrans"><span style="color:#8a8b7e">Здесь появится расшифровка…</span></div><div id="derr"></div>'+
    '<div class="dwrap"><button class="btn ghost" id="dcancel">Отмена</button><button class="btn primary" id="dok">Вставить текст</button></div>'+
    (SR?'':'<div class="note" style="margin-top:10px">Живая расшифровка работает в Chrome. В другом браузере — надиктуй системным способом и вставь руками.</div>')+'</div>';
  document.body.appendChild(ov);
  let text='',interimBuf='',listening=false,want=false;
  const trans=ov.querySelector('#dtrans'),mic=ov.querySelector('#dmic'),errb=ov.querySelector('#derr');
  function paint(interim){trans.innerHTML=(text?esc(text):'')+(interim?'<span class="interim"> '+esc(interim)+'</span>':'')||'<span style="color:#8a8b7e">Здесь появится расшифровка…</span>';trans.scrollTop=trans.scrollHeight;}
  function say(m){if(errb)errb.innerHTML=m?('<div class="errbox" style="margin:8px 0 0">'+esc(m)+'</div>'):'';}
  function stop(){want=false;if(DREC){try{DREC.stop();}catch(_){}}listening=false;mic&&mic.classList.remove('rec');}
  function close(){stop();DREC=null;document.removeEventListener('keydown',onKey);ov.remove();}
  function full(){return (text+' '+interimBuf).replace(/\s+/g,' ').trim();}
  function askClose(){if(full()&&!confirm('Закрыть диктофон? Надиктованное не будет вставлено.'))return;close();}
  function onKey(e){if(e.key==='Escape'){e.preventDefault();askClose();}}
  document.addEventListener('keydown',onKey);
  const ERRTXT={'not-allowed':'Доступ к микрофону запрещён. Разреши его в адресной строке Chrome и нажми микрофон ещё раз.',
    'service-not-allowed':'Браузер не даёт доступ к распознаванию. Открой страницу в Chrome по https или с локального сервера.',
    'no-speech':'Не слышу голос. Говори ближе к микрофону — запись продолжается.',
    'audio-capture':'Микрофон не найден. Проверь, что он подключён и выбран в настройках системы.',
    'network':'Распознавание требует интернета — проверь соединение.',
    'aborted':''};
  mic.onclick=()=>{
    if(!SR){alert('Живая расшифровка доступна в Chrome. В другом браузере надиктуй системным способом и вставь текст руками.');return;}
    if(listening){stop();say('Пауза. Нажми микрофон, чтобы продолжить.');return;}
    say('');
    DREC=new SR();DREC.lang='ru-RU';DREC.continuous=true;DREC.interimResults=true;
    DREC.onresult=e=>{let interim='';for(let i=e.resultIndex;i<e.results.length;i++){const r=e.results[i];if(r.isFinal)text+=(text?' ':'')+r[0].transcript.trim();else interim+=r[0].transcript;}interimBuf=interim;paint(interim);
      try{sessionStorage.setItem('apx_dict_last',full());}catch(_){}};
    DREC.onerror=ev=>{const m=ERRTXT[ev.error];if(m)say(m);else if(ev.error)say('Ошибка распознавания: '+ev.error);};
    /* браузер обрывает распознавание на паузе — перезапускаем, пока пользователь не нажал стоп */
    DREC.onend=()=>{
      if(want){try{DREC.start();return;}catch(_){setTimeout(()=>{if(want){try{DREC.start();}catch(_){}}},300);return;}}
      listening=false;mic.classList.remove('rec');
    };
    try{DREC.start();listening=true;want=true;mic.classList.add('rec');say('');}catch(_){say('Не удалось включить микрофон. Проверь доступ и попробуй ещё раз.');}
  };
  ov.querySelector('#dcancel').onclick=askClose;
  ov.querySelector('#dok').onclick=()=>{
    const t=full();          /* забираем и незавершённую фразу тоже */
    close();
    try{sessionStorage.removeItem('apx_dict_last');}catch(_){}
    if(t&&onDone)onDone(t);
  };
  ov.onclick=e=>{if(e.target===ov)askClose();};
}
window.openDictaphone=openDictaphone;

/* ================= МАТЕРИАЛЫ: загрузка, парсинг, привязка к слоям ================= */
/* Тексты файлов лежат в IndexedDB (localStorage не выдержит), в S.files — только метаданные. */
const FDB={name:"apx_onb_files",store:"files"};
let _db=null;
function fdb(){return new Promise((res,rej)=>{
  if(_db)return res(_db);
  const r=indexedDB.open(FDB.name,1);
  r.onupgradeneeded=e=>{const db=e.target.result;if(!db.objectStoreNames.contains(FDB.store))db.createObjectStore(FDB.store);};
  r.onsuccess=e=>{_db=e.target.result;res(_db);};r.onerror=()=>rej(r.error);});}
async function fput(id,text){const db=await fdb();return new Promise((res,rej)=>{const t=db.transaction(FDB.store,"readwrite");t.objectStore(FDB.store).put(text,id);t.oncomplete=()=>res();t.onerror=()=>rej(t.error);});}
async function fget(id){const db=await fdb();return new Promise((res)=>{const t=db.transaction(FDB.store,"readonly");const q=t.objectStore(FDB.store).get(id);q.onsuccess=()=>res(q.result||"");q.onerror=()=>res("");});}
async function fdel(id){const db=await fdb();return new Promise((res)=>{const t=db.transaction(FDB.store,"readwrite");t.objectStore(FDB.store).delete(id);t.oncomplete=()=>res();});}

function filesState(){S.files=S.files||[];return S.files;}
/* что реально уйдёт в промпт этого слоя — одна точка правды для контекста и для счётчиков */
function filesForLayer(lid){return filesState().filter(f=>!lid||(f.layers||[]).includes(lid)||(!f.mapped&&!(f.layers||[]).length));}
function fmtKB(n){return n>1048576?(n/1048576).toFixed(1)+" МБ":Math.round(n/1024)+" КБ";}

/* ---- парсеры ---- */
/* Windows-1251 и UTF-16 встречаются в выгрузках из 1С и Excel чаще, чем хотелось бы */
function decodeText(buf){
  const b=new Uint8Array(buf);
  if(b.length>1&&b[0]===0xFF&&b[1]===0xFE)return new TextDecoder("utf-16le").decode(buf);
  if(b.length>1&&b[0]===0xFE&&b[1]===0xFF)return new TextDecoder("utf-16be").decode(buf);
  let t="";
  try{t=new TextDecoder("utf-8",{fatal:true}).decode(buf);}
  catch(_){try{return new TextDecoder("windows-1251").decode(buf);}catch(__){return new TextDecoder("utf-8").decode(buf);}}
  const bad=(t.match(/\uFFFD/g)||[]).length;
  if(bad>0&&bad/Math.max(1,t.length)>0.005){try{return new TextDecoder("windows-1251").decode(buf);}catch(_){}}
  return t;
}
function unents(t){
  return String(t||"")
    .replace(/&#(\d+);/g,(_,d)=>{try{return String.fromCodePoint(+d);}catch(e){return _;}})
    .replace(/&#x([0-9a-f]+);/gi,(_,h)=>{try{return String.fromCodePoint(parseInt(h,16));}catch(e){return _;}})
    .replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&quot;/g,'"').replace(/&apos;/g,"'").replace(/&nbsp;/g," ").replace(/&amp;/g,"&");
}
async function parseFile(file){
  const ext=(file.name.split(".").pop()||"").toLowerCase();
  if(["txt","md","csv","json","html","htm"].includes(ext)){
    let t=decodeText(await file.arrayBuffer());
    if(ext==="html"||ext==="htm")t=unents(t.replace(/<script[\s\S]*?<\/script>/gi,"").replace(/<style[\s\S]*?<\/style>/gi,"").replace(/<[^>]+>/g," "));
    return t;
  }
  if(ext==="xlsx"||ext==="xls"){
    if(!window.XLSX)throw new Error("библиотека Excel не загрузилась");
    const wb=XLSX.read(await file.arrayBuffer(),{type:"array"});
    return wb.SheetNames.map(n=>"### ЛИСТ: "+n+"\n"+XLSX.utils.sheet_to_csv(wb.Sheets[n])).join("\n\n");
  }
  if(ext==="docx"){
    if(!window.JSZip)throw new Error("библиотека для .docx не загрузилась");
    const zip=await JSZip.loadAsync(await file.arrayBuffer());
    const f=zip.file("word/document.xml");if(!f)throw new Error("не похоже на .docx");
    const xml=await f.async("string");
    return unents(xml.replace(/<w:p[ >]/g,"\n<w:p ").replace(/<w:tab\/>/g,"\t").replace(/<[^>]+>/g,"")).replace(/\n{3,}/g,"\n\n").trim();
  }
  if(ext==="pptx"){
    if(!window.JSZip)throw new Error("библиотека для .pptx не загрузилась");
    const zip=await JSZip.loadAsync(await file.arrayBuffer());
    const names=Object.keys(zip.files).filter(n=>/^ppt\/slides\/slide\d+\.xml$/.test(n)).sort((a,b)=>(+a.match(/\d+/))-(+b.match(/\d+/)));
    const out=[];
    for(const n of names){const xml=await zip.file(n).async("string");
      out.push("### СЛАЙД "+(n.match(/\d+/)[0])+"\n"+unents(xml.replace(/<a:p[ >]/g,"\n<a:p ").replace(/<[^>]+>/g,"")).replace(/\n{3,}/g,"\n").trim());}
    return out.join("\n\n");
  }
  if(ext==="pdf"){
    if(!window.pdfjsLib)throw new Error("библиотека PDF не загрузилась");
    const doc=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;
    const out=[];const max=Math.min(doc.numPages,120);
    for(let i=1;i<=max;i++){const p=await doc.getPage(i);const c=await p.getTextContent();
      out.push(c.items.map(x=>x.str).join(" "));}
    return out.join("\n\n");
  }
  throw new Error("формат ."+ext+" не поддерживается. Поддерживаются: docx, xlsx, pptx, pdf, txt, md, csv, json, html");
}

async function onFiles(input,layerId){
  const list=[...input.files];input.value="";
  if(!list.length)return;
  const box=$("#filesStatus");if(box)box.innerHTML='<div class="statusbox"><span class="spin"></span>Читаю файлы…</div>';
  const F=filesState();let ok=0,err=[];
  for(const f of list){
    try{
      const text=await parseFile(f);
      const clean=String(text||"").replace(/[ \t]{2,}/g," ").replace(/\n{3,}/g,"\n\n").trim();
      if(!clean){err.push(f.name+" — пусто (возможно, скан без текста)");continue;}
      const id="f"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
      await fput(id,clean);
      F.push({id,name:f.name,size:f.size,chars:clean.length,layers:layerId?[layerId]:[],note:""});
      ok++;
    }catch(e){err.push(f.name+" — "+(e.message||e));}
  }
  save();
  render();
  const box2=$("#filesStatus");
  if(box2)box2.innerHTML=(ok?'<div class="note b">✓ Загружено файлов: '+ok+'. Нажми «🧠 Разобрать и разнести по всем слоям» — система определит, к каким слоям они относятся, и заполнит брифы.</div>':'')+
    (err.length?'<div class="errbox"><b>Не удалось прочитать:</b> '+err.map(esc).join("; ")+'<div class="kmini" style="margin:6px 0 0">Если это PDF-скан без текстового слоя — распознай его (например, через Google Docs) и загрузи заново.</div></div>':'');
}

/* ---- сборка контекста материалов для промпта ---- */
const CTX_LIMIT=140000;
async function filesContext(layerId,limit){
  const F=filesForLayer(layerId);
  if(!F.length)return "";
  const cap=limit||CTX_LIMIT;const per=Math.max(4000,Math.floor(cap/Math.max(1,F.length)));
  const parts=[];
  for(let i=0;i<F.length;i++){
    const f=F[i];
    let t=await fget(f.id);
    if(t.length>per)t=t.slice(0,per)+"\n…[файл обрезан, всего "+f.chars+" символов]";
    parts.push("=== ФАЙЛ #"+(i+1)+": "+f.name+" ===\n"+t);
  }
  return "МАТЕРИАЛЫ КОМПАНИИ (используй как источник фактов, ничего не додумывай):\n\n"+parts.join("\n\n");
}

function stepDone(id){
  if(id==="start")return !!(S.company&&S.role);

  if(id==="brief")return BRIEF.some(bl=>(S.brief[bl.id]||[]).some(a=>String(a||"").trim()));
  return !!S.results[id];
}
/* слой начат: бриф заполняется, но контент ещё не собран */
function stepPart(id){
  if(stepDone(id))return false;
  if(id==="brief"){const t=BRIEF.reduce((a,b)=>a+b.qs.length,0);const n=BRIEF.reduce((a,b)=>a+(S.brief[b.id]||[]).filter(x=>String(x||"").trim()).length,0);return n>0&&n<t;}
  if(typeof layerById==="function"&&layerById(id))return lbFill(id).n>0;
  return false;
}

function obRefresh(){
  const R=obState();

    let v='<span class="kmini" style="margin:0">идёт</span>';
    if(done===LAYERS.length&&att>=80)v='<span class="g">✓ аттестован</span>';
    else if(done===LAYERS.length&&att>0&&att<80)v='<span class="r">аттестация не сдана</span>';
    else if(done===LAYERS.length)v='<span class="y">ждёт аттестации</span>';
    else if(days!==null&&days>21&&done<LAYERS.length)v='<span class="r">⚠ выбился из срока ('+days+' дн.)</span>';

function delProject(id){if(!confirm("Удалить этот онбординг из списка? Прикреплённые к нему материалы тоже будут стёрты."))return;
  const gone=(getProjects().find(f=>f.id===id)||{}).files||[];

/* тексты файлов лежат в IndexedDB — чистим те, на которые больше никто не ссылается */
async function purgeOrphanFiles(){
  try{
    const live=new Set();
    (S.files||[]).forEach(f=>live.add(f.id));
    getProjects().forEach(p=>(p.files||[]).forEach(f=>live.add(f.id)));
    const db=await fdb();
    const ids=await new Promise(res=>{const t=db.transaction(FDB.store,"readonly");const q=t.objectStore(FDB.store).getAllKeys();q.onsuccess=()=>res(q.result||[]);q.onerror=()=>res([]);});
    for(const k of ids){if(!live.has(k))await fdel(k);}
  }catch(_){}
}

async function assembleWorkbook(){
  if(!window.ExcelJS){alert("ExcelJS не загрузился (нужен интернет).");return;}
  const wb=new ExcelJS.Workbook();wb.creator="A-Players";
  let ws=wb.addWorksheet("Онбординг");wsWidths(ws,[30,70]);
  xTitle(ws,"СИСТЕМА ОНБОРДИНГА — "+((S.role||"роль").toUpperCase()),2);
  [["Компания",S.company],["Ниша",S.niche],["Роль",S.role],["Целевой срок",S.target],["Формат",S.format]].forEach((kv,i)=>xData(ws,kv,i%2));
  ws.addRow([]);
  xSection(ws,"Карта слоёв",2);
  xHeader(ws,["Слой","Уроков · время · тест · порог"]);
  LAYERS.forEach((L,i)=>xData(ws,["Слой "+L.n+" · "+L.title+" — "+L.sub,L.lessons+" уроков · "+L.min+" мин · "+L.quiz+" вопросов · порог "+L.thr+"% · "+L.days],i%2));
  ws=wb.addWorksheet("Бриф компании");wsWidths(ws,[46,60]);xTitle(ws,"БРИФ КОМПАНИИ",2);
  BRIEF.forEach(bl=>{const ans=S.brief[bl.id]||[];const any=bl.qs.some((q,i)=>ans[i]);if(!any)return;
    xSection(ws,bl.name+" (спросить у: "+bl.who+")",2);bl.qs.forEach((q,i)=>{if(ans[i])xData(ws,[q,ans[i]]);});ws.addRow([]);});
  Object.keys(GEN).forEach(id=>{const r=S.results[id];if(!r)return;
    const g=GEN[id];const w=wb.addWorksheet(uniqSheet(wb,g.title));wsWidths(w,[26,40,40,40,30,30]);
    xTitle(w,(r.title||g.title).toUpperCase(),6);
    const L=layerById(id);
    if(L){xSection(w,"Параметры слоя",6);xData(w,["Уроков",L.lessons,"Время",L.min+" мин","Тест",L.quiz+" вопр. · порог "+L.thr+"%"]);xData(w,["Место в плане",L.days,"","","",""],1);w.addRow([]);}
    xBlocks(w,r.blocks);});
  // Результаты глубокого ресерча по слоям
  LAYERS.forEach(L=>{const rr=S.results[L.id+"_research"];if(!rr)return;
    const w=wb.addWorksheet(uniqSheet(wb,"Ресерч · слой "+L.n));wsWidths(w,[26,40,40,40,30,30]);
    xTitle(w,("РЕСЕРЧ · СЛОЙ "+L.n+" · "+L.title).toUpperCase(),6);xBlocks(w,rr.blocks,6);});
  // Брифы слоёв — что вытащено из материалов и на что ещё нужен ответ
  const anyLB=LAYERS.some(L=>lbFill(L.id).n>0);
  if(anyLB){
    const w=wb.addWorksheet(uniqSheet(wb,"Брифы слоёв"));wsWidths(w,[52,60,18,22]);
    xTitle(w,"БРИФЫ СЕМИ СЛОЁВ — ЧТО СОБРАНО И ЧТО ЕЩЁ НУЖНО",4);
    LAYERS.forEach(L=>{
      const b=(S.lbrief||{})[L.id]||{};const f=lbFill(L.id);
      xSection(w,"Слой "+L.n+" · "+L.title+" — заполнено "+f.n+" из "+f.total,4);
      xHeader(w,["Вопрос брифа","Ответ","Статус","Источник"]);
      L.brief.forEach((q,i)=>{
        const v=String(b[i]||"").trim();
        xData(w,[q,v||"— нужен ответ от руководителя —",v?(b["_c"+i]||"из материалов"):"ПРОБЕЛ",b["_s"+i]||""],i%2);
      });
      w.addRow([]);
    });
  }
  // Материалы, на которых собран онбординг
  if((S.files||[]).length){
    const w=wb.addWorksheet(uniqSheet(wb,"Материалы"));wsWidths(w,[38,14,12,22,50]);
    xTitle(w,"МАТЕРИАЛЫ, НА КОТОРЫХ СОБРАН ОНБОРДИНГ",5);
    xHeader(w,["Файл","Размер","Символов","Слои","Что внутри"]);
    S.files.forEach((f,i)=>xData(w,[f.name,fmtKB(f.size),f.chars,(f.layers||[]).map(x=>{const L=layerById(x);return L?("С"+L.n):x;}).join(", ")||"—",f.note||""],i%2));
  }
  if(allLinks().length){
    const w=wb.addWorksheet(uniqSheet(wb,"Ссылки для новичка"));wsWidths(w,[36,60,16,16]);
    xTitle(w,"ССЫЛКИ НА МАТЕРИАЛЫ — ВЫДАТЬ ДОСТУП ДО ПЕРВОГО ДНЯ",4);
    xHeader(w,["Что","Адрес","Где лежит","Слой"]);
    allLinks().forEach((l,i)=>{const L=layerById(l.layer);xData(w,[l.title,l.url,l.kind,L?("Слой "+L.n):"все слои"],i%2);});
  }

    S.onb.list.forEach((p,i)=>xData(w,[p.name||"",p.start||""].concat(LAYERS.map(L=>(p.layers||{})[L.id]?"✓":"")).concat([p.att||""]),i%2));
  }
  // Чек-лист внедрения
  const w9=wb.addWorksheet(uniqSheet(wb,"Чек-лист внедрения"));wsWidths(w9,[8,60,20,16,16]);
  xTitle(w9,"ЧЕК-ЛИСТ ВНЕДРЕНИЯ ОНБОРДИНГА — 8 НЕДЕЛЬ",5);
  xHeader(w9,["№","Что сделать","Кто отвечает","Срок","Готово"]);
  LAUNCH_CHECK.forEach((r,i)=>xData(w9,[i+1,r[0],r[1],r[2],""],i%2));
  await xlsxDownload(wb,"Онбординг — "+(S.company||"")+" "+(S.role||"роль")+".xlsx");
}

function dictateLayer(lid){
  const L=layerById(lid);
  openDictaphone("Диктовка · Слой "+L.n+" "+L.title,"Наговори всё, что знаешь по этому слою — система разложит по вопросам брифа.",async(txt)=>{
    if(!txt.trim())return;

    if(!($("#apikey").value||"").trim()){S.lbrief=S.lbrief||{};S.lbrief[lid]=S.lbrief[lid]||{};S.lbrief[lid][0]=((S.lbrief[lid][0]||"")+" "+txt).trim();save();render();return;}
    const sys=["Разложи устную речь по вопросам брифа. Только сказанное, ничего не додумывай.",
      "Вопросы:\n"+L.brief.map((q,i)=>(i+1)+". "+q).join("\n"),
      'Верни СТРОГО JSON: {"answers":["…"]} — ровно '+L.brief.length+' элементов, пустая строка если про вопрос не сказано.'].join("\n");
    try{const r=parseJSON(await callClaude({system:sys,messages:[{role:"user",content:"Надиктовка:\n"+txt}],max_tokens:8000,effort:"low"}));
      S.lbrief=S.lbrief||{};S.lbrief[lid]=S.lbrief[lid]||{};
      (r.answers||[]).forEach((a,i)=>{if(a&&String(a).trim()){S.lbrief[lid][i]=(S.lbrief[lid][i]?S.lbrief[lid][i]+" ":"")+a;S.lbrief[lid]["_c"+i]="ручной";}});
      save();render();
    }catch(e){
      S.lbrief=S.lbrief||{};S.lbrief[lid]=S.lbrief[lid]||{};
      S.lbrief[lid][0]=((S.lbrief[lid][0]||"")+" "+txt).trim();S.lbrief[lid]["_c0"]="ручной";
      save();render();

    }
  });
}

    user=user+"\n\nТЕКУЩИЙ РЕЗУЛЬТАТ (JSON):\n"+JSON.stringify(S.results[id]||{})+"\n\nПРАВКА ПОЛЬЗОВАТЕЛЯ:\n"+correction;}
  const cap=layerById(id)?28000:16000;   /* слой просит уроки + тест — 14k не вмещало */

const XC={EM:"FF143A2D",GOLD:"FFB0822E",LINE:"FFDCD4C2",CREAM:"FFEFE9DA",ZEBRA:"FFF7F3E9",SEC:"FFEFE9D9",WHITE:"FFFFFFFF"};
function xThin(){return {style:"thin",color:{argb:XC.LINE}};}
function xBorder(){const t=xThin();return {top:t,left:t,bottom:t,right:t};}

function xData(ws,arr,z){const row=ws.addRow(arr);row.eachCell(c=>{c.alignment={vertical:"top",wrapText:true,indent:1};c.border=xBorder();if(z)c.fill={type:"pattern",pattern:"solid",fgColor:{argb:XC.ZEBRA}};});}
function xSection(ws,text,span){const row=ws.addRow([text]);if(span>1)ws.mergeCells(row.number,1,row.number,span);const c=row.getCell(1);c.font={bold:true,size:12,color:{argb:XC.EM}};c.fill={type:"pattern",pattern:"solid",fgColor:{argb:XC.SEC}};c.alignment={vertical:"middle",indent:1};row.height=20;}
function xBullets(ws,arr,span){const a=Array.isArray(arr)?arr:(arr?[arr]:[]);a.forEach(x=>{const row=ws.addRow(["•  "+(typeof x==="object"?JSON.stringify(x):x)]);if(span>1)ws.mergeCells(row.number,1,row.number,span);row.getCell(1).alignment={wrapText:true,vertical:"top",indent:1};});}
function xText(ws,txt,span){String(txt||"").split("\n").forEach(line=>{const row=ws.addRow([line]);if(span>1)ws.mergeCells(row.number,1,row.number,span);row.getCell(1).alignment={wrapText:true,vertical:"top",indent:1};});}

/* разбор блока «Тест по слою» в структуру вопросов */
function parseQuiz(blocks){
  const b=(blocks||[]).find(x=>/^Тест/i.test(x.h||"")&&x.kind==="table");
  if(!b||!Array.isArray(b.rows))return [];
  const col=(name)=>{const c=(b.columns||[]).findIndex(x=>new RegExp(name,"i").test(String(x)));return c;};
  const iQ=col("вопрос")>=0?col("вопрос"):0, iO=col("вариант")>=0?col("вариант"):1,
        iC=col("правильн")>=0?col("правильн"):2, iW=col("почему")>=0?col("почему"):3;
  const norm=s=>String(s==null?"":s).replace(/\s+/g," ").replace(/^[\s"«»]+|[\s"«».]+$/g,"").toLowerCase();
  const out=[];
  b.rows.forEach(r=>{
    const row=Array.isArray(r)?r:[r];
    const q=String(row[iQ]||"").trim(); if(!q)return;
    const opts=String(row[iO]||"").split(/\s*[|;]\s*/).map(s=>s.trim()).filter(Boolean);
    if(opts.length<2)return;
    const raw=String(row[iC]||"").trim();
    /* делим только по | и ; — запятая часто стоит внутри самого ответа */
    let parts=raw.split(/\s*[|;]\s*/).map(s=>s.trim()).filter(Boolean);
    const idxOf=(v)=>{
      let i=opts.findIndex(o=>norm(o)===norm(v));
      if(i<0)i=opts.findIndex(o=>norm(o).indexOf(norm(v))>=0&&norm(v).length>3);
      if(i<0&&/^[а-дa-e1-9]$/i.test(v)){const k="абвгдеabcdef".indexOf(v.toLowerCase());if(k>=0&&k<opts.length)i=k;
        const n=parseInt(v,10);if(isFinite(n)&&n>=1&&n<=opts.length)i=n-1;}
      return i;
    };
    let idx=parts.map(idxOf).filter(i=>i>=0);
    /* запасной путь: ответ мог быть перечислен через запятую и целиком не нашёлся */
    if(!idx.length&&/,/.test(raw)){
      parts=raw.split(/\s*,\s*/).map(s=>s.trim()).filter(Boolean);
      idx=parts.map(idxOf).filter(i=>i>=0);
    }
    idx=idx.filter((v,i)=>idx.indexOf(v)===i);
    const multi=idx.length>1;
    out.push({q:q,opts:opts,multi:multi,
      correct: multi?idx:(idx.length?idx[0]:null),
      why:String(row[iW]||"").trim()});
  });
  return out;
}

function mdBlocks(blocks){
  return (blocks||[]).map(b=>{
    let out="### "+(b.h||"")+"\n\n";
    if(b.kind==="table"&&(b.columns||b.rows)){
      const c=Array.isArray(b.columns)?b.columns:[];
      const rows=(Array.isArray(b.rows)?b.rows:[]).map(r=>Array.isArray(r)?r:[r]);
      if(c.length){
        out+="| "+c.join(" | ")+" |\n|"+c.map(()=>"---").join("|")+"|\n";
        rows.forEach(r=>{out+="| "+c.map((_,i)=>String(r[i]==null?"":r[i]).replace(/\|/g,"\\|").replace(/\n/g," ")).join(" | ")+" |\n";});
      } else rows.forEach(r=>{out+="- "+r.join(" · ")+"\n";});
      out+="\n";
    } else if(b.kind==="list"){
      const it=Array.isArray(b.items)?b.items:(b.items?[b.items]:[]);
      out+=it.map(x=>"- "+x).join("\n")+"\n\n";
    } else {
      const it=Array.isArray(b.items)?b.items:[];
      out+=(b.text||it.join("\n"))+"\n\n";
    }
    return out;
  }).join("");
}
