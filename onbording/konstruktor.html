function dictateLayer(lid){
  const L=layerById(lid);
  openDictaphone("Диктовка · Слой "+L.n+" "+L.title,"Наговори всё, что знаешь по этому слою — система разложит по вопросам брифа.",async(txt)=>{
    if(!txt.trim())return;
    const st=$("#lbStatus");if(st)st.innerHTML='<div class="statusbox"><span class="spin"></span>Раскладываю по вопросам…</div>';
    if(!($("#apikey").value||"").trim()){S.lbrief=S.lbrief||{};S.lbrief[lid]=S.lbrief[lid]||{};S.lbrief[lid][0]=((S.lbrief[lid][0]||"")+" "+txt).trim();save();render();return;}
    const sys=["Разложи устную речь по вопросам брифа. Только сказанное, ничего не додумывай.",
      "Вопросы:\n"+L.brief.map((q,i)=>(i+1)+". "+q).join("\n"),
      'Верни СТРОГО JSON: {"answers":["…"]} — ровно '+L.brief.length+' элементов, пустая строка если про вопрос не сказано.'].join("\n");
    try{const r=parseJSON(await callClaude({system:sys,messages:[{role:"user",content:"Надиктовка:\n"+txt}],max_tokens:8000,effort:"low"}));
      S.lbrief=S.lbrief||{};S.lbrief[lid]=S.lbrief[lid]||{};
      (r.answers||[]).forEach((a,i)=>{if(a&&String(a).trim()){S.lbrief[lid][i]=(S.lbrief[lid][i]?S.lbrief[lid][i]+" ":"")+a;S.lbrief[lid]["_c"+i]="ручной";}});
      save();render();
    }catch(e){
      S.lbrief=S.lbrief||{};S.lbrief[lid]=S.lbrief[lid]||{};
      S.lbrief[lid][0]=((S.lbrief[lid][0]||"")+" "+txt).trim();S.lbrief[lid]["_c0"]="ручной";
      save();render();
      const s2=$("#lbStatus");if(s2)s2.innerHTML='<div class="errbox">Не удалось разложить по вопросам ('+esc(errText(e))+'). Текст сохранён целиком в первый вопрос — ничего не потеряно, разнеси руками или попробуй ещё раз.</div>';
    }
  });
}

function fixboxHTML(id){return '<div class="fixbox"><h4>✏️ Поправить этот раздел</h4><textarea id="fix_'+id+'" placeholder="Что изменить? Напр.: добавь урок про работу с рассрочкой; сделай тест сложнее; убери воду из урока 2.3. Можно надиктовать голосом."></textarea><div class="row" style="margin-top:10px"><button class="btn primary sm" onclick="runGenFix(\''+id+'\')">Применить правку</button><button class="btn ghost sm" onclick="dictateFix(\''+id+'\')">🎙 Надиктовать правку</button></div></div>';}

  let sys=g.sys(),user=ctxText(id);
  try{const fc=await filesContext(layerById(id)?id:null,110000);if(fc)user=fc+"\n\n"+user;}catch(_){}
  if(correction){sys=g.sys()+"\n\nЭто ПРАВКА уже собранного раздела. Ниже — материалы, бриф, текущий результат (JSON) и правка пользователя. Внеси правку и верни ОБНОВЛЁННЫЙ ПОЛНЫЙ JSON в той же схеме, сохранив корректным всё остальное и не потеряв факты из материалов.";
    user=user+"\n\nТЕКУЩИЙ РЕЗУЛЬТАТ (JSON):\n"+JSON.stringify(S.results[id]||{})+"\n\nПРАВКА ПОЛЬЗОВАТЕЛЯ:\n"+correction;}
  const cap=layerById(id)?28000:16000;   /* слой просит уроки + тест — 14k не вмещало */
  try{const raw=await callClaude({system:sys,messages:[{role:"user",content:user}],max_tokens:cap,effort:"low"});
    S.results[id]=parseJSON(raw);save();renderNav();render();
  }catch(e){$("#genStatus").innerHTML='<div class="errbox">Не удалось: '+esc(errText(e))+' <button class="btn ghost sm" onclick="runGen(\''+id+'\')">↻ Повторить</button></div>';if(btn)btn.disabled=false;}
}

function editGen(id){CUREDIT=id;EDITBUF=JSON.parse(JSON.stringify(S.results[id]||{title:"",blocks:[]}));$("#genOut").innerHTML=editGenHTML(id);const c=document.querySelector('.card.edit');if(c)c.scrollIntoView({behavior:"smooth",block:"start"});}
function editGenHTML(id){
  const r=EDITBUF;let h='<div class="card edit"><div class="row" style="justify-content:space-between"><h2 style="margin:0">✏️ Редактирование вручную</h2><span class="kmini">Меняй текст прямо в полях. Можно добавлять и удалять пункты и строки. Потом «Сохранить».</span></div>';

    h+='<div class="edblock"><input class="edh" type="text" value="'+esc(b.h||"")+'" oninput="edH('+bi+',this.value)" placeholder="Заголовок блока">';

      h+='<div style="overflow-x:auto"><table class="gt narrow" style="margin-top:8px"><thead><tr>'+b.columns.map((c,ci)=>'<th><input type="text" value="'+esc(c)+'" oninput="edCol('+bi+','+ci+',this.value)" style="min-width:90px;background:transparent;border:1px solid rgba(255,255,255,.35);color:#fff;font-weight:700;padding:4px 6px"></th>').join("")+'<th style="min-width:30px"></th></tr></thead><tbody>'+
        (b.rows||[]).map((row,ri)=>'<tr>'+b.columns.map((c,ci)=>'<td><textarea rows="2" oninput="edCell('+bi+','+ri+','+ci+',this.value)" style="min-height:40px;font-size:13px">'+esc((row&&row[ci])||"")+'</textarea></td>').join("")+'<td><button class="btn ghost sm" onclick="edDelRow('+bi+','+ri+')" title="Удалить строку">✕</button></td></tr>').join("")+
        '</tbody></table></div><button class="btn ghost sm" style="margin-top:8px" onclick="edAddRow('+bi+')">+ строка</button>';
    } else if(b.kind==="list"){
      h+='<div class="edlist">'+(b.items||[]).map((x,ii)=>'<div class="row" style="margin-top:6px;flex-wrap:nowrap"><textarea rows="1" oninput="edItem('+bi+','+ii+',this.value)">'+esc(x)+'</textarea><button class="btn ghost sm" onclick="edDelItem('+bi+','+ii+')" title="Удалить пункт">✕</button></div>').join("")+'</div><button class="btn ghost sm" style="margin-top:8px" onclick="edAddItem('+bi+')">+ пункт</button>';
    } else {
      h+='<textarea style="margin-top:8px;min-height:120px" oninput="edText('+bi+',this.value)">'+esc(b.text||(b.items||[]).join("\n"))+'</textarea>';
    }
    h+='</div>';
  });
  h+='<div class="row" style="margin-top:16px"><button class="btn primary" onclick="saveEdit(\''+id+'\')">✓ Сохранить изменения</button><button class="btn ghost" onclick="cancelEdit(\''+id+'\')">Отмена</button></div></div>';
  return h;
}

function edCol(bi,ci,v){EDITBUF.blocks[bi].columns[ci]=v;}
function edCell(bi,ri,ci,v){const b=EDITBUF.blocks[bi];b.rows=b.rows||[];b.rows[ri]=b.rows[ri]||[];b.rows[ri][ci]=v;}
function edDelRow(bi,ri){EDITBUF.blocks[bi].rows.splice(ri,1);reEdit();}

function exportGen(id){const r=S.results[id];if(!r)return;const wb=XLSX.utils.book_new();let n=0;(r.blocks||[]).forEach(b=>{let rows=[];if(b.kind==="table"&&b.columns){rows=[b.columns].concat(b.rows||[]);}else if(b.kind==="list"){rows=[[b.h]].concat((b.items||[]).map(x=>[x]));}else{rows=[[b.h]].concat(String(b.text||"").split("\n").map(x=>[x]));}const ws=XLSX.utils.aoa_to_sheet(rows);ws["!cols"]=(rows[0]||[""]).map(()=>({wch:40}));let nm=(b.h||("Блок "+(++n))).slice(0,26).replace(/[\\/?*:\[\]]/g,"")||("Блок "+(++n));while(wb.SheetNames.indexOf(nm)>=0)nm=nm.slice(0,24)+" "+(++n);XLSX.utils.book_append_sheet(wb,ws,nm);});XLSX.writeFile(wb,(r.title||GEN[id].title).slice(0,28)+".xlsx");}
window.exportGen=exportGen;

/* ================= БРЕНДИРОВАННЫЙ EXCEL (ExcelJS) ================= */
const XC={EM:"FF143A2D",GOLD:"FFB0822E",LINE:"FFDCD4C2",CREAM:"FFEFE9DA",ZEBRA:"FFF7F3E9",SEC:"FFEFE9D9",WHITE:"FFFFFFFF"};
function xThin(){return {style:"thin",color:{argb:XC.LINE}};}
function xBorder(){const t=xThin();return {top:t,left:t,bottom:t,right:t};}
function xTitle(ws,text,span){const row=ws.addRow([text]);ws.mergeCells(row.number,1,row.number,span);const c=row.getCell(1);c.fill={type:"pattern",pattern:"solid",fgColor:{argb:XC.EM}};c.font={name:"Arial",bold:true,size:14,color:{argb:XC.CREAM}};c.alignment={vertical:"middle",indent:1};row.height=28;ws.addRow([]);}
function xHeader(ws,arr){const row=ws.addRow(arr);row.eachCell(c=>{c.fill={type:"pattern",pattern:"solid",fgColor:{argb:XC.GOLD}};c.font={bold:true,color:{argb:XC.WHITE},size:11};c.alignment={vertical:"middle",wrapText:true,indent:1};c.border=xBorder();});row.height=22;}
function xData(ws,arr,z){const row=ws.addRow(arr);row.eachCell(c=>{c.alignment={vertical:"top",wrapText:true,indent:1};c.border=xBorder();if(z)c.fill={type:"pattern",pattern:"solid",fgColor:{argb:XC.ZEBRA}};});}
function xSection(ws,text,span){const row=ws.addRow([text]);if(span>1)ws.mergeCells(row.number,1,row.number,span);const c=row.getCell(1);c.font={bold:true,size:12,color:{argb:XC.EM}};c.fill={type:"pattern",pattern:"solid",fgColor:{argb:XC.SEC}};c.alignment={vertical:"middle",indent:1};row.height=20;}
function xBullets(ws,arr,span){const a=Array.isArray(arr)?arr:(arr?[arr]:[]);a.forEach(x=>{const row=ws.addRow(["•  "+(typeof x==="object"?JSON.stringify(x):x)]);if(span>1)ws.mergeCells(row.number,1,row.number,span);row.getCell(1).alignment={wrapText:true,vertical:"top",indent:1};});}
function xText(ws,txt,span){String(txt||"").split("\n").forEach(line=>{const row=ws.addRow([line]);if(span>1)ws.mergeCells(row.number,1,row.number,span);row.getCell(1).alignment={wrapText:true,vertical:"top",indent:1};});}

function uniqSheet(wb,t){let base=sheetName(t),n=base,i=2;while(wb.getWorksheet(n)){const suf=" ("+i+")";n=base.slice(0,31-suf.length)+suf;i++;}return n;}
function xBlocks(ws,blocks,span){
  span=span||6;
  (blocks||[]).forEach(b=>{
    xSection(ws,b.h||"",Math.max(span,(b.columns||[]).length||1));
    if(b.kind==="table"&&(b.columns||b.rows)){
      const cols=Array.isArray(b.columns)?b.columns:[];
      if(cols.length)xHeader(ws,cols);
      (Array.isArray(b.rows)?b.rows:[]).forEach((r,i)=>xData(ws,Array.isArray(r)?r:(r&&typeof r==="object"?Object.values(r):[r]),i%2));
    }
    else if(b.kind==="list"){xBullets(ws,b.items,span);}
    else{const it=Array.isArray(b.items)?b.items:(b.items?[b.items]:[]);xText(ws,b.text||it.join("\n"),span);}
    ws.addRow([]);
  });
}
function wsWidths(ws,w){ws.columns=w.map(x=>({width:x}));}
async function xlsxDownload(wb,fname){const buf=await wb.xlsx.writeBuffer();const blob=new Blob([buf],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});const u=URL.createObjectURL(blob);const a=document.createElement("a");a.href=u;a.download=fname;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(u);a.remove();},400);}
function sheetName(s){return String(s||"Лист").replace(/[\\/?*:\[\]]/g,"").slice(0,31)||"Лист";}

/* экспорт одного раздела (генератора) — оформленный */
async function exportBrandedBlocks(id){
  const r=S.results[id];if(!r){return;}

  const wb=new ExcelJS.Workbook();wb.creator="A-Players";
  const ws=wb.addWorksheet(sheetName(GEN[id].title));wsWidths(ws,[26,40,40,40,30,30]);
  xTitle(ws,(r.title||GEN[id].title).toUpperCase(),6);xBlocks(ws,r.blocks);
  await xlsxDownload(wb,(r.title||GEN[id].title).slice(0,40)+".xlsx");
}
