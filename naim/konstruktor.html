<!DOCTYPE html>
<html lang="ru">
<head>
<script src="gate.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Конструктор воронки найма · A-Players</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Roboto+Slab:wght@500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<style>
  :root{
    --cream:#F4F1EA;--bg2:#EFE9D9;--card:#FCFAF4;--ink:#16201B;--muted:#5A6056;--line:#DCD4C2;
    --em:#143A2D;--em2:#1C4C3B;--gold:#B0822E;--gold-h:#977019;--gold2:#C79A45;
    --green:#3E8E5E;--red:#B23B2E;--amber:#C77A22;
    --serif:"Roboto Slab",Georgia,serif;--sans:"Manrope",system-ui,-apple-system,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--cream);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5}
  a{color:var(--em)}
  .app{display:grid;grid-template-columns:280px 1fr;min-height:100vh}
  /* sidebar */
  .side{background:var(--em);color:#EFE9DA;padding:22px 18px;position:sticky;top:0;height:100vh;overflow-y:auto}
  .brand{font-family:var(--serif);font-weight:800;font-size:18px;color:#fff;display:flex;align-items:center;gap:9px;margin-bottom:4px}
  .brand .dot{width:11px;height:11px;border-radius:3px;background:var(--gold2)}
  .side .sub{font-size:12px;color:#a9bcaf;margin-bottom:18px}
  .steps{display:flex;flex-direction:column;gap:3px}
  .snav{display:flex;gap:11px;align-items:flex-start;padding:9px 11px;border-radius:10px;cursor:pointer;color:#cdd8ce;transition:.12s}
  .snav:hover{background:rgba(255,255,255,.06)}
  .snav.on{background:rgba(199,154,69,.16);color:#fff}
  .snav .si{width:24px;height:24px;border-radius:7px;background:rgba(255,255,255,.1);display:grid;place-items:center;font-size:13px;font-weight:800;flex:none;font-family:var(--serif)}
  .snav.on .si{background:var(--gold);color:#19120A}
  .snav.done .si{background:var(--green);color:#fff}
  .snav .st{font-size:13.5px;font-weight:600;line-height:1.25}
  .snav .sd{font-size:11px;color:#9fb0a4;margin-top:1px}
  .keybox{margin-top:18px;background:rgba(0,0,0,.16);border-radius:10px;padding:12px}
  .keybox label{font-size:11px;color:#a9bcaf;display:block;margin-bottom:5px}
  .keybox input,.keybox select{width:100%;background:rgba(255,255,255,.95);border:none;border-radius:7px;padding:8px 10px;font-size:13px;color:#16201B;margin-bottom:7px}
  /* main */
  .main{padding:34px 52px 90px;max-width:2400px;margin-inline:auto;width:100%}
  @media(min-width:2100px){.main{padding:44px 76px 120px}}
  .kick{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-h);font-weight:800}
  h1{font-family:var(--serif);font-weight:800;font-size:30px;letter-spacing:-.4px;margin:4px 0 6px}
  h2{font-family:var(--serif);font-weight:800;font-size:21px;color:var(--em);margin:22px 0 10px}
  h3{font-family:var(--serif);font-weight:700;font-size:16px;color:var(--em)}
  p.lead{color:var(--muted);font-size:16px;max-width:74ch}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-top:14px;box-shadow:0 6px 20px rgba(20,32,27,.05)}
  label.fl{font-size:13px;font-weight:600;color:var(--muted);display:block;margin-bottom:5px}
  input[type=text],input[type=number],textarea,select{width:100%;background:#fff;border:1.5px solid var(--line);border-radius:9px;padding:10px 12px;font-size:14.5px;font-family:inherit;color:var(--ink)}
  textarea{min-height:90px;resize:vertical}
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--em);box-shadow:0 0 0 3px rgba(20,58,45,.12)}
  .fg{margin-bottom:14px}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:820px){.app{grid-template-columns:1fr}.side{position:static;height:auto}.two{grid-template-columns:1fr}}
  .btn{display:inline-flex;align-items:center;gap:8px;border:none;border-radius:10px;padding:11px 18px;font-size:14.5px;font-weight:700;cursor:pointer;font-family:inherit;transition:.14s}
  .btn:hover{transform:translateY(-1px)}
  .btn.primary{background:var(--gold);color:#fff}
  .btn.dark{background:var(--em);color:#fff}
  .btn.ghost{background:#fff;border:1.5px solid var(--line);color:var(--em)}
  .btn.sm{padding:8px 13px;font-size:13px}
  .btn:disabled{opacity:.5;cursor:default;transform:none}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .rec{display:inline-flex;align-items:center;gap:7px;background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:9px 14px;font-weight:700;font-size:13.5px;cursor:pointer;color:var(--em)}
  .rec.on{background:#fbe9e6;border-color:var(--red);color:var(--red)}
  .rec .d{width:11px;height:11px;border-radius:50%;background:var(--red)}
  .rec.on .d{animation:pulse 1s infinite}
  @keyframes pulse{50%{opacity:.3}}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{border:1.5px solid var(--line);background:#fff;border-radius:20px;padding:7px 13px;font-size:13px;font-weight:600;cursor:pointer}
  .chip.on{border-color:var(--em);background:#EFF4EC;color:var(--em)}
  .statusbox{background:#fff;border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:10px;padding:12px 15px;font-size:14px;margin-top:12px;display:flex;align-items:center;gap:10px}
  .errbox{background:#fbecea;border:1px solid #e6c7c0;border-left:4px solid var(--red);border-radius:10px;padding:12px 15px;font-size:14px;margin-top:12px;color:#7a2318}
  .spin{width:16px;height:16px;border:2.5px solid var(--line);border-top-color:var(--gold);border-radius:50%;animation:sp .7s linear infinite;flex:none}
  @keyframes sp{to{transform:rotate(360deg)}}
  .note{background:#FBF6EC;border:1px solid var(--line);border-radius:10px;padding:11px 14px;font-size:13.5px;color:#6a4e17;margin-top:12px}
  .note.b{background:#EFF4EC;color:#1d3b2c;border-color:#c3d6c8}
  table.gt{width:100%;border-collapse:collapse;font-size:13.5px;background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-top:8px}
  table.gt th{background:var(--em);color:#EFE9DA;text-align:left;padding:8px 11px;font-size:12px;font-weight:700}
  table.gt td{padding:8px 11px;border-top:1px solid var(--line);vertical-align:top;min-width:112px}
  table.gt.narrow td{min-width:0}
  table.gt tr:nth-child(even) td{background:#faf7f0}
  .g{color:var(--green);font-weight:800}.y{color:var(--amber);font-weight:800}.r{color:var(--red);font-weight:800}
  ul.li{list-style:none;display:flex;flex-direction:column;gap:7px;margin-top:6px}
  ul.li li{position:relative;padding-left:22px;font-size:14px}
  ul.li li::before{content:"";position:absolute;left:0;top:8px;width:8px;height:8px;border-radius:2px;background:var(--gold);transform:rotate(45deg)}
  .brief-block{border:1px solid var(--line);border-radius:12px;margin-top:12px;overflow:hidden;background:#fff}
  .bb-h{background:var(--bg2);padding:11px 15px;font-weight:800;color:var(--em);font-size:14.5px;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
  .bb-body{padding:6px 15px 14px}
  .qa{padding:9px 0;border-bottom:1px dashed var(--line)}
  .qa:last-child{border-bottom:none}
  .qa .q{font-size:13px;color:var(--muted);font-weight:600;margin-bottom:4px}
  .skill{border:1px solid var(--line);border-radius:11px;padding:12px 14px;margin-top:10px;background:#fff}
  .skill .sh{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .skill .sname{font-weight:800;color:var(--em);font-size:14.5px}
  .grades{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:9px}
  .grade{border:1.5px solid var(--line);border-radius:9px;padding:9px 11px;font-size:12.5px;cursor:pointer;background:#fdfcf8}
  .grade .gl{font-weight:800;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--gold-h);margin-bottom:3px}
  .grade.on{border-color:var(--em);background:#EFF4EC}
  .grade.on .gl{color:var(--em)}
  .top5{margin-left:auto;font-size:12px;font-weight:700;color:var(--muted);display:flex;align-items:center;gap:6px;cursor:pointer}
  .top5 input{width:16px;height:16px}
  .pill{display:inline-block;font-size:11px;font-weight:800;border-radius:20px;padding:3px 9px}
  .pill.gold{background:rgba(176,130,46,.16);color:var(--gold-h)}
  .hidden{display:none}
  .out{margin-top:16px}
  .kmini{font-size:11px;color:var(--muted);margin-top:8px}
  /* устойчивая сетка статов */
  .statgrid{display:flex;flex-wrap:wrap;gap:14px;margin:12px 0}
  .stat-tile{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 18px;min-width:180px}
  .stat-tile .n{font-family:var(--serif);font-weight:800;font-size:30px;line-height:1.05}
  .stat-tile .l{font-size:12px;color:var(--muted)}
  /* рекомендация грейда */
  .recbadge{font-size:10.5px;font-weight:800;background:rgba(62,142,94,.16);color:var(--green);border-radius:20px;padding:2px 8px}
  .grade.grec{box-shadow:inset 0 0 0 2px var(--green);background:#EFF4EC}
  .grade.grec .gl{color:var(--green)}
  .reason{font-size:12px;color:var(--muted);margin-top:6px;font-style:italic}
  /* блок правок в каждом разделе */
  .fixbox{background:#FBF6EC;border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-top:14px}
  .fixbox h4{font-family:var(--serif);color:var(--em);font-size:15px;margin-bottom:8px}
  .fixbox textarea{min-height:64px}
  .card.edit{border:2px solid var(--gold2)}
  /* ---- скоркарта кандидатов ---- */
  table.sctable td{padding:6px 8px;min-width:0;vertical-align:middle}
  table.sctable th{white-space:nowrap}
  table.sctable td.scname input{width:150px;padding:7px 9px;font-size:13.5px;border:1px solid var(--line);border-radius:8px;font-family:inherit;font-weight:700;color:var(--em)}
  table.sctable td.sccell{padding:4px 5px}
  table.sctable td.sccell input{width:56px;padding:6px;font-size:13.5px;text-align:center;border:1px solid var(--line);border-radius:7px;font-family:inherit}
  table.sctable td.sccell input:focus,table.sctable td.scname input:focus{border-color:var(--gold);outline:none}
  table.sctable td.scsum,table.sctable td.scavg{font-family:var(--serif);font-weight:800;color:var(--em);text-align:center;background:#F4F1EA}
  table.sctable td.scnote textarea{width:210px;min-height:44px;padding:6px 8px;font-size:12.5px;border:1px solid var(--line);border-radius:8px;font-family:inherit;resize:vertical}
  .shortlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-top:6px}
  .b9x{display:flex;gap:11px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 13px}
  .b9x .nn{width:30px;height:30px;flex:none;border-radius:9px;background:linear-gradient(160deg,#C79A45,#B0822E);color:#fff;font-family:var(--serif);font-weight:800;display:flex;align-items:center;justify-content:center}
  .b9x b{display:block;color:var(--em);font-size:14.5px}
  .b9x span{display:block;font-size:11.5px;color:var(--muted);margin-top:2px}
  /* ---- отчётность: дашборд вакансий ---- */
  .vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px;margin-top:14px}
  .vcard2{background:#fff;border:1px solid var(--line);border-radius:14px;padding:15px 17px;cursor:pointer;transition:.15s;display:flex;flex-direction:column;gap:10px}
  .vcard2:hover{border-color:var(--gold2);transform:translateY(-2px);box-shadow:0 12px 30px rgba(20,32,27,.10)}
  .vc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .vc-name{font-family:var(--serif);font-weight:800;font-size:17px;color:var(--em);line-height:1.2}
  .vc-sub{font-size:11.5px;color:var(--muted);margin-top:3px}
  .vc-bars{display:flex;align-items:flex-end;gap:4px;height:38px;padding:2px 0;border-bottom:1px solid var(--line)}
  .vc-bars i{flex:1;background:linear-gradient(180deg,var(--gold2),var(--gold));border-radius:3px 3px 0 0;display:block}
  .vc-stats{display:flex;gap:16px}
  .vc-stats div{display:flex;flex-direction:column}
  .vc-stats b{font-family:var(--serif);font-size:20px;color:var(--em);line-height:1}
  .vc-stats span{font-size:11px;color:var(--muted);margin-top:2px}
  .vc-prog{height:6px;border-radius:4px;background:#EFE9D9;overflow:hidden}
  .vc-prog i{display:block;height:100%;background:linear-gradient(90deg,var(--gold2),var(--gold))}
  .vc-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:11.5px}
  .vc-foot .r{font-weight:700}
  .vc-open{color:var(--gold-h);font-weight:800;white-space:nowrap}
  /* ---- отчётность: дневной журнал ---- */
  .dayscroll{overflow-x:auto;margin-top:10px;border:1px solid var(--line);border-radius:10px;background:#fff}
  table.dayt{margin-top:0;border:none;border-radius:0}
  table.dayt th.stick,table.dayt td.stick{position:sticky;left:0;z-index:2;min-width:190px;background:#fff;font-weight:700;color:var(--em);box-shadow:1px 0 0 var(--line)}
  table.dayt th.stick{background:var(--em);color:#EFE9DA}
  table.dayt tr:nth-child(even) td.stick{background:#faf7f0}
  table.dayt th.dh{text-align:center;min-width:76px;white-space:nowrap}
  table.dayt th.dh span{display:block;font-size:10px;opacity:.55;cursor:pointer;font-weight:600}
  table.dayt th.dh span:hover{opacity:1;color:#ffb4a6}
  table.dayt td.dc{padding:4px 5px;min-width:0}
  table.dayt td.dc input{width:66px;padding:6px 7px;font-size:13px;text-align:center;border:1px solid var(--line);border-radius:7px;font-family:inherit}
  table.dayt td.dc input:focus{border-color:var(--gold);outline:none}
  table.dayt th.dtot,table.dayt td.dtot{background:#F4F1EA;font-weight:800;color:var(--em);text-align:center;min-width:74px}
  table.dayt th.dtot{background:var(--gold);color:#fff}
  .edblock{border:1px solid var(--line);border-radius:11px;padding:12px 14px;margin-top:12px;background:#fdfcf8}
  .edblock .edh{font-weight:800;color:var(--em);margin-bottom:2px}
  .edblock textarea{min-height:38px}
  .edlist .row textarea{flex:1}
  /* диктофон-модалка */
  .dov{position:fixed;inset:0;z-index:9999;background:rgba(14,27,21,.55);display:flex;align-items:center;justify-content:center}
  .doc{background:var(--card);border-radius:18px;padding:26px 26px 22px;width:520px;max-width:92vw;box-shadow:0 30px 80px rgba(0,0,0,.4);text-align:center}
  .doc h3{font-size:19px}
  .doc .sub{font-size:13px;color:var(--muted);margin:4px 0 16px}
  .mic{width:88px;height:88px;border-radius:50%;border:none;cursor:pointer;background:var(--em);color:#fff;font-size:34px;margin:0 auto;display:grid;place-items:center;transition:.15s}
  .mic.rec{background:var(--red);animation:mic 1.1s infinite}
  @keyframes mic{0%,100%{box-shadow:0 0 0 0 rgba(178,59,46,.5)}50%{box-shadow:0 0 0 16px rgba(178,59,46,0)}}
  .dtrans{background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;min-height:96px;max-height:200px;overflow-y:auto;text-align:left;font-size:14px;margin:16px 0 6px;white-space:pre-wrap}
  .dtrans .interim{color:var(--muted)}
  .dwrap{display:flex;gap:10px;justify-content:center;margin-top:12px}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><span class="dot"></span> A-Players</div>
    <div class="sub">Конструктор воронки найма</div>
    <div class="steps" id="steps"></div>
    <div class="keybox">
      <label>Claude API-ключ (твой)</label>
      <input id="apikey" type="password" placeholder="sk-ant-..." autocomplete="off" spellcheck="false">
      <label>Модель</label>
      <select id="model">
        <option value="claude-opus-5">Opus 5 (точнее)</option>
        <option value="claude-sonnet-5">Sonnet 5 (быстрее)</option>
      </select>
      <div style="font-size:10.5px;color:#9fb0a4;line-height:1.4">Ключ хранится только в твоём браузере. Без ключа доступен пример.</div>
    </div>
  </aside>
  <main class="main" id="main"></main>
</div>

<script>
/* ================= STATE ================= */
const LS={key:"apx_hire_key",model:"apx_hire_model",state:"apx_hire_state"};
const API_URL="https://api.anthropic.com/v1/messages";
let STEP=0;
let S={ company:"", niche:"", role:"", top3:["","",""], brief:{}, portrait:null, results:{} };
try{const j=JSON.parse(localStorage.getItem(LS.state));if(j)S=Object.assign(S,j);}catch(_){}
function save(){try{localStorage.setItem(LS.state,JSON.stringify(S));}catch(_){}}
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ================= БРИФ (7 блоков из шаблона) ================= */
const BRIEF=[
 {id:"base",name:"1 · Базовая информация",qs:[
   "Название должности (все вариации, рус/англ)","Тип занятости (part-time / full-time / фриланс)","Испытательный срок (есть? на какой период)",
   "Зарплата на испытательный срок","Зарплата после испытательного срока","Бонусы/премии (условия)","Идеальная дата выхода","Реалистичная дата выхода (сколько реально ищем)",
   "Открытый или закрытый поиск (ограничения на публикацию)","Приоритет вакансии (tier 1 критично / tier 2 важно / tier 3 спокойно)"]},
 {id:"context",name:"2 · Контекст",qs:[
   "Причина открытия вакансии (замена / расширение)","Был ли опыт поиска такого кандидата? Сложности, удачные гипотезы, сроки","Есть ли уже кандидаты (по рекомендации)?"]},
 {id:"role",name:"3 · Подробное описание позиции",qs:[
   "Кто прямой руководитель?","Есть/будут подчинённые?","Структура отдела (кто ещё в команде)","С кем чаще всего взаимодействовать (отделы/специалисты)","Перспективы роста",
   "Обязательные требования: образование, hard skills, soft skills, знание софта/тулов, опыт (лет/позиции/компании), английский","Доп. требования (nice to have)","Блокеры, с которыми не готовы работать",
   "Какие задачи предстоит решать?","Из чего состоит типичный рабочий день?","Как эти задачи решаются сейчас?","Challenges, с которыми столкнётся кандидат","Придёт «на готовое» или аудит/оптимизация процессов?"]},
 {id:"exp",name:"4 · Ожидания (ТОП-3 результата)",qs:[
   "Ожидания по итогам испытательного срока (пропишем в оффере)","Ожидания через полгода","Ожидания через год","Ожидаемый результат в деньгах"]},
 {id:"hyp",name:"5 · Гипотезы по кандидатам",qs:[
   "Портрет идеального кандидата (своими словами)","Из каких компаний-доноров смотреть людей? Гипотезы по бэкграунду","Стоп-лист по компаниям/опыту (откуда НЕ берём)"]},
 {id:"funnel",name:"6 · Воронка отбора",qs:[
   "Этапы отбора (рекрутер → тестовое → руководитель → фаундер)","Сколько кандидатов хотите увидеть на финале?","Кто со стороны заказчика участвует и на каких этапах","Кто принимает решение о пропуске/найме",
   "Ссылка на тестовое (если есть)","Кто проверяет тестовое","Рекомендации по поиску (каналы, тг, фб-группы)","Частота синкапов заказчик+рекрутер"]},

/* ================= 28 РОЛЕЙ (библиотека Drive A-Players) ================= */
/* === Библиотека портретов навыков A-Players: 28 ролей, дословно из базы (Google Drive). Источник истины для описаний Junior/Middle/Senior. === */
window.ROLE_PORTRAITS={"Финансовый директор CFO": [{"name": "Бюджетирование и FP&A (БДР, БДДС, план-факт)", "junior": "Работает с готовыми бюджетными формами и данными: собирает факт, заполняет БДР/БДДС по шаблону, сверяет с планом. Понимает базовые показатели (выручка, расходы, прибыль, движение денег). Готовит первичные план-факт таблицы под контролем руководителя, без самостоятельных выводов.", "middle": "Самостоятельно строит бюджеты (БДР, БДДС) по направлениям и юрлицам, ведет ежемесячный и квартальный план-факт. Проводит анализ отклонений, находит причины и предлагает корректировки. Отвечает за исполнение и точность бюджета своей зоны, готовит бюджетные сценарии для руководителя.", "senior": "Строит систему бюджетирования компании с нуля: годовой и ежемесячный БДР/БДДС, регламент план-факт, сценарное планирование (база, оптимистичный, пессимистичный). Связывает бюджет с финансовой стратегией и целями, управляет OPEX/CAPEX и рентабельностью. Отвечает за предсказуемость и исполнение бюджета всей компании."}, {"name": "Учет и отчетность (управленческий, РСБУ/МСФО, аудит)", "junior": "Знает базовые принципы учета (РСБУ), готовит первичные документы, разносит проводки, формирует стандартные отчеты по шаблонам. Следует установленным регламентам и срокам. Работает под контролем, эскалирует нестандартные операции руководителю.", "middle": "Самостоятельно ведет управленческий учет и отчетность (РСБУ/МСФО) по юрлицу, контролирует корректность разноски и сверки счетов. Готовит отчеты точно в срок, обеспечивает достоверность. Отвечает за отчетность своей зоны и взаимодействие с аудиторами по своему участку.", "senior": "Выстраивает систему учета и отчетности для всей группы: управленческая, РСБУ/МСФО, консолидация. Обеспечивает достоверную отчетность точно в срок, подтвержденную аудиторами, готовит пакеты для собственника и банков. Отвечает за прозрачность и достоверность всей финансовой картины компании."}, {"name": "Себестоимость и рентабельность продуктов", "junior": "Собирает данные по прямым и косвенным затратам, заполняет калькуляции себестоимости по шаблону. Понимает структуру себестоимости продукта. Работает под контролем, без самостоятельной оценки прибыльности.", "middle": "Считает себестоимость и маржинальность продуктов и SKU, анализирует отклонения от плана и динамику. Выявляет убыточные и низкомаржинальные позиции, сигнализирует о них. Отвечает за корректность расчета себестоимости в своей зоне.", "senior": "Строит систему управления себестоимостью и рентабельностью портфеля: методология расчета, контроль, драйверы маржи, план по себестоимости. Обеспечивает прибыльность продуктов, связывает себестоимость с ценообразованием и решениями бизнеса. Отвечает за то, что продукты прибыльны."}, {"name": "Unit-экономика и бизнес-аналитика", "junior": "Понимает базовые метрики (маржа, средний чек, окупаемость, CAC, LTV), считает их по готовым формулам и шаблонам. Работает с данными из учетных и BI-систем под руководством. Готовит первичную аналитику без выводов.", "middle": "Самостоятельно строит модели unit-экономики по продуктам и сегментам, ведет когортный анализ, оценивает окупаемость в динамике. Находит точки, где экономика не сходится, и предлагает решения. Отвечает за аналитику своего направления.", "senior": "Строит систему финансовой аналитики компании на данных: unit-экономика, когорты, сегментная доходность, предиктивные модели выручки и рентабельности. Делает экономику прозрачной и управляемой на всех уровнях. Основывает решения бизнеса на данных, а не на интуиции."}, {"name": "Казначейство и платежная дисциплина", "junior": "Отслеживает поступления и выплаты по шаблону, сверяет банковские выписки, готовит платежи и платежные документы. Понимает разницу между прибылью и денежным потоком. Работает под контролем в рамках регламента.", "middle": "Самостоятельно управляет краткосрочным cash flow и платежным календарем, прогнозирует денежный поток на 1-3 месяца. Обеспечивает своевременные платежи в рамках БДДС, контролирует лимиты. Отвечает за ликвидность в моменте по своей зоне.", "senior": "Строит систему казначейства и управления ликвидностью: платежный календарь, исполнение БДДС, регламент контроля и согласования платежей, привлечение дешевых ресурсов. Обеспечивает своевременную оплату без кассовых разрывов. Отвечает за ликвидность всей компании."}, {"name": "Финансирование, кредитный портфель и стоимость капитала", "junior": "Знаком с источниками финансирования (банки, кредиты, лизинг, факторинг). Помогает готовить материалы и пакеты документов для банков. Ведет реестр кредитов по шаблону под контролем.", "middle": "Готовит финансовые модели и пакеты для банков, участвует в переговорах по кредитным линиям и условиям. Ведет учет и обслуживание кредитного портфеля, следит за ковенантами. Поддерживает регулярные отношения с банками.", "senior": "Управляет финансированием и кредитным портфелем компании: наращивает лимиты, снижает стоимость капитала, обеспечивает достаточность и дешевизну ресурсов. Структурирует долговое финансирование, строит отношения с банками и инвесторами. Отвечает за размер и стоимость кредитного портфеля."}, {"name": "Управление оборотным капиталом (ДЗ, КЗ, запасы)", "junior": "Ведет учет дебиторской и кредиторской задолженности по шаблону, отслеживает сроки и просрочку. Готовит реестры и напоминания. Работает под контролем руководителя.", "middle": "Управляет ДЗ, КЗ и запасами по направлению, контролирует оборачиваемость и работает с просрочкой. Согласует условия оплат с контрагентами. Отвечает за оборотный капитал своей зоны.", "senior": "Строит систему управления оборотным капиталом: нормативы ДЗ, КЗ и запасов, оборачиваемость, высвобождение денег в оборот. Балансирует ликвидность и условия с поставщиками и клиентами. Управляет оборотным капиталом как источником денег компании."}, {"name": "Финансовое моделирование и оценка", "junior": "Работает в Excel на уровне базовых формул и таблиц, строит простые расчеты по заданному шаблону. Понимает базовые концепции (DCF, мультипликаторы). Самостоятельно модели не строит.", "middle": "Самостоятельно строит финансовые модели средней сложности (3-statement, DCF), оценивает проекты и инвестиции через NPV, IRR, срок окупаемости. Готовит сравнение сценариев. Отвечает за корректность моделей своих задач.", "senior": "Строит сложные интегрированные модели для стратегии, инвестиций и оценки бизнеса, моделирует сценарии и capital allocation. Оценивает проекты, сделки и распределение капитала на уровне компании. Делает финансовую модель основой стратегических решений."}, {"name": "Риск-менеджмент, налоги и комплаенс", "junior": "Понимает базовые финансовые и налоговые риски, следует процедурам внутреннего контроля, документирует операции по регламенту. Сообщает о выявленных рисках руководителю.", "middle": "Выявляет, оценивает и минимизирует финансовые и налоговые риски в своей зоне, поддерживает систему внутреннего контроля. Обеспечивает соответствие операций требованиям, работает с аудиторами и юристами. Внедряет корректирующие меры.", "senior": "Строит комплексную систему управления финансовыми, налоговыми и регуляторными рисками. Ведет налоговое планирование и оптимизацию в рамках закона, обеспечивает внутренний контроль и защиту активов. Управляет рисками как частью устойчивости бизнеса."}, {"name": "Финансовые системы, автоматизация и AI", "junior": "Работает в учетных системах, Excel и базовом BI по установленным процедурам. Участвует во внедрении инструментов как конечный пользователь. Вносит и сверяет данные.", "middle": "Оценивает и внедряет инструменты автоматизации отчетности и планирования, настраивает BI-дашборды и интеграции между системами. Обеспечивает достоверность и актуальность данных. Оптимизирует рутинные процессы, в том числе через AI.", "senior": "Строит технологическую основу финансовой функции: учетные системы, BI, автоматизация, AI в отчетности и анализе. Обеспечивает единую достоверную базу данных как фундамент решений. Делает финансы data-driven, прозрачными и масштабируемыми."}, {"name": "Лидерство и управление финансовой командой", "junior": "Управляет небольшой группой по четким задачам и инструкциям, контролирует исполнение и сроки. Проводит регулярные рабочие встречи. Мотивирует и поддерживает сотрудников точечно.", "middle": "Управляет командой из нескольких функций (FP&A, бухгалтерия, казначейство), развивает подчиненных через наставничество и обучение. Ставит цели и KPI, распределяет нагрузку. Отвечает за результат команды.", "senior": "Формирует и развивает финансовый департамент, нанимает сильных специалистов, растит руководителей второго уровня. Строит оргструктуру, планы развития и систему KPI, задает культуру. Управляет функцией через людей, а не вручную."}, {"name": "Стратегическое мышление и партнерство с бизнесом", "junior": "Понимает связь финансовых показателей с целями бизнеса, дает финансовую перспективу в обсуждениях. Анализирует базовые тренды, влияющие на финансы. Действует в рамках поставленных задач.", "middle": "Выступает финансовым партнером для подразделений, помогает командам принимать решения на данных. Анализирует отраслевые и рыночные тренды, влияет на экономику направлений. Связывает финансы с операционными задачами.", "senior": "Формирует финансовое видение и стратегию компании, партнер собственника и совета директоров в стратегических решениях. Управляет EBITDA, рентабельностью и capital allocation. Предвосхищает финансовые последствия решений бизнеса и рынка."}, {"name": "Коммуникация и работа со стейкхолдерами", "junior": "Готовит стандартные отчеты и презентации по шаблонам, поддерживает базовую коммуникацию по финансовым вопросам. Следует протоколам. Эскалирует сложные вопросы руководителю.", "middle": "Понятно доносит финансы нефинансовой аудитории и руководству, готовит материалы для решений. Ведет коммуникацию с банками, аудиторами и подразделениями. Проводит регулярные финансовые обзоры.", "senior": "Доносит сложные финансовые концепции собственнику, совету директоров и банкам, готовит убедительные пакеты, влияющие на стратегические решения. Строит долгосрочные отношения с ключевыми стейкхолдерами. Защищает финансовую позицию компании."}, {"name": "Решение проблем и принятие решений", "junior": "Решает стандартные финансовые задачи по установленным процедурам, находит очевидные ошибки и несоответствия в данных. Эскалирует сложные вопросы руководителю с описанием ситуации.", "middle": "Самостоятельно решает сложные задачи через системный анализ, проводит разбор первопричин отклонений. Принимает взвешенные решения в своей зоне ответственности с опорой на данные.", "senior": "Решает стратегические финансовые задачи с долгосрочными последствиями, принимает решения при высокой неопределенности и ограниченных данных. Отвечает за последствия своих решений. Интегрирует финансовую и бизнес-логику в единое решение."}, {"name": "Финансовая дисциплина и ответственность", "junior": "Соблюдает финансовые процедуры, регламенты и сроки, документирует свою работу. Доводит задачи до конца. Признает и оперативно исправляет ошибки.", "middle": "Берет полную ответственность за финансовый результат своей зоны, держит стабильно высокое качество данных и отчетности без ошибок. Проактивно выявляет и решает проблемы до того, как они станут критичными.", "senior": "Несет окончательную ответственность за финансовое здоровье всей компании: достоверность, сроки, результат. Обеспечивает исполнение обязательств перед собственником, банками и контрагентами. Задает планку финансовой дисциплины для всей функции."}, {"name": "Решения на данных (data-first)", "junior": "Опирается на доступные финансовые данные и отчеты, спрашивает цифры перед принятием решений. Ставит под сомнение решения без финансового обоснования.", "middle": "Инициирует сбор нужных данных для решений, оспаривает интуитивные выводы финансовым анализом. Строит процессы и отчетность на достоверных данных.", "senior": "Делает данные основой всех финансовых и стратегических решений, формирует культуру data-driven в компании. Инвестирует в достоверную единую базу данных как фундамент решений и требует того же от бизнеса."}, {"name": "Бизнес-ориентированность", "junior": "Понимает, что финансы - сервис для бизнеса, а не самоцель. Выполняет запросы операционных команд вовремя. Знает базовую бизнес-модель компании.", "middle": "Активно выступает финансовым партнером бизнеса, предлагает решения для роста, а не только контроль затрат. Понимает операционку и коммерческую логику направлений.", "senior": "Превращает финансовую функцию из контролирующей в создающую ценность. Делает финансы драйвером роста и прибыльности, а не только полицейским бюджета. Балансирует контроль и поддержку роста бизнеса."}, {"name": "Этика и комплаенс", "junior": "Соблюдает требования законодательства и внутренние регламенты, базовую финансовую этику. Сообщает о подозрительных операциях по установленным правилам.", "middle": "Обеспечивает соблюдение финансового законодательства и этических стандартов в своей зоне, взаимодействует с юристами и аудиторами для снижения рисков. Проводит проверки и контроль.", "senior": "Создает культуру финансовой этики и комплаенса на всех уровнях компании, обеспечивает системную защиту финансовых данных и активов. Задает стандарты честности и прозрачности финансов."}], "Операционный директор": [{"name": "Operations Strategy (операционная стратегия)", "junior": "Понимает основы операционной стратегии и ее связь с бизнес-целями. Участвует в разработке операционных планов под руководством старших коллег. Может анализировать текущие операционные процессы и выявлять очевидные проблемы. Работает с готовыми шаблонами стратегического планирования. Требует постоянного контроля и направления при стратегическом планировании.", "middle": "Самостоятельно разрабатывает операционные стратегии для отдельных направлений бизнеса. Четко связывает операционные цели со стратегическими целями компании. Проводит базовый анализ операционной среды и конкурентных преимуществ. Использует стандартные инструменты для операционного планирования. Принимает стратегические решения в рамках установленных полномочий.", "senior": "Разрабатывает комплексные долгосрочные операционные стратегии для всей компании. Интегрирует операционную стратегию с корпоративной стратегией и видением. Проводит глубокий анализ операционных возможностей, трендов и кардинальных изменений в отрасли. Создает адаптивные операционные стратегии под быстро меняющиеся условия рынка. Принимает сложные стратегические решения с долгосрочными последствиями для бизнеса."}, {"name": "Process Optimization (оптимизация процессов)", "junior": "Выявляет простые неэффективности в существующих процессах. Реализует базовые улучшения процессов по готовым инструкциям. Использует стандартные инструменты для картирования и анализа процессов. Фокусируется на устранении очевидных узких мест. Работает над оптимизацией отдельных этапов процесса под руководством.", "middle": "Самостоятельно проводит полный анализ и реинжиниринг процессов средней сложности. Применяет методологии бережливого производства и шести сигм для системной оптимизации. Внедряет автоматизацию процессов для рутинных операций. Измеряет и улучшает время цикла, качество и затратную эффективность процессов. Координирует кросс-функциональные процессы между отделами.", "senior": "Трансформирует критически важные процессы компании с радикальным улучшением производительности. Создает прорывные процессы через дизайн-мышление и инновационные подходы. Интегрирует продвинутую аналитику и искусственный интеллект для предиктивной оптимизации. Стандартизирует лучшие практики процессов по всей организации. Достигает мирового уровня эффективности процессов в отрасли."}, {"name": "Supply Chain Management (управление цепочкой поставок)", "junior": "Понимает основы функционирования цепочки поставок. Работает с поставщиками по стандартным операционным вопросам. Отслеживает базовые показатели поставок (сроки, качество). Участвует в процессе управления поставщиками под руководством. Обеспечивает выполнение текущих контрактных обязательств.", "middle": "Самостоятельно управляет средним портфелем поставщиков и подрядчиков. Оптимизирует затраты и производительность существующей цепочки поставок. Внедряет системы оценки поставщиков и метрики производительности. Управляет уровнями запасов и планированием спроса. Разрабатывает планы на случай сбоев в поставках.", "senior": "Трансформирует цепочку поставок в стратегическое конкурентное преимущество компании. Создает устойчивые и гибкие сети поставок с множественными стратегиями поиска источников. Интегрирует цифровые технологии цепочки поставок (интернет вещей, блокчейн, искусственный интеллект). Развивает стратегические партнерства с ключевыми поставщиками. Оптимизирует всю цепочку поставок для максимального создания ценности."}, {"name": "Quality Management (управление качеством)", "junior": "Знаком с базовыми принципами управления качеством и стандартами качества. Выполняет рутинные проверки качества и следует установленным процедурам контроля качества. Документирует проблемы качества и участвует в их устранении. Работает с базовыми инструментами и метриками качества. Обеспечивает соответствие минимальным требованиям качества.", "middle": "Разрабатывает и внедряет комплексные системы управления качеством. Проводит анализ коренных причин проблем качества и внедряет корректирующие действия. Управляет аудитами качества и процессами сертификации. Обучает команды в области качества и непрерывного улучшения. Обеспечивает постоянно высокие стандарты качества по всем операциям.", "senior": "Создает мирового уровня культуру качества и мышление нулевого брака по всей организации. Интегрирует передовые технологии качества (статистическое управление процессами, предиктивная аналитика качества). Разрабатывает инновации качества и инициативы прорывных улучшений. Достигает ведущих в отрасли показателей качества и удовлетворенности клиентов. Становится эталоном качества для других компаний отрасли."}, {"name": "Resource Management (управление ресурсами)", "junior": "Отслеживает использование основных ресурсов (люди, оборудование, материалы). Планирует распределение ресурсов для текущих операций. Работает с установленными бюджетами и ресурсными ограничениями. Координирует ежедневное планирование ресурсов. Обеспечивает доступность ресурсов для рутинных операций.", "middle": "Оптимизирует использование ресурсов через стратегическое планирование и прогнозирование. Управляет планированием ресурсных мощностей для среднесрочного роста. Внедряет инструменты и аналитику оптимизации ресурсов. Балансирует конкурирующие приоритеты и потребности в ресурсах между проектами. Достигает высокой эффективности в использовании всех критически важных ресурсов.", "senior": "Создает динамические модели оптимизации ресурсов для максимальной операционной гибкости. Разрабатывает стратегические стратегии поиска и распределения ресурсов. Интегрирует предиктивную аналитику для оптимального распределения ресурсов. Создает масштабируемые модели ресурсов для быстрого роста бизнеса. Трансформирует управление ресурсами в конкурентное преимущество через инновации."}, {"name": "Technology & Systems Integration (интеграция технологий и систем)", "junior": "Понимает базовые IT-системы, используемые в операциях. Работает со стандартными программными решениями под руководством IT. Участвует во внедрении новых систем как конечный пользователь. Следует установленным процедурам для использования технологий. Адаптируется к изменениям систем при поддержке обучения.", "middle": "Управляет интеграцией операционных систем среднего уровня сложности. Оценивает технологические решения для улучшения операционной эффективности. Координируется с IT в технологических проектах, затрагивающих операции. Обеспечивает правильное внедрение новых технологий командой. Оптимизирует существующие системные процессы для лучшей производительности.", "senior": "Разрабатывает комплексную технологическую стратегию для операционной трансформации. Интегрирует передовые технологии (искусственный интеллект, интернет вещей, роботизацию) в основные операции. Создает бесшовную технологическую экосистему, поддерживающую бизнес-цели. Ведет инициативы цифровой трансформации по всей организации. Становится лидером технологических инноваций в своей отрасли."}, {"name": "Risk Management (управление рисками)", "junior": "Способен идентифицировать наиболее очевидные операционные риски в своей области. Строго следует всем установленным процедурам и протоколам управления качеством. Реагирует на операционные инциденты согласно четким стандартным инструкциям. Ведет базовую документацию и отчетность по вопросам качества и управления рисками. Работает в области соблюдения требований только под постоянным контролем и руководством.", "middle": "Самостоятельно выявляет, оценивает и управляет всем спектром операционных рисков в своей зоне ответственности. Проектирует и внедряет эффективные системы контроля качества операционных процессов. Разрабатывает детальные планы предотвращения рисков и реагирования на критические ситуации. Обеспечивает полное соответствие всех процессов внутренним стандартам и внешним регуляторным требованиям. Проводит системные внутренние аудиты всех операционных процессов.", "senior": "Создает комплексную интегрированную систему управления всеми видами рисков в операционной деятельности компании. Встраивает управление рисками как неотъемлемую часть операционной стратегии и ежедневной деятельности. Формирует передовую корпоративную культуру качества, безопасности и управления рисками. Эффективно управляет репутационными и стратегическими рисками компании. Обеспечивает бесперебойную непрерывность всех бизнес-процессов даже в критических кризисных ситуациях."}, {"name": "Performance Management (управление эффективностью)", "junior": "Отслеживает базовые операционные KPI и показатели производительности. Готовит стандартные отчеты по производительности по установленным шаблонам. Участвует в обзорах производительности и постановке целей под руководством. Использует установленные метрики для мониторинга производительности команды. Реагирует на пробелы в производительности по стандартным процедурам.", "middle": "Разрабатывает комплексные системы измерения производительности для своей области. Проводит регулярный анализ производительности и выявляет возможности для улучшения. Устанавливает сложные, но достижимые цели производительности для команды. Внедряет инициативы по улучшению производительности и отслеживает результаты. Связывает индивидуальную производительность с организационными целями.", "senior": "Создает культуру управления производительностью мирового класса по всей организации. Разрабатывает инновационные метрики производительности, согласованные со стратегическими целями. Внедряет предиктивную аналитику производительности для проактивного управления. Достигает постоянно высоких результатов производительности по всем ключевым метрикам. Становится эталоном превосходства производительности для отрасли."}, {"name": "Regulatory Compliance (соответствие требованиям)", "junior": "Понимает базовые регуляторные требования, затрагивающие операции. Следует установленным процедурам и протоколам соблюдения требований. Участвует в обучении по соблюдению требований и поддерживает необходимые сертификации. Документирует действия по соблюдению требований согласно стандартным форматам. Эскалирует вопросы соблюдения требований руководству согласно процедурам.", "middle": "Управляет комплексной программой соблюдения требований для своей операционной области. Отслеживает изменения в регулировании и оценивает их влияние на операции. Разрабатывает процедуры соблюдения требований и обучает команду требованиям. Проводит внутренние аудиты соблюдения требований и корректирующие действия. Профессионально взаимодействует с внешними регуляторами и аудиторами.", "senior": "Создает проактивную стратегию соблюдения требований, предвосхищающую эволюцию регулирования. Бесшовно интегрирует требования соблюдения в основные бизнес-процессы. Влияет на отраслевые регуляторные стандарты через мысль лидерство. Достигает нулевых нарушений соблюдения требований при поддержании операционной эффективности. Становится примером превосходства соблюдения требований для других организаций."}, {"name": "Leadership & Team Management (лидерство и управление командой)", "junior": "Управляет небольшой командой до 10 человек в рамках четких инструкций. Применяет базовые принципы делегирования простых задач. Проводит регулярные рабочие встречи и собирает стандартную отчетность. Мотивирует сотрудников через традиционные инструменты поощрения. Справляется с повседневными управленческими задачами при активной поддержке HR-службы.", "middle": "Эффективно управляет командами среднего размера 10-25 человек с различными функциональными ролями. Активно развивает подчиненных через систематическое наставничество и организацию обучения. Создает эффективное взаимодействие и координацию между различными отделами и функциями. Успешно разрешает конфликты и управляет организационными изменениями среднего масштаба. Формирует высокую культуру производительности и результативности в своей зоне ответственности.", "senior": "Управляет крупными подразделениями 25+ человек, включая сложные матричные организационные структуры. Системно развивает лидерский потенциал второго уровня в своих командах. Создает и внедряет передовую операционную культуру высокой эффективности по всей компании. Успешно проводит трансформационные организационные изменения масштаба всей компании. Является признанным ментором и примером для подражания для всех управленцев компании."}, {"name": "Problem Solving (решение проблем)", "junior": "Решает рутинные операционные проблемы, используя установленные процедуры и руководящие принципы. Может определить базовые коренные причины простых проблем. Эскалирует сложные вопросы руководству для решения. Применяет стандартные инструменты и методы решения проблем. Фокусируется на немедленных исправлениях, а не на системных решениях.", "middle": "Самостоятельно решает сложные операционные проблемы через систематический анализ. Проводит тщательный анализ коренных причин и разрабатывает устойчивые решения. Применяет структурированные методологии решения проблем (8D, DMAIC). Предотвращает повторение проблем через улучшения процессов. Наставляет других в эффективных подходах к решению проблем.", "senior": "Решает высоко сложные стратегические проблемы с далеко идущими последствиями. Применяет продвинутые инструменты решения проблем и инновационное мышление. Трансформирует хронические проблемы в конкурентные преимущества. Создает культуру решения проблем и возможности по всей организации. Становится экспертом для самых сложных операционных проблем в отрасли."}, {"name": "Communication & Coordination (коммуникация и координация)", "junior": "Поддерживает базовую коммуникацию с внутренними заинтересованными сторонами по операционным вопросам. Участвует в рутинных встречах и предоставляет обновления статуса. Следует стандартным протоколам и процедурам коммуникации. Координирует простые активности между небольшими командами. Эскалирует проблемы коммуникации руководству при необходимости.", "middle": "Эффективно коммуницирует с разнообразными заинтересованными сторонами, включая высшее руководство. Проводит кросс-функциональные встречи и способствует продуктивным обсуждениям. Создает четкие каналы коммуникации между отделами. Координирует сложные многокомандные инициативы успешно. Адаптирует стиль коммуникации к различным аудиториям эффективно.", "senior": "Мастерски коммуницирует сложные операционные концепции руководителям высшего уровня и совету директоров. Создает убедительные презентации, влияющие на стратегические решения. Строит сильные сети внутри и вне организации. Координирует общекорпоративные инициативы, включая внешних партнеров. Становится доверенным коммуникационным мостом между операциями и другими функциями."}, {"name": "Change Management (управление изменениями)", "junior": "Участвует в организационных изменениях, следуя руководству от лидеров изменений. Помогает команде адаптироваться к базовым изменениям процессов. Коммуницирует требования изменений согласно установленным сообщениям. Поддерживает инициативы изменений через личное соблюдение. Предоставляет обратную связь по вызовам внедрения изменений.", "middle": "Планирует и выполняет операционные изменения средней сложности успешно. Разрабатывает планы управления изменениями, включая анализ заинтересованных сторон. Обеспечивает эффективное обучение и поддержку во время переходов. Преодолевает сопротивление изменениям через стратегии вовлечения. Измеряет успех изменений и адаптирует подход на основе обратной связи.", "senior": "Ведет трансформационные инициативы изменений по всей организации. Создает видение изменений и убедительное повествование для крупных трансформаций. Строит коалицию изменений и развивает чемпионов изменений по всей организации. Успешно навигирует сложную организационную политику во время крупных изменений. Трансформирует корпоративную культуру через устойчивое лидерство изменений."}, {"name": "Strategic Thinking (стратегическое мышление)", "junior": "Понимает, как ежедневные операции связываются с более широкими бизнес-целями. Участвует в стратегических обсуждениях, предоставляя операционную перспективу. Может анализировать базовые рыночные тренды, влияющие на операции. Думает за пределами немедленных задач к долгосрочным последствиям. Ищет руководство по стратегическим решениям, влияющим на операции.", "middle": "Разрабатывает операционные стратегии, согласованные с корпоративным стратегическим направлением. Анализирует отраслевые тренды и конкурентную среду для стратегических инсайтов. Балансирует краткосрочные операционные потребности с долгосрочными стратегическими целями. Вносит ценный стратегический вклад в решения высшего руководства. Предвосхищает будущие операционные вызовы и возможности.", "senior": "Формирует стратегическое видение для операций, интегрируя множественные сложные факторы. Влияет на корпоративную стратегию через глубокую операционную экспертизу. Создает инновационные стратегические решения для конкурентной дифференциации. Предвосхищает отраслевые сбои и позиционирует компанию выгодно. Становится признанным стратегическим мыслителем в отрасли."}, {"name": "Decision Making (принятие решений)", "junior": "Принимает рутинные операционные решения в рамках установленных руководящих принципов. Консультируется с руководством по нестандартным решениям. Использует доступные данные для базового анализа решений. Следует стандартным процессам принятия решений. Документирует решения согласно установленным процедурам.", "middle": "Принимает сложные операционные решения самостоятельно с хорошим суждением. Использует аналитику данных и количественные методы для информированного принятия решений. Балансирует конкурирующие приоритеты при принятии сложных компромиссных решений. Консультируется с заинтересованными сторонами, но сохраняет власть принятия решений. Берет ответственность за результаты решений и учится из результатов.", "senior": "Принимает стратегические решения с значительными долгосрочными последствиями для организации. Интегрирует сложные данные, рыночные инсайты и вклад заинтересованных сторон в процесс принятия решений. Принимает высокорисковые решения в неопределенных средах с уверенностью. Создает инструменты принятия решений, используемые по всей организации. Становится доверенным советником для CEO по самым критическим операционным решениям."}, {"name": "Operational Excellence (операционное совершенство)", "junior": "Понимает принципы операционного совершенства и следует лучшим практикам. Участвует в инициативах улучшения под руководством старших членов команды. Поддерживает стандарты качества и процедуры в ежедневных операциях. Выявляет базовые возможности улучшения в непосредственной рабочей области. Поддерживает корпоративные инициативы операционного совершенства.", "middle": "Внедряет методологии операционного совершенства (бережливое производство, шесть сигм) в своей области. Ведет проекты улучшения, обеспечивающие измеримые результаты. Создает стандартизированные процессы и лучшие практики для постоянной производительности. Разрабатывает операционные метрики и регулярно отслеживает производительность. Наставляет членов команды в принципах операционного совершенства.", "senior": "Создает культуру операционного совершенства мирового класса по всей организации. Ведет прорывные улучшения, обеспечивающие исключительные бизнес-результаты. Интегрирует операционное совершенство с стратегическими бизнес-целями бесшовно. Становится отраслевым эталоном для операционной производительности. Влияет на отраслевые стандарты через мысль лидерство в операционном совершенстве."}, {"name": "Continuous Improvement (непрерывное улучшение)", "junior": "Участвует в деятельности по улучшению, следуя руководству от старшей команды. Выявляет базовые неэффективности и предлагает простые решения. Внедряет назначенные улучшения в своей рабочей области. Отслеживает базовые метрики, связанные с инициативами улучшения. Поддерживает командную культуру улучшений через личный пример.", "middle": "Ведет инициативы непрерывного улучшения средней сложности успешно. Развивает мышление улучшения и возможности у членов команды. Использует подход, основанный на данных, для выявления и приоритизации улучшений. Внедряет систематические процессы улучшения с измеримыми результатами. Создает устойчивую культуру улучшения в операционной области.", "senior": "Трансформирует организацию в электростанцию непрерывного улучшения. Создает инновационную культуру, где улучшение становится естественным поведением. Разрабатывает собственные методологии улучшения, обеспечивающие превосходные результаты. Интегрирует непрерывное улучшение со стратегическим планированием бесшовно. Становится отраслевым мысль лидером в практиках непрерывного улучшения."}, {"name": "Customer Focus (фокус на клиенте)", "junior": "Понимает базовые требования клиентов, влияющие на операции. Поддерживает уровни обслуживания согласно установленным стандартам. Отвечает на проблемы клиентов, следуя стандартным процедурам. Отслеживает базовые метрики удовлетворенности клиентов. Эскалирует проблемы клиентов согласно протоколам.", "middle": "Активно управляет ожиданиями клиентов и предоставлением услуг в операционной области. Разрабатывает клиентоцентричные процессы, улучшающие удовлетворенность и лояльность. Анализирует обратную связь клиентов для операционных улучшений. Координируется с командами, обращенными к клиентам, для бесшовного опыта. Балансирует потребности клиентов с требованиями операционной эффективности.", "senior": "Создает клиентоцентричную операционную стратегию, трансформирующую клиентский опыт. Интегрирует голос клиента во все операционные решения. Разрабатывает предиктивные возможности для предвосхищения потребностей клиентов. Достигает ведущей в отрасли удовлетворенности клиентов через операционное совершенство. Становится защитником клиентов, влияющим на всю организационную стратегию."}, {"name": "Safety & Sustainability (безопасность и устойчивость)", "junior": "Строго следует всем протоколам безопасности и экологическим процедурам. Поддерживает актуальность необходимого обучения по безопасности и сертификаций. Сообщает о происшествиях и опасностях безопасности согласно процедурам. Участвует в инициативах устойчивости под руководством политик. Понимает базовое экологическое воздействие своей операционной области.", "middle": "Разрабатывает комплексные программы безопасности с целями нулевых происшествий. Интегрирует соображения устойчивости в операционное планирование и решения. Обучает команду в лучших практиках безопасности и экологическом сознании. Внедряет инициативы по сокращению отходов и эффективности ресурсов. Балансирует операционную эффективность с требованиями безопасности и экологии.", "senior": "Создает ведущую в отрасли культуру безопасности с исключительной записью производительности. Пионирует модель устойчивых операций, становясь экологическим лидером. Интегрирует безопасность и устойчивость в стратегическое бизнес-планирование. Достигает превосходных эталонов безопасности и экологической производительности. Влияет на отраслевые стандарты через мысль лидерство в безопасности и устойчивости."}, {"name": "Accountability & Results (ответственность и результаты)", "junior": "Берет ответственность за назначенные задачи и обеспечивает ожидаемые результаты. Соблюдает установленные сроки и стандарты качества постоянно. Оперативно эскалирует проблемы, угрожающие поставкам, руководству. Документирует прогресс работы и результаты согласно требованиям. Принимает обратную связь и работает над улучшением производительности.", "middle": "Берет полную ответственность за операционные результаты в области ответственности. Постоянно превышает цели производительности и ожидания поставки. Проактивно решает препятствия и находит креативные решения для вызовов. Держит команду подотчетной за высокие стандарты и поставку результатов. Создает культуру собственности и мышления, ориентированного на результаты.", "senior": "Берет окончательную подотчетность за общекорпоративный операционный успех и неудачи. Обеспечивает исключительные результаты, постоянно превышающие ожидания заинтересованных сторон. Создает культуру, ориентированную на результаты, пронизывающую всю организацию. Трансформирует вызовы в конкурентные преимущества через неустанное исполнение. Становится признанным лидером за поставку невозможных результатов в отрасли."}], "CEO": [{"name": "Strategic Planning (Стратегическое планирование)", "junior": "Выполняет готовую стратегию компании • Понимает что такое стратегия - долгосрочный план развития компании на 3-5 лет • Может разложить большие цели на мелкие задачи (например: цель \"увеличить продажи на 50%\" = 100 задач по привлечению клиентов) • Следует установленным показателям успеха (KPI - ключевые показатели эффективности, например: количество звонков в день, процент закрытых сделок) • Участвует в совещаниях по планированию как исполнитель, а не как тот кто принимает решения • Умеет читать стратегические документы и понимать свою роль в общем плане", "middle": "Создает стратегию компании на 1-2 года • Проводит SWOT-анализ (анализ Сильных сторон, Слабостей, Возможностей, Угроз) для своего направления • Изучает конкурентов: что они делают лучше, где мы можем их обойти • Создает план развития отдела с конкретными целями и сроками • Умеет связать цели отдела с общими целями компании (например: если компания хочет выйти в новые города, то отдел продаж планирует найм менеджеров в этих городах) • Может менять планы когда меняется ситуация на рынке • Использует методы планирования: OKR (Цели и Ключевые Результаты), Balanced Scorecard (система сбалансированных показателей)", "senior": "Определяет стратегию всей компании на 3-5 лет с гарантированным ростом • Создает видение компании - как она будет выглядеть через 5 лет (например: \"станем лидером рынка доставки еды в 10 городах\") • Анализирует тренды в отрасли и экономике, предсказывает изменения • Создает несколько вариантов развития (сценарии): оптимистичный, реалистичный, пессимистичный • Обеспечивает чтобы все отделы работали в одном направлении • Включает принципы ESG (Экология, Социальная ответственность, Корпоративное управление) в стратегию • Использует продвинутые методы: Blue Ocean Strategy (создание новых рынков), Platform Strategy (построение экосистемы партнеров)"}, {"name": "P&L Management (Управление прибылями и убытками)", "junior": "Читает и понимает финансовые отчеты • Понимает что такое P&L отчет - документ показывающий сколько денег заработала и потратила компания • Знает основные показатели: выручка (доходы), расходы, прибыль, маржинальность (сколько процентов от дохода остается прибыли) • Следит за бюджетом своего направления - не тратит больше выделенных денег • Понимает как его действия влияют на финансы (например: если привлек дорогого клиента, это увеличит выручку) • Может объяснить почему показатели выросли или упали", "middle": "Управляет финансами отдела, находит способы экономить деньги • Планирует бюджет отдела на год: сколько нужно денег на зарплаты, оборудование, маркетинг • Анализирует отклонения - почему потратили больше или меньше чем планировали • Ищет способы увеличить доходы и уменьшить расходы без потери качества • Внедряет методы контроля затрат (cost management) • Готовит обоснования для больших трат: почему нужно купить новое оборудование, сколько это принесет прибыли • Использует продвинутые инструменты: Power BI (аналитика), системы планирования бюджетов", "senior": "Управляет финансами всей компании, поддерживает прибыльность на нужном уровне • Создает сводный финансовый план всей компании • Балансирует текущую прибыль и долгосрочные инвестиции (например: потратить деньги сейчас на разработку нового продукта, чтобы заработать больше в будущем) • Оптимизирует налоги законными способами • Управляет оборотным капиталом - следит чтобы хватало денег на текущие операции • Строит прогнозные модели для разных сценариев развития • Использует системы: ERP (планирование ресурсов предприятия), продвинутая аналитика, прогнозные модели"}, {"name": "Unit Economics (Экономика единицы продукта)", "junior": "Считает базовые показатели по шаблону • Понимает что такое unit economics - сколько денег приносит и тратит компания на одного клиента • Считает CAC (Customer Acquisition Cost) - сколько стоит привлечь одного клиента • Считает LTV (Life Time Value) - сколько денег принесет один клиент за все время • Считает ARPU (Average Revenue Per User) - средний доход с одного пользователя • Работает в готовых Excel таблицах и системах • Понимает воронку продаж: сколько людей узнало о продукте → сколько заинтересовалось → сколько купило", "middle": "Улучшает показатели единичной экономики в своем отделе • Строит детальные модели: разбивает клиентов по группам, считает показатели для каждой группы отдельно • Проводит когортный анализ - сравнивает как ведут себя клиенты, пришедшие в разное время • Делит клиентов на сегменты по поведению, доходам, регионам • Проводит A/B тесты - сравнивает два варианта (например: две версии сайта) чтобы понять какой работает лучше • Связывает экономические показатели с реальными процессами в компании • Внедряет модели атрибуции - понимает какой канал маркетинга привел клиента", "senior": "Строит масштабируемую модель экономики с нужным соотношением LTV/CAC • Создает комплексную модель для всех направлений бизнеса • Встраивает unit economics в стратегическое планирование компании • Использует машинное обучение для прогноза поведения клиентов • Внедряет ценообразование основанное на ценности для клиента • Создает системы мониторинга показателей в реальном времени • Настраивает автоматическую оптимизацию ставок в рекламных кампаниях"}, {"name": "Fundraising & Investor Relations (Привлечение инвестиций)", "junior": "Помогает готовить материалы для инвесторов • Понимает что такое венчурное финансирование - когда инвесторы дают деньги в обмен на долю в компании • Помогает создавать презентации для инвесторов (pitch deck) • Участвует в due diligence - процесс когда инвесторы проверяют компанию перед инвестицией • Знает основные термины: валуация (оценка стоимости компании), equity (доля в компании), term sheet (основные условия сделки) • Собирает документы и данные которые запрашивают инвесторы", "middle": "Самостоятельно ведет переговоры с инвесторами • Презентует компанию бизнес-ангелам (богатые люди которые инвестируют свои деньги) и венчурным фондам • Ведет переговоры по условиям сделки: какую долю отдать, по какой цене • Управляет процессом проверки компании инвесторами • Поддерживает регулярное общение с инвесторами: отчеты о результатах, планы на будущее • Понимает разные типы финансирования: обычные акции, конвертируемые займы, долговое финансирование", "senior": "Привлекает крупные раунды инвестиций на выгодных условиях • Строит долгосрочную стратегию привлечения капитала: когда, сколько и от кого получать деньги • Управляет сложными структурами сделок: транши (части инвестиций), стратегические инвесторы • Ведет переговоры с институциональными инвесторами (пенсионные фонды, банки) и стратегическими партнерами • Готовит компанию к IPO (выход на биржу) или продаже другой компании • Создает конкуренцию между инвесторами чтобы получить лучшие условия • Управляет cap table (таблица акционеров) и программами для сотрудников"}, {"name": "M&A (Слияния и поглощения)", "junior": "Участвует в интеграции купленных компаний • Понимает что такое M&A - когда одна компания покупает другую или они объединяются • Помогает объединить процессы и системы разных компаний • Участвует в культурной интеграции - помогает сотрудникам разных компаний работать вместе • Поддерживает проекты по получению синергии - дополнительной прибыли от объединения • Помогает адаптировать новых сотрудников", "middle": "Руководит сделками среднего размера • Ищет компании для покупки, делает первичный анализ • Управляет due diligence - детальной проверкой компании перед покупкой • Участвует в переговорах о цене и условиях сделки • Планирует и реализует интеграцию после покупки • Работает с внешними консультантами: инвестиционными банками, юристами, аудиторами • Следит чтобы сделка принесла ожидаемые результаты", "senior": "Строит стратегию M&A, интегрирует компании без потери эффективности • Создает долгосрочную стратегию покупок связанную с общей стратегией бизнеса • Создает pipeline сделок - постоянный поток потенциальных покупок • Ведет сложные международные сделки • Создает стандартные процедуры интеграции которые можно повторять • Управляет портфелем активов - решает что покупать, что продавать • Интегрирует M&A в систему распределения капитала"}, {"name": "Go-to-Market Strategy (Стратегия выхода на рынок)", "junior": "Участвует в запуске продукта • Понимает основы продуктового маркетинга - как рассказать рынку о новом продукте • Участвует в планировании запуска продукта • Поддерживает маркетинговые кампании • Собирает и анализирует отзывы клиентов • Помогает готовить материалы для запуска: описания продукта, цены, каналы продаж", "middle": "Руководит выходом продукта на один рынок • Разрабатывает полную стратегию выхода на рынок для нового продукта • Координирует работу разных отделов: продуктового, маркетингового, продаж • Распределяет бюджет между маркетинговыми каналами • Проводит исследование рынка и анализ конкурентов • Строит карту пути клиента - как он узнает о продукте, пробует, покупает • Оптимизирует конверсию на каждом этапе воронки", "senior": "Открывает новые страны, получает значительную долю выручки от них • Создает стратегию глобальной экспансии с учетом особенностей каждой страны • Строит систему выхода на множество рынков одновременно • Управляет международными партнерствами и каналами дистрибуции • Адаптирует продукт под местные рынки (локализация, соответствие местным законам) • Создает масштабируемые операции для работы в разных странах • Интегрирует рыночную аналитику в принятие стратегических решений"}, {"name": "Data-Driven Decision Making (Решения на основе данных)", "junior": "Понимает базовые показатели и может их объяснить • Понимает основные бизнес-метрики компании и KPI (ключевые показатели эффективности) • Умеет работать с дашбордами (панели с графиками и цифрами) и отчетами • Может делать простой анализ в Excel или Google Таблицах • Понимает что такое статистическая значимость - когда различия в данных действительно важны, а когда случайны • Всегда спрашивает данные перед принятием решений", "middle": "Принимает решения основываясь на анализе данных • Строит сложную аналитику для своего направления • Проводит когортный анализ (сравнение групп клиентов), вороночный анализ (где теряем клиентов), корреляционный анализ (что на что влияет) • Использует SQL (язык запросов) для работы с базами данных • Внедряет A/B тестирование для проверки гипотез • Создает прогнозные модели для планирования бизнеса", "senior": "Строит систему аналитики для всей компании и создает культуру принятия решений на данных • Создает архитектуру данных для всего предприятия и правила управления данными • Внедряет продвинутую аналитику: машинное обучение, искусственный интеллект, прогнозные модели • Строит системы поддержки решений в реальном времени • Формирует культуру где все решения принимаются на основе данных • Интегрирует внешние данные: рыночную информацию, данные о конкурентах • Создает платформы самообслуживания для аналитики всей организации"}, {"name": "Change Management (Управление изменениями)", "junior": "Внедряет изменения по готовому плану • Понимает основы управления изменениями - как помочь людям принять новые процессы • Следует установленным процедурам изменений • Объясняет своей команде зачем нужны изменения и как они будут происходить • Участвует в обучении и программах внедрения • Собирает обратную связь от команды о том как проходят изменения", "middle": "Управляет изменениями в своем отделе • Планирует и реализует изменения в отделе • Проводит анализ заинтересованных сторон - кто поддерживает изменения, кто против • Создает планы коммуникации - кому, когда и как рассказывать об изменениях • Управляет сопротивлением изменениям - помогает людям принять новое • Измеряет насколько успешно внедряются изменения • Использует методы управления изменениями: 8-шаговый процесс Коттера, модель ADKAR", "senior": "Ведет трансформацию всей компании без снижения результатов • Создает комплексную стратегию трансформации компании • Управляет крупномасштабными организационными изменениями • Создает культуру готовности к изменениям и адаптивные способности • Балансирует инновации и операционное совершенство • Внедряет методы непрерывных улучшений: Lean (бережливое производство), Agile (гибкие методы) • Строит организационную устойчивость и способность быстро адаптироваться"}, {"name": "Operational Excellence (Операционное совершенство)", "junior": "Соблюдает процессы и стандарты • Понимает установленные рабочие процессы и процедуры • Следует стандартам качества и лучшим практикам • Участвует в проектах улучшения процессов • Ведет документацию и делится знаниями с коллегами • Предлагает простые улучшения в работе", "middle": "Оптимизирует процессы в своей области • Проводит картирование процессов - детально описывает как происходит работа • Ищет узкие места - где процесс замедляется или дает сбои • Внедряет автоматизацию процессов и цифровизацию • Создает показатели эффективности и системы мониторинга • Управляет проектами непрерывных улучшений • Использует методы Lean Six Sigma для повышения качества и эффективности", "senior": "Строит операционную модель компании, значительно сокращает время вывода продуктов на рынок • Проектирует операционную модель от начала до конца • Создает масштабируемые процессы и архитектуру систем • Внедряет продвинутую автоматизацию: RPA (роботизированная автоматизация процессов), процессы на основе ИИ • Строит систему операционных метрик связанную с бизнес-стратегией • Создает центры компетенций и распространения лучших практик • Интегрирует операционное совершенство в корпоративную стратегию"}, {"name": "Decision-Making Under Uncertainty (Принятие решений в неопределенности)", "junior": "Принимает решения когда есть нужная информация • Использует доступные данные и проверенные методы принятия решений • Консультируется с руководством по сложным вопросам • Применяет проверенные процессы принятия решений • Записывает почему принял то или иное решение • Не торопится с решениями когда информации недостаточно", "middle": "Решает задачи когда информации не хватает • Применяет вероятностное мышление - оценивает шансы разных исходов • Использует сценарное планирование - готовит планы на разные варианты развития событий • Создает деревья решений - схемы которые помогают выбрать лучший вариант • Управляет компромиссами между скоростью и точностью решения • Использует мнения экспертов когда данных не хватает • Применяет подход реальных опционов - сохраняет возможность изменить решение позже", "senior": "Создает систему принятия решений в условиях высокой неопределенности • Строит надежные методы принятия решений для неясных ситуаций • Создает механизмы раннего обнаружения изменений • Применяет подход венчурного капитала к стратегическим инвестициям • Создает портфельный подход к инновациям и инициативам роста • Внедряет быстрое экспериментирование и методы \"быстро провалиться\" • Развивает организационную амбидекстрию (способность одновременно исследовать новое и эксплуатировать существующее)"}, {"name": "Critical Thinking (Критическое мышление)", "junior": "Проверяет факты и задает вопросы • Проверяет информацию из нескольких источников • Применяет простую логику и рассуждения • Задает уточняющие вопросы • Избегает когнитивных предрассудков - ошибок мышления • Не принимает информацию на веру, всегда проверяет", "middle": "Анализирует гипотезы и рассматривает альтернативы • Применяет структурированные методы решения проблем • Проводит анализ первопричин - ищет настоящие причины проблем • Оценивает предположения и модели мышления • Генерирует альтернативные гипотезы • Использует подход \"адвоката дьявола\" - специально критикует идеи чтобы их улучшить", "senior": "Внедряет критическое мышление в культуру компании • Создает системный подход к сложным проблемам • Внедряет методы \"красная команда / синяя команда\" - одна группа атакует идеи другой • Создает культуру интеллектуальной честности • Развивает коллективный интеллект • Применяет продвинутые техники рассуждения: байесовское мышление, системное мышление • Создает процессы аудита решений для непрерывного обучения"}, {"name": "Leadership (Лидерство)", "junior": "Мотивирует свою команду • Применяет базовые принципы лидерства • Мотивирует через личный пример • Регулярно дает обратную связь и признание • Поддерживает командный дух и вовлеченность • Помогает команде решать проблемы", "middle": "Руководит командами из разных отделов • Применяет разные стили лидерства в зависимости от ситуации • Управляет матричными организациями - когда люди подчиняются нескольким руководителям • Создает согласованность между разными функциями • Развивает других лидеров в организации • Применяет принципы лидерства изменений", "senior": "Формирует культуру лидерства во всей компании • Создает программы развития лидерства • Внедряет модель распределенного лидерства • Формирует кадровый резерв лидеров для планирования преемственности • Создает модели компетенций лидерства • Развивает адаптивные лидерские способности • Интегрирует развитие лидерства в бизнес-стратегию"}, {"name": "Ownership (Принятие ответственности)", "junior": "Отвечает за свою работу • Берет ответственность за порученные задачи • Проактивно находит и решает проблемы • Не обвиняет других в неудачах • Доводит дела до конца • Признает свои ошибки и учится на них", "middle": "Берет ответственность за бизнес-результат своего направления • Думает шире своих функциональных обязанностей • Ведет проекты с участием разных отделов • Принимает решения в интересах общего бизнеса, а не только своего отдела • Отвечает за бизнес-результаты, а не только за выполнение активностей • Создает менталитет владельца в своей команде", "senior": "Несет полную ответственность за результаты всей компании • Создает культуру ответственности во всей организации • Связывает личный успех с успехом компании • Берет ответственность перед всеми заинтересованными сторонами: сотрудники, клиенты, инвесторы • Строит системы которые поощряют менталитет владельца • Показывает пример экстремальной ответственности • Создает психологическую безопасность для ответственного принятия рисков"}, {"name": "Customer Obsession (Клиентоориентированность)", "junior": "Следует стандартам обслуживания клиентов • Понимает потребности и ожидания клиентов • Следует установленным протоколам обслуживания клиентов • Собирает и передает обратную связь от клиентов • Ставит клиента на первое место в повседневных решениях • Быстро реагирует на жалобы клиентов", "middle": "Улучшает продукт на основе обратной связи клиентов • Инициирует улучшения ориентированные на клиента • Использует данные о клиентах для принятия продуктовых решений • Создает карты пути клиента • Внедряет программы \"голос клиента\" • Измеряет и улучшает показатели удовлетворенности клиентов", "senior": "Строит стратегию всей компании вокруг клиента • Встраивает одержимость клиентом в корпоративную стратегию • Создает бизнес-модель ориентированную на клиента • Строит организацию вокруг пути клиента • Использует инсайты клиентов для стимулирования инноваций • Создает консультативные советы клиентов и петли обратной связи • Измеряет успех бизнеса через успех клиентов"}, {"name": "Data-First Thinking (Мышление основанное на данных)", "junior": "Использует готовые данные для работы • Использует доступные данные для принятия решений • Понимает основные метрики и KPI • Ставит под сомнение решения не подкрепленные данными • Ищет данные прежде чем делать предположения • Умеет читать простые отчеты и дашборды", "middle": "Принимает решения на основе анализа данных • Инициирует сбор данных • Создает процессы основанные на данных • Оспаривает интуицию с помощью данных • Строит аналитические способности • Обучает команду важности данных", "senior": "Делает данные основой всех бизнес-процессов • Встраивает данные в каждый бизнес-процесс • Создает культуру приоритета данных • Инвестирует в инфраструктуру"}], "Директор отдела продаж": [{"name": "Решение проблем", "junior": "Решает локальные проблемы в продажах по готовым сценариям и в рамках заданной стратегии. Эскалирует нестандартные ситуации выше. Тушит операционные пожары точечно, без анализа коренных причин. Держит фокус на быстром возврате к плану.", "middle": "Самостоятельно диагностирует системные сбои в продажах (падение конверсий, просадка канала, срыв плана команды) и находит первопричину. Строит решения, которые убирают проблему на уровне процесса, а не симптома. Балансирует скорость и системность, обучает руководителей команд разбору проблем.", "senior": "Работает с проблемами уровня всей sales-функции и коммерческой модели. Превращает системные ограничения (зависимость от канала, концентрация клиентов, потолок роста) в точки конкурентного преимущества. Создает методологию разбора проблем, которую тиражирует на всю организацию продаж, и предвосхищает сбои до их появления."}, {"name": "Стратегия каналов и route-to-market", "junior": "Работает внутри уже выбранных каналов, поддерживает текущую модель дистрибуции. Понимает разницу между сетями, дистрибуцией, ключевыми клиентами, экспортом и D2C, но не проектирует микс каналов. Реализует решения по каналам, принятые сверху.", "middle": "Строит и оптимизирует микс каналов под сегменты и территории, считает экономику каждого канала. Определяет, где продавать напрямую, где через партнеров и дистрибьюторов, где через сети. Управляет конфликтом каналов, выстраивает правила игры и покрытие. Достигает роста за счет перераспределения фокуса между каналами.", "senior": "Проектирует route-to-market для всей компании: какие каналы, в каких пропорциях, на каких рынках и с какой экономикой обеспечивают предсказуемый рост. Открывает принципиально новые каналы и модели продаж как источник конкурентного преимущества. Связывает канальную стратегию с продуктом, ценой и логистикой в единую систему выхода на рынок."}, {"name": "Стратегия продаж и roadmapping", "junior": "Мыслит горизонтом квартала, исполняет заданную стратегию продаж. Участвует в планировании, но не формирует его. Не связывает действия команды с долгосрочной картиной бизнеса.", "middle": "Строит roadmap продаж на 12 месяцев: цели по каналам, территориям, сегментам, ресурсам и найму. Декомпозирует коммерческую цель компании в исполнимый план функции продаж. Пересматривает стратегию под изменения рынка, отстаивает приоритеты и ресурсы.",
