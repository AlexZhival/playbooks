 "senior": "Формирует стратегию продаж на 2-3 года: как масштабируется sales-машина, какие рынки и каналы открываются, какая структура и экономика продаж нужна под цели бизнеса. Влияет на коммерческую стратегию компании со стороны продаж. Умеет отказываться от направлений ради фокуса и связывать план продаж с продуктовой и финансовой моделью."}, {"name": "Управление P&L продаж", "junior": "Отвечает за выполнение плана по выручке, видит маржу как отчетную цифру. Работает в рамках заданной ценовой и дисконтной политики. Не влияет на экономику сделки осознанно.", "middle": "Управляет не только выручкой, но и маржинальностью: контролирует дисконты, структуру сделки, микс продуктов и каналов ради экономики. Считает экономику канала и клиента, находит источники маржи внутри продаж. Балансирует рост объема и качество выручки.", "senior": "Владеет P&L продаж целиком: выручка, маржа, стоимость канала, экономика привлечения и удержания. Строит дисконтную и коммерческую политику, которая защищает маржу при росте. Принимает решения на стыке цены, объема и стратегии, отвечает за здоровье экономики продаж перед C-level. (Не путать с P&L всей компании - это зона коммерческого директора.)"}, {"name": "Проектирование и масштабирование орг-структуры продаж", "junior": "Работает в существующей структуре, закрывает вакансии рядовых продавцов по резюме. Не проектирует, как устроена команда, а поддерживает то, что есть. Масштабирование понимает как найм еще людей.", "middle": "Проектирует структуру под задачи: разделение по каналам, сегментам, территориям, роли hunter/farmer, выделение RevOps и enablement. Определяет норму управляемости, нанимает и растит руководителей команд. Масштабирует так, чтобы продуктивность не падала с ростом штата.", "senior": "Строит sales-организацию как систему, способную кратно расти без потери управляемости и экономики. Проектирует уровни управления, RevOps, enablement, карьерные треки и модель, при которой результат воспроизводим, а не держится на героях. Заранее закладывает структуру под стратегию роста на годы вперед."}, {"name": "Запуск новых рынков, сегментов и филиалов", "junior": "Участвует в запуске нового направления как исполнитель, отвечает за отдельные задачи. Не держит проект запуска целиком. Опирается на готовый план входа.", "middle": "Запускает новый сегмент, канал или территорию: считает потенциал, собирает команду, ставит процессы и цели, доводит до первых продаж. Управляет юридическими, кадровыми и операционными вопросами входа. Отвечает за то, чтобы запуск вышел на плановую экономику.", "senior": "Открывает новые рынки и филиалы как отдельные бизнес-единицы, в том числе с локальным управленцем и P&L. Выстраивает воспроизводимую модель экспансии (как масштабировать вход на новый рынок), оценивает страновые и канальные риски. Превращает выход на новые рынки в системный драйвер роста компании."}, {"name": "Портфельное прогнозирование и планирование продаж", "junior": "Готовит прогноз по своей команде/каналу на основе воронки и истории. Точность ограничена, горизонт короткий. Обновляет прогноз по запросу.", "middle": "Строит прогноз по всему портфелю каналов и территорий с учетом сезонности, пайплайна и рыночных факторов. Дает сценарии (пессимистичный/базовый/оптимистичный), связывает прогноз с планом ресурсов и найма. Достигает высокой точности на горизонте квартала-полугода.", "senior": "Обеспечивает предсказуемость выручки всей организации продаж на горизонте до года. Строит модель планирования, где план продаж согласован с производством, логистикой и финансами. Использует предиктивную аналитику, управляет разрывом план-факт как системой, а не как отчетом."}, {"name": "Сегментация портфеля, ICP и приоритизация (ABC-XYZ)", "junior": "Работает с готовыми сегментами и списком клиентов. Применяет базовые критерии приоритета. Не пересматривает портрет клиента и структуру портфеля.", "middle": "Строит сегментацию клиентского портфеля и SKU через ABC-XYZ, формирует ICP и правила приоритизации для команд. Перераспределяет фокус на прибыльные сегменты, отсекает неэффективные. Настраивает разные подходы под разные сегменты и каналы.", "senior": "Создает динамическую модель управления портфелем: где рост, где удержание, где выход, как распределены ресурсы продаж между сегментами и клиентами. Связывает сегментацию с ассортиментом, ценой и каналом. Использует данные и конкурентную разведку для формирования ICP на уровне всей организации."}, {"name": "Ассортиментно-канальная стратегия и покрытие", "junior": "Продает текущий ассортимент в текущих каналах, следит за наличием и представленностью. Не влияет на матрицу продукт-канал. Реагирует на дефицит покрытия постфактум.", "middle": "Управляет матрицей ассортимент-канал: что, в какой канал и в какие сети заводить, как обеспечивать покрытие и листинг. Считает представленность и долю полки/каталога, закрывает разрывы покрытия по территориям. Согласует ассортимент с маркетингом и закупками.", "senior": "Строит стратегию покрытия рынка: какие категории и SKU, через какие каналы и сети обеспечивают долю рынка и маржу. Управляет листингом в ключевые сети как стратегическим активом, влияет на ассортиментную и продуктовую политику со стороны спроса. Превращает покрытие и представленность в измеримое конкурентное преимущество."}, {"name": "Ценообразование и коммерческие условия", "junior": "Работает в рамках заданных прайсов и скидок. Согласовывает нестандартные условия выше. Не отвечает за экономику скидки.", "middle": "Управляет дисконтной политикой, торговыми условиями и правилами сделки для команд. Контролирует, чтобы скидки не разрушали маржу, вводит матрицу условий по сегментам и объемам. Балансирует привлекательность условий и экономику.", "senior": "Формирует коммерческую и ценовую политику продаж: сегментное ценообразование, трейд-условия, бонусные и ретро-схемы для каналов. Держит баланс объема, цены и маржи на уровне всей функции. Строит систему условий, которая стимулирует нужное поведение клиентов и каналов и защищает экономику."}, {"name": "Ключевые сделки и стратегические клиенты/партнеры", "junior": "Поддерживает работу команды по крупным клиентам, участвует в переговорах как усиление. Не ведет ключевые контракты как ЛПР. Опирается на решения руководства по условиям.", "middle": "Ведет часть ключевых клиентов и партнеров лично, отвечает за крупные контракты и их условия. Выстраивает отношения на уровне ЛПР клиента, управляет циклом сложной сделки. Развивает ключевые аккаунты вглубь (рост доли кошелька).", "senior": "Лично ведет стратегические сделки и партнерства как ЛПР со стороны компании: крупнейшие контракты, вход в сети, стратегические альянсы. Выстраивает отношения на уровне первых лиц, конструирует нестандартные сделки, влияющие на бизнес. Превращает ключевые партнерства в долгосрочный рычаг роста."}, {"name": "Sales Ops, процессы и CRM-архитектура", "junior": "Обеспечивает дисциплину заполнения CRM в команде, пользуется готовыми процессами и отчетами. Эскалирует доработки систем в IT. Не проектирует процессы.", "middle": "Строит и описывает sales-процессы с четкими стадиями и критериями перехода, настраивает CRM под управление функцией. Внедряет автоматизацию рутин, обеспечивает высокое соответствие процессам. Оптимизирует процессы по данным.", "senior": "Проектирует архитектуру sales-операций всей организации: процессы, CRM, интеграции, RevOps как отдельная функция. Ставит ТЗ на системы и дашборды, использует данные процессов для стратегических решений. Создает операционную модель продаж, которая становится эталоном и масштабируется без сбоев."}, {"name": "BI-аналитика и предиктивные модели продаж", "junior": "Пользуется готовыми отчетами и дашбордами, видит базовые метрики. Готовит регулярную отчетность по шаблонам. Смотрит в историю, без предиктивности.", "middle": "Строит BI-дашборды и метрики под управление функцией, владеет воронкой в разрезе каналов и сегментов. Применяет когортный анализ, находит узкие места и точки роста в данных. Ставит ТЗ аналитикам, внедряет data-driven решения в командах.", "senior": "Формирует аналитическую систему всей организации продаж, включая предиктивные модели (прогноз, отток, склонность к покупке). Ставит требования к сквозной аналитике от лида до повторной сделки. Делает данные основой стратегических решений и превращает аналитику продаж в актив компании."}, {"name": "AI в управлении продажами", "junior": "Пользуется базовыми AI-функциями в CRM и готовыми инструментами (шаблоны, скоринг, транскрибация). Экспериментирует под руководством. Простые сценарии без настройки.", "middle": "Внедряет AI в процессы продаж системно: приоритизация лидов, анализ звонков и коучинг, автоматизация рутин, ассистенты для команды. Считает эффект от внедрений, обучает руководителей и продавцов работе с инструментами. Повышает продуктивность функции за счет AI.", "senior": "Формирует AI-стратегию продаж: где искусственный интеллект дает рычаг в аналитике, прогнозе, работе с клиентом и управлении. Внедряет продвинутые решения (conversation intelligence, предиктивные модели, кастомные ассистенты) в операционную модель. Создает AI-нативную культуру продаж и влияет на технологическую стратегию компании со стороны продаж."}, {"name": "Система мотивации и компенсации sales-организации", "junior": "Работает по готовой схеме мотивации, применяет стандартные бонусы и признание. Эскалирует вопросы компенсации выше. Не проектирует систему.", "middle": "Проектирует систему мотивации команд: связка план-факт, KPI, бонусы, ускорители, нефинансовое признание. Настраивает мотивацию так, чтобы она вела к нужному поведению (маржа, новые клиенты, удержание). Управляет удовлетворенностью и удержанием sales-персонала.", "senior": "Строит модель компенсации всей sales-организации: разные схемы под роли и каналы, баланс фикс/переменная, защита от перекосов. Связывает мотивацию с экономикой продаж и стратегией. Влияет на корпоративную политику вознаграждения, создает систему, удерживающую и притягивающую сильных."}, {"name": "Развитие руководителей продаж (leader-of-leaders)", "junior": "Развивает отдельных продавцов, дает обратную связь по метрикам. Проводит базовый коучинг. Не растит руководителей.", "middle": "Развивает руководителей команд: ставит им управленческие навыки, делегирует зоны ответственности, строит планы развития. Создает обмен практиками между командами. Готовит сильных лидеров первой линии.", "senior": "Строит систему развития управленцев в продажах: кадровый резерв, преемники, треки от продавца до директора направления. Создает внутреннюю школу и стандарты управления продажами. Становится источником управленческих талантов для всей компании (leader-of-leaders)."}, {"name": "Кросс-функциональная оркестрация", "junior": "Взаимодействует с маркетингом и смежными отделами по текущим вопросам, эскалирует спорные. Работает на цели своей функции. Обмен информацией по установленным правилам.", "middle": "Выстраивает партнерства с маркетингом (передача и качество лидов), продуктом, финансами, логистикой и операциями. Согласует общие цели и метрики стыка, влияет на продукт через обратную связь с рынка. Ведет совместные инициативы вывода на рынок.", "senior": "Оркеструет продажи внутри всей коммерческой машины: единый GTM с маркетингом и продуктом, синхронизация с финансами по марже и с логистикой по поставкам. Влияет на стратегию компании со стороны рынка, встраивает продажи в сквозной путь клиента. Становится участником стратегического планирования на уровне C-level."}, {"name": "Управление рисками и кризис-менеджмент в продажах", "junior": "Реагирует на проблемы по установленным процедурам, тушит пожары в операционке. Сообщает статус выше. Действует по чужому плану реагирования.", "middle": "Заранее видит риски продаж (зависимость от клиента/канала, кассовые разрывы, срыв плана) и строит планы на случай. Управляет умеренными кризисами самостоятельно, держит команду и результат в турбулентности. Внедряет превентивные меры по итогам.", "senior": "Строит систему управления рисками продаж и раннего предупреждения: концентрация клиентов, канальные конфликты, рыночные и валютные риски, зависимость от людей. Проводит организацию через крупные кризисы без потери клиентов и экономики. Превращает устойчивость к рискам в конкурентное преимущество."}, {"name": "Этика, комплаенс и торговые/экспортные требования", "junior": "Соблюдает базовые правила и коммерческую этику в ежедневной работе. Использует утвержденные материалы и условия. Сообщает о нарушениях по политике.", "middle": "Строит комплаенс sales-функции: правила работы с клиентами и партнерами, антикоррупционные и договорные стандарты, требования к каналам. Учитывает торговые и экспортные ограничения при работе с разными рынками. Формирует культуру прозрачности в продажах.", "senior": "Встраивает этику и комплаенс в коммерческую модель без ущерба результату: договорные, антимонопольные, санкционные и экспортные требования на всех рынках. Задает отраслевые стандарты честных продаж, управляет репутационными рисками. Делает соответствие частью доверия к бизнесу и его устойчивости."}], "Директор отдела маркетинга": [{"name": "Решение проблем", "junior": "Работает строго по инструкциям и чек-листам. Запускает кампании и собирает креативы по готовым шаблонам и брифам. Не анализирует причины неудач, эскалирует проблемы руководителю. Использует ИИ как помощника для отдельных задач (текст, картинка). Фокус на тактике. Примеры: настройка таргета, контент по брифу, ведение соцсетей", "middle": "Самостоятельно анализирует динамику показателей и находит закономерности в данных. Адаптирует решения под контекст, проводит A/B-тесты, оптимизирует конверсию воронки. Использует ИИ для ускорения анализа и генерации гипотез. KPI: рост CTR на 15-25%, конверсии на 10-20%. Примеры: оптимизация кампаний, анализ поведения, разбор просадки каналов", "senior": "Выявляет системные проблемы на уровне бизнес-модели и архитектуры маркетинга. Диагностирует причины роста CAC и падения LTV через данные и агентов. Формулирует комплексные гипотезы, перестраивает систему, влияет на продукт через инсайты. Ставит агентов на регулярную диагностику отклонений. KPI: рост ROMI на 25-50%, снижение CAC на 30-50%, рост LTV на 20-40%"}, {"name": "Формулирование и каскадирование фокусов и целей", "junior": "Работает по задачам, поставленным сверху. Не понимает связи с общими OKR компании. Выполняет разрозненные тактические активности. Не видит влияния своей работы на бизнес. Фокусируется на операционных метриках. Примеры: выполнение ТЗ на контент, запуск кампаний по плану, ведение отчетности", "middle": "Ставит SMART-цели на уровне кампаний. Планирует спринты и формирует backlog задач. Связывает тактические метрики с отдельными OKR. Проводит ретроспективы и корректирует планы. Декомпозирует квартальные цели на месячные. KPI: достижение 80%+ целей спринта, своевременность выполнения планов. Примеры: планирование медиакампаний, постановка целей по лидам, распределение задач в команде", "senior": "Формулирует 3-5 летнюю маркетинговую стратегию. Каскадирует ее в квартальные и годовые OKR. Синхронизирует цели маркетинга с целями компании. Проводит стратегические сессии и пересмотр приоритетов. Влияет на стратегию продукта и бизнеса. Создает систему измерения прогресса. KPI: достижение 90%+ стратегических целей, рост выручки от маркетинга на 30%+, NPS функции 8+"}, {"name": "Бюджетирование", "junior": "Работает в рамках выделенного бюджета. Не влияет на структуру расходов. Тратит средства по утвержденному плану. Не анализирует эффективность трат. Простая отчетность о потраченных средствах. Ограничения: бюджет до 500K руб/мес, отклонения до 10%", "middle": "Планирует бюджеты отдельных каналов. Проводит план-факт анализ трат, перераспределяет средства между каналами. Планирует расходы на ИИ-инструменты и токены как отдельную статью. Рассчитывает ROI по каналам. KPI: отклонение от плана не более 7%, ROI каналов выше рынка на 15%. Примеры: управление бюджетом 1-5 млн руб/мес", "senior": "Формирует годовой маркетинговый бюджет (10+ млн руб), включая инфраструктуру ИИ-инструментов и агентов. Аргументирует инвестиции перед C-level и советом директоров. Строит финансовые модели окупаемости, считает экономику замены ручного труда на агентов. Управляет P&L функции. KPI: отклонение бюджета не более 5% в квартал, ROMI выше планового на 20%+"}, {"name": "Управление командой и AI-агентами", "junior": "Не управляет людьми напрямую. Может координировать подрядчиков и отдельные ИИ-инструменты под надзором. Не выстраивает системные процессы взаимодействия. Фокус на личной эффективности. Scope: 1-2 подрядчика/фрилансера, готовые ИИ-инструменты", "middle": "Управляет 2-5 специалистами. Проводит синки и 1:1, участвует в найме и онбординге. Начинает заменять рутинные роли агентами и перераспределять людей на сложные задачи. KPI: удержание команды 90%+, рост производительности на 15%+ в квартал. Примеры: SMM, контент-маркетолог, дизайнер, аналитик + базовые агенты", "senior": "Строит гибридную структуру: люди (15+ человек) + сеть агентов. Решает, что отдать человеку, а что агенту по качеству, скорости и цене. Внедряет PDP, обучение, performance management. Формирует культуру, где владение ИИ - норма. Развивает внутренних лидеров. KPI: eNPS 50+, время закрытия вакансий < 45 дней, доля рутины на агентах растет квартал к кварталу"}, {"name": "Организация процессов и оркестрация агентов", "junior": "Следует установленным процессам и регламентам. Указывает на недочеты, но не предлагает решений. Не видит процесс целиком. Эскалирует процессные проблемы руководству. Использует готовые ИИ-сценарии. Примеры: следование брифам, соблюдение SLA, корпоративные шаблоны", "middle": "Анализирует и улучшает существующие процессы. Внедряет шаблоны и автоматизацию, ставит агентов на отдельные участки (отчетность, анализ конкурентов). Устраняет узкие места. Измеряет эффективность процессов. KPI: сокращение времени задач на 20-30%, снижение ошибок на 40%. Примеры: внедрение CRM, автоматизация отчетности, оптимизация воронки лидов", "senior": "Проектирует end-to-end архитектуру, где ключевые участки закрыты агентами. Строит оркестрацию: единая база знаний о компании и контексте + интерфейс к ней (Cursor, Claude Cowork), агенты передают результат друг другу. Создает процессы скалирования рабочих практик. Результат: сокращение time-to-market на 50%, рост скорости итераций в 2-3 раза, предсказуемость 85%+"}, {"name": "Прозрачность метрик и влияние работы на бизнес", "junior": "Собирает стандартные отчеты по шаблонам. Использует готовые дашборды. Понимает базовые метрики (CTR, CPC, конверсии). Не связывает маркетинговые метрики с бизнес-результатами. Фокусируется на vanity metrics. Инструменты: Google Analytics, Яндекс.Метрика, рекламные кабинеты", "middle": "Связывает маркетинговые активности с выручкой. Строит funnel-отчеты от показа до продажи. Рассчитывает contribution margin от маркетинга. Создает executive dashboards. Проводит когортный анализ и RFM-сегментацию. KPI: прозрачность ROI по каналам 95%+, время подготовки отчетов сокращено на 60%. Инструменты: BI-платформы, продвинутая аналитика", "senior": "Создает единую систему маркетинговых и бизнес-метрик. Влияет на KPI всей компании через инсайты. Строит предиктивные модели business impact. Автоматизирует принятие решений на данных. Создает культуру data-driven решений. KPI: маркетинг обеспечивает 40%+ прогнозируемости выручки, точность прогнозов 90%+. Impact: влияние на стратегические решения C-level"}, {"name": "Перформанс на данных: AI-конвейер креативов", "junior": "Запускает рекламные кампании по шаблонам в одном-двух кабинетах. Делает креативы по брифу, поштучно. Не строит креативный процесс на данных. Ориентируется на vanity-метрики. Инструменты: рекламные кабинеты, генерация отдельных картинок и текстов в ИИ", "middle": "Строит креативы на данных: анализ конкурентов, тренды, звонки сейлзов, интервью. Запускает десятки вариантов, разбивает на параметры, находит рабочие связки и масштабирует. Сканирует креативы и цены конкурентов. KPI: снижение CPA на 20-30%, рост ROAS на 25%+. Инструменты: парсеры конкурентов, генеративные креативы, кабинеты в связке с аналитикой", "senior": "Строит конвейер: данные (глубинные интервью, дипресерч, трендвотчинг, звонки сейлзов, анализ конкурентов) → гипотезы → сотни баннеров супер-дешево → авторазбивка на параметры → определение и масштабирование рабочих связок. Агент сканирует конкурентов в реальном времени. KPI: кратное снижение стоимости креатива, десятки рабочих связок в месяц, предсказуемый CAC. Результат: перформанс как управляемая система, а не лотерея"}, {"name": "Быстрое тестирование воронок и вайбкодинг лендингов", "junior": "Использует готовые шаблоны лендингов и квизов. Не собирает страницы сам, ставит задачу подрядчику. Тестирует 1-2 варианта. Долгий цикл от идеи до запуска. Инструменты: готовые конструкторы по шаблону", "middle": "Быстро собирает лендинги и квизы на ноу-коде, тестирует разные форматы воронок (от квиза до VSL). Запускает A/B на уровне посадочных. Сокращает цикл идея → тест до 1-2 дней. Инструменты: Tilda, Base44, Lovable, конструкторы квизов", "senior": "Вайбкодит воронки и лендинги под гипотезу за часы (Base44, Lovable, Claude Code). Тестирует десятки связок параллельно, от VSL до многошаговых квизов. Встраивает аналитику и быстро отсекает нерабочее. KPI: цикл гипотеза → живой лендинг < 1 дня, десятки тестов воронок в месяц. Результат: скорость теста перестает быть ограничением роста"}, {"name": "Контент-фабрика и генеративный контент", "junior": "Делает контент вручную по контент-плану. Низкая скорость и объем. Использует ИИ для отдельных постов. Не выстраивает поток контента. Фокус: ведение 1-2 аккаунтов по графику", "middle": "Строит регулярный поток контента с участием ИИ. Прогревает органический трафик из перформанса (те 10-15%, что оседают в соцсетях) и конвертирует в продажи. Адаптирует контент под площадки. KPI: рост охватов и подписчиков, конверсия органики в лиды. Инструменты: генеративные видео и тексты, планировщики, аналитика соцсетей", "senior": "Строит контент-завод: генеративный контент в масштабе за часы и десятки долларов на токены вместо недель инхаус-продакшена. Системно прогревает и конвертирует органику. Понимает, что часть трафика всегда оседает в соцсетях, и строит под это отдельную машину. KPI: сотни тысяч просмотров и десятки тысяч подписчиков за недели, измеримый вклад органики в выручку. Результат: контент как канал привлечения, а не имидж"}, {"name": "Проектирование агентных систем", "junior": "Использует готовые ИИ-инструменты по одному. Не связывает их в систему. Не понимает, что можно делегировать агенту целиком. Фокус: ручные операции с ИИ-помощником под конкретную задачу", "middle": "Внедряет отдельных агентов на конкретные задачи: анализ конкурентов, трендвотчинг, сбор отчетов. Настраивает их под свои данные и процессы. Понимает, где агент быстрее и дешевле человека. KPI: 3-5 рабочих агентов в команде, экономия времени на рутине 40%+", "senior": "Проектирует целостную агентную систему. Must-have агенты: анализ конкурентов (сайты и крео), трендвотчинг, генерация виральных видео на базе трендов, единая база знаний о компании + интерфейс (Cursor, Claude Cowork), агент-аналитик, подсвечивающий отклонения от плана/нормы. Связывает их в единый контур. KPI: ключевые блоки маркетинга закрыты агентами, качество и скорость выше ручного. Результат: команда работает как система, а не набор людей"}, {"name": "GEO и видимость в ИИ-выдаче", "junior": "Не работает с выдачей ИИ. Знает про классическое SEO на базовом уровне. Не понимает, как бренд попадает в ответы ChatGPT, Claude, Perplexity. Фокус: стандартная поисковая оптимизация", "middle": "Понимает миграцию трафика из классического поиска в ответы ИИ. Производит контент так, чтобы его цитировали модели и ИИ-подсказки в поисковиках. Отслеживает упоминания бренда в выдаче ИИ. KPI: рост цитируемости в ответах ИИ, органические лиды из ИИ-каналов. Подход: контент под алгоритмы ИИ-выдачи", "senior": "Строит видимость бренда в выдаче ИИ как дешевый канал органики. Понимает алгоритмы попадания и в ИИ-подсказки поисковиков, и в выдачу самих моделей. Быстро производит контент и адаптируется под меняющиеся требования. Делает компанию той, кого цитируют ChatGPT, Claude, Perplexity, Gemini. KPI: доля голоса в ответах ИИ, стоимость лида из органики ниже paid в разы. Результат: органика из ИИ как растущий управляемый канал"}, {"name": "Сквозная аналитика и ее автоматизация", "junior": "Использует простые модели атрибуции (last click). Анализирует каналы изолированно, не понимает cross-channel влияния. Собирает отчеты вручную из стандартных дашбордов. Ограничения: видит только прямое влияние каналов", "middle": "Настраивает модели атрибуции (linear, time-decay, U-shaped). Анализирует customer journey across touchpoints. Понимает взаимное влияние каналов. Начинает автоматизировать сбор метрик. KPI: покрытие customer journey 80%+, точность атрибуции 75%. Инструменты: Google Attribution, аналитические платформы, UTM-разметка", "senior": "Создает custom attribution модели на ML, внедряет cross-device tracking, incrementality testing и MMM. Автоматизирует аналитику полностью: агент собирает метрики из всех систем и шлет отчет с рекомендациями в Telegram. KPI: incrementality для 90%+ каналов, отчет с рекомендациями без участия человека. Инструменты: CDP, MMM, ML-based attribution"}, {"name": "Управление гипотезами / Growth-подход", "junior": "Запускает разрозненные кампании без гипотез. Не структурирует эксперименты, не документирует результаты тестов. Полагается на интуицию. Не масштабирует успешные решения. Подход: trial-and-error без системности", "middle": "Формулирует четкие гипотезы по ICE-framework. Проводит A/B-тесты со статистической значимостью. Ведет backlog гипотез и приоритизирует. Документирует learnings в knowledge base, внедряет успешные решения. KPI: 15+ гипотез в месяц, 25% success rate, 3+ winning tests внедрено. Инструменты: Optimizely, VWO, своя CRO-платформа", "senior": "Создает культуру continuous experimentation, усиленную ИИ: гипотезы и тесты генерируются и обсчитываются быстрее. Внедряет North Star Metric и AARRR. Автоматизирует тестирование и масштабирование, строит growth loops. Создает cross-functional growth team. KPI: рост ключевых метрик 20%+ в квартал через эксперименты, сотни гипотез в год. Impact: экспоненциальный рост вместо линейного"}, {"name": "Performance & CRM / MarTech stack", "junior": "Настраивает простые кампании и использует базовый функционал CRM. Работает с готовыми воронками и сегментами. Ограниченное понимание интеграций. Фокус на отдельных инструментах, а не системе. Инструменты: рекламные кабинеты, простые email-рассылки, базовая CRM", "middle": "Создает омниканальные кампании и автоматизированные воронки. Использует динамические сегменты и персонализацию. Интегрирует рекламные платформы с CRM. Оптимизирует конверсии по всей воронке. KPI: lead-to-customer выше на 30%, retention +25%. Инструменты: HubSpot, Salesforce, автоматизированные email-последовательности", "senior": "Проектирует и внедряет полный MarTech stack, строит unified customer data platform (CDP). Внедряет real-time персонализацию и AI для оптимизации кампаний. Строит predictive analytics и lookalike audiences, автоматизирует весь customer lifecycle. KPI: качество MQL 90%+, LTV +50%. Инструменты: Segment, продвинутые CDP, AI-оптимизация"}, {"name": "Product-Marketing Fit. Что продавать, кому и почему", "junior": "Получает готовый продукт и промо-материалы. Транслирует сообщения компании без адаптации. Не анализирует потребности аудитории. Фокусируется на функциональных характеристиках. Не влияет на продуктовые решения. Подход: продаем то, что есть", "middle": "Проводит customer development и интервью. Анализирует конкурентов и позиционирование. Создает customer personas на данных. Формулирует value proposition для сегментов, адаптирует messaging под аудитории. KPI: рост conversion rate на 40%+, снижение CAC на 25%. Инструменты: surveys, интервью, конкурентный анализ, Jobs-to-be-Done", "senior": "Влияет на продуктовую стратегию через customer insights. Создает go-to-market стратегии для новых продуктов. Находит новые рыночные возможности (blue ocean). Развивает product-led growth. Строит category-defining позиционирование. KPI: выход в новые сегменты и рынки, создание новых продуктовых линеек. Impact: влияние на product roadmap и бизнес-стратегию"}, {"name": "Стратегическое мышление и roadmapping", "junior": "Работает в рамках месячных планов. Не участвует в стратегическом планировании. Фокусируется на краткосрочных результатах. Реализует готовые стратегические решения. Горизонт планирования: 1-3 месяца", "middle": "Разрабатывает квартальные и годовые планы. Анализирует рыночные тренды и возможности. Создает roadmap развития каналов. Балансирует краткосрочные и долгосрочные цели. Участвует в стратегических сессиях. KPI: достижение среднесрочных целей 80%+, предсказуемость планов. Инструменты: SWOT, Porter's 5 Forces, strategic planning frameworks", "senior": "Создает долгосрочную стратегию (3-5 лет). Формулирует видение развития категории и рынка. Предвосхищает технологические и социальные тренды, в том числе скорость смены ИИ-инструментов. Создает сценарные планы. Влияет на vision компании. KPI: опережение конкурентов в ключевых трендах, создание новых рыночных стандартов. Impact: формирование будущего индустрии"}, {"name": "Финансовая грамотность", "junior": "Понимает простые финансовые показатели. Работает с выделенным бюджетом. Рассчитывает базовые метрики (ROI, ROAS). Не понимает влияния на общие финансы компании. Ограниченное понимание unit-экономики. Метрики: CTR, CPC, простой ROI", "middle": "Глубоко понимает unit-экономику продукта. Рассчитывает LTV, CAC, payback period. Анализирует влияние маркетинга на cash flow. Строит модели окупаемости инвестиций. Понимает маржинальность и contribution margin. KPI: точность финансового планирования 85%+, положительный unit economics. Инструменты: financial modeling, cohort analysis", "senior": "Управляет P&L маркетинговой функции. Влияет на ценообразование и monetization стратегию. Участвует в investment decisions и M&A. Строит сложные финансовые модели и сценарии. Понимает влияние маркетинга на валуацию компании. KPI: маркетинг как profit center, рост company valuation. Impact: влияние на финансовую стратегию"}, {"name": "Data & AI fluency", "junior": "Работает с простыми отчетами и дашбордами. Понимает базовые принципы работы с данными. Использует готовые AI-инструменты (генерация текста и картинок). Не понимает принципов работы моделей. Инструменты: Excel, готовые дашборды, простые AI-инструменты", "middle": "Самостоятельно строит сложные аналитические модели. Использует SQL для больших данных. Внедряет AI-инструменты для автоматизации, понимает основы машинного обучения. Создает predictive models для маркетинга. KPI: автоматизация 50%+ рутинных аналитических задач. Инструменты: SQL, Python basics, BI, специализированные AI-платформы", "senior": "Создает AI-driven маркетинговые системы. Внедряет ML для персонализации и оптимизации, генеративный ИИ для контента и креатива в масштабе. Постоянно мониторит выход новых моделей (новый флагман раз в несколько недель) и быстро встраивает их. Понимает риск отключения доступа к моделям. KPI: ИИ дает 30%+ прироста эффективности. Инструменты: продвинутые ML-платформы, агенты, генеративные модели"}, {"name": "Stakeholder-менеджмент", "junior": "Взаимодействует в рамках своей команды. Получает задачи от прямого руководителя. Ограниченное взаимодействие с другими отделами. Не влияет на решения других функций. Простая отчетность. Scope: команда маркетинга, прямой руководитель", "middle": "Активно сотрудничает с продуктом, продажами, поддержкой. Участвует в кросс-функциональных проектах. Влияет на решения смежных команд. Представляет интересы маркетинга на уровне middle management. Строит внутренние партнерства. KPI: NPS от внутренних клиентов 7+, успешность совместных проектов 80%+. Scope: все функции, middle management", "senior": "Член executive team или регулярный участник C-level meetings. Влияет на стратегические решения компании. Управляет отношениями с советом директоров и инвесторами. Представляет компанию на индустриальных событиях. Строит внешние стратегические партнерства, менторит руководителей. KPI: trust score от CEO/board 9+, внешняя экспертность. Impact: репутация компании в индустрии"}, {"name": "Кризис-менеджмент", "junior": "Работает в стандартных условиях. Эскалирует нестандартные ситуации. Не имеет опыта работы в кризисе. Теряется при резких изменениях внешних условий. Фокусируется на сохранении текущих процессов. Подход: избегание рисков и неопределенности", "middle": "Быстро адаптирует тактику под изменения. Реагирует на локальные кризисы (просадка каналов, блокировки кабинетов, смена флагманской модели). Перераспределяет ресурсы в условиях ограничений. Поддерживает команду. KPI: время реакции < 24 часов, сохранение эффективности команды 80%+. Примеры: блокировки рекламных аккаунтов, отключение доступа к инструментам", "senior": "Превращает кризисы в возможности для роста. Создает антикризисные стратегии, управляет репутационными рисками. Быстро перестраивает всю систему, в том числе при смене ИИ-инструментов и каналов. Создает новые business models в кризис. KPI: рост market share во время кризисов, новые revenue streams. Impact: выход из кризиса сильнее конкурентов"}, {"name": "Бренд / PR / Storytelling", "junior": "Создает контент по готовым брендгайдам. Следует установленным стандартам коммуникации. Не участвует в формировании бренд-стратегии. Работает с готовыми месседжами. Ограниченные навыки storytelling. Фокус: соблюдение brand guidelines", "middle": "Развивает бренд-активности и кампании. Создает compelling storytelling для разных аудиторий. Управляет репутацией бренда в digital, работает с PR и медиа. Адаптирует коммуникацию под каналы и сегменты. KPI: рост brand awareness на 25%+, positive sentiment 75%+. Инструменты: brand monitoring, PR-платформы, контент-стратегия", "senior": "Формирует долгосрочную бренд-стратегию и category-defining позиционирование. Развивает thought leadership, в том числе присутствие бренда в выдаче ИИ. Управляет репутацией, создает emotional connection с аудиторией на фоне потока генеративного контента. KPI: бренд в top-3 категории, NPS 50+, earned media value. Impact: создание iconic brand"}, {"name": "Вкус, стратегия и доверительные отношения", "junior": "Опирается на чужой вкус и готовые гайды. Не формирует свою точку зрения. Отношения - в рамках своей команды. Стратегию воспринимает как данность. ИИ использует как замену мышлению, а не усиление", "middle": "Имеет насмотренность и свой вкус, отличает сильное от слабого. Мыслит на горизонт кампаний и кварталов. Строит рабочие отношения со смежными командами и подрядчиками. Понимает: ИИ ускоряет, но смысл и вкус задает человек", "senior": "Сильный вкус и стратегическое мышление - то, что не делегируется ИИ. Видит смысл там, где агенты дают объем. Строит глубокие доверительные отношения с командой, клиентами, партнерами и рынком. Это превращает поток ИИ-контента в бренд, а данные - в стратегию. Результат: человеческое ядро, вокруг которого работает вся ИИ-машина"}, {"name": "Этические нормы и AI-комплаенс", "junior": "Следует базовым этическим стандартам компании. Понимает основы GDPR и персональных данных. Знает базовые правила использования ИИ и данных. Работает под контролем юридического отдела. Ограниченное понимание regulatory landscape. Подход: избегание рисков", "middle": "Активно изучает и внедряет compliance-требования. Создает этичные кампании, следит за корректным использованием генеративного ИИ (прозрачность, авторские права, данные). Работает с legal по вопросам регулирования. KPI: zero compliance violations, положительная оценка этичности. Области: данные, таргетинг, ИИ-контент", "senior": "Формирует стандарты ответственного использования ИИ в маркетинге: данные, генеративный контент, прозрачность для аудитории. Управляет рисками зависимости от внешних моделей. Превращает этику в конкурентное преимущество, развивает sustainable и inclusive маркетинг. KPI: лидерство в ethical AI marketing, awards за social impact. Impact: формирование этических стандартов индустрии"}], "Коммерческий директор": [{"name": "Коммерческая стратегия и каскадирование целей (как цели компании превращаются в планы команд и людей)", "junior": "Работает внутри готовой стратегии и плана. • Понимает что такое коммерческая стратегия - как компания планирует зарабатывать (сегменты, каналы, продукты) • Разбирает общий план продаж на свои задачи: сколько звонков, встреч, сделок нужно сделать • Следует заданным целям и приоритетам, не меняет их сам • Понимает свою роль в общей воронке: на каком этапе он влияет на результат • Принцип работы: \"мне поставили цель - я выполнил\"", "middle": "Каскадирует цели на команду и строит план на квартал. • Раскладывает квартальный план (target) на месяц, неделю и день для своей команды • Декомпозирует цель в действия (пример: +30% к выручке = план по лидам, конверсии и среднему чеку) • Строит дерево целей: цель компании → цель отдела → цель сотрудника, следит за синхронизацией • Связывает план продаж с маркетингом и продуктом, видит их в одной связке • Использует методики: OKR (цели и ключевые результаты), вороночное планирование", "senior": "Определяет коммерческую стратегию и строит roadmap роста на 1-3 года. • Создает стратегию выручки, связанную с бизнес-моделью и unit-экономикой компании • Строит roadmap роста на 12-36 месяцев и влияет на топ-метрики (выручка, маржа, доля рынка) • Готовит сценарии: оптимистичный, базовый, пессимистичный - и план действий под каждый • Обеспечивает каскад целей сверху вниз во всей коммерческой функции • Балансирует стратегию под обе модели: B2B (длинный цикл, ABM, партнеры) и B2C (объем, performance, retention) • Использует продвинутые подходы: портфель каналов, сегментная стратегия, Blue Ocean"}, {"name": "Система продаж и плейбук (единый процесс и правила, по которым работает вся команда)", "junior": "Работает по готовому процессу и скриптам. • Понимает этапы сделки (воронку): от первого контакта до оплаты • Использует готовые скрипты, шаблоны писем и регламенты • Заполняет CRM (систему учета сделок) корректно и вовремя • Понимает базовую методологию продаж компании (например, квалификацию лида) • Не меняет процесс, а следует ему", "middle": "Описывает и улучшает процесс продаж в своем направлении. • Картирует воронку по этапам и находит, где теряются сделки • Создает и обновляет плейбук: скрипты, чек-листы, критерии перехода между этапами • Внедряет методологию квалификации (B2B - BANT, MEDDIC; B2C - быстрая квалификация и допродажа) • Настраивает логику CRM: статусы, авто-задачи, передачу лидов между ролями • Связывает изменения процесса с ростом конверсии", "senior": "Строит масштабируемую систему продаж, единую для B2B и B2C. • Проектирует end-to-end процесс продаж от лида до повторной покупки • Создает data-driven плейбук (база знаний на цифрах, а не на мнениях) и систему его обновления • Внедряет RevOps: единые правила, инструменты и данные между маркетингом, продажами и сервисом • Делает процесс воспроизводимым: новый менеджер выходит на план за заданный срок • Связывает систему продаж с unit-экономикой и прогнозом выручки"}, {"name": "Управление воронкой и Velocity (скорость движения денег по воронке, Time-to-Money)", "junior": "Работает с воронкой как есть. • Ведет свои сделки по этапам, не теряет их • Понимает базовые показатели: количество лидов, конверсия, длительность сделки • Видит свои узкие места, но решает их точечно • Работает в заданном темпе, не оптимизирует скорость", "middle": "Сокращает цикл сделки и чистит pipeline. • Управляет pipeline (набором активных сделок): приоритизирует, убирает зависшие • Сокращает длительность цикла сделки за счет работы с этапами и квалификацией • Находит bottlenecks (узкие места) воронки и устраняет их системно • Балансирует скорость и качество сделок", "senior": "Выводит Time-to-Money на целевой уровень и масштабирует. • Управляет Velocity всей коммерции: лид → деньги за ≤ X дней • Связывает скорость воронки с выручкой и поступлением денег (cash flow) • Работает через цикл: тест гипотезы → результат → масштабирование • Знает все узкие места системы и устраняет их до того, как они станут проблемой • B2B - ускорение длинных сделок; B2C - скорость и автоматизация массовой воронки"}, {"name": "Маркетинг и генерация спроса (как создается поток лидов и заявок)", "junior": "Поддерживает маркетинговые активности. • Понимает основные каналы привлечения (реклама, контент, партнеры, аутбаунд) • Помогает запускать кампании и собирает по ним обратную связь • Понимает базовые метрики: стоимость лида (CPL), стоимость заявки (CPO) • Передает в маркетинг информацию о качестве лидов", "middle": "Управляет генерацией спроса в своих каналах. • Планирует и ведет кампании, распределяет бюджет между каналами • Управляет стоимостью привлечения (CAC) и качеством лидов • Настраивает связку маркетинг → продажи: передачу и квалификацию лидов (SLA между отделами) • B2B - ABM (работа с целевыми компаниями) и аутбаунд; B2C - performance-маркетинг и retention-рассылки • Анализирует, какой канал приносит выручку, а не просто лиды (атрибуция)", "senior": "Строит систему генерации спроса с управляемым CAC. • Создает портфель каналов под обе модели и балансирует его по CAC/LTV • Строит предсказуемый поток лидов с прогнозом по объему и стоимости • Внедряет сквозную атрибуцию (какой канал реально приводит к деньгам) • Интегрирует генерацию спроса в общую стратегию выручки • Создает масштабируемые механики: реферальные программы, партнерские сети, лайфсайкл-маркетинг"}, {"name": "Ценообразование и монетизация (цены, упаковка, скидки)", "junior": "Работает по утвержденному прайсу. • Знает действующие цены, тарифы и правила скидок • Считает базовую маржу сделки (сколько остается после затрат) • Применяет согласованные условия, не меняет их сам • Понимает, как цена влияет на решение клиента", "middle": "Управляет ценами и условиями в своем направлении. • Анализирует чувствительность к цене и маржинальность по продуктам и сегментам • Создает продуктовую упаковку и тарифные линейки (B2C - пакеты; B2B - условия по объему) • Управляет скидочной политикой так, чтобы не убивать маржу • Тестирует цены через A/B и пилоты", "senior": "Строит систему монетизации, повышающую маржу и средний чек. • Внедряет ценообразование на основе ценности для клиента (value-based pricing) • Создает архитектуру тарифов и механик upsell/cross-sell (допродажа и перекрестная продажа) • Балансирует объем, средний чек и маржу на уровне P&L • Использует данные и модели для динамического и сегментного ценообразования • Связывает монетизацию со стратегией: где зарабатываем сейчас, а где инвестируем в рост"}, {"name": "Переговоры и работа с ключевыми клиентами (key accounts, крупные сделки)", "junior": "Ведет переговоры по типовым сделкам. • Применяет готовые аргументы и работает с базовыми возражениями • Соблюдает рамки по цене и условиям • Доводит типовые сделки до оплаты • Передает сложные кейсы старшим коллегам", "middle": "Ведет сложные сделки и работает с ключевыми клиентами. • Самостоятельно ведет переговоры по цене, объему и условиям • Работает с лицами, принимающими решения (B2B - закупки, руководство; B2C - VIP и удержание) • Готовит коммерческие предложения под потребность клиента • Управляет дебиторкой и повторными продажами по своим аккаунтам", "senior": "Ведет стратегические сделки и партнерства на уровне компании. • Закрывает крупнейшие и нестандартные сделки, влияющие на план • Выстраивает долгосрочные отношения с ключевыми клиентами (key account management) • Создает стратегические альянсы и партнерские каналы выручки • Готовит команду к сложным переговорам, передает методологию • Управляет рисками крупных контрактов (юридическими, финансовыми, репутационными)"}, {"name": "Unit-экономика и P&L коммерции (экономика на одного клиента и коммерческая прибыль)", "junior": "Считает базовые показатели по шаблону. • Понимает что такое unit-экономика - сколько приносит и стоит один клиент • Считает CAC (стоимость привлечения клиента) и LTV (сколько клиент принесет за все время) • Понимает маржу сделки и средний чек / ARPU (доход с пользователя) • Работает в готовых таблицах и моделях", "middle": "Управляет экономикой своего направления. • Строит модель unit-экономики по сегментам и каналам • Проводит когортный анализ (как ведут себя клиенты, пришедшие в разное время) • Ищет, где экономика \"течет\": дорогой CAC, низкий LTV, плохая конверсия • Связывает экономические показатели с реальными процессами продаж и маркетинга", "senior": "Управляет коммерческим P&L и масштабируемой экономикой. • Доводит LTV/CAC до целевого уровня в масштабе всей коммерции • Управляет коммерческим P&L: выручка, прямые затраты, маржа, окупаемость каналов • Балансирует прибыль сейчас и инвестиции в рост (когда тратить ради будущего LTV) • Строит прогнозные модели экономики под разные сценарии • B2B - длинный LTV и крупные сделки; B2C - массовый объем и частота покупок"}, {"name": "Метрики, BI и аналитика продаж (дашборды и анализ воронки)", "junior": "Пользуется готовыми отчетами. • Работает с базовыми метриками: конверсии, CPO, ROMI (возврат на маркетинг) • Читает дашборды и отчеты в Excel или CRM • Понимает свою воронку по цифрам • Спрашивает данные перед решением", "middle": "Строит аналитику и отчетность по направлению. • Создает BI-дашборды (наглядные панели с метриками) и следит за воронкой по этапам • Использует скоринг лидов (оценку вероятности покупки) и сегментацию • Проводит вороночный и когортный анализ, находит точки потерь • Строит отчетность, на которой принимаются решения", "senior": "Строит систему аналитики для всей коммерции. • Создает сквозную аналитику от лида до выручки и связывает ее с P&L • Внедряет предиктивные метрики: прогноз pipeline, вероятность оттока (churn) • Делает data-driven playbook - решения на цифрах, а не на мнениях • Применяет когортный анализ и сегментное ценообразование на уровне системы • Формирует культуру управления на данных в команде"}, {"name": "Прогнозирование и планирование выручки", "junior": "Прогнозирует по истории и интуиции. • Делает простой прогноз на основе прошлых периодов • Понимает, что план должен опираться на воронку • Отслеживает факт против плана • Сообщает о рисках невыполнения", "middle": "Делает регулярный прогноз с понятной точностью. • Строит еженедельный и месячный прогноз выручки с точностью ±10-15% • Опирается на pipeline, конверсии и средний цикл сделки • Управляет планом: что сделать, чтобы закрыть разрыв (gap to plan) • Учитывает сезонность и динамику каналов", "senior": "Выстраивает точное прогнозирование, связанное с P&L. • Доводит точность прогноза до ≤ ±5% за счет BI и моделей (в т.ч. ML) • Связывает прогноз выручки с бюджетом, наймом и cash flow • Управляет несколькими сценариями и быстро пересобирает план при изменениях • Делает прогноз инструментом управления, а не отчетом постфактум"}, {"name": "Управление гипотезами и Growth-эксперименты", "junior": "Предлагает идеи без структуры. • Предлагает простые улучшения (сменить креатив, добавить бюджет) • Пока не формулирует гипотезу в формате \"если → то\" • Участвует в тестах, которые ведут другие • Фиксирует результат", "middle": "Тестирует гипотезы системно. • Формулирует гипотезы в формате \"если [действие] → то [результат]\" • Приоритизирует их (например, по ICE: влияние, уверенность, простота) • Ведет backlog (очередь) гипотез и доводит тесты до вывода • Измеряет эффект корректно (контрольная группа, выборка)", "senior": "Строит систему роста на экспериментах. • Создает поток экспериментов: гипотеза → тест → результат → масштабирование • Автоматизирует и ускоряет цикл проверки гипотез (CI/CD для роста) • Замеряет результат через unit-экономику, а не только конверсию • Внедряет культуру \"быстро проверить и решить\" в команде • Держит целевую частоту экспериментов и долю успешных гипотез"}, {"name": "AI и автоматизация коммерции", "junior": "Использует базовые AI-инструменты. • Применяет чат-боты, авто-ответы, AI-помощников в рутине • Использует AI для черновиков писем и подготовки к встречам • Понимает, где автоматизация экономит время • Работает в готовых сценариях", "middle": "Внедряет AI в процессы направления. • Использует AI для скоринга и приоритизации лидов • Внедряет AI в аналитику, обучение команды и подготовку контента • Автоматизирует рутинные шаги воронки (квалификация, напоминания) • Оценивает эффект автоматизации на конверсию и скорость", "senior": "Встраивает AI в архитектуру коммерции. • Интегрирует AI в pipeline: авто-маршрутизация лидов (auto-lead routing), оптимизация скриптов • Внедряет AI в QA (анализ звонков и переписок) и в CI/CD экспериментов • Ведет архитектуру AI-стека коммерции и данные под него • Балансирует автоматизацию и человеческий контакт (особенно в B2B) • Связывает эффект AI с выручкой и затратами"}, {"name": "Клиентский опыт, удержание и LTV", "junior": "Реагирует на обращения точечно. • Отрабатывает жалобы и негативные отзывы • Понимает базовые ожидания клиентов • Передает обратную связь дальше • Действует не системно, без анализа причин оттока", "middle": "Управляет удержанием в своем направлении. • Анализирует путь клиента (CJM - карта клиентского пути) и находит точки оттока • Внедряет механики удержания: триггерные цепочки, допродажи, cross-sell • Следит за churn rate (оттоком) и NPS (индексом лояльности) • Использует данные о клиентах для решений", "senior": "Строит стратегию роста LTV по сегментам. • Проектирует CJM под ключевые сегменты и убирает причины оттока • Связывает причины churn с продуктовыми и сервисными изменениями и инициирует их • Персонализирует опыт и строит retention-механики на данных • Привязывает удержание к P&L: рост повторной выручки и LTV • B2B - удержание и развитие аккаунтов; B2C - повторные покупки и лояльность"}, {"name": "Контроль качества (QA) продаж и сервиса", "junior": "Качество проверяется выборочно. • Понимает, что звонки и переписки выборочно проверяются • Знает базовые требования к качеству общения с клиентом • Получает обратную связь по своим диалогам • Системы оценки пока нет", "middle": "Внедряет систему QA. • Создает чек-листы и критерии оценки (QA Score) • Проводит регулярные ревью звонков и переписок • Запускает цикл обратной связи: менеджер → тимлид → база знаний/скрипт • Следит, чтобы ошибки превращались в изменения процесса", "senior": "Строит end-to-end систему качества. • Автоматизирует ревью через AI (анализ речи, отклонений от скрипта) • Строит аналитику трендов ошибок и связывает QA с выручкой, churn, win rate • Привязывает QA к обучению и performance review (оценке сотрудников) • Замыкает цикл обратной связи в заданный срок (например, 72 часа) • Делает качество частью культуры постоянного улучшения"}, {"name": "Подбор, адаптация и enablement команды (как нанимать и быстро выводить людей на результат)", "junior": "Участвует в финальном этапе подбора. • Подключается к финальному собеседованию с кандидатом • Оценивает базовые навыки под роль • Помогает новичку освоиться в первые дни • Не отвечает за систему найма", "middle": "Строит ввод в должность и развитие команды. • Участвует в финальных собеседованиях и формирует требования к кандидатам • Строит онбординг: ролевки, обратная связь, тренинги по продукту и продажам • Создает индивидуальные планы развития (PDP) • Выводит новичка на план за заданный срок (ramp-up)", "senior": "Выстраивает оцифрованную систему отбора и enablement. • Строит воронку найма от публикации вакансии до ввода в должность • Подключает HR и руководителей отделов к исполнению процессов найма • Оцифровывает отбор и онбординг: метрики качества найма, скорость выхода на план • Создает систему enablement: база знаний, обучение, сертификация продавцов • Формирует кадровый резерв А-плееров под рост"}, {"name": "Управление командой и развитие лидеров", "junior": "Руководит небольшой командой по инструкциям. • Делегирует задачи и контролирует выполнение • Дает обратную связь точечно • Поддерживает рабочий настрой • Пока не развивает сотрудников системно", "middle": "Развивает команду и вводит управленческий ритм. • Внедряет тимлидов и руководителей групп • Проводит регулярные 1:1 и еженедельные синки • Формирует индивидуальные планы развития (PDP) и следит за прогрессом • Работает с вовлеченностью, создает зоны ответственности, а не только контроль", "senior": "Строит масштабируемую команду и развивает лидеров. • Проектирует структуру команды под рост • Развивает лидеров и формирует кадровый резерв • Управляет через ценности и культуру, а не только через задачи • Строит систему оценки и развития: PDP + performance review + треки роста • Влияет на eNPS (лояльность сотрудников) и удержание ключевых игроков"}, {"name": "Решение проблем и системное мышление", "junior": "Реагирует на проблемы по инструкции. • Работает по принципу \"тушения пожара\" - убирает видимый симптом • Действует в рамках регламента • Эскалирует то, что не может решить • Не инициирует изменения", "middle": "Находит корневую причину через данные. • Диагностирует первопричину (пример: падает конверсия → смотрит сегменты, этапы воронки, качество лидов) • Формулирует гипотезы и тестирует решения • Отслеживает эффект внедренного решения • Применяет структурированные методы (root cause analysis - анализ корневых причин)", "senior": "Строит процесс постоянного улучшения. • Системно управляет рисками и \"утечками эффективности\" • Выявляет узкие места до того, как они станут проблемой (через предиктивные метрики) • Строит цикл: корневая причина → решение → контроль → масштабирование • Делает так, чтобы та же проблема не повторялась • Развивает системное мышление в команде"}, {"name": "Кризис-менеджмент и управление рисками", "junior": "Передает проблему выше. • Эскалирует ситуацию, которую не может решить на своем уровне • Сообщает о рисках, но не предотвращает их • Действует по готовым инструкциям • Не строит сценарии", "middle": "Восстанавливает процессы и снижает потери. • Сам находит причины сбоев (например, провал лидогенерации или воронки) • Быстро принимает тактические меры для минимизации убытков • Восстанавливает ключевые показатели • Внедряет меры против повторения инцидентов", "senior": "Строит антикризисную устойчивость компании. • Готовит сценарии \"Plan B\": резервные каналы, альтернативные офферы, схемы мотивации • Внедряет системное управление рисками во всей коммерции • Готовит команду к работе в неопределенности • Обеспечивает быстрые решения в кризис и предотвращает повтор на уровне системы"}, {"name": "Кросс-функциональная работа и RevOps", "junior": "Передает запросы через доступные каналы. • Сообщает о проблемах клиентов через чат и тикеты • Работает в своей зоне ответственности • Не вовлекается в решения за ее пределами • Понимает, кто за что отвечает", "middle": "Активно работает со смежными командами. • Участвует в регулярных синках с продуктом, маркетингом, финансами • Совместно анализирует проблемы клиентов и предлагает улучшения • Согласует общие приоритеты по конкретным задачам • Доносит голос клиента в продукт", "senior": "Выстраивает общий результат и RevOps. • Инициирует изменения продукта и цен (видит, где они мешают продажам, и предлагает решение) • Ставит общие цели со смежными отделами (работа на общий результат, а не \"мы продали - дальше не наши проблемы\") • Строит RevOps: единые данные, процессы и инструменты между маркетингом, продажами и сервисом • Снимает межфункциональные барьеры на уровне системы"}, {"name": "Stakeholder-менеджмент (работа с CEO, советом, партнерами)", "junior": "Исполняет поручения руководства. • Выполняет задачи от CEO и руководителей • Соблюдает сроки и информирует о статусе • Готовит отчеты по запросу • Не выходит за рамки исполнения", "middle": "Согласует планы и обеспечивает прозрачность. • Обсуждает и согласует планы с CEO и ключевыми стейкхолдерами • Обеспечивает прозрачную и своевременную отчетность • Управляет ожиданиями по срокам и результатам • Доносит риски заранее", "senior": "Влияет на стратегию и ведет альянсы. • Инициирует и ведет стратегические партнерства на уровне компании • Продвигает кросс-функциональные инициативы, влияя на бизнес-стратегию • Управляет ожиданиями и строит долгосрочные отношения с внутренними и внешними сторонами • Участвует в ключевых решениях компании как равный партнер"}, {"name": "Ownership (принятие ответственности за результат)", "junior": "Отвечает за свою работу. • Берет ответственность за свои задачи и сделки • Доводит дела до конца • Не перекладывает неудачи на других • Признает ошибки и учится на них", "middle": "Отвечает за результат направления. • Думает шире своих задач - за бизнес-результат направления • Принимает решения в интересах общего результата, а не только своего участка • Ведет проекты с участием смежных команд • Создает менталитет владельца в команде", "senior": "Отвечает за коммерческий результат компании. • Несет ответственность за выручку и маржу на уровне компании • Связывает личный успех с успехом бизнеса • Строит системы, поощряющие ответственность • Создает психологическую безопасность для ответственного риска • Показывает пример ownership всей команде"}, {"name": "Velocity (ориентация на скорость и результат)", "junior": "Работает в заданном темпе. • Выполняет задачи в срок • Понимает, что скорость влияет на деньги • Не тормозит процесс • Пока не оптимизирует темп сам", "middle": "Ускоряет ключевые процессы. • Сокращает время от действия до результата в своей зоне • Убирает лишние шаги и ожидания • Расставляет приоритеты по влиянию на выручку • Балансирует скорость и качество", "senior": "Делает скорость частью культуры. • Ориентирует команду на быстрый результат и быстрые деньги (Time-to-Money) • Внедряет принцип \"быстро проверить → быстро решить\" • Убирает системные тормоза в процессах • Держит высокий темп без потери качества и выгорания команды"}, {"name": "Data-first thinking (решения на данных)", "junior": "Использует готовые данные. • Опирается на доступные метрики и отчеты • Спрашивает цифры перед решением • Ставит под сомнение решения без данных • Читает простые дашборды", "middle": "Принимает решения на анализе. • Инициирует сбор нужных данных • Оспаривает интуицию цифрами • Строит процессы на данных • Учит команду опираться на данные", "senior": "Делает данные основой коммерции. • Встраивает данные в каждый процесс продаж и маркетинга • Формирует культуру приоритета данных • Инвестирует в инфраструктуру данных и аналитики • Связывает все ключевые решения с метриками и P&L"}, {"name": "Этика и комплаенс (работа по закону и правилам: законность, защита данных, прозрачность сделок)", "junior": "Соблюдает правила и закон. • Следует внутренним регламентам и законодательству • Соблюдает базовую этику и правила работы с данными • Не нарушает условия сделок • Сообщает о сомнительных ситуациях", "middle": "Контролирует соблюдение норм в сделках. • Оценивает и согласует нестандартные коммерческие условия • Взаимодействует с юристами для снижения рисков • Гарантирует соблюдение нормативов в своем направлении • Следит за прозрачностью сделок", "senior": "Строит культуру комплаенса. • Внедряет культуру комплаенса на всех уровнях коммерции • Обеспечивает системную защиту данных и законность сделок • Инициирует внутренние аудиты • Минимизирует юридические и репутационные риски • Повышает доверие клиентов и партнеров через прозрачность"}], "Главный бухгалтер": [{"name": "Бухгалтерский учет (РСБУ и ФСБУ)", "junior": "Ведет учет на закрепленном участке: вводит первичку в 1С, формирует стандартные проводки и регистры, сверяет операции. Знает базовый план счетов и правила разноски. Работает по инструкции под контролем, эскалирует нестандартные операции.", "middle": "Ведет учет по участку полностью, применяет действующие ФСБУ (6/2020 ОС, 25/2018 аренда, 5/2019 запасы, 14/2022 НМА, 26/2020 капвложения) и ПБУ. Самостоятельно отражает сложные операции, обеспечивает корректность регистров. Отвечает за учет своего участка и его закрытие.", "senior": "Отвечает за корректность бухгалтерского учета всей организации по РСБУ и действующим ФСБУ. Определяет, как отражать сложные и нестандартные операции, контролирует все участки. Обеспечивает, что учет достоверен и готов к отчетности и проверкам."}, {"name": "Налоговый учет и отчетность (НДС, прибыль, НДФЛ, взносы, ЕНС)", "junior": "Готовит данные для налоговых расчетов по участку, формирует первичные регистры. Понимает базовые налоги (НДС, НДФЛ). Работает под контролем, без самостоятельных решений по налогам.", "middle": "Ведет налоговый учет по участку, готовит декларации и расчеты (НДС, налог на прибыль, 6-НДФЛ, РСВ, ЕФС-1), сверяет сальдо ЕНС. Отслеживает изменения (прогрессивный НДФЛ, НДС на УСН, ставка налога на прибыль 25%). Отвечает за налоговую отчетность своего участка.", "senior": "Отвечает за весь налоговый учет и отчетность организации, управляет расчетом налогов и сальдо ЕНС. Держит учет в актуальном состоянии под изменения законодательства, обеспечивает отсутствие штрафов и пеней. Принимает решения по налоговым вопросам компании."}, {"name": "Бухгалтерская (финансовая) отчетность", "junior": "Собирает данные и готовит части отчетности по шаблону. Понимает структуру баланса и отчета о финансовых результатах. Работает под контролем.", "middle": "Формирует бухгалтерскую отчетность по участку или юрлицу по ФСБУ 4/2023, готовит расшифровки и пояснения. Сдает в срок в ФНС, СФР, Росстат. Отвечает за корректность отчетности своей зоны.", "senior": "Формирует и контролирует всю бухгалтерскую (финансовую) отчетность организации (месячную, квартальную, годовую) по ФСБУ 4/2023. Обеспечивает достоверность и сдачу точно в срок во все органы. Отвечает за отчетность компании перед государством и руководством."}, {"name": "Учетная политика и методология", "junior": "Применяет действующую учетную политику по инструкции. Не формирует методологию. Работает по установленным правилам.", "middle": "Применяет учетную политику на участке, готовит предложения по ее изменению под новые ФСБУ. Разбирается в методологии сложных операций. Отвечает за корректное применение правил на участке.", "senior": "Формирует и обновляет учетную политику организации (бухгалтерскую и налоговую) под действующие ФСБУ и специфику бизнеса. Принимает решения по методологии сложных и нестандартных операций. Отвечает за методологическую корректность учета компании."}, {"name": "Закрытие периода и качество данных", "junior": "Готовит данные для закрытия по участку, проводит сверки по инструкции. Не отвечает за закрытие периода в целом.", "middle": "Закрывает свой участок в срок, проводит сверки и устраняет расхождения. Минимизирует корректировки задним числом. Отвечает за качество данных участка.", "senior": "Управляет закрытием периода по всем участкам, контролирует качество и согласованность данных. Сокращает время закрытия (time-to-close) за счет регламентов и автоматизации, минимизирует корректирующие проводки. Отвечает за скорость и достоверность закрытия по компании."}, {"name": "Управленческая отчетность и аналитика", "junior": "Готовит данные для внутренней отчетности по шаблону, без анализа. Собирает расшифровки. Работает под контролем.", "middle": "Формирует управленческую отчетность по направлению, готовит расшифровки и пояснения. Превращает учетные данные в понятные таблицы. Отвечает за корректность управленческих данных своей зоны.", "senior": "Выстраивает систему управленческой отчетности из учетных данных: понятные и своевременные отчеты для руководства для принятия решений. Интерпретирует данные, готовит аналитику и пояснения. Строит связку «учет - отчетность - управленческая аналитика»."}, {"name": "Автоматизация учета", "junior": "Работает в 1С по установленным процедурам, вносит данные. Не настраивает автоматизацию. Пользуется готовыми обработками.", "middle": "Настраивает и оптимизирует учетные процессы в 1С, внедряет ЭДО, сокращает ручной ввод на участке. Предлагает улучшения. Отвечает за автоматизацию своего участка.", "senior": "Строит систему автоматизации учета: регламенты, маршрутизация, исключение ручного труда и дублирования, ЭДО, интеграции. Снижает ручной труд и ошибки как KPI качества. Развивает учетную систему компании."}, {"name": "Налоговые риски и взаимодействие с ФНС", "junior": "Готовит документы по запросам по инструкции. Не оценивает налоговые риски. Работает под контролем.", "middle": "Отрабатывает требования и запросы ФНС по участку, готовит пояснения. Отслеживает риски своего участка. Взаимодействует с налоговой по текущим вопросам.", "senior": "Управляет налоговыми рисками компании, ведет налоговое планирование в рамках закона. Взаимодействует с ФНС на камеральных и выездных проверках, отрабатывает требования, не допускает блокировок счетов. Защищает позицию компании и обеспечивает отсутствие претензий."}, {"name": "Проверки, аудит и внутренний контроль", "junior": "Готовит и собирает документы для проверок по инструкции. Не ведет подготовку. Работает под контролем.", "middle": "Готовит участок к аудиту и проверкам, устраняет расхождения, закрывает старые периоды. Отвечает за готовность своей зоны. Работает с аудиторами по своему участку.", "senior": "Организует подготовку к аудиторским и налоговым проверкам, обеспечивает прохождение без существенных замечаний. Выстраивает систему внутреннего контроля (ст. 19 402-ФЗ). Защищает позицию компании и отвечает за результат проверок."}, {"name": "Учетные системы и цифровые инструменты", "junior": "Работает в 1С, клиент-банке и системах отчетности по процедурам. Пользуется готовыми настройками. Вносит и сверяет данные.", "middle": "Уверенно работает в 1С, ЭДО, системах электронной отчетности (Контур, СБИС, Такском), справочно-правовых системах (КонсультантПлюс, Гарант). Настраивает под задачи участка. Оптимизирует работу с инструментами.", "senior": "Определяет технологический стек бухгалтерии, внедряет и развивает 1С, ЭДО, электронную отчетность, справочно-правовые системы, элементы AI. Обеспечивает единую достоверную базу данных. Делает учет цифровым и масштабируемым."}, {"name": "Управление командой бухгалтерии", "junior": "Выполняет задачи на участке, помогает коллегам. Не управляет командой.", "middle": "Руководит участком или группой, распределяет задачи, контролирует сроки и качество. Обучает младших. Отвечает за результат участка.", "senior": "Руководит бухгалтерией (заместитель, бухгалтеры по участкам, операторы), распределяет участки без потери качества. Нанимает и развивает, задает стандарты и сроки. Управляет функцией через людей, обеспечивает взаимозаменяемость."}, {"name": "Взаимодействие с руководством и стейкхолдерами", "junior": "Готовит стандартные справки и данные по запросу. Поддерживает базовую коммуникацию. Эскалирует сложное.", "middle": "Понятно доносит учетные данные руководству и смежным службам. Взаимодействует с банками, аудиторами, контрагентами по участку. Готовит пояснения.", "senior": "Доносит финансово-учетную картину руководству понятным языком для решений. Ведет коммуникацию с ФНС, аудиторами, банками и фондами. Защищает позицию компании и выстраивает доверие как эксперт по учету."}, {"name": "Решение проблем и принятие решений", "junior": "Решает стандартные учетные задачи по процедурам, находит очевидные ошибки. Эскалирует сложное.", "middle": "Решает сложные учетные и налоговые вопросы на участке через анализ и нормативную базу. Принимает решения в своей зоне с опорой на законодательство.", "senior": "Принимает решения по сложным и нестандартным операциям, спорным налоговым вопросам и методологии. Действует в условиях неоднозначного законодательства, взвешивая риски. Отвечает за последствия решений для компании."}, {"name": "Организация процессов и приоритизация", "junior": "Работает по установленному графику, выполняет задачи в срок. Не приоритизирует. Ведет свой участок.", "middle": "Организует работу участка в отчетные периоды, расставляет приоритеты задач. Держит сроки при высокой нагрузке. Отвечает за график своей зоны.", "senior": "Организует работу всей бухгалтерии под циклы отчетности и дедлайны, приоритизирует между участками. Держит 100% дедлайнов при пиковых нагрузках. Строит процессы, снижающие авралы."}, {"name": "Достоверность и ответственность", "junior": "Соблюдает правила учета и документирует работу, признает и исправляет ошибки. Отвечает за свой участок.", "middle": "Берет ответственность за достоверность данных участка, держит качество без ошибок. Проактивно устраняет расхождения.", "senior": "Несет ответственность за достоверность учета и отчетности всей организации, в том числе персональную по закону. Обеспечивает, что данным можно доверять для решений и проверок. Задает планку достоверности для бухгалтерии."}, {"name": "Дисциплина сроков", "junior": "Сдает свои задачи в установленные сроки. Понимает важность дедлайнов отчетности.", "middle": "Обеспечивает сдачу отчетности своего участка в срок без просрочек. Планирует работу под дедлайны.", "senior": "Обеспечивает 100% дедлайнов бухгалтерской и налоговой отчетности организации. Не допускает просрочек, штрафов и пеней за срыв сроков. Делает своевременность нормой бухгалтерии."}, {"name": "Ориентация на автоматизацию и эффективность", "junior": "Пользуется готовыми инструментами, выполняет операции вручную по инструкции. Открыт к обучению новому.", "middle": "Ищет способы сократить ручной труд на участке, предлагает и внедряет улучшения. Считает автоматизацию частью качества.", "senior": "Делает снижение ручного труда и ошибок KPI качества бухгалтерии. Постоянно развивает автоматизацию и регламенты, сокращает дублирование данных. Формирует культуру эффективного учета."}, {"name": "Этика, комплаенс и профразвитие", "junior": "Соблюдает законодательство и внутренние регламенты, базовую профессиональную этику. Сообщает о нарушениях.", "middle": "Обеспечивает соответствие учета законодательству в своей зоне, следит за изменениями. Регулярно повышает квалификацию.", "senior": "Обеспечивает соответствие учета и отчетности законодательству и профстандарту, ведет учет этично и прозрачно. Держит квалификацию актуальной (профстандарт: 120 часов за 3 года, аттестация ИПБ/ЦОК). Задает стандарты комплаенса для бухгалтерии."}], "Директор по закупкам": [{"name": "Решение проблем", "junior": "Решает типовые проблемы снабжения по отлаженным процессам (задержка поставки, нехватка позиции) в рамках заданной задачи. Эскалирует нестандартное выше. Тушит сбои точечно, без разбора первопричины. Отвечает за возврат процесса в норму в моменте.", "middle": "Самостоятельно диагностирует системные сбои в закупках (срывы поставок, рост стоимости, брак, дефицит) и находит первопричину. Строит решения на уровне процесса, а не симптома. Обучает команду разбирать проблемы, балансирует скорость и системность.", "senior": "Работает с проблемами уровня всей функции закупок и снабжения производства. Превращает системные ограничения (зависимость от поставщика, санкции, валютные и логистические риски) в управляемые решения. Создает методологию разбора, предвосхищает сбои и берет право принимать риски и финансовую ответственность."}, {"name": "Стратегия закупок и снабжения", "junior": "Исполняет заданную модель закупок, мыслит горизонтом заказа/недели. Не формирует стратегию, работает внутри текущей схемы снабжения. Не связывает закупки с бизнес-целями.", "middle": "Строит план развития закупок на 6-12 месяцев: база поставщиков, категории, условия, ресурсы, снижение рисков. Оптимизирует снабжение под задачи производства, пересматривает под изменения рынка. Отвечает за то, чтобы снабжение поддерживало бесперебойность и экономику.", "senior": "Формирует стратегию закупок на 2-3 года: как система обеспечивает непрерывность, экономику и качество при росте бизнеса и новых продуктах. Проектирует архитектуру снабжения (в т.ч. дуалсорсинг как политику), связывает закупки с бизнес-стратегией, экономикой и разработкой. Влияет на решения компании со стороны снабжения."}, {"name": "Категорийное управление закупками", "junior": "Работает с закрепленными позициями и поставщиками по готовым условиям. Не сегментирует закупки по категориям. Обрабатывает заказы в рамках схемы.", "middle": "Управляет категориями закупок (сырье, упаковка, материалы): стратегия по каждой, консолидация объемов, выбор поставщиков, условия. Считает экономику категории, находит рычаги снижения стоимости. Отвечает за результат по группам закупок.", "senior": "Строит категорийную стратегию всей функции: приоритеты, модель снабжения по каждой категории, баланс цены, риска и качества. Проектирует, где консолидировать, где диверсифицировать, где локализовать. Превращает категорийное управление в источник экономии и устойчивости."}, {"name": "Поиск и развитие поставщиков, дуалсорсинг", "junior": "Работает с текущей базой поставщиков, размещает заказы. Не ищет альтернативы системно. Опирается на утвержденный пул.", "middle": "Ищет и квалифицирует новых поставщиков, внедряет альтернативные источники (дуалсорсинг) по ключевым позициям. Оценивает поставщиков по цене, качеству и надежности. Развивает базу под задачи бесперебойности.", "senior": "Строит стратегию базы поставщиков и дуалсорсинга как политику: наличие альтернатив по критичному сырью и упаковке, локализация и диверсификация под риски. Развивает стратегических поставщиков как партнеров. Делает устойчивость снабжения конкурентным преимуществом."}, {"name": "Переговоры и управление контрактами", "junior": "Ведет переговоры в рамках заданных условий, работает по типовым договорам. Не меняет структуру сделки. Согласует нестандартное выше.", "middle": "Ведет переговоры по цене, отсрочке, объемам и условиям, управляет договорной базой. Добивается улучшения условий, снижает риски в контрактах. Отвечает за коммерческие условия по своим категориям.", "senior": "Ведет ключевые и стратегические контракты как ЛПР: рамочные соглашения, долгосрочные условия, сложные сделки с поставщиками. Конструирует условия, влияющие на экономику и устойчивость бизнеса. Задает стандарты переговоров и договорной работы для функции."}, {"name": "Управление поставщиками и отношениями (SRM)", "junior": "Взаимодействует с поставщиками по текущим заказам, контролирует исполнение. Не оценивает и не развивает поставщиков системно.", "middle": "Строит оценку поставщиков (scorecard: качество, сроки, цена, надежность), управляет их эффективностью. Развивает ключевых, отсекает слабых. Управляет отношениями как ресурсом.", "senior": "Строит систему управления поставщиками: сегментация, стратегические партнерства, совместное развитие и инновации. Управляет пулом поставщиков как активом устойчивости и экономии. Влияет на разработку и продукт через поставщиков."}, {"name": "Экономика закупок: бюджет, cost saving, TCO", "junior": "Работает в рамках заданного бюджета, отслеживает план-факт по затратам. Не планирует и не защищает бюджет. Отвечает за расход в рамках заказа.", "middle": "Управляет экономикой закупок: cost saving к базе, совокупная стоимость владения (TCO), консолидация, условия. Находит источники экономии без потери качества и надежности. Держит бюджет департамента.", "senior": "Планирует и защищает бюджет закупок, отвечает за экономику снабжения как рычаг маржи бизнеса. Управляет cost saving и TCO как системой, принимает решения на стыке цены, риска и качества. Берет финансовую ответственность за контракты и изменения."}, {"name": "Планирование потребности и нормирование запасов (MRP)", "junior": "Считает потребность в сырье под план производства и размещает заказы. Ведет неснижаемые остатки по заданным нормам. Работает по установленным нормативам.", "middle": "Строит планирование потребности (MRP) под план производства, нормирует страховые и текущие запасы по SKU. Балансирует наличие, стоимость хранения и риск дефицита. Отвечает за уровень и оборачиваемость запасов сырья.", "senior": "Строит систему планирования снабжения, связанную с продажами и производством (S&OP со стороны закупок). Управляет запасами сырья как деньгами и как страховкой непрерывности. Задает политику нормирования и влияет на оборотный капитал."}, {"name": "Непрерывность снабжения и управление рисками", "junior": "Реагирует на сбои поставок по процедуре, сообщает статус выше. Тушит локальные дефициты. Действует по чужому плану реагирования.", "middle": "Заранее видит риски снабжения (зависимость от поставщика, срыв поставки, дефицит) и строит планы на случай (дуалсорс, буферы). Разруливает нестандартные ситуации самостоятельно, держит производство снабженным. Внедряет превентивные меры.", "senior": "Строит систему управления рисками снабжения и раннего предупреждения: поставщики, санкции, валюта, логистика, качество. Проводит снабжение через крупные кризисы без остановки производства, берет право принимать риски. Превращает непрерывность в конкурентное преимущество."}, {"name": "Качество входящего сырья и управление браком", "junior": "Контролирует соответствие входящего сырья требованиям по стандарту. Реагирует на брак постфактум. Не управляет качеством поставок системно.", "middle": "Строит входной контроль качества, работает с поставщиками над снижением брака и рекламациями. Снижает % брака и возвраты по сырью. Настраивает требования и стандарты к поставкам.", "senior": "Создает систему управления качеством поставок: стандарты, аудит поставщиков, предупреждение брака на входе. Связывает качество сырья с качеством продукта и потерями производства. Делает качество поставок частью устойчивости бизнеса."}, {"name": "ВЭД и импортные закупки", "junior": "Работает с готовыми импортными поставками, размещает заказы у зарубежных поставщиков по заданным схемам. Не ведет переговоры и не выбирает источники за рубежом.", "middle": "Управляет импортными закупками: выбор зарубежных (в т.ч. китайских) поставщиков, условия, INCO terms, валютные и таможенные аспекты, работа с брокерами. Считает импортную стоимость и сроки. Отвечает за бесперебойность импортного снабжения.", "senior": "Строит стратегию ВЭД в закупках: диверсификация зарубежных источников, адаптация к санкциям и валютному контролю, локализация против импорта. Ведет ключевые импортные контракты как ЛПР. Превращает международные закупки в источник экономии и защиты от рисков."}, {"name": "NPI: постановка нового продукта на производство", "junior": "Выполняет отдельные задачи по обеспечению новинок сырьем по готовому плану. Оценивает готовность позиций к запуску. Не держит контур NPI целиком.", "middle": "Обеспечивает снабжение новых продуктов: поиск и квалификация сырья и поставщиков под новинки, сроки, образцы, ввод в серию. Управляет готовностью снабжения к запуску. Отвечает за то, чтобы новинки вышли в серию без срыва.", "senior": "Строит контур NPI со стороны закупок: процесс постановки продукта на производство, стратегия обеспечения новинок сырьем, интеграция с разработкой. Проектирует, как снабжение масштабирует запуск новых продуктов. Делает скорость и надежность запуска новинок преимуществом."}, {"name": "Рыночная и трендовая экспертиза (ингредиенты)", "junior": "Знает текущих поставщиков и позиции, ориентируется в закрепленных категориях. Не отслеживает рынок и тренды системно.", "middle": "Отслеживает рынок поставщиков и сырья: кто что поставляет, на каких условиях, новые игроки, альтернативы. Находит новые ингредиенты и решения, приносит их в разработку. Использует экспертизу для выбора и переговоров.", "senior": "Строит рыночную и трендовую разведку как функцию: инновационные ингредиенты, технологии, игроки, тренды рынка. Интегрирует находки в разработку и стратегию продукта. Превращает экспертизу по рынку в источник конкурентного преимущества и инноваций."}, {"name": "Процессы снабжения и их архитектура", "junior": "Работает по готовым процессам снабжения, контролирует их соблюдение. Не проектирует процессы. Реализует принятые улучшения.", "middle": "Проводит аудит процессов снабжения, находит узкие места и устраняет их. Описыва
