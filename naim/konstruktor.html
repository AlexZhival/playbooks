/* узкое место: этап с наибольшим отставанием CR от бенчмарка */
function repBottleneck(vac){
  const F=BENCH.funnel,T=repTrans();let worst=null;
  for(let i=1;i<F.length;i++){
    const cur=repTot(vac,F[i].k),prev=repTot(vac,F[i-1].k),bm=T[i-1];
    if(!prev||!bm)continue;
    const f=cur/prev,ratio=f/bm.cr;
    if(prev<5)continue; /* мало данных — не судим */
    if(!worst||ratio<worst.ratio)worst={i:i,stage:F[i].label,f:f,bm:bm,ratio:ratio};
  }
  return (worst&&worst.ratio<0.9)?worst:null;
}

function renderReport(){
  const R=repState();
  if(!R.active)return renderRepBoard(R);
  const vac=repActive();
  if(!vac){R.active=null;save();return renderRepBoard(R);}
  return renderRepVac(vac);
}

    const resp=repTot(v,"responses"),hired=repTot(v,"hired"),need=(BENCH.perHire[v.type]||2200)*(v.plan||1);
    const pct=Math.min(100,Math.round(resp/need*100));
    const dd=v.days&&v.days.length?daysBetween(v.opened,v.days[v.days.length-1].d):daysBetween(v.opened,todayISO());

      '<div class="vc-bars">'+bars+'</div>'+

       '<div><b>'+(v.days?v.days.length:0)+'</b><span>дней внесено</span></div></div>'+
      '<div class="vc-prog"><i style="width:'+pct+'%"></i></div>'+

      '<span class="vc-open">Открыть →</span></div></div>';

   '<div class="card"><div class="row" style="justify-content:space-between"><h3 style="margin:0">Вакансии</h3><button class="btn primary sm" onclick="repAddVac()">+ Добавить вакансию</button></div>'+
   (cards?'<div class="vgrid">'+cards+'</div>':'<div class="note b">Пока нет ни одной вакансии. Нажми «+ Добавить вакансию» — заведём воронку и начнём вести ежедневный план-факт.</div>')+'</div>'+
   repCasesHTML()+navBtns();

/* обновляем только производные блоки — поля ввода не трогаем */
function repRefresh(){
  const vac=repActive();if(!vac)return;
  BENCH.funnel.forEach(s=>{const el=$("#tot_"+s.k);if(el)el.textContent=fmtN(repTot(vac,s.k));});
  const kpi=$("#repkpi");if(kpi)kpi.innerHTML=repKPIHTML(vac);
  const wk=$("#repweek");if(wk)wk.innerHTML=repWeekHTML(vac);
  const fn=$("#repfun");if(fn)fn.innerHTML=repFunnelHTML(vac);
}

function repKPIHTML(vac){
  const resp=repTot(vac,"responses"),hired=repTot(vac,"hired"),views=repTot(vac,"views");
  const per=BENCH.perHire[vac.type]||2200,need=per*(vac.plan||1);
  const last=(vac.days&&vac.days.length)?vac.days[vac.days.length-1].d:todayISO();
  const dd=daysBetween(vac.opened,last);
  const rate=resp/dd;
  let t="";
  t+=tile("В работе",dd+" дн.","открыта "+fmtD(vac.opened),"var(--em)");
  t+=tile("Откликов",fmtN(resp),"на "+(vac.plan||1)+" найм нужно ~"+fmtN(need),"var(--em)");
  t+=tile("Темп",rate>=1?fmtN(rate)+" /день":rate.toFixed(1)+" /день","средний поток откликов","var(--gold-h)");
  if(resp<need&&rate>0.05){const left=Math.ceil((need-resp)/rate);
    t+=tile("Ещё нужно",fmtN(need-resp),"откликов · ~"+left+" дн. таким темпом","var(--gold-h)");}
  if(views>0)t+=tile("Просмотр → отклик",(resp/views*100).toFixed(1)+"%","норма HH 1–5%",(resp/views>=0.03?"var(--green)":"var(--amber)"));
  t+=tile("Нанято",hired+" / "+(vac.plan||1),hired?("1 найм из "+fmtN(resp/hired)+" откликов"):"пока никого","var(--green)");
  return t;
}

function repWeekHTML(vac){
  const F=BENCH.funnel,days=(vac.days||[]).slice().sort((a,b)=>a.d<b.d?-1:1);
  if(!days.length)return '<div class="kmini">Внеси хотя бы один день — недели соберутся сами.</div>';
  const map={};
  days.forEach(d=>{const w=weekStart(d.d);map[w]=map[w]||{n:0,v:{}};map[w].n++;F.forEach(s=>{map[w].v[s.k]=(map[w].v[s.k]||0)+dnum(d.v[s.k]);});});
  const keys=Object.keys(map).sort();
  const rows=keys.map((w,i)=>{
    const c=map[w].v,prev=i>0?map[keys[i-1]].v:null;
    const cr=c.responses?(c.hired/c.responses*100).toFixed(2)+"%":"—";
    let dlt="—";
    if(prev&&prev.responses){const g=(c.responses-prev.responses)/prev.responses*100;
      dlt='<span class="'+(g>=0?"g":"r")+'">'+(g>=0?"+":"")+g.toFixed(0)+"%</span>";}
    const cells=F.map(s=>'<td>'+(c[s.k]?fmtN(c[s.k]):"—")+'</td>').join("");
    return '<tr><td><b>нед. '+esc(fmtD(w))+'</b><div class="kmini" style="margin:0">'+map[w].n+' дн.</div></td>'+cells+'<td class="g">'+cr+'</td><td>'+dlt+'</td><td style="font-size:12px;color:var(--muted)">'+repWeekVerdict(c)+'</td></tr>';
  }).join("");
  return '<div style="overflow-x:auto"><table class="gt narrow" style="margin-top:10px"><thead><tr><th>Неделя</th>'+F.map(s=>'<th>'+esc(shortLabel(s.k))+'</th>').join("")+'<th>Откл.→найм</th><th>Откл. к пред.</th><th>Вывод недели</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
}
function repWeekVerdict(c){
  const F=BENCH.funnel,T=repTrans();let worst=null;
  for(let i=1;i<F.length;i++){const cur=c[F[i].k]||0,prev=c[F[i-1].k]||0,bm=T[i-1];
    if(prev<5||!bm)continue;const r=(cur/prev)/bm.cr;if(!worst||r<worst.r)worst={r:r,s:F[i].label,f:cur/prev,bm:bm};}
  if(!worst)return "мало данных за неделю";
  if(worst.r>=0.9)return "воронка в норме, держим темп";
  return "проседает «"+worst.s+"»: "+(worst.f*100).toFixed(0)+"% против ~"+(worst.bm.cr*100).toFixed(0)+"% → "+worst.bm.hint;
}

function repFunnelHTML(vac){
  const F=BENCH.funnel,T=repTrans();
  const bn=repBottleneck(vac);
  const rows=F.map((s,i)=>{
    const cur=repTot(vac,s.k);
    if(i===0)return '<tr><td><b>'+esc(s.label)+'</b></td><td>'+fmtN(cur)+'</td><td>—</td><td>—</td><td>—</td><td style="font-size:12px;color:var(--muted)">стартовая метрика воронки</td></tr>';
    const prev=repTot(vac,F[i-1].k),bm=T[i-1];
    let cr="—",ev="";
    if(prev>0){const f=cur/prev;cr=(f*100).toFixed(f<0.1?1:0)+"%";
      ev=(bm.low&&f<bm.low)?'<span class="r">⚠ узкое место</span>':(f>=bm.cr*0.9?'<span class="g">✓ в норме</span>':'<span class="y">ниже среднего</span>');}
    const hi=(bn&&bn.i===i)?' style="background:#FBEFEC"':'';
    return '<tr'+hi+'><td><b>'+esc(s.label)+'</b></td><td>'+fmtN(cur)+'</td><td style="font-weight:800">'+cr+'</td><td style="color:var(--muted)">~'+(bm.cr*100).toFixed(bm.cr<0.1?1:0)+'%</td><td>'+ev+'</td><td style="font-size:12px;color:var(--muted)">'+esc(bm.hint)+'</td></tr>';
  }).join("");
  const anyData=repTot(vac,"responses")>50;
  const concl=bn?'<div class="note" style="border-left:3px solid var(--red)"><b>Узкое место сейчас — «'+esc(bn.stage)+'»</b>: '+(bn.f*100).toFixed(0)+'% против бенчмарка ~'+(bn.bm.cr*100).toFixed(0)+'%. '+esc(bn.bm.hint)+'. Усиливай именно этот инструмент, а не «лей ещё откликов».</div>'
    :(anyData?'<div class="note b"><b>Узких мест нет</b> — все переходы держатся в пределах бенчмарков A-Players. Дальше решает объём: добирай отклики до нормы и не роняй темп.</div>'
             :'<div class="note b">Данных пока мало для вывода об узком месте — веди план-факт хотя бы неделю.</div>');
  return '<div style="overflow-x:auto"><table class="gt narrow" style="margin-top:10px"><thead><tr><th>Этап</th><th>Всего</th><th>CR к пред.</th><th>Бенчмарк</th><th>Оценка</th><th>Подсказка</th></tr></thead><tbody>'+rows+'</tbody></table></div>'+concl;
}

function repCasesHTML(){
  const cols=["Отклики","Анкеты","1-е собес","Тестовое","2-е собес","Презентация","Финал","Найм"];
  const rows=BENCH.cases.map(c=>{const resp=c.n[0],hired=c.n[c.n.length-1];const cr=(resp&&hired)?(hired/resp*100).toFixed(2)+"%":"—";
    return '<tr><td><b>'+esc(c.role)+'</b></td>'+c.n.map(x=>'<td>'+(x===null?"—":x)+'</td>').join("")+'<td class="g">'+cr+'</td></tr>';}).join("");
  return '<div class="card"><h3>Реальные кейсы A-Players (ориентир)</h3><div class="kmini" style="margin:4px 0 6px">Фактические закрытые позиции — по ним откалиброваны бенчмарки. «1 найм из тысяч откликов» — это норма современного найма, а не провал.</div><div style="overflow-x:auto"><table class="gt narrow"><thead><tr><th>Позиция</th>'+cols.map(x=>'<th>'+x+'</th>').join("")+'<th>Отклик→найм</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>';
}

/* ---- действия ---- */
function repOpen(id){repState().active=id;save();renderReport();window.scrollTo(0,0);}
function repBack(){repState().active=null;save();renderReport();window.scrollTo(0,0);}
function repAddVac(){
  const R=repState();const nm=prompt("Название вакансии (роль):",S.role||"Руководитель отдела продаж");if(nm===null)return;
  const id="v"+Date.now().toString(36);
  R.list.push({id,name:(nm.trim()||S.role||"Вакансия"),type:(S.calc&&S.calc.type)||"Руководящая (РОП/РО/директор)",status:"В работе",opened:todayISO(),plan:1,owner:"",days:[],notes:{}});
  R.active=id;save();renderReport();window.scrollTo(0,0);
}
function repDelVac(){const R=repState();if(!R.active)return;if(!confirm("Удалить вакансию и всю её историю?"))return;R.list=R.list.filter(v=>v.id!==R.active);R.active=null;save();renderReport();}
function repRenameVac(){const vac=repActive();if(!vac)return;const n=prompt("Название вакансии:",vac.name);if(n!==null){vac.name=n.trim()||vac.name;}const o=prompt("Ответственный рекрутер:",vac.owner||"");if(o!==null)vac.owner=o.trim();const p=prompt("Сколько человек нанимаем:",String(vac.plan||1));if(p!==null){const n2=parseInt(p,10);if(n2>0)vac.plan=n2;}save();renderReport();}
function repSetField(k,v){const vac=repActive();if(!vac)return;vac[k]=v;save();repRefresh();}
function repAddDay(){repPushDay(todayISO());}
function repAddDayAsk(){const d=prompt("Дата в формате ГГГГ-ММ-ДД:",todayISO());if(d&&/^\d{4}-\d{2}-\d{2}$/.test(d.trim()))repPushDay(d.trim());else if(d)alert("Нужен формат ГГГГ-ММ-ДД, например "+todayISO());}
function repPushDay(d){
  const vac=repActive();if(!vac)return;vac.days=vac.days||[];
  if(vac.days.some(x=>x.d===d)){alert("Такой день уже есть в таблице.");return;}
  vac.days.push({d:d,v:repEmptyDay()});
  vac.days.sort((a,b)=>a.d<b.d?-1:1);
  if(d<vac.opened)vac.opened=d;
  save();renderReport();
}
function repDelDay(i){const vac=repActive();if(!vac)return;if(!confirm("Удалить этот день?"))return;vac.days.splice(i,1);save();renderReport();}
function repSetDay(i,k,v){const vac=repActive();if(!vac||!vac.days[i])return;vac.days[i].v[k]=v;save();repRefresh();}
window.repOpen=repOpen;window.repBack=repBack;window.repAddVac=repAddVac;window.repDelVac=repDelVac;window.repRenameVac=repRenameVac;window.repSetField=repSetField;window.repAddDay=repAddDay;window.repAddDayAsk=repAddDayAsk;window.repDelDay=repDelDay;window.repSetDay=repSetDay;

/* ---- экспорт отчёта в Excel ---- */
async function exportReportExcel(){
  const vac=repActive();if(!vac){alert("Открой вакансию");return;}
  if(typeof ExcelJS==="undefined"){alert("Библиотека Excel не загрузилась — обнови страницу.");return;}
  const F=BENCH.funnel,T=repTrans();
  const wb=new ExcelJS.Workbook();wb.creator="A-Players";

  const w1=wb.addWorksheet("Дни");
  xTitle(w1,"Ежедневный план-факт · "+vac.name,1+(vac.days||[]).length+1);
  xHeader(w1,["Этап воронки"].concat((vac.days||[]).map(d=>d.d)).concat(["Итого"]));
  F.forEach((s,i)=>xData(w1,[s.label].concat((vac.days||[]).map(d=>dnum(d.v[s.k]))).concat([repTot(vac,s.k)]),i%2));
  wsWidths(w1,[30].concat((vac.days||[]).map(()=>12)).concat([12]));

  const w2=wb.addWorksheet("Недели");
  const days=(vac.days||[]).slice().sort((a,b)=>a.d<b.d?-1:1);
  const map={};days.forEach(d=>{const wk=weekStart(d.d);map[wk]=map[wk]||{};F.forEach(s=>{map[wk][s.k]=(map[wk][s.k]||0)+dnum(d.v[s.k]);});});
  xTitle(w2,"Итоги по неделям · "+vac.name,F.length+3);
  xHeader(w2,["Неделя"].concat(F.map(s=>s.label)).concat(["Отклик→найм","Вывод недели"]));
  Object.keys(map).sort().forEach((wk,i)=>{const c=map[wk];
    xData(w2,["нед. с "+wk].concat(F.map(s=>c[s.k]||0)).concat([c.responses?(c.hired/c.responses*100).toFixed(2)+"%":"—",repWeekVerdict(c).replace(/<[^>]+>/g,"")]),i%2);});
  wsWidths(w2,[16].concat(F.map(()=>13)).concat([14,50]));

  const w3=wb.addWorksheet("Воронка");
  xTitle(w3,"Воронка накопительно vs бенчмарки · "+vac.name,6);
  xHeader(w3,["Этап","Всего","CR к пред.","Бенчмарк","Оценка","Подсказка"]);
  F.forEach((s,i)=>{
    if(i===0){xData(w3,[s.label,repTot(vac,s.k),"—","—","—","стартовая метрика воронки"],i%2);return;}
    const cur=repTot(vac,s.k),prev=repTot(vac,F[i-1].k),bm=T[i-1];
    const f=prev>0?cur/prev:null;
    const ev=f===null?"—":((bm.low&&f<bm.low)?"узкое место":(f>=bm.cr*0.9?"в норме":"ниже среднего"));
    xData(w3,[s.label,cur,f===null?"—":(f*100).toFixed(1)+"%","~"+(bm.cr*100).toFixed(1)+"%",ev,bm.hint],i%2);
  });
  wsWidths(w3,[30,12,14,14,16,60]);

  await xlsxDownload(wb,("Отчёт найма — "+vac.name).slice(0,60)+".xlsx");
}
window.exportReportExcel=exportReportExcel;

/* ---- КАЛЬКУЛЯТОР воронки найма ---- */
function renderCalc(){
  S.calc=S.calc||{hires:1,type:"Руководящая (РОП/РО/директор)"};
  const perHire=BENCH.perHire[S.calc.type]||2100;
  const need=Math.round(perHire*(+S.calc.hires||1));
  // разложим по этапам от откликов
  let x=need;const stageRows=BENCH.perStage.map(st=>{const before=Math.round(x);x=x*st.cr;const after=Math.round(x);return '<tr><td>'+esc(st.stage)+'</td><td>'+before+'</td><td class="g">'+(st.cr*100).toFixed(0)+'%</td><td>'+after+'</td></tr>';}).join("");
  $("#main").innerHTML=head("Калькулятор воронки найма","Сколько откликов нужно, чтобы нанять","На бенчмарках агентства A-Players: сколько входящих заявок собрать под цель по найму и сколько кандидатов будет на каждом этапе.")+
  '<div class="card"><div class="two"><div class="fg"><label class="fl">Тип позиции</label><select id="c_type" onchange="calcEdit()"><option'+(S.calc.type.indexOf("Линей")>=0?" selected":"")+'>Линейная (менеджер/ассистент)</option><option'+(S.calc.type.indexOf("Руковод")>=0?" selected":"")+'>Руководящая (РОП/РО/директор)</option></select></div><div class="fg"><label class="fl">Сколько человек нанять</label><input type="number" id="c_hires" min="1" value="'+(S.calc.hires||1)+'" oninput="calcEdit()"></div></div>'+
  '<div class="statgrid"><div class="stat-tile"><div class="l">На 1 нанятого</div><div class="n" style="color:var(--em)">~'+perHire+'</div><div class="l">откликов</div></div><div class="stat-tile"><div class="l">Всего откликов под цель</div><div class="n" style="color:var(--gold-h)">~'+need+'</div><div class="l">откликов</div></div></div>'+
  '<div style="overflow-x:auto"><table class="gt"><thead><tr><th>Этап</th><th>Кандидатов на входе</th><th>CR</th><th>Прошло дальше</th></tr></thead><tbody>'+stageRows+'</tbody></table></div>'+
  '<div class="note">Вакансия за 7 дней: линейная '+BENCH.vacancy7d["Линейная"].avg+' откликов (хорошо '+BENCH.vacancy7d["Линейная"].good+'), руководящая '+BENCH.vacancy7d["Руководящая"].avg+' (хорошо '+BENCH.vacancy7d["Руководящая"].good+'). Меньше нормы за 7 дней — переписывай заголовок и первый абзац вакансии.</div></div>'+navBtns();
}

/* ================= БРЕНДИРОВАННЫЙ EXCEL (ExcelJS) ================= */
const XC={EM:"FF143A2D",GOLD:"FFB0822E",LINE:"FFDCD4C2",CREAM:"FFEFE9DA",ZEBRA:"FFF7F3E9",SEC:"FFEFE9D9",WHITE:"FFFFFFFF"};
function xThin(){return {style:"thin",color:{argb:XC.LINE}};}
function xBorder(){const t=xThin();return {top:t,left:t,bottom:t,right:t};}
function xTitle(ws,text,span){const row=ws.addRow([text]);ws.mergeCells(row.number,1,row.number,span);const c=row.getCell(1);c.fill={type:"pattern",pattern:"solid",fgColor:{argb:XC.EM}};c.font={name:"Arial",bold:true,size:14,color:{argb:XC.CREAM}};c.alignment={vertical:"middle",indent:1};row.height=28;ws.addRow([]);}
function xHeader(ws,arr){const row=ws.addRow(arr);row.eachCell(c=>{c.fill={type:"pattern",pattern:"solid",fgColor:{argb:XC.GOLD}};c.font={bold:true,color:{argb:XC.WHITE},size:11};c.alignment={vertical:"middle",wrapText:true,indent:1};c.border=xBorder();});row.height=22;}
function xData(ws,arr,z){const row=ws.addRow(arr);row.eachCell(c=>{c.alignment={vertical:"top",wrapText:true,indent:1};c.border=xBorder();if(z)c.fill={type:"pattern",pattern:"solid",fgColor:{argb:XC.ZEBRA}};});}
function xSection(ws,text,span){const row=ws.addRow([text]);if(span>1)ws.mergeCells(row.number,1,row.number,span);const c=row.getCell(1);c.font={bold:true,size:12,color:{argb:XC.EM}};c.fill={type:"pattern",pattern:"solid",fgColor:{argb:XC.SEC}};c.alignment={vertical:"middle",indent:1};row.height=20;}
function xBullets(ws,arr,span){(arr||[]).forEach(x=>{const row=ws.addRow(["•  "+x]);if(span>1)ws.mergeCells(row.number,1,row.number,span);row.getCell(1).alignment={wrapText:true,vertical:"top",indent:1};});}
function xText(ws,txt,span){String(txt||"").split("\n").forEach(line=>{const row=ws.addRow([line]);if(span>1)ws.mergeCells(row.number,1,row.number,span);row.getCell(1).alignment={wrapText:true,vertical:"top",indent:1};});}
/* блоки {h,kind,items,columns,rows,text} → лист */
function xBlocks(ws,blocks){
  (blocks||[]).forEach(b=>{
    xSection(ws,b.h||"",Math.max(1,(b.columns||[]).length||1));
    if(b.kind==="table"&&b.columns){xHeader(ws,b.columns);(b.rows||[]).forEach((r,i)=>xData(ws,r,i%2));}
    else if(b.kind==="list"){xBullets(ws,b.items||[],1);}
    else{xText(ws,b.text||(b.items||[]).join("\n"),1);}
    ws.addRow([]);
  });
}
function wsWidths(ws,w){ws.columns=w.map(x=>({width:x}));}
async function xlsxDownload(wb,fname){const buf=await wb.xlsx.writeBuffer();const blob=new Blob([buf],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});const u=URL.createObjectURL(blob);const a=document.createElement("a");a.href=u;a.download=fname;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(u);a.remove();},400);}
function sheetName(s){return String(s||"Лист").replace(/[\\/?*:\[\]]/g,"").slice(0,31)||"Лист";}

/* экспорт одного раздела (генератора) — оформленный */
async function exportBrandedBlocks(id){
  const r=S.results[id];if(!r){return;}
  if(!window.ExcelJS){return exportGenPlain(id);}
  const wb=new ExcelJS.Workbook();wb.creator="A-Players";
  const ws=wb.addWorksheet(sheetName(GEN[id].title));wsWidths(ws,[26,40,40,40,30,30]);
  xTitle(ws,(r.title||GEN[id].title).toUpperCase(),6);xBlocks(ws,r.blocks);
  await xlsxDownload(wb,(r.title||GEN[id].title).slice(0,40)+".xlsx");
}

/* единый файл — ВСЯ ВОРОНКА одним workbook */
async function assembleWorkbook(){
  if(!window.ExcelJS){alert("ExcelJS не загрузился (нужен интернет).");return;}
  const wb=new ExcelJS.Workbook();wb.creator="A-Players";
  // 0. Обзор
  let ws=wb.addWorksheet("Воронка найма");wsWidths(ws,[26,70]);
  xTitle(ws,"ВОРОНКА НАЙМА — "+((S.role||"роль").toUpperCase()),2);
  [["Компания",S.company],["Ниша",S.niche],["Роль",S.role]].forEach((kv,i)=>xData(ws,kv,i%2));
  ws.addRow([]);xSection(ws,"ТОП-3 результата за 1-й квартал",2);xBullets(ws,S.top3.filter(Boolean),2);
  // Бриф
  ws=wb.addWorksheet("Бриф");wsWidths(ws,[40,60]);xTitle(ws,"БРИФ ДОЛЖНОСТИ",2);
  BRIEF.forEach(bl=>{const ans=S.brief[bl.id]||[];const any=bl.qs.some((q,i)=>ans[i]);if(!any)return;xSection(ws,bl.name,2);bl.qs.forEach((q,i)=>{if(ans[i])xData(ws,[q,ans[i]]);});ws.addRow([]);});
  // Портрет
  if(S.portrait&&S.portrait.skills){ws=wb.addWorksheet("Портрет навыков");wsWidths(ws,[26,42,42,42,15,8]);xTitle(ws,"ПОРТРЕТ НАВЫКОВ",6);xHeader(ws,["Навык","Junior","Middle","Senior","Целевой грейд","ТОП-5"]);S.portrait.skills.forEach((sk,i)=>xData(ws,[sk.name,sk.junior,sk.middle,sk.senior,(S.portrait.sel||{})[sk.name]||sk.targetGrade||"",(S.portrait.top5||[]).includes(sk.name)?"да":""],i%2));}
  // Каждый собранный раздел
  Object.keys(GEN).forEach(id=>{const r=S.results[id];if(!r)return;const w=wb.addWorksheet(sheetName(GEN[id].title));wsWidths(w,[26,40,40,40,30,30]);xTitle(w,(r.title||GEN[id].title).toUpperCase(),6);xBlocks(w,r.blocks);});
  // Мотивация-калькулятор (с формулами)
  motivationSheet(wb);
  await xlsxDownload(wb,"Воронка найма — "+(S.company||"")+" "+(S.role||"роль")+".xlsx");
}

/* ================= МОТИВАЦИЯ · КАЛЬКУЛЯТОР (лист с формулами) ================= */
function motivationSheet(wb){
  const m=S.motiv||{okladMin:80000,okladReal:110000,okladMax:140000,bonusPct:20,planReal:100};
  const ws=wb.addWorksheet("Мотивация-калькулятор");wsWidths(ws,[34,20,20,20]);
  xTitle(ws,"СИСТЕМА МОТИВАЦИИ · КАЛЬКУЛЯТОР ДОХОДА",4);
  xData(ws,["Кандидат может подставлять свои значения (жёлтые) и видеть доход min / реалистично / max.","","",""],0);
  ws.addRow([]);
  xHeader(ws,["Показатель","Минимально","Реалистично","Максимально"]);
  const rOklad=ws.addRow(["Оклад (gross), ₽",m.okladMin,m.okladReal,m.okladMax]);
  const rBonus=ws.addRow(["Бонус за достижение плана, %",m.bonusPct,m.bonusPct,m.bonusPct]);
  const rPlan=ws.addRow(["Выполнение плана, %",Math.max(0,m.planReal-30),m.planReal,Math.min(150,m.planReal+30)]);
  [rOklad,rBonus,rPlan].forEach(r=>{[2,3,4].forEach(ci=>{const c=r.getCell(ci);c.fill={type:"pattern",pattern:"solid",fgColor:{argb:"FFFFFAE3"}};c.border=xBorder();c.alignment={horizontal:"right",indent:1};});r.getCell(1).border=xBorder();r.getCell(1).alignment={indent:1};});
  const n0=rOklad.number,nb=rBonus.number,np=rPlan.number;
  const rBonusRub=ws.addRow(["Бонус, ₽",{formula:`B${n0}*B${nb}/100*B${np}/100`},{formula:`C${n0}*C${nb}/100*C${np}/100`},{formula:`D${n0}*D${nb}/100*D${np}/100`}]);
  const rTotal=ws.addRow(["ИТОГО доход в месяц, ₽",{formula:`B${n0}+B${rBonusRub.number}`},{formula:`C${n0}+C${rBonusRub.number}`},{formula:`D${n0}+D${rBonusRub.number}`}]);
  [rBonusRub,rTotal].forEach(r=>{[1,2,3,4].forEach(ci=>{r.getCell(ci).border=xBorder();r.getCell(ci).alignment={horizontal:ci===1?"left":"right",indent:1};});});
  rTotal.eachCell(c=>{c.font={bold:true,color:{argb:XC.EM},size:12};c.fill={type:"pattern",pattern:"solid",fgColor:{argb:XC.SEC}};});
  ws.getColumn(2).numFmt='#,##0';ws.getColumn(3).numFmt='#,##0';ws.getColumn(4).numFmt='#,##0';
  ws.addRow([]);xSection(ws,"Как считается",4);xBullets(ws,["Бонус = Оклад × Бонус% × Выполнение плана%","Итого = Оклад + Бонус","Меняй жёлтые ячейки — числа пересчитаются. Отправь файл кандидату, чтобы он «побаловался» с потенциальным доходом."],4);
  return ws;
}
async function exportMotivCalc(){if(!window.ExcelJS){alert("ExcelJS не загрузился.");return;}const wb=new ExcelJS.Workbook();wb.creator="A-Players";motivationSheet(wb);await xlsxDownload(wb,"Мотивация — калькулятор дохода.xlsx");}
window.exportMotivCalc=exportMotivCalc;
function rub(v){return Math.round(v||0).toLocaleString("ru-RU");}
function motivTableHTML(){const m=S.motiv;const scen=[["Минимально",m.okladMin,Math.max(0,m.planReal-30)],["Реалистично",m.okladReal,m.planReal],["Максимально",m.okladMax,Math.min(150,m.planReal+30)]];
  return '<table class="gt"><thead><tr><th>Сценарий</th><th>Оклад</th><th>Выполн. плана</th><th>Бонус</th><th>Итого доход/мес</th></tr></thead><tbody>'+
   scen.map(s=>{const bonus=s[1]*(m.bonusPct/100)*(s[2]/100);return '<tr><td>'+s[0]+'</td><td>'+rub(s[1])+' ₽</td><td>'+s[2]+'%</td><td>'+rub(bonus)+' ₽</td><td class="g">'+rub(s[1]+bonus)+' ₽</td></tr>';}).join("")+'</tbody></table>';}
function motivCalcHTML(){
  S.motiv=S.motiv||{okladMin:80000,okladReal:110000,okladMax:140000,bonusPct:20,planReal:100};const m=S.motiv;
  return '<div class="card"><h3>💰 Калькулятор дохода (для кандидата)</h3><div class="note">Подставь значения — таблица пересчитает доход min / реалистично / max. Выгрузи в Excel с формулами, чтобы кандидат сам «побаловался».</div>'+
   '<div class="two" style="margin-top:10px"><div class="fg"><label class="fl">Оклад: min / реал / max, ₽</label><div class="row"><input type="number" id="mo_min" value="'+m.okladMin+'" oninput="motivEdit()" style="width:108px"><input type="number" id="mo_real" value="'+m.okladReal+'" oninput="motivEdit()" style="width:108px"><input type="number" id="mo_max" value="'+m.okladMax+'" oninput="motivEdit()" style="width:108px"></div></div>'+
   '<div class="fg"><label class="fl">Бонус за план, % · Выполнение плана (реал), %</label><div class="row"><input type="number" id="mo_bonus" value="'+m.bonusPct+'" oninput="motivEdit()" style="width:100px"><input type="number" id="mo_plan" value="'+m.planReal+'" oninput="motivEdit()" style="width:100px"></div></div></div>'+
   '<div style="overflow-x:auto" id="motivTable">'+motivTableHTML()+'</div>'+
   '<div class="row" style="margin-top:12px"><button class="btn dark sm" onclick="exportMotivCalc()">⬇ Калькулятор в Excel (с формулами)</button></div></div>';
}
function motivEdit(){S.motiv={okladMin:+$("#mo_min").value||0,okladReal:+$("#mo_real").value||0,okladMax:+$("#mo_max").value||0,bonusPct:+$("#mo_bonus").value||0,planReal:+$("#mo_plan").value||0};save();const t=$("#motivTable");if(t)t.innerHTML=motivTableHTML();}
window.motivEdit=motivEdit;

/* ================= АДМИН-ПАНЕЛЬ (локально) ================= */
function getFunnels(){try{return JSON.parse(localStorage.getItem("apx_hire_funnels"))||[];}catch(_){return [];}}
function setFunnels(a){localStorage.setItem("apx_hire_funnels",JSON.stringify(a));}
function saveFunnel(){
  if(!S.role){alert("Заполни хотя бы роль на «Старте».");return;}
  const arr=getFunnels();const id=S._fid||("f"+Date.now());S._fid=id;
  const snap={id,company:S.company,niche:S.niche,role:S.role,top3:S.top3,brief:S.brief,portrait:S.portrait,results:S.results,motiv:S.motiv,driveLink:(arr.find(f=>f.id===id)||{}).driveLink||"",updated:new Date().toISOString().slice(0,16).replace("T"," ")};
  const i=arr.findIndex(f=>f.id===id);if(i>=0)arr[i]=snap;else arr.unshift(snap);
  setFunnels(arr);save();renderAdmin();
}
function loadFunnel(id){const f=getFunnels().find(x=>x.id===id);if(!f)return;S=Object.assign(S,{company:f.company,niche:f.niche,role:f.role,top3:f.top3||["","",""],brief:f.brief||{},portrait:f.portrait||null,results:f.results||{},motiv:f.motiv,_fid:f.id});save();renderNav();go(0);}
function deleteFunnel(id){if(!confirm("Удалить эту воронку из списка?"))return;setFunnels(getFunnels().filter(f=>f.id!==id));renderAdmin();}
function setDrive(id,v){const arr=getFunnels();const f=arr.find(x=>x.id===id);if(f){f.driveLink=v;setFunnels(arr);}}
window.saveFunnel=saveFunnel;window.loadFunnel=loadFunnel;window.deleteFunnel=deleteFunnel;window.setDrive=setDrive;
function renderAdmin(){
  const arr=getFunnels();
  const rows=arr.length?arr.map(f=>{
    const nsteps=Object.keys(f.results||{}).length+(f.portrait?1:0)+(Object.keys(f.brief||{}).length?1:0);
    return '<tr><td><b>'+esc(f.role||"—")+'</b><div class="kmini">'+esc(f.company||"")+' · '+esc(f.niche||"")+'</div></td><td>'+esc(f.updated||"")+'</td><td>'+nsteps+' шагов</td>'+
    '<td><input type="text" value="'+esc(f.driveLink||"")+'" placeholder="вставь ссылку на файл в Google Drive" oninput="setDrive(\''+f.id+'\',this.value)" style="min-width:220px">'+(f.driveLink?' <a href="'+esc(f.driveLink)+'" target="_blank">↗</a>':'')+'</td>'+
    '<td class="row" style="gap:6px"><button class="btn ghost sm" onclick="loadFunnel(\''+f.id+'\')">Открыть</button><button class="btn ghost sm" onclick="deleteFunnel(\''+f.id+'\')">✕</button></td></tr>';
  }).join(""):'<tr><td colspan="5" style="color:var(--muted)">Пока нет сохранённых воронок. Заполни воронку и нажми «💾 Сохранить текущую воронку».</td></tr>';
  $("#main").innerHTML=head("Мои воронки найма","Админ-панель","Все собранные воронки найма (хранятся в этом браузере). Сохрани текущую, выгрузи её одним файлом в Excel, залей на Google Drive и вставь ссылку — чтобы лидер вакансии пошерил команде рекрутинга.")+
  '<div class="card"><div class="row"><button class="btn primary" onclick="saveFunnel()">💾 Сохранить текущую воронку</button><button class="btn dark" onclick="assembleWorkbook()">⬇ Скачать всю воронку в Excel</button></div>'+
  '<div class="note">Google Drive: выгрузи собранный Excel вручную на Drive → скопируй ссылку «Доступ по ссылке» → вставь в таблице ниже. (Авто-логин и авто-загрузку добавим при деплое на домен.)</div>'+
  '<div style="overflow-x:auto"><table class="gt" style="margin-top:12px"><thead><tr><th>Роль / компания</th><th>Обновлено</th><th>Прогресс</th><th>Ссылка на собранную воронку (Google Drive)</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div></div>'+navBtns();
}
