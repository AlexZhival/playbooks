ет и оптимизирует процессы (заказ, приемка, работа с поставщиком, документооборот). Повышает скорость и точность за счет процессов.", "senior": "Проектирует архитектуру процессов закупок для всей функции и площадок. Внедряет изменения логики работы как проекты (аудит - стратегия - внедрение). Создает операционную модель снабжения, которая масштабируется и становится эталоном."}, {"name": "Аналитика закупок и ERP (ABC-XYZ, дашборды)", "junior": "Пользуется готовыми отчетами из ERP, вносит данные, сверяет. Смотрит в исторические данные. Не строит аналитику самостоятельно.", "middle": "Строит анализы (ABC-XYZ по позициям и поставщикам, план-факт, стоимость) на данных ERP (Odoo/1C). Делает дашборды для мониторинга статусов процессов. Внедряет решения на основе данных.", "senior": "Формирует аналитическую систему всей функции закупок, включая предиктивные метрики (риски дефицита, спрос, цены). Ставит ТЗ на дашборды и сквозную аналитику снабжения. Делает данные основой стратегических решений и переговоров."}, {"name": "AI в закупках", "junior": "Пользуется AI для простых задач (парсинг данных, генерация формул и дашбордов, обработка прайсов). Экспериментирует под руководством. Простые сценарии без внедрения.", "middle": "Внедряет AI в процессы закупок: анализ данных и дашборды, сравнение поставщиков и цен, прогноз потребности, автоматизация рутин. Считает эффект, обучает команду. Повышает производительность функции за счет AI.", "senior": "Формирует AI-стратегию закупок: где искусственный интеллект дает рычаг в аналитике, прогнозе, поиске поставщиков и переговорах. Внедряет продвинутые решения в операционную модель. Создает data- и AI-нативную культуру в снабжении."}, {"name": "Управление командой (снабжение, ВЭД, NPI)", "junior": "Руководит участком или задачей, ставит задачи специалистам по снабжению, контролирует исполнение. Решает конфликты с помощью вышестоящих.", "middle": "Управляет отделом или несколькими специалистами, строит нормы и метрики, проводит еженедельные разборы. Мотивирует и развивает сотрудников, обеспечивает единое понимание целей. Отвечает за результат команды.", "senior": "Строит орг-структуру департамента закупок (снабжение, ВЭД, NPI), отвечает за найм, развитие руководителей и распределение функций. Растит преемников, задает культуру и метрики. Управляет функцией через руководителей, а не вручную."}, {"name": "Кросс-функциональная работа", "junior": "Взаимодействует с производством и складом по текущим вопросам, эскалирует спорные. Работает на задачи своего участка. Обмен информацией по правилам.", "middle": "Выстраивает партнерство с производством, разработкой, качеством, финансами и продажами. Проводит регулярные встречи с внутренними заказчиками для управления Service Level. Согласует общие цели и метрики стыка.", "senior": "Оркеструет закупки внутри цепочки создания ценности: синхронизация с производством, разработкой, качеством и финансами по единым целям. Влияет на продукт и планирование со стороны снабжения (что закупаемо, по какой цене и риску). Становится участником стратегического планирования на уровне C-level."}, {"name": "Этика и комплаенс закупок", "junior": "Соблюдает правила закупок и коммерческую этику в ежедневной работе. Использует утвержденные процедуры выбора поставщиков. Сообщает о нарушениях.", "middle": "Строит прозрачные процедуры выбора поставщиков (тендеры, критерии, конфликт интересов), антикоррупционные стандарты. Обеспечивает честность и прозрачность закупок. Формирует культуру комплаенса в команде.", "senior": "Встраивает этику и комплаенс в модель закупок без ущерба результату: антикоррупция, конфликт интересов, санкционные и договорные требования. Задает стандарты честных закупок, управляет репутационными и правовыми рисками. Делает прозрачность закупок частью доверия к бизнесу."}], "Директор по логистике": [{"name": "Решение проблем", "junior": "Решает типовые операционные проблемы склада и доставки по инструкциям и в рамках заданной задачи. Эскалирует нестандартные ситуации выше. Тушит сбои точечно (недогруз, пересорт, задержка), без разбора первопричины. Отвечает за возврат операции в норму сегодня-завтра.", "middle": "Самостоятельно диагностирует системные сбои в логистике (срывы OTIF, потери, простои, ошибки комплектации) и находит первопричину. Строит решения на уровне процесса, а не симптома. Обучает руководителей участков разбирать проблемы, балансирует скорость и системность.", "senior": "Работает с проблемами уровня всей логистической функции и цепочки поставок. Превращает системные ограничения (зависимость от поставщика, узкие места мощностей, санкционные и валютные риски) в управляемые решения и преимущества. Создает методологию разбора проблем, предвосхищает сбои и берет финансовую ответственность за решения."}, {"name": "Стратегия логистики и цепочки поставок (SCM)", "junior": "Исполняет заданную модель логистики, мыслит горизонтом смены/недели. Не формирует стратегию, работает внутри текущей схемы поставок. Не связывает логистику с бизнес-целями.", "middle": "Строит план развития логистики на 6-12 месяцев: мощности, каналы поставок, транспортные схемы, ресурсы. Оптимизирует цепочку под задачи бизнеса, пересматривает схемы под изменения рынка. Отвечает за то, чтобы логистика поддерживала рост продаж и производства.", "senior": "Формирует стратегию логистики и цепочки поставок на 2-3 года: как система масштабируется, выходит на новые рынки и адаптируется к внешним условиям (санкции, валютный контроль, смена поставщиков). Проектирует архитектуру цепочки от закупки до клиента. Влияет на бизнес-стратегию компании со стороны логистики, связывает ее с экономикой и продуктом."}, {"name": "Складская логистика, WMS и инфраструктура", "junior": "Обеспечивает выполнение складских операций по регламенту (приемка, хранение, комплектация, отгрузка). Работает в имеющейся системе учета и ТСД. Не проектирует логику склада, поддерживает текущую.", "middle": "Оптимизирует складские процессы: адресное хранение, зонирование, маршруты комплектации, загрузку площадей. Внедряет и настраивает WMS и терминалы сбора данных, повышает точность и скорость. Отвечает за производительность и порядок на складе.", "senior": "Проектирует складскую инфраструктуру и технологию под стратегию бизнеса: сеть складов, мощности, автоматизация, собственный склад против 3PL. Архитектурно меняет логику работы склада (внедрение WMS, цифровизация) как проект. Обеспечивает масштабирование склада без потери экономики и управляемости."}, {"name": "Транспортная логистика и доставка", "junior": "Организует отгрузки и рейсы по готовым маршрутам и графикам. Взаимодействует с водителями и перевозчиками по текущим задачам. Не влияет на транспортную схему.", "middle": "Оптимизирует транспортную логистику: маршрутизация, консолидация, выбор перевозчиков, баланс собственного и наемного транспорта, стоимость доставки. Управляет сроками и стоимостью плеча, сокращает пустые пробеги. Отвечает за своевременность доставки.", "senior": "Строит транспортную стратегию: модель доставки под каналы и рынки, тарифная политика, сеть перевозчиков, последняя миля. Оптимизирует транспортные затраты на единицу как систему, вводит новые схемы (мультимодальность, кросс-докинг). Управляет транспортом как источником сервиса и экономии для бизнеса."}, {"name": "ВЭД и международная логистика", "junior": "Работает с готовыми внешнеторговыми поставками, готовит стандартный пакет документов. Не ведет переговоры с зарубежными поставщиками. Опирается на заданные схемы.", "middle": "Управляет международными поставками: работа с зарубежными (в т.ч. китайскими) поставщиками, морские и ЖД контейнеры, транзитные сроки, INCO terms, таможенное оформление. Считает стоимость и время плеча, снижает риски задержек. Отвечает за бесперебойность импортных поставок.", "senior": "Строит стратегию ВЭД и международной логистики: диверсификация поставщиков и маршрутов, адаптация к санкциям, валютному контролю и смене условий. Проектирует устойчивые цепочки Китай-СНГ и другие направления, ведет ключевые контракты с зарубежными партнерами как ЛПР. Превращает международную логистику в конкурентное преимущество и защиту от рисков."}, {"name": "Управление запасами и планирование (S&OP)", "junior": "Ведет учет остатков, сверяет запасы, готовит данные по уровню запасов. Работает по заданным нормативам. Не влияет на политику запасов.", "middle": "Нормализует страховые и текущие запасы, балансирует наличие и стоимость хранения. Планирует запасы под спрос и производство, снижает неликвиды и дефицит. Отвечает за уровень запасов и себестоимость ТМЦ на складах.", "senior": "Строит систему планирования запасов и поставок (S&OP), связывающую продажи, производство и закупки. Управляет запасами как деньгами: оборачиваемость, замороженный капитал, баланс сервиса и стоимости. Влияет на политику запасов и оборотный капитал всей компании."}, {"name": "OTIF и уровень клиентского сервиса", "junior": "Обеспечивает выполнение заказов по стандарту, реагирует на недогрузы и просрочки постфактум. Отслеживает базовые показатели отгрузок. Не управляет уровнем сервиса системно.", "middle": "Управляет OTIF и качеством выполнения заказов: точность, полнота, своевременность. Разбирает причины срывов сервиса и претензий, строит меры по устранению. Достигает и удерживает целевой уровень сервиса (например, OTIF 95%+).", "senior": "Строит систему управления уровнем сервиса как обещанием клиенту: SLA по каналам, баланс сервиса и стоимости, предиктивное управление рисками срыва. Связывает логистический сервис с удержанием клиентов и выручкой. Делает надежность поставок конкурентным преимуществом компании."}, {"name": "Экономика логистики и бюджет", "junior": "Работает в рамках заданного бюджета, готовит фактические данные по затратам. Не планирует и не защищает бюджет. Отвечает за расход в рамках операции.", "middle": "Управляет логистическими затратами на единицу продукции, находит источники оптимизации (маршруты, мощности, подрядчики, запасы). Считает экономику решений, держит бюджет департамента. Балансирует стоимость и уровень сервиса.", "senior": "Планирует и защищает бюджет логистики перед финансовым департаментом, отвечает за экономику направления. Управляет логистической себестоимостью как рычагом маржи бизнеса, принимает решения на стыке затрат, сервиса и запасов. Берет финансовую ответственность за проекты и изменения."}, {"name": "Цифровизация, учет и прослеживаемость ТМЦ", "junior": "Вносит данные в учетную систему (1С/Excel), поддерживает актуальность остатков. Пользуется готовыми инструментами учета. Не проектирует систему прослеживаемости.", "middle": "Внедряет прозрачный цифровой учет движения ТМЦ в реальном времени, адресное хранение, прослеживаемость партий. Настраивает маркировку (например, Честный Знак) и сквозные процессы без срыва отгрузок. Отвечает за достоверность данных о местонахождении любого ТМЦ.", "senior": "Строит стратегию цифровизации логистики: единая система учета и прослеживаемости от закупки до клиента, интеграция WMS/ERP/маркировки. Проектирует прозрачность как основу управленческих решений. Превращает данные логистики в актив и конкурентное преимущество."}, {"name": "Аналитика и дашборды логистики", "junior": "Готовит стандартные отчеты по отгрузкам, загрузке, затратам по шаблонам. Смотрит в исторические данные. Не строит аналитику самостоятельно.", "middle": "Строит дашборды под управление функцией: затраты на единицу, производительность участков, загрузка площадей, OTIF. Анализирует узкие места и точки роста в данных, использует Excel/Power Query/BI. Внедряет решения на основе данных.", "senior": "Формирует аналитическую систему всей логистики, включая предиктивные метрики (риски срыва, спрос, нагрузка). Ставит ТЗ на дашборды и сквозную аналитику, делает данные основой стратегических решений. Влияет на управленческую отчетность компании со стороны логистики."}, {"name": "AI в логистике", "junior": "Пользуется AI-инструментами для простых задач (парсинг данных, генерация формул и отчетов). Экспериментирует под руководством. Простые сценарии без внедрения.", "middle": "Внедряет AI в процессы логистики: прогноз спроса и нагрузки, оптимизация маршрутов и запасов, автоматизация отчетности и учета. Считает эффект, обучает команду. Повышает производительность функции за счет AI.", "senior": "Формирует AI-стратегию логистики: где искусственный интеллект дает рычаг в планировании, прослеживаемости, оптимизации и прогнозе. Внедряет продвинутые решения в операционную модель. Создает data- и AI-нативную культуру в логистике и влияет на технологическую стратегию компании."}, {"name": "Управление командой и линейным персоналом", "junior": "Руководит участком или сменой, контролирует дисциплину и выполнение операций по чек-листу. Ставит задачи линейному персоналу (кладовщики, грузчики, водители). Решает конфликты с помощью вышестоящих.", "middle": "Управляет несколькими участками и руководителями, строит нормы производительности и графики. Мотивирует линейный персонал, снижает текучесть, развивает старших. Обеспечивает результат мультиплощадочной команды.", "senior": "Строит орг-структуру логистики под стратегию: распределение функций, руководители складов и направлений, управление большим линейным штатом (десятки-сотни человек). Развивает руководителей, создает кадровый резерв, выстраивает культуру исполнения и безопасности. Управляет функцией через руководителей, а не вручную."}, {"name": "Управление подрядчиками и 3PL", "junior": "Взаимодействует с подрядчиками по текущим задачам, контролирует выполнение по договору. Не выбирает подрядчиков и не ведет переговоры по условиям.", "middle": "Выбирает и оценивает перевозчиков, склады 3PL, сервисных подрядчиков по цене и качеству. Управляет SLA, контролирует исполнение, оптимизирует пул подрядчиков. Отвечает за баланс собственных и внешних ресурсов.", "senior": "Строит стратегию аутсорсинга логистики: что делать самим, что отдавать 3PL, как управлять сетью подрядчиков на разных рынках. Ведет ключевые контракты как ЛПР, выстраивает партнерские отношения и рычаг переговоров. Управляет подрядчиками как расширением собственной системы без потери контроля и экономики."}, {"name": "Процессы, регламенты и стандартизация", "junior": "Работает по готовым регламентам, контролирует их соблюдение на участке. Не проектирует процессы. Реализует принятые улучшения по инструкции.", "middle": "Описывает и оптимизирует процессы логистики (приемка, хранение, комплектация, отгрузка, документооборот). Стандартизирует работу между участками, внедряет регламенты и чек-листы. Повышает точность и скорость за счет процессов.", "senior": "Проектирует операционную модель логистики: сквозные процессы, стандарты и регламенты для всех площадок и рынков. Внедряет изменения логики работы как проекты (архитектура процессов). Создает стандарты, которые масштабируются и становятся эталоном."}, {"name": "Качество, сохранность и документооборот", "junior": "Контролирует сохранность и качество на участке по чек-листу, оформляет документы по образцу. Реагирует на бой/брак/пересорт постфактум. Не управляет системой качества.", "middle": "Строит контроль качества и сохранности груза на всех этапах хранения и доставки. Снижает бой, брак, пересорт и ошибки документации, добивается нулевых претензий по вине логистики. Настраивает точность комплектации и документального сопровождения.", "senior": "Создает систему качества и сохранности как часть обещания клиенту: стандарты, предупреждение потерь, культура точности. Связывает операционное качество с претензиями, возвратами и удержанием клиентов. Делает сохранность и точность конкурентным преимуществом."}, {"name": "Кросс-функциональная работа", "junior": "Взаимодействует с производством, закупками и продажами по текущим вопросам, эскалирует спорные. Работает на цели своего участка. Обмен информацией по правилам.", "middle": "Выстраивает партнерство с производством (снабжение сырьем и материалами), закупками, продажами и финансами. Согласует общие цели и метрики стыка (наличие, сроки, себестоимость). Ведет совместные проекты (маркировка, планирование поставок).", "senior": "Оркеструет логистику внутри всей цепочки создания ценности: синхронизация с производством, закупками, продажами и финансами по единым целям. Влияет на решения бизнеса со стороны цепочки поставок (что, где и когда производить и хранить). Становится участником стратегического планирования на уровне C-level."}, {"name": "Управление рисками и кризис-менеджмент", "junior": "Реагирует на нештатные ситуации по процедуре, сообщает статус выше. Тушит локальные сбои. Действует по чужому плану реагирования.", "middle": "Заранее видит риски логистики (срыв поставки, простой, зависимость от поставщика) и строит планы на случай. Разруливает нестандартные ситуации самостоятельно (зависший на таможне груз, брак, сбой отгрузки), держит результат в турбулентности. Внедряет превентивные меры.", "senior": "Строит систему управления рисками цепочки поставок и раннего предупреждения: таможня, санкции, валюта, поставщики, мощности. Проводит логистику через крупные кризисы без срыва обязательств перед клиентом, берет право принимать риски. Превращает устойчивость к рискам в конкурентное преимущество."}, {"name": "Охрана труда и промышленная безопасность", "junior": "Соблюдает и контролирует технику безопасности на участке по чек-листу. Проводит базовые инструктажи. Сообщает о нарушениях.", "middle": "Строит систему охраны труда и промышленной безопасности на складе и в транспорте: регламенты, обучение, контроль, снижение травматизма. Обеспечивает безопасную эксплуатацию техники (погрузчики, оборудование, ТСД). Отвечает за культуру безопасности участков.", "senior": "Формирует стандарты охраны труда и промбезопасности для всей логистики, встраивает безопасность в процессы без потери производительности. Управляет рисками травматизма и ответственности как системой. Задает культуру безопасности как норму на всех площадках."}, {"name": "Комплаенс и регуляторные требования (маркировка, таможня)", "junior": "Соблюдает установленные требования (маркировка, документы, таможня) в ежедневной работе. Использует утвержденные схемы. Сообщает о нарушениях по политике.", "middle": "Обеспечивает соответствие логистики регуляторным требованиям: маркировка (Честный Знак), таможенное и товарное сопровождение, требования по хранению и перевозке. Настраивает процессы под новые нормы без срыва поставок. Формирует прозрачность документооборота.", "senior": "Встраивает комплаенс в логистическую модель без ущерба результату: маркировка, таможенные, санкционные и отраслевые требования на всех рынках. Заранее адаптирует систему под изменения законодательства и валютного контроля. Управляет регуляторными рисками как частью устойчивости бизнеса."}], "Руководитель отдела NPI": [{"name": "Решение проблем", "junior": "Решает локальные вопросы по запуску в рамках задачи, эскалирует проблемы. Действует по инструкции. Видит отдельный кейс.", "middle": "Самостоятельно диагностирует проблемы по продукту (отклонение, срыв срока, упаковочный риск) и находит причину. Предлагает корректирующие действия по типовым отклонениям. Балансирует скорость и качество.", "senior": "Работает с проблемами уровня всей NPI-функции: системные узкие места процесса, конфликты сроков и качества, критические риски. Превращает ограничения в решения и правила, предотвращающие повтор. Принимает решения в неопределенности и отвечает за промышленный результат."}, {"name": "Стратегия и архитектура NPI-процесса", "junior": "Работает внутри готового процесса по шаблону. Не проектирует процесс. Выполняет отдельные шаги.", "middle": "Работает по этапам процесса, предлагает улучшения на своем участке. Понимает логику перехода продукта между этапами. Отвечает за корректность прохождения своих продуктов.", "senior": "Проектирует NPI-процесс и функцию, вплоть до создания с нуля: логика от разработки до серии, этапы, роли, зоны ответственности, контур взаимодействия. Задает правила процесса и развивает его. Отвечает за архитектуру системы постановки продуктов."}, {"name": "Управление портфелем запусков", "junior": "Ведет статусы отдельных продуктов по форме. Не управляет портфелем. Сопровождает один продукт под контролем.", "middle": "Самостоятельно ведет несколько SKU в постановке: статусы, сроки, блокеры. Координирует запуск нескольких продуктов. Отвечает за движение своего пула.", "senior": "Управляет портфелем в сотни SKU одновременно: приоритеты, статусы, этапы, риски, ответственные. Следит, чтобы запуски не терялись между подразделениями. Держит скорость и предсказуемость вывода продуктов в серию."}, {"name": "Постановка продукта на серийное производство", "junior": "Выполняет отдельные задачи по подготовке продукта к запуску по инструкции. Не ведет постановку целиком.", "middle": "Ведет постановку продукта от рецептуры и упаковки до пилотной и промышленной партии. Организует подготовку к выработкам. Отвечает за доведение своих продуктов до производства.", "senior": "Обеспечивает переход новых продуктов из разработки в стабильное серийное производство на уровне портфеля: технологичность, качество, документация, готовность линии. Строит процесс постановки без срывов. Отвечает за то, что продукт можно стабильно выпускать серийно."}, {"name": "Технологичность запуска и масштабирование рецептур", "junior": "Собирает вводные по технологии и ограничениям по заданию. Не оценивает технологичность.", "middle": "Оценивает технологичность продукта и производственные ограничения, выявляет типовые риски масштабирования. Готовит технологические вводные. Отвечает за технологичность своих продуктов.", "senior": "Соединяет коммерческую задачу с реальными возможностями производства: можно ли продукт стабильно произвести, где нужны корректировки, какие риски масштабирования. Заранее выявляет критические параметры процесса. Делает технологичность условием выпуска, а не проблемой на линии."}, {"name": "Управление упаковочными решениями и рисками", "junior": "Готовит макеты и вводные по упаковке по образцу. Не оценивает упаковочные риски.", "middle": "Оценивает упаковочные решения на технологичность, выявляет риски на линии. Ведет подготовку макетов и согласование. Отвечает за упаковку своих продуктов.", "senior": "Строит раннюю оценку упаковки до промышленного запуска на уровне портфеля: технологичность, риски на линии, ограничения. Предотвращает упаковочные проблемы до выработки. Делает упаковочную готовность управляемой частью запуска."}, {"name": "Критерии готовности и контрольные точки (stage gates)", "junior": "Заполняет чек-листы готовности по форме. Не определяет критерии. Работает по заданным точкам.", "middle": "Ведет продукты по контрольным точкам, проверяет готовность к переходу на этап. Собирает и проверяет вводные. Отвечает за прохождение своих продуктов через точки.", "senior": "Определяет критерии готовности и правила перехода между этапами NPI. Задает единый подход к статусам и контрольным точкам. Делает переходы между этапами прозрачными и предсказуемыми."}, {"name": "Управление сроками и приоритетами", "junior": "Контролирует отдельные дедлайны по продукту. Не расставляет приоритеты. Работает по плану.", "middle": "Контролирует сроки и блокеры по нескольким продуктам, отрабатывает задержки. Держит план-график своего пула. Отвечает за сроки своих запусков.", "senior": "Расставляет приоритеты между продуктами всего портфеля, управляет сроками этапов и конфликтами загрузки. Балансирует скорость, ресурсы и риски. Держит предсказуемость сроков на уровне функции."}, {"name": "Управление рисками и стоп-решения", "junior": "Фиксирует риски и блокеры по инструкции, эскалирует. Не оценивает критичность.", "middle": "Выявляет типовые риски (упаковка, сырье, линия, рецептура, сроки) заранее. Предлагает решения. Внедряет превентивные меры на своем участке.", "senior": "Строит раннее выявление рисков на этапе подготовки, а не на выработке. Принимает и инициирует стоп-решения при критических рисках. Управляет рисками запуска на уровне всего портфеля."}, {"name": "Тестовые, пилотные и промышленные выработки", "junior": "Помогает в организации выработок по задачам. Фиксирует результаты. Не ведет выработку.", "middle": "Организует подготовку к тестовым и пилотным выработкам, сопровождает их. Анализирует отклонения, предлагает корректировки. Отвечает за выработки своих продуктов.", "senior": "Строит систему прохождения выработок от теста до промышленной партии: критерии, анализ отклонений, переход из пилота в серию с первого раза. Снижает отклонения и потери на запуске. Делает выработки предсказуемым этапом."}, {"name": "Технологическая документация", "junior": "Оформляет и собирает документы по образцу. Поддерживает актуальность по инструкции. Не отвечает за полноту.", "middle": "Готовит и проверяет технологическую документацию под продукт, следит за актуальностью. Работает с эталонами и требованиями. Отвечает за документацию своих продуктов.", "senior": "Задает требования к технологической документации и стандарт ее подготовки. Обеспечивает полноту и актуальность документации портфеля. Делает документацию основой воспроизводимости производства."}, {"name": "Качество внедрения и готовность производства", "junior": "Собирает данные по качеству и отклонениям по инструкции. Не управляет качеством внедрения.", "middle": "Контролирует соответствие продукта эталону и требованиям, работает с отклонениями и корректирующими действиями. Готовит вводные для производства. Отвечает за качество внедрения своих продуктов.", "senior": "Обеспечивает, что производство понимает технологию и может стабильно воспроизвести результат. Управляет качеством внедрения и стабильностью промышленной партии на уровне портфеля. Делает воспроизводимость результата стандартом."}, {"name": "Межфункциональная координация без прямого подчинения", "junior": "Передает информацию между участниками процесса. Работает на свой участок. Эскалирует спорное.", "middle": "Согласует действия со смежными подразделениями (разработка, закупки, производство, качество). Ведет межфункциональные встречи по продуктам. Отвечает за координацию своих запусков.", "senior": "Оркеструет запуск между разработкой, закупками, производством, качеством и коммерцией под единый результат. Влияет на смежные подразделения без прямого административного подчинения. Разрешает конфликты интересов на уровне решений."}, {"name": "Аналитика и построение метрик (time-to-market)", "junior": "Собирает вводные и готовит простые отчеты по форме. Не строит метрики. Смотрит на факт.", "middle": "Готовит отчеты по статусу продуктов, отслеживает сроки и отклонения. Анализирует типовые проблемы. Использует данные для корректировок.", "senior": "Строит систему метрик NPI: скорость постановки, процент запусков в срок, длительность этапов, отклонения, причины переносов. Видит системные узкие места по данным. Делает процесс измеримым и управляемым через метрики."}, {"name": "AI и цифровизация процесса", "junior": "Пользуется Excel и Bitrix по инструкции, вносит данные. Не автоматизирует. Простые задачи.", "middle": "Ведет портфель и статусы в Excel/Bitrix, использует AI для анализа отклонений, документов и отчетов. Оптимизирует рутину. Повышает прозрачность на своем участке.", "senior": "Развивает цифровизацию NPI: переход от ручного ведения к метрикам, дашбордам и автоматизации, AI для анализа и документации. Строит систему, дающую прозрачность и предсказуемость. Делает процесс data-driven."}, {"name": "Управление командой", "junior": "Выполняет задачи в команде, ведет свой участок. Не управляет командой.", "middle": "Ставит задачи специалистам, распределяет отдельные участки, контролирует исполнение. Поддерживает команду. Отвечает за результат своего участка.", "senior": "Строит команду NPI (верстальщик упаковки, NPI-менеджер, специалист по запускам), распределяет нагрузку и зоны ответственности. Отвечает за структуру и найм. Управляет функцией через людей."}, {"name": "Развитие команды и компетенций", "junior": "Развивает свои навыки, учится у руководителя. Не развивает других.", "middle": "Развивает специалистов на своем участке, обучает по процессу. Дает обратную связь. Растит исполнителей.", "senior": "Развивает компетенции команды NPI: обучение, экспертиза, зоны роста. Растит специалистов, способных вести продукты самостоятельно. Повышает эффективность функции через людей."}, {"name": "Процессы, стандартизация и автоматизация", "junior": "Работает по чек-листам и шаблонам, поддерживает их. Не проектирует процессы.", "middle": "Описывает и унифицирует этапы запуска, сокращает ручные согласования на своем участке. Ведет чек-листы и стандарты. Повышает управляемость.", "senior": "Стандартизирует и автоматизирует NPI-процесс: единые этапы, критерии, статусы, снижение зависимости от устных договоренностей. Делает процесс прозрачным и воспроизводимым. Создает операционную модель, которая масштабируется."}, {"name": "Управление конфликтами и решения в неопределенности", "junior": "Действует по инструкции, эскалирует проблемы руководителю. Не принимает решения в неопределенности.", "middle": "Принимает решения по стандартным ситуациям в своей зоне. Согласует спорное. Предлагает варианты при отклонениях.", "senior": "Принимает решения при высокой неопределенности и ограниченных ресурсах, управляет конфликтами сроков, качества, производства, закупок и коммерческих ожиданий. Несет ответственность за конечный промышленный результат, а не за отдельные задачи. Может создать функцию и систему управления NPI с нуля."}], "Руководитель отдела RnD": [{"name": "Решение проблем", "junior": "Решает локальные вопросы по разработке и тестам в рамках задачи. Эскалирует нестандартное, сверяется с руководителем. Действует по инструкции, видит отдельный кейс.", "middle": "Самостоятельно диагностирует проблемы в разработке (срыв сроков, нестабильность рецептуры, брак теста) и находит первопричину. Строит решения на уровне процесса. Балансирует скорость и качество.", "senior": "Работает с проблемами уровня всей R&D-функции: расфокус портфеля, узкие места мощностей, регуляторные и ресурсные ограничения. Превращает системные ограничения в решения и механизмы, предотвращающие повтор. Принимает решения в неопределенности и берет ответственность за результат отдела."}, {"name": "Стратегия R&D и развитие портфеля", "junior": "Работает в рамках заданных приоритетов. Не формирует стратегию, видит отдельные разработки, а не портфель.", "middle": "Планирует разработки по направлению или линейке, расставляет приоритеты задач. Связывает разработку с задачами бренда. Отвечает за результат своего пула.", "senior": "Формирует стратегию R&D и сбалансированный портфель разработки под цели бизнеса: какие продукты, линейки и бренды, в каком приоритете и с какой доказательной базой. Держит баланс новизны, сроков, ресурсов и регуляторики. Влияет на продуктовую стратегию компании со стороны R&D."}, {"name": "Управление портфелем разработки (приоритеты, фокус, сроки)", "junior": "Ведет отдельные разработки как задачи, отслеживает статусы. Не управляет портфелем. Работает по чек-листу.", "middle": "Управляет пулом разработок: сроки, статусы, проблемные точки. Держит фокус в рамках направления, отрабатывает изменения ТЗ. Отвечает за движение своих проектов.", "senior": "Управляет портфелем в сотни разработок одновременно: приоритеты, фокус, распределение между брендами и линейками. Защищает разработку от расфокуса при потоке новых брифов и смене приоритетов. Держит скорость и предсказуемость вывода продуктов."}, {"name": "Разработка рецептур и формул", "junior": "Выполняет отдельные этапы разработки по инструкции (проварка образцов, ввод компонентов). Работает под контролем химика или руководителя.", "middle": "Разрабатывает рецептуры под бриф: органолептика, INCI, отдушки, активы, стабильность. Доводит формулу до согласования. Отвечает за качество рецептуры своих продуктов.", "senior": "Задает подход к разработке рецептур на уровне отдела: стандарты, экспертиза, сложные и флагманские формулы. Обеспечивает конкурентоспособность и воспроизводимость рецептур. Держит планку качества массы на масштабе портфеля."}, {"name": "Тестирование и оценка продукта", "junior": "Готовит образцы и материалы для тестов, собирает обратную связь по инструкции. Не проектирует тестирование.", "middle": "Организует и проводит тестирование: стабильность, фокус-группы, потребительские и слепые тесты, опросники. Анализирует результаты, дает выводы для доработки. Отвечает за качество оценки своих продуктов.", "senior": "Строит систему тестирования и разрабатывает новые методологии: как доказательно оценивать продукт и превосходство над конкурентами в слепых тестах. Увеличивает доказательную базу портфеля. Делает тестирование источником уверенности в продукте."}, {"name": "Сертификация и регуляторное соответствие", "junior": "Готовит документы и макеты по сертификации по образцу (вычитка этикеток, внесение в базы). Работает по инструкции.", "middle": "Ведет сертификацию продуктов: ДС/СГР, CPNP/CPRE, сертификаты свободной торговли, соответствие требованиям. Сопровождает документооборот. Отвечает за легитимность своих продуктов.", "senior": "Обеспечивает регуляторное соответствие портфеля требованиям законодательства разных стран производства и реализации. Строит систему сертификации без задержек запуска. Управляет регуляторными рисками как частью устойчивости бизнеса."}, {"name": "Оптимизация рецептур и себестоимости", "junior": "Выполняет отдельные задачи по замене компонентов и доработке по инструкции. Не ведет оптимизацию.", "middle": "Оптимизирует рецептуры: замена компонентов, себестоимость, доработка по рекламациям, без потери качества. Считает эффект. Отвечает за оптимизацию своих продуктов.", "senior": "Строит направление оптимизации как систему: снижение себестоимости, замена компонентов, устойчивость к дефициту сырья на уровне портфеля. Связывает оптимизацию с маржой и надежностью выпуска. Делает оптимизацию источником экономики и устойчивости."}, {"name": "Вывод продукта в серийное производство", "junior": "Помогает в подготовке продукта к производству по задачам. Не ведет вывод в серию.", "middle": "Доводит продукт до серийного производства: перенос рецептуры, технологичность, стабильный выпуск. Согласует с производством. Отвечает за готовность своих продуктов к серии.", "senior": "Обеспечивает своевременный вывод новых продуктов в производство на уровне портфеля: легитимные, безопасные, подтвержденные, готовые к стабильному выпуску. Строит процесс постановки на производство без срывов. Отвечает за регулярное пополнение производимого портфеля."}, {"name": "Управление сроками и рисками разработки", "junior": "Отслеживает сроки своих задач, сообщает о рисках. Тушит локально. Действует по плану руководителя.", "middle": "Видит риски разработки (поставка компонентов, смена ТЗ, срыв тестов) и управляет ими. Прогнозирует сроки, отрабатывает проблемные кейсы. Внедряет превентивные меры.", "senior": "Строит управление рисками R&D и раннего предупреждения: срывы сроков, поставки, регуляторика, расфокус. Прогнозирует риски и предлагает решения до возникновения проблем. Предотвращает задержки запуска на уровне всего портфеля."}, {"name": "Доказательная база и клеймы", "junior": "Собирает материалы и данные для подтверждения клеймов по инструкции. Не ведет проект доказательной базы.", "middle": "Ведет проекты подтверждения клеймов: пул образцов, экспертные и потребительские тесты, документирование, согласование. Отвечает за обоснованность клейма продукта.", "senior": "Строит доказательную базу портфеля как актив: экспертные исследования, клеймы (например, участие врачей в разработке), подтверждение эффективности. Связывает доказательность с позиционированием и доверием к бренду. Делает доказательную базу конкурентным преимуществом."}, {"name": "Управление направлениями как единой системой", "junior": "Работает внутри одного направления по задачам. Не видит систему целиком. Выполняет свою часть.", "middle": "Управляет одним направлением (разработка, тестирование, сертификация или оптимизация) автономно. Согласует работу со смежными. Отвечает за результат направления.", "senior": "Управляет четырьмя направлениями (разработка, тестирование, сертификация, оптимизация) как единой системой. Синхронизирует их, чтобы на выходе был качественный продукт. Отвечает за то, что R&D работает как система, а не набор функций."}, {"name": "Data-driven решения и аналитика", "junior": "Собирает и консолидирует метрики отдела по шаблону. Готовит информацию для решений. Не строит аналитику.", "middle": "Анализирует метрики разработки, тестирования и сертификации, находит узкие места. Готовит обоснования решений на данных. Внедряет улучшения по данным.", "senior": "Строит систему метрик и аналитики R&D, принимает технические и управленческие решения на данных, а не на интуиции. Оценивает вклад проектов в конечный результат. Делает данные основой приоритетов и стратегии."}, {"name": "Исследования, тренды и продуктовые инновации", "junior": "Собирает информацию по трендам и ингредиентам по заданию. Не ведет исследования.", "middle": "Отслеживает тренды рынка и новые ингредиенты, приносит их в разработку. Проверяет применимость в рецептурах. Отвечает за актуальность своих продуктов.", "senior": "Развивает исследовательскую функцию R&D: быстрая реакция на тренды, новые ингредиенты и технологии, внедрение в рецептуры. Строит исследовательский задел портфеля. Делает скорость реакции на тренды конкурентным преимуществом."}, {"name": "Кросс-функциональная работа (производство, маркетинг, PR, коммерция)", "junior": "Взаимодействует со смежными по задачам разработки. Работает на свой участок. Эскалирует спорное.", "middle": "Выстраивает работу с производством, брендами, маркетингом и снабжением по проектам. Согласует брифы, сроки, приоритеты. Ведет совместные разработки.", "senior": "Оркеструет R&D внутри всей компании: связка с производством, маркетингом, PR, коммерцией и руководством под единый результат. Отрабатывает смену приоритетов брендов, защищает фокус и ресурсы разработки. Влияет на продуктовую стратегию со стороны R&D."}, {"name": "Управление командой", "junior": "Выполняет задачи в команде, ведет свой участок. Не управляет командой.", "middle": "Управляет группой специалистов направления, ставит задачи, распределяет загрузку, проводит планерки. Мотивирует и поддерживает. Отвечает за результат группы.", "senior": "Строит и ведет мультидисциплинарную команду R&D (химики, лаборанты, технолог, сертификация, тестирование) через руководителей. Отвечает за структуру, распределение загрузки, найм на ключевые позиции. Управляет функцией через людей, а не вручную."}, {"name": "Развитие команды и компетенций", "junior": "Развивает свои навыки, учится у старших. Не развивает других.", "middle": "Развивает специалистов направления, обучает, дает обратную связь. Растит экспертизу в своей области. Готовит сильных исполнителей.", "senior": "Строит систему развития компетенций отдела: обучение, экспертиза, кадровый резерв, развитие заместителя и старших. Взращивает команду и повышает эффективность функции. Становится источником сильных R&D-специалистов."}, {"name": "Процессы, автоматизация и стандартизация", "junior": "Работает по чек-листам и инструкциям, поддерживает их актуальность. Не проектирует процессы.", "middle": "Описывает и оптимизирует процессы разработки и тестирования, ведет чек-листы и стандарты. Повышает скорость и точность. Отвечает за управляемость направления.", "senior": "Строит операционную модель R&D: стандартизирует и автоматизирует процессы всех направлений, убирает узкие места. Внедряет автоматизацию и оптимизацию как постоянную практику. Делает результат воспроизводимым и масштабируемым."}, {"name": "AI в R&D", "junior": "Пользуется AI для простых задач (анализ тестов, документы, отчеты, сбор информации). Экспериментирует под руководством.", "middle": "Внедряет AI в процессы R&D: анализ тестов и данных, проработка документов, отчеты, ускорение рутин. Считает пользу, обучает команду.", "senior": "Формирует подход к AI в R&D: где ИИ дает рычаг в анализе, документообороте, исследованиях и оценке. Внедряет продвинутые решения в работу отдела. Создает data- и AI-нативную культуру R&D."}, {"name": "Делегирование и решения в неопределенности", "junior": "Действует по указанию и инструкциям с регулярной сверкой. Управляет точечно по задачам. Прогнозирует риски и анализирует кейсы только с руководителем.", "middle": "Ведет проекты и направление самостоятельно, делегирует задачи. Принимает решения в своей зоне. Прогнозирует риски и предлагает решения.", "senior": "Качественно делегирует процессы и зоны ответственности, принимает решения о запуске, остановке и изменении проектов в условиях высокой неопределенности и ограниченных ресурсов. Координирует всех участников, отвечает за конечный результат, а не за отдельные задачи. Отвечает за эффективность всей системы и стратегию ее развития."}], "Руководитель трейд-маркетинга": [{"name": "Решение проблем", "junior": "Решает локальные вопросы по промо и проектам в рамках задачи. Эскалирует нестандартное. Действует по готовым решениям, видит отдельный кейс.", "middle": "Самостоятельно диагностирует проблемы в своем канале или активности (провал промо, перерасход, слабая представленность) и находит первопричину. Строит решения на уровне процесса. Балансирует скорость и результат.", "senior": "Работает с критическими вопросами уровня всей функции: экономика промо, конфликт объема и маржи, убытки. Превращает системные ограничения в управляемые решения. Создает методологию и принимает решения на основе стратегии и прогноза."}, {"name": "Стратегия трейд-маркетинга", "junior": "Исполняет заданный план активностей, мыслит горизонтом акции. Не формирует стратегию, видит отдельные каналы, а не систему.", "middle": "Строит план трейд-маркетинга по каналу или клиенту на квартал: активности, бюджет, механики. Оптимизирует под прирост и эффективность. Пересматривает под изменения рынка.", "senior": "Формирует стратегию трейд-маркетинга компании: как система связывает каналы, клиентов, ассортимент и бюджет под цели бизнеса. Видит связь между всеми каналами, функциями и рынком, быстро корректирует. Влияет на коммерческую стратегию со стороны трейд-маркетинга."}, {"name": "Промо-планирование и оценка эффективности (ROI/ROMI/uplift)", "junior": "Готовит и подводит итоги промо по шаблону. Считает базовые показатели. Не оценивает эффективность системно.", "middle": "Планирует промо и оценивает эффективность (pre/post, ROI, ROMI, uplift). Считает экономику активности, отсекает неэффективное. Отвечает за результат промо по своему направлению.", "senior": "Строит систему планирования и оценки промо: единый календарь, критерии, решение launch/no-launch на основе прогноза ROI и влияния на маржу. Управляет эффективностью промо всей компании. Делает промо предсказуемым и окупаемым."}, {"name": "Промо-механики: тестирование и тиражирование", "junior": "Реализует заданные механики по клиентам. Собирает результаты. Не тестирует и не ранжирует.", "middle": "Тестирует промо-механики по клиентам и каналам, ранжирует по приросту, ROI и ROMI. Отбирает лучшие. Отвечает за приток рабочих механик.", "senior": "Строит систему тестирования и тиражирования механик: библиотека эффективных механик, критерии, масштабирование на всю представленность. Приоритизирует под бизнес-цели. Делает тестирование двигателем роста эффективности."}, {"name": "Управление трейд-бюджетом и трейд-инвестициями", "junior": "Работает в рамках заданного бюджета активности. Отслеживает расход. Не распределяет бюджет.", "middle": "Управляет бюджетом активностей и трейд-инвестициями по каналу, держит расход в рамках. Ищет соинвест клиентов, повышает эффективность вложений. Балансирует затраты и результат.", "senior": "Распределяет годовой трейд-бюджет между каналами, клиентами и активностями под стратегию. Управляет трейд-инвестициями как рычагом продаж и маржи, привлекает соинвест клиентов. Отвечает за экономику трейд-затрат."}, {"name": "Категорийный менеджмент и управление ассортиментом", "junior": "Работает с заданным ассортиментом и категориями. Не анализирует и не управляет категорией. Выполняет по плану.", "middle": "Управляет ассортиментом и категорией по каналу: приоритеты SKU, промо-микс, представленность. Анализирует продажи категории, находит точки роста. Отвечает за результат категории.", "senior": "Строит категорийную стратегию: роль категорий и SKU в каналах, ассортиментная и промо-политика под маржу и оборот. Связывает ассортимент с промо, полкой и ценой. Делает категорийное управление источником роста."}, {"name": "Мерчандайзинг и управление полкой (OOS, представленность)", "junior": "Контролирует представленность и выкладку по стандартам. Собирает данные по полке. Не управляет системой мерчандайзинга.", "middle": "Управляет мерчандайзингом по каналу: стандарты полки, представленность, контроль OOS. Запускает и ведет мерчандайзинг в точках. Отвечает за качество представленности и доступность на полке.", "senior": "Строит систему мерчандайзинга и управления полкой на масштабе: стандарты, контроль OOS, связь представленности с продажами. Доказывает вклад мерчандайзинга в результат данными. Делает представленность управляемым драйвером продаж."}, {"name": "Переговоры с сетями и дистрибьюторами (JBP)", "junior": "Взаимодействует с сетями и дистрибьюторами по текущим активностям. Не ведет переговоры по условиям. Работает по заданным договоренностям.", "middle": "Ведет переговоры по промо-условиям и активностям с сетями и дистрибьюторами. Согласует планы активностей, добивается условий. Отвечает за договоренности по своему направлению.", "senior": "Ведет ключевые переговоры с сетями как ЛПР: коммерческие условия, JBP (совместные бизнес-планы), стратегические договоренности. Конструирует условия, влияющие на объем и маржу. Задает стандарты работы с сетями для команды."}, {"name": "Промо-ценообразование и скидочная политика", "junior": "Применяет заданные скидки и промо-цены. Не рассчитывает размер скидки. Работает по прайсу.", "middle": "Рассчитывает эффективный размер скидки на основе статистики и маржинальности. Строит скидочную механику по клиентам. Балансирует привлекательность промо и экономику.", "senior": "Формирует промо-ценовую и скидочную политику компании: матрица скидок по каналам и объемам, защита маржи при промо. Держит баланс объема, цены и маржи на уровне функции. Делает скидочную политику инструментом экономики, а не потерь."}, {"name": "Связь с P&L и управление маржинальностью", "junior": "Смотрит на объем и выполнение плана. Не связывает активности с маржой и P&L. Отвечает за расход в задаче.", "middle": "Учитывает маржинальность в промо и активностях, а не только объем. Считает вклад активности в прибыль. Отсекает объемные, но убыточные механики.", "senior": "Управляет трейд-маркетингом через связь с P&L компании: маржа, а не только объем, вклад в прибыль. Разрешает конфликт объема и маржи (продажи vs маржа) на уровне решений. Отвечает за финансовые показатели функции."}, {"name": "Аналитика продаж и работа с данными", "junior": "Собирает данные по продажам, промо и конкурентам по шаблону. Не строит аналитику. Смотрит на факт.", "middle": "Анализирует продажи и промо на данных (продвинутый Excel, большие данные, визуализация). Находит закономерности и точки роста. Внедряет решения на данных.", "senior": "Строит аналитическую систему трейд-маркетинга: метрики, дашборды, быстрое чтение данных для решений. Мыслит через цифры, видит закономерности на уровне всей системы продаж. Делает данные основой стратегии и бюджета."}, {"name": "Сценарное моделирование «что-если» и гипотезы", "junior": "Выполняет расчеты по заданным сценариям. Не строит сценарии. Работает по модели.", "middle": "Строит сценарии «что-если» по промо и активностям, проверяет гипотезы. Оценивает варианты до запуска. Отвечает за обоснованность решений.", "senior": "Строит сценарное моделирование как систему принятия решений: что-если по объему, марже, бюджету, отклик на изменения рынка. Проверяет гипотезы до вложений. Делает решения просчитанными, а не интуитивными."}, {"name": "Прогнозирование продаж и бюджетов", "junior": "Готовит данные для прогноза по шаблону. Не прогнозирует. Работает на коротком горизонте.", "middle": "Прогнозирует продажи и бюджет по промо и каналу с учетом сезонности и истории. Дает оценки под планирование. Отвечает за точность в своем направлении.", "senior": "Прогнозирует продажи, бюджеты и рост клиентов на длительный срок с учетом внешних и внутренних факторов на реальных данных. Строит планирование функции на прогнозе. Обеспечивает предсказуемость результата."}, {"name": "Мониторинг рынка и конкурентов", "junior": "Собирает данные по конкурентам и рынку по заданию. Не анализирует системно. Передает как есть.", "middle": "Ведет мониторинг рынка и конкурентов: цены, промо, активности, тренды. Использует выводы в своих активностях. Отвечает за актуальную картину по направлению.", "senior": "Строит систему мониторинга рынка и конкурентов, встраивает выводы в стратегию и решения. Быстро реагирует на изменения рынка корректировкой активностей. Делает рыночную разведку преимуществом функции."}, {"name": "Программы лояльности и активация каналов", "junior": "Реализует заданные программы и пакеты по каналам. Не проектирует программы. Работает по инструкции.", "middle": "Разрабатывает программы лояльности и промо-пакеты для каналов (сети, дистрибьюторы, спец-каналы) на основе конкурентного анализа и экономики. Тестирует, дорабатывает. Отвечает за результат программы.", "senior": "Строит систему активации каналов и лояльности под бизнес-цели: программы для разных каналов, экономика, тиражирование на всю представленность. Связывает лояльность с объемом и маржой. Делает активацию каналов драйвером роста."}, {"name": "AI в трейд-маркетинге", "junior": "Пользуется AI для простых задач (расчеты, обработка данных, отчеты). Экспериментирует под руководством.", "middle": "Внедряет AI в трейд-маркетинг: анализ промо и продаж, сценарии, автоматизация расчетов и отчетов. Считает пользу, обучает команду.", "senior": "Формирует подход к AI в функции: где ИИ дает рычаг в аналитике, прогнозе, сценариях и оценке промо. Внедряет продвинутые решения. Создает data- и AI-нативную культуру трейд-маркетинга."}, {"name": "Управление командой", "junior": "Выполняет задачи в команде, ведет свой участок. Не управляет командой.", "middle": "Управляет трейд-маркетологами по направлению, ставит задачи и метрики. Мотивирует и развивает. Отвечает за результат команды.", "senior": "Строит команду трейд-маркетинга, отвечает за найм, развитие, приоритизацию и разрешение конфликтов интересов. Растит сильных, задает метрики и культуру. Управляет функцией через людей."}, {"name": "Процессы, регламенты и стандартизация", "junior": "Работает по готовым процессам и шаблонам. Не проектирует процессы. Выполняет по регламенту.", "middle": "Описывает и оптимизирует процессы промо и активностей, вводит стандарты и шаблоны. Повышает скорость и точность. Отвечает за управляемость направления.", "senior": "Строит систему работы отдела: регламентирует и стандартизирует процессы трейд-маркетинга, повышает эффективность функции на постоянной основе. Делает результат воспроизводимым, а не героическим. Создает операционную модель, которая масштабируется."}, {"name": "Кросс-функциональная работа", "junior": "Взаимодействует с продажами и смежными по задачам. Работает на свой участок. Эскалирует спорное.", "middle": "Выстраивает работу с продажами, маркетингом, категорийным менеджментом, финансами и логистикой. Согласует цели и активности. Ведет совместные проекты.", "senior": "Оркеструет трейд-маркетинг внутри коммерции: связка с продажами, маркетингом, финансами и цепочкой поставок под единый результат. Разрешает конфликт интересов (объем vs маржа) на уровне решений. Влияет на коммерческую стратегию и защищает бюджет перед руководством."}], "Креативный директор": [{"name": "Решение проблем", "junior": "Решает локальные задачи по контенту и съемкам в рамках процесса. Эскалирует нестандартное. Действует по готовым решениям.", "middle": "Самостоятельно диагностирует проблемы в своем направлении (качество, сроки, бюджет) и находит первопричину. Строит решения на уровне процесса, а не симптома. Балансирует скорость и качество.", "senior": "Работает с проблемами уровня всей креативной функции: система, экономика, эффективность. Превращает ограничения (качество на масштабе, зависимость от подрядчиков) в управляемые решения. Создает методологию и принимает решения в неопределенности."}, {"name": "Креативная стратегия и видение", "junior": "Реализует контент по готовому брифу и стратегии. Не формирует креативное направление. Следует заданному видению.", "middle": "Переводит задачи бренда и запуска в креативные решения по своему направлению. Формирует видение конкретного проекта или линейки. Отвечает за то, чтобы контент решал задачу.", "senior": "Формирует креативную стратегию и видение всей функции: как контент реализует стратегию бренда и бизнес-цели. Задает направление дизайна, продакшена и контента под запуски. Влияет на позиционирование и стратегию бренда со стороны креатива."}, {"name": "Управление креативной системой (дизайн + продакшн + контент)", "junior": "Работает внутри одного направления по задачам. Не видит систему целиком. Выполняет свою часть.", "middle": "Управляет одним направлением (дизайн, продакшн или контент) автономно. Согласует работу со смежными. Отвечает за результат направления.", "senior": "Управляет дизайном, продакшеном и контентом маркетплейсов как единой системой. Синхронизирует направления, чтобы они работали как одно целое. Отвечает за то, что креативная система управляема и дает согласованный результат."}, {"name": "Арт-дирекшн и визуальное качество", "junior": "Готовит материалы и макеты по ТЗ и стандартам. Не задает планку качества. Работает по референсам.", "middle": "Ведет арт-дирекшн проектов, держит визуальное качество и стиль. Ревьюит работу дизайнеров, дает направление. Отвечает за качество контента направления.", "senior": "Задает стандарты визуального качества и арт-дирекшн всей функции. Держит планку высокого уровня и единый стиль на масштабе. Делает качество контента конкурентным преимуществом бренда."}, {"name": "Продакшн-менеджмент и организация съемок", "junior": "Организует отдельные этапы съемок по плану. Готовит материалы, сопровождает продакшн. Не владеет проектом.", "middle": "Ведет продакшн-проекты: бриф, планирование, съемка, результат. Становится владельцем съемок, привлекает экспертов. Отвечает за качество и сроки продакшена.", "senior": "Строит продакшн как систему: форматы, процессы, качество, экономика. Владеет ключевыми съемками уровня имиджевого контента. Выводит продакшн на стабильно высокое качество и масштаб."}, {"name": "Управление подрядчиками и продакшн-базой", "junior": "Взаимодействует с подрядчиками по текущим задачам. Не выбирает и не оценивает их. Работает с заданным пулом.", "middle": "Отбирает и оценивает подрядчиков по качеству и стоимости, ведет пул. Тестирует новых, находит выгодные варианты (в т.ч. по географии). Отвечает за качество работы подрядчиков.", "senior": "Строит сильную подрядческую базу как актив: постоянное тестирование, отбор и ротация вместо зависимости от одного продакшена. Оптимизирует качество и бюджет через управление пулом. Делает базу подрядчиков источником качества и гибкости."}, {"name": "Контент для маркетплейсов и e-commerce", "junior": "Готовит контент для маркетплейсов по ТЗ и шаблону. Не проектирует воронку. Работает по заданному формату.", "middle": "Разрабатывает контент и воронки для маркетплейсов: карточки, имиджевый контент, дизайн этикеток. Адаптирует под площадки и продукты. Отвечает за готовность контента к запуску.", "senior": "Строит систему контента для маркетплейсов и e-commerce под бизнес-цели: воронки, форматы, стандарты, связка с продажами. Масштабирует тест-запуски новинок без потери качества. Делает контент маркетплейсов управляемым каналом результата."}, {"name": "Бренд-консистентность и позиционирование в контенте", "junior": "Соблюдает бренд-требования в контенте по гайдам. Не отвечает за позиционирование. Работает по стандартам.", "middle": "Обеспечивает соответствие контента бренду и позиционированию в своем направлении. Держит единый стиль и tone of voice. Отвечает за бренд-фит контента.", "senior": "Задает, как бренд и позиционирование живут в контенте на всех направлениях и запусках. Держит консистентность на масштабе. Делает контент носителем стратегии и позиционирования бренда."}, {"name": "Приоритизация и планирование запусков", "junior": "Ведет задачи по плану запусков. Не приоритизирует. Работает по заданному графику.", "middle": "Планирует запуски по своему направлению, расставляет приоритеты задач. Управляет загрузкой и сроками. Отвечает за готовность направления к запускам.", "senior": "Приоритизирует запуски всей креативной функции: что, когда и в каком объеме делает система. Распределяет ресурсы между направлениями под приоритеты бизнеса. Держит поток запусков управляемым."}, {"name": "Управление бюджетами и ресурсами", "junior": "Работает в рамках заданного бюджета проекта. Не планирует и не распределяет ресурсы. Отвечает за расход в своей задаче.", "middle": "Ведет бюджет продакшена по проектам, оптимизирует затраты. Распределяет ресурсы направления под задачи. Балансирует качество и стоимость.", "senior": "Управляет бюджетами и ресурсами всей креативной функции, распределяет их между направлениями. Оптимизирует стоимость контента без потери качества (форматы, подрядчики, география). Отвечает за экономику креатива."}, {"name": "Гипотезный подход к контенту", "junior": "Выполняет контент по заданным гипотезам. Не формирует гипотезы. Работает по брифу.", "middle": "Строит и проверяет гипотезы по контенту, ведет тест-запуски. Анализирует, что сработало. Отвечает за приток рабочих решений.", "senior": "Строит гипотезный подход как систему: тест-запуски, критерии, масштабирование удачных решений на функцию. Приоритизирует гипотезы под бизнес-цели. Делает эксперименты двигателем роста эффективности контента."}, {"name": "Оценка эффективности контента (data-driven креатив)", "junior": "Собирает базовые данные по контенту. Не оценивает эффективность. Смотрит на факт выпуска.", "middle": "Оценивает результаты контента по метрикам, делает выводы для следующих проектов. Связывает контент с показателями. Внедряет улучшения по данным.", "senior": "Внедряет систему оценки эффективности контента для всей функции: метрики, бенчмарки, обратная связь в следующие запуски. Связывает креатив с бизнес-результатом. Делает креативную функцию data-driven, а не оценочной на вкус."}, {"name": "Креативные процессы, стандарты и масштабирование", "junior": "Работает по готовым процессам и стандартам. Не проектирует процессы. Выполняет по регламенту.", "middle": "Описывает и оптимизирует процессы своего направления, вводит стандарты. Повышает качество и скорость через процессы. Отвечает за управляемость направления.", "senior": "Проектирует креативные процессы всей функции: как держать качество и объем на масштабе, убирать лишние роли, перераспределять ресурсы. Строит систему, которая масштабируется без потери качества и управляемости. Делает процессы основой стабильного результата."}, {"name": "Развитие руководителей направлений (leader-of-leaders)", "junior": "Развивает свои навыки, помогает коллегам точечно. Не развивает руководителей.", "middle": "Развивает специалистов и старших в своем направлении. Делегирует, дает обратную связь. Растит сильных исполнителей.", "senior": "Развивает руководителей направлений (арт-директор, креативный продюсер, контент-менеджер) до автономности. Строит так, чтобы направления работали и принимали решения без него. Становится источником сильных креативных лидеров (leader-of-leaders)."}, {"name": "Управление командой", "junior": "Ставит задачи в рамках проекта, контролирует исполнение. Решает конфликты с помощью руководителя.", "middle": "Управляет командой направления, строит загрузку и приоритеты. Мотивирует и развивает, обеспечивает результат. Отвечает за команду направления.", "senior": "Строит и ведет мультидисциплинарную креативную команду (дизайн, продакшн, контент) через руководителей. Отвечает за структуру, найм, культуру и метрики. Управляет функцией через людей, а не вручную."}, {"name": "AI в креативе и продакшене", "junior": "Пользуется AI для простых задач (тексты, идеи, оформление ТЗ). Экспериментирует под руководством.", "middle": "Внедряет AI в креативные процессы: генерация гипотез и идей, структурирование информации, ускорение ТЗ и анализа. Считает пользу, обучает команду.", "senior": "Формирует подход к AI в креативной функции: где ИИ дает рычаг в идеях, продакшене, аналитике и масштабе. Внедряет продвинутые решения в процессы. Создает AI-нативную культуру креатива."}, {"name": "Кросс-функциональная работа", "junior": "Взаимодействует со смежными по задачам проекта. Работает на свою часть. Эскалирует спорное.", "middle": "Выстраивает работу со стратегическим маркетингом, брендом, digital и e-commerce по проектам. Согласует цели и брифы. Ведет совместные запуски.", "senior": "Оркеструет креатив внутри всей маркетинговой машины: связка со стратегией, брендом, digital и e-commerce. Влияет на стратегию запусков со стороны креатива. Защищает креативные решения и ресурсы перед руководством."}, {"name": "Управление рисками и решения в неопределенности", "junior": "Сообщает о проблемах в проекте. Тушит локально. Действует по чужому плану.", "middle": "Видит риски проекта (сроки, качество, бюджет) и управляет ими. Принимает решения в рамках направления. Внедряет превентивные меры.", "senior": "Принимает решения за всю функцию в условиях неопределенности (нет метрик, новый формат, сжатые сроки). Несет ответственность за результат системы деньгами и качеством. Проводит функцию через сложные запуски без потери качества."}, {"name": "Итерационный цикл и развитие креативной функции", "junior": "Выполняет задачи в текущем цикле. Не анализирует и не улучшает систему. Работает по кругу задач.", "middle": "Ведет цикл планирование-реализация-анализ-улучшение по своему направлению. Внедряет выводы в следующие проекты. Улучшает направление итерациями.", "senior": "Строит итерационный цикл развития всей креативной функции: выводы из запусков превращаются в улучшение системы. Развивает функцию от запуска к запуску на основе данных. Делает обучение и рост встроенными в работу."}], "Проджект-менеджер AI": [{"name": "Решение проблем", "junior": "Решает задачи в рамках проекта по заданному подходу. Эскалирует нестандартное. Ищет решение под конкретную задачу, без системного разбора.", "middle": "Самостоятельно диагностирует проблему в проекте, находит первопричину, подбирает решение (в т.ч. через AI и инструменты). Балансирует скорость и качество. Разбирает проблемы до сути.", "senior": "Работает с проблемами уровня бизнес-задачи: превращает размытый запрос в понятный проект и работающее решение. Находит нестандартные подходы через нейросети и автоматизацию. Создает решения, которые снимают проблему системно, а не разово."}, {"name": "Управление проектами (методологии, сроки, результат)", "junior": "Выполняет задачи в проекте по плану, ведет свой участок. Не управляет проектом целиком. Отчитывается о статусе.", "middle": "Ведет проект end-to-end: план, этапы, сроки, ресурсы, результат. Применяет подходящую методологию (Agile/Kanban/waterfall под задачу). Доводит проект до внедрения самостоятельно.", "senior": "Лидирует несколько ключевых проектов параллельно, держит фокус на результате и бизнес-эффекте. Выбирает, какие проекты и как вести, приоритизирует. Забирает на себя самые сложные и неопределенные проекты компании."}, {"name": "OKR и квартальное лидирование проектов", "junior": "Работает в рамках заданных целей и задач. Не формирует OKR. Выполняет свою часть.", "middle": "Ставит и декомпозирует OKR по своему проекту, ведет его в квартальном ритме. Связывает задачи с измеримым результатом. Отвечает за достижение целей проекта.", "senior": "Формирует OKR ключевых проектов компании и лидирует их поквартально. Приоритизирует, что взять в квартал, связывает проекты с целями бизнеса. Отвечает за портфель квартальных инициатив и их эффект."}, {"name": "Декомпозиция, планирование и roadmapping", "junior": "Разбивает задачи на шаги по заданной структуре. Планирует свой участок. Не строит roadmap проекта.", "middle": "Декомпозирует проект на этапы, вехи и задачи, строит план и roadmap. Оценивает сроки и зависимости. Держит проект по плану, корректирует под реальность.", "senior": "Раскладывает сложные и размытые проекты в исполнимые roadmap под разные домены (воронки, системы, автоматизации). Проектирует последовательность запуска и зависимостей. Строит планы, которые доводят до результата в срок."}, {"name": "Управление стейкхолдерами и заказчиками", "junior": "Взаимодействует с участниками проекта по текущим вопросам. Собирает требования по шаблону. Эскалирует спорное.", "middle": "Управляет ожиданиями заказчиков и стейкхолдеров, собирает и уточняет требования, согласует объем. Держит их в курсе, снимает блокеры. Отвечает за то, чтобы результат совпал с ожиданием.", "senior": "Управляет стейкхолдерами уровня руководства, превращает бизнес-запрос в проект и доносит обратно результат. Согласует приоритеты и ресурсы, защищает решения. Выстраивает доверие как основной подрядчик по внутренним проектам."}, {"name": "Промпт-инжиниринг и работа с нейросетями", "junior": "Пользуется нейросетями для простых задач по готовым промптам. Получает базовый результат. Не проектирует промпты.", "middle": "Владеет промпт-инжинирингом: строит сложные промпты, выбирает модели под задачу, получает стабильный результат. Использует AI в аналитике, генерации и обработке данных. Учит команду базовым практикам.", "senior": "Проектирует работу с нейросетями на уровне решений: цепочки промптов, выбор моделей и инструментов, оценка качества. Держит экспертизу по возможностям AI как преимущество. Задает стандарты работы с нейросетями в команде."}, {"name": "Вайбкодинг и создание инструментов", "junior": "Собирает простые вещи по инструкции с помощью AI (скрипты, шаблоны). Копирует готовые решения. Не создает инструменты с нуля.", "middle": "Создает работающие инструменты через вайбкодинг: приложения, скрипты, дашборды, внутренние сервисы под задачу. Использует Claude Code и подобные инструменты. Доводит инструмент до рабочего состояния.", "senior": "Строит сложные инструменты и внутренние продукты через вайбкодинг: от идеи до внедренного решения. Проектирует архитектуру, интеграции и поддерживаемость. Делает создание инструментов через AI ключевым рычагом скорости компании."}, {"name": "AI-автоматизация процессов и агенты", "junior": "Настраивает простые автоматизации по готовым сценариям. Не проектирует автоматизацию.", "middle": "Автоматизирует рутинные процессы через AI, no-code и скрипты, строит агентов под задачи. Считает экономию времени. Внедряет автоматизации в работу команды.", "senior": "Проектирует автоматизацию процессов на уровне системы: где AI и агенты дают максимальный рычаг, как связать инструменты. Строит сложные автоматизированные потоки. Превращает автоматизацию в источник производительности компании."}, {"name": "Проектирование решений и AI-архитектура", "junior": "Реализует заданное решение. Не проектирует архитектуру. Работает по готовой схеме.", "middle": "Проектирует решение под задачу: какие инструменты, данные, AI и интеграции нужны. Выбирает подход (вайбкодинг, готовый сервис, автоматизация). Отвечает за работоспособность решения.", "senior": "Проектирует архитектуру решений и AI-систем под бизнес-задачи: масштабируемость, интеграции, поддерживаемость, стоимость. Выбирает, что строить, а что брать готовым. Задает технические стандарты внутренних решений."}, {"name": "Интеграции, API и работа с данными", "junior": "Работает с данными по инструкции, использует готовые интеграции. Не настраивает API.", "middle": "Настраивает интеграции между системами через API, собирает и обрабатывает данные. Связывает инструменты в единый поток. Отвечает за корректность данных в решении.", "senior": "Проектирует интеграции и потоки данных между системами компании (ERP, CRM, аналитика, AI). Строит сквозную связанность инструментов. Делает данные и интеграции основой работающих систем."}, {"name": "Прототипирование и запуск MVP", "junior": "Собирает простые прототипы по образцу. Не доводит до MVP. Работает по шаблону.", "middle": "Быстро прототипирует и запускает MVP: от идеи до работающей версии за короткий срок. Тестирует на реальных задачах, дорабатывает. Отвечает за скорость проверки идей.", "senior": "Делает быстрое прототипирование методом работы: идея превращается в работающий MVP за дни через AI и вайбкодинг. Проверяет гипотезы дешево и быстро. Задает культуру скорости и экспериментов."}, {"name": "Разворачивание внутренних систем (ERP, CRM, QA, онбординг)", "junior": "Помогает во внедрении систем по заданным задачам. Не ведет внедрение. Выполняет настройки по инструкции.", "middle": "Разворачивает внутренние системы под задачу: ERP/CRM, отдел контроля качества, онбординг, процессы. Настраивает, интегрирует, запускает в работу. Доводит систему до использования командой.", "senior": "Ведет разворачивание сложных внутренних систем end-to-end: выбор, архитектура, внедрение, адаптация под компанию. Запускает новые функции (контроль качества, онбординг, ERP) как проекты. Делает так, чтобы системы работали и приживались."}, {"name": "Построение воронок и процессов", "junior": "Собирает воронки и процессы по готовой схеме. Не проектирует. Настраивает по инструкции.", "middle": "Строит воронки и процессы под задачу: этапы, автоматизации, метрики, инструменты. Оптимизирует конверсию и эффективность. Отвечает за работающий процесс.", "senior": "Проектирует воронки и процессы как систему под бизнес-цели: от привлечения до результата, с автоматизацией и аналитикой. Связывает процессы с инструментами и данными. Делает процессы масштабируемыми и управляемыми."}, {"name": "Аналитика, метрики и дашборды", "junior": "Собирает данные и отчеты по шаблонам. Не строит аналитику. Смотрит в готовые метрики.", "middle": "Строит метрики и дашборды по проектам, в том числе через AI. Анализирует результат, находит точки роста. Внедряет решения на данных.", "senior": "Формирует систему аналитики проектов и решений: какие метрики, как считать, как визуализировать. Ставит данные в основу решений и приоритизации. Делает прозрачность результата стандартом."}, {"name": "Enablement и поддержка команды (внедрение AI)", "junior": "Помогает коллегам по конкретным вопросам. Не обучает системно. Поддерживает точечно.", "middle": "Поддерживает команду: внедряет AI-инструменты и практики, обучает, снимает блокеры. Делает так, чтобы команда пользовалась инструментами. Отвечает за adoption решений.", "senior": "Строит AI-зрелость команды: обучение, стандарты, инструменты, культура. Enablement как система, поднимающая производительность всех. Делает команду AI-нативной и самостоятельной."}, {"name": "Документация, регламенты и передача", "junior": "Ведет базовую документацию по шаблону. Не описывает решения системно.", "middle": "Документирует решения, пишет регламенты и инструкции, передает в эксплуатацию. Обеспечивает, чтобы решением могли пользоваться без него. Отвечает за передаваемость.", "senior": "Строит систему документации и передачи: решения не завязаны на одного человека, легко поддерживаются и масштабируются. Задает стандарт передачи проектов. Делает знания активом компании."}, {"name": "Управление рисками и качеством проекта", "junior": "Сообщает о проблемах в проекте. Тушит локально. Действует по чужому плану.", "middle": "Видит риски проекта заранее (сроки, качество, зависимости) и управляет ими. Обеспечивает качество и стабильность результата. Внедряет проверки.", "senior": "Строит управление рисками и качеством по портфелю проектов. Проводит сложные проекты через неопределенность без срыва результата. Отвечает за то, что запущенное работает и не ломается."}, {"name": "Кросс-функциональная работа", "junior": "Взаимодействует со смежными по задачам проекта. Работает на свою часть. Эскалирует спорное.", "middle": "Выстраивает работу с разными отделами под проект (продажи, маркетинг, операции, финансы). Согласует цели и ресурсы. Ведет кросс-функциональные проекты.", "senior": "Оркеструет проекты через всю компанию: собирает нужных людей, ресурсы и данные под результат. Работает как связующее звено между командами и руководством. Двигает изменения через функции."}, {"name": "Автономность, проактивность и ownership", "junior": "Работает по поставленным задачам, ждет постановки. Берет ответственность за свой участок.", "middle": "Ведет проекты самостоятельно, не ждет задач, видит, что нужно сделать. Берет ответственность за результат проекта. Проактивно предлагает улучшения.", "senior": "Забирает ключевые проекты компании на себя и доводит до результата без надзора. Видит, где нужен, приходит с решением, а не с проблемой. Снимает нагрузку с руководства и команды, беря сложное на себя."}], "Руководитель UGC-отдела": [{"name": "Решение проблем", "junior": "Решает типовые проблемы производства (срыв контента, брак ролика, задержка) по инструкции. Эскалирует нестандартное. Тушит точечно.", "middle": "Диагностирует системные сбои (падение CR, рост CPO, просадка качества на масштабе) и находит первопричину. Строит решения на уровне процесса. Обучает команду.", "senior": "Работает с проблемами уровня всего направления: экономика, сеть, производство на масштабе. Превращает ограничения (отток креаторов, потолок качества) в управляемые решения. Создает методологию, берет ответственность за экономику направления."}, {"name": "UGC-стратегия и связка «контент-деньги»", "junior": "Производит контент по брифу, не связывает его с продажами. Мыслит единицей контента. Не формирует стратегию.", "middle": "Строит план направления: какой контент, под какие продукты и цели, с какой экономикой. Связывает форматы с заказами. Оптимизирует под CR и CPO.", "senior": "Формирует UGC-стратегию под бизнес-цели: как поток контента системно приносит продажи при управляемой экономике. Видит связку контент-деньги на уровне всего направления. Влияет на маркетинг-стратегию со стороны UGC."}, {"name": "Построение и масштабирование сети креаторов", "junior": "Онбордит креаторов по чек-листу, ведет первичный отбор. Работает с текущей сетью. Не строит сеть.", "middle": "Строит рекрутинг, онбординг и удержание сети креаторов, наращивает объем. Управляет качеством и активностью сети. Отвечает за стабильность и управляемость сети.", "senior": "Проектирует систему сети креаторов: как масштабировать до сотен креаторов без потери качества и управляемости, с приемлемым оттоком. Строит модель тиражирования (менторы, регионы). Делает сеть креаторов активом и производственной мощностью."}, {"name": "Экономика креатора и юнит-экономика направления", "junior": "Считает базовые метрики по шаблону. Не связывает с экономикой креатора. Смотрит на факт.", "middle": "Считает юнит-экономику креатора и форматов через ROI и CPO, соотносит результат с затратами. Находит выгодные форматы и креаторов. Управляет стоимостью заказа и отдачей.", "senior": "Выстраивает и пересобирает экономику направления и креатора: юнит-экономика, ROI, CPO, модель окупаемости. Управляет экономикой как системой. Отвечает за выход направления в целевой ROI."}, {"name": "Контент- и бренд-стратегия (карты-стратегии)", "junior": "Делает контент по готовой стратегии и шаблону. Не формирует стратегию. Следует брифу.", "middle": "Разрабатывает контент-стратегии по линейкам и продуктам (карты-стратегии), обеспечивает бренд-фит. Обновляет подходы под результаты. Отвечает за соответствие контента бренду и стратегии.", "senior": "Строит контент- и бренд-стратегию отдела под бизнес-цели: карты-стратегии, конфигураторы подач, система обновления. Задает, что и как производит вся сеть. Делает управляемую контент-стратегию ядром результата."}, {"name": "Производство контента на масштабе", "junior": "Производит контент по брифу и шаблону в заданном объеме. Работает в потоке по плану.", "middle": "Организует производство на масштабе (тысячи единиц в месяц), держит объем и качество. Строит процессы потока (бриф, производство, приемка). Отвечает за объем выпуска.", "senior": "Проектирует контент-фабрику: стандарты, процессы, инструменты, позволяющие держать тысячи единиц в месяц без потери качества и управляемости. Делает производство на масштабе системой. Строит модель, которая растет без пропорционального роста затрат."}, {"name": "Контроль качества и модерация контента", "junior": "Проверяет контент по чек-листу на соответствие брифу. Реагирует на брак постфактум.", "middle": "Строит контроль качества и модерацию контента по бенчмаркам эффективности. Внедряет модератора и стандарты. Держит качество на потоке.", "senior": "Создает систему качества UGC: бенчмарки, модерация, соответствие бренд-стратегиям на масштабе. Связывает качество с конверсией и экономикой. Делает качество на масштабе преимуществом."}, {"name": "Тестирование гипотез и трехступенчатый анализ", "junior": "Выполняет тесты по заданному плану, собирает результаты. Не проектирует гипотезы.", "middle": "Строит и тестирует контентные гипотезы (A/B), анализирует результат, масштабирует конвертящие подачи. Использует анализ рынка, отзывов и хуков. Отвечает за приток рабочих подач.", "senior": "Проектирует систему тестирования гипотез: трехступенчатый анализ (рынок, отзывы, хуки), метрики, масштабирование лучших подач на всю сеть. Приоритизирует гипотезы под бизнес-цели. Делает тестирование двигателем роста конверсии."}, {"name": "Performance-аналитика UGC (CR, CPO, ROI)", "junior": "Собирает метрики и отчеты по шаблонам. Смотрит в историю. Не строит аналитику.", "middle": "Строит performance-аналитику UGC: CR, CPO, ROI, сквозная аналитика, эффективность контента и креаторов. Делает дашборды. Внедряет решения на данных.", "senior": "Формирует аналитическую систему направления, связывает контент с выручкой (сквозная атрибуция). Ставит ТЗ на аналитику и дашборды. Делает данные основой решений по бюджету, гипотезам и креаторам."}, {"name": "Мотивация и KPI креаторов (от охвата к продажам)", "junior": "Считает выплаты креаторам по готовой модели. Не влияет на систему мотивации.", "middle": "Настраивает KPI и мотивацию креаторов, связывает выплаты с результатом. Управляет вовлечением и продуктивностью сети. Отвечает за отдачу от креаторов.", "senior": "Пересобирает экономику и мотивацию креатора: переход от охвата к продажам (атрибуция по подменному артикулу), автоматизация выплат. Строит систему KPI, ведущую сеть к продажам. Влияет на юнит-экономику через мотивацию."}, {"name": "Комьюнити-менеджмент и удержание креаторов", "junior": "Поддерживает коммуникацию с креаторами по регламенту. Не управляет удержанием.", "middle": "Строит комьюнити креаторов, менторство, вовлечение, снижает отток. Развивает креаторов, поддерживает активность сети. Отвечает за удержание и юнит-экономику креатора.", "senior": "Строит систему комьюнити и удержания: менторская модель, культура сети, приемлемый отток на масштабе. Делает лояльную управляемую сеть активом. Тиражирует модель на регионы и группы."}, {"name": "Дистрибуция по площадкам (TikTok, Instagram, YouTube)", "junior": "Постит и распространяет контент по плану. Знает базовые механики. Не адаптирует под площадки.", "middle": "Управляет дистрибуцией по площадкам (TikTok, Instagram, YouTube): форматы, механики, что конвертит. Адаптирует контент под каждую. Тестирует форматы.", "senior": "Держит экспертизу по площадкам как преимущество: где и как UGC дает охват и продажи. Первым выходит в новые площадки и форматы. Задает подход к дистрибуции для команды."}, {"name": "Автоматизация и системы управления креаторами", "junior": "Работает в готовых системах (вебка, мини-апп, Битрикс), заносит данные. Не настраивает системы.", "middle": "Настраивает и развивает системы управлени
