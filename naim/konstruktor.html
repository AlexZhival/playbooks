ания дополнительного контента • Измеряет экономию времени и рост метрик от внедрения каждого AI-инструмента", "senior": "Строит AI-стек продакшена как конкурентное преимущество • Проектирует AI-ассистированный производственный конвейер: от брифа до публикации • Оценивает и внедряет LLM-решения для автоматизации сценарного процесса • Строит систему персонализации контента с помощью AI под разные сегменты аудитории • Управляет балансом человек/AI: где автоматизировать, где сохранять авторский голос • Формирует AI-стратегию продакшена и защищает её перед CEO"}, {"name": "Креативное мышление (Creative Thinking)", "junior": "Генерирует идеи в рамках заданного формата и темы • Предлагает темы и форматы контента по заданному направлению • Умеет находить нестандартный угол в обычной теме • Участвует в брейнштормах, генерирует несколько вариантов идей • Использует референсы и тренды как источник вдохновения • Принимает обратную связь по идеям и дорабатывает их", "middle": "Самостоятельно генерирует виральные идеи и адаптирует тренды под бренд • Находит нестандартные углы и форматы, которые выделяют контент в ленте • Адаптирует тренды платформы под тон и позиционирование бренда • Умеет «переупаковать» экспертизу в увлекательный нарратив для широкой аудитории • Инициирует эксперименты с новыми форматами, оценивает результат • Балансирует между креативом и бизнес-задачей: красиво — и конвертирует", "senior": "Формирует креативную культуру команды и задаёт планку качества • Создаёт систему генерации и оценки идей в команде • Строит редакционный процесс, в котором каждый член команды вносит вклад в идеи • Умеет «продать» нестандартную идею CEO и обосновать её через метрики • Управляет творческим риском: знает когда экспериментировать, когда придерживаться проверенного • Определяет долгосрочный творческий вектор бренда в видеоконтенте"}, {"name": "Управление проектами и процессами (Project & Process Mgmt)", "junior": "Соблюдает дедлайны, работает по плану производства • Выполняет задачи в установленные сроки без напоминаний • Ведёт задачи в таск-трекере, обновляет статусы • Сигнализирует о задержках и рисках заблаговременно • Придерживается производственного регламента • Понимает приоритеты и не переключается на второстепенное", "middle": "Самостоятельно управляет производственными процессами и несколькими потоками задач • Планирует и ведёт параллельные производственные процессы без потери качества • Выстраивает производственный ритм: регулярные созвоны, чекпоинты, ретроспективы • Управляет подрядчиками: ТЗ, дедлайны, приёмка, обратная связь • Находит решения при форс-мажорах (перенос съёмки, болезнь подрядчика, технические сбои) • Оптимизирует производственный процесс, сокращая Time-to-Publish", "senior": "Проектирует и масштабирует производственную систему • Строит scalable-конвейер производства контента, не зависящий от одного человека • Внедряет стандарты, регламенты, SLA для каждого этапа производства • Управляет ресурсной моделью: когда нанимать в штат, когда брать подрядчика • Выстраивает систему резервирования и замены на критических участках • Обеспечивает предсказуемость производства: план выполняется независимо от внешних факторов"}, {"name": "Коммуникация с бизнесом (Business Communication)", "junior": "Понятно передаёт статус задач и запрашивает нужную информацию • Чётко и своевременно информирует о ходе производства • Умеет задать правильные вопросы для получения нужного брифа • Принимает обратную связь без защитной реакции • Переводит творческие идеи в понятное объяснение • Соблюдает деловой стиль коммуникации", "middle": "Самостоятельно ведёт диалог с CEO и смежными отделами, защищает решения • Синхронизируется с маркетингом и продажами без напоминаний • Защищает производственные решения через данные и логику • Умеет объяснить почему «этот формат работает» через метрики, а не только интуицию • Управляет ожиданиями CEO: реалистичные прогнозы, прозрачность по срокам • Инициирует встречи для стратегической синхронизации, а не только для отчёта", "senior": "Выступает стратегическим партнёром CEO в вопросах контент-маркетинга • Регулярно презентует аналитику и стратегические инициативы CEO • Формирует общее понимание в компании: как контент влияет на выручку • Управляет ожиданиями всех стейкхолдеров (CEO, маркетинг, продажи) • Участвует в бизнес-стратегии: предлагает контентные решения под продуктовые запуски • Является голосом продакшена на уровне топ-менеджмента"}, {"name": "Ownership (Принятие ответственности)", "junior": "Берёт ответственность за своё задание и доводит до результата • Завершает задачи без напоминаний, соблюдает дедлайны • Признаёт ошибки, не ищет виноватых в команде • Заблаговременно предупреждает о рисках срыва • Инициирует исправление проблем, которые замечает • Не ждёт идеальных условий: находит способ сделать в рамках ограничений", "middle": "Берёт ответственность за результат производства и метрики контента • Отвечает за качество и показатели контента — не только за факт выхода ролика • Воспринимает метрики как свой результат, а не просто цифры • Инициирует изменения в процессе, если текущий подход не даёт роста • Берёт сложные задачи — экспериментальные форматы, жёсткие дедлайны • Не перекладывает ответственность на алгоритм или «аудитория не та»", "senior": "Отвечает за рост каналов и вклад контента в бизнес-результат компании • Воспринимает показатели каналов как личную бизнес-цель • Связывает каждое производственное решение с выручкой и конверсией • Создаёт культуру ответственности за метрики в команде продакшена • Принимает риски при экспериментах с форматами и управляет ими • Показывает пример: первый замечает проблему, последний уходит с задачи"}, {"name": "Data-Driven Content (Контент на основе данных)", "junior": "Использует метрики для выбора тем и оценки результата • Смотрит аналитику после каждого выхода — не игнорирует данные • Понимает какие ролики сработали и может назвать причину • Не принимает решения по теме только «на ощущение» • Фиксирует метрики по шаблону для накопления базы • Открыт к тому что данные могут опровергнуть его гипотезу", "middle": "Принимает производственные решения на основе системного анализа • Анализирует почему ролик недосмотрели: ищет точку падения, формирует гипотезу • Тестирует форматы и измеряет эффект: A/B по обложкам, заголовкам, структуре • Связывает контентные метрики с бизнес-метриками (переходы, лиды) • Строит гипотезы на основе данных, а не только интуиции • Обучает команду читать и использовать аналитику в работе", "senior": "Делает данные основой производственной системы и стратегии каналов • Выстраивает сквозную аналитику от просмотра до покупки • Строит дашборды для еженедельного мониторинга ключевых метрик • Использует данные для обоснования бюджета и приоритетов продакшена перед CEO • Внедряет предиктивную аналитику: прогнозирует потенциал темы до съёмки • Создаёт культуру измерения в команде: каждое решение — это гипотеза с метрикой"}, {"name": "Continuous Improvement (Постоянное совершенствование)", "junior": "Учится на каждом выпущенном ролике и улучшает своё мастерство • Смотрит успешный контент в своей и смежных нишах для обучения • Применяет обратную связь — не повторяет одних и тех же ошибок • Изучает новые инструменты монтажа, съёмки, AI-помощников • Делится находками с командой, не держит знания при себе • Открыт к экспериментам с форматами даже если это выход из зоны комфорта", "middle": "Системно улучшает производственный процесс и качество контента • После каждого крупного проекта проводит ретроспективу: что сработало, что нет • Тестирует новые форматы и документирует результат для базы знаний команды • Изучает лидеров индустрии, адаптирует лучшие практики под задачи бренда • Инициирует улучшения без запроса сверху — видит проблему раньше CEO • Строит обучающую среду в команде: разборы роликов, обмен знаниями", "senior": "Строит культуру непрерывного роста как конкурентное преимущество продакшена • Встраивает регулярные ретроспективы и разборы контента в ритм команды • Управляет бэклогом экспериментов с приоритизацией по потенциальному эффекту • Следит за глобальными трендами видеопроизводства и первым тестирует их • Масштабирует успешные форматы и подходы быстрее конкурентов • Формирует репутацию команды продакшена как точки роста внутри компании"}], "Личный ассистент": [{"name": "Уровень вовлечённости и мышление", "junior": "Выполняет задачи по чётким инструкциям. Задаёт уточняющие вопросы. Результат: 100% задач выполнены согласно ТЗ, без отклонений от инструкции", "middle": "Анализирует контекст задачи перед выполнением. Предлагает улучшения процесса. Результат: 30% задач решает с дополнительной ценностью (оптимизация, экономия времени CEO)", "senior": "Мыслит как сооснователь — видит последствия решений, предлагает стратегические улучшения. Результат: минимум 2 системные инициативы в месяц, экономящие CEO 5+ часов в неделю"}, {"name": "Самостоятельность и ответственность", "junior": "Справляется с типовыми задачами без ошибок. Сообщает о проблемах сразу. Результат: 0 просроченных задач, 0 забытых поручений", "middle": "Решает 80% задач автономно без возвратов на доработку. Сам находит решения нетиповых ситуаций. Результат: CEO тратит не более 15 мин/день на постановку задач", "senior": "Полностью закрывает направления без контроля. Предвидит проблемы и решает до эскалации. Результат: CEO узнаёт о проблемах только в формате 'была проблема X — решена так Y'"}, {"name": "Планирование и приоритизация", "junior": "Ведёт список задач в актуальном состоянии. Выполняет задачи в порядке приоритета, заданного CEO. Результат: 100% задач в трекере, статусы актуальны", "middle": "Самостоятельно расставляет приоритеты по матрице Эйзенхауэра. Перераспределяет ресурсы при изменении вводных. Результат: CEO не тратит время на расстановку приоритетов в 70% случаев", "senior": "Строит системы приоритизации для CEO и связывает с бизнес-целями. Оптимизирует ежедневные процессы. Результат: внедрённая система приоритизации, сокращение time-to-decision на 40%"}, {"name": "Управление временем и календарём CEO", "junior": "Корректно ведёт календарь. Переносит/подтверждает встречи по инструкции. Результат: 0 накладок в расписании, все встречи подтверждены за 24 часа", "middle": "Планирует недели с учётом фокус-времени, буферов, энергии CEO. Защищает время от неприоритетных встреч. Результат: 2+ часа фокус-времени ежедневно в календаре", "senior": "Строит 3-6-12 месячное планирование с интеграцией в бизнес-цели. Прогнозирует нагрузку, защищает стратегический фокус. Результат: CEO готов к ключевым событиям за 2+ недели, 0 авральных ситуаций"}, {"name": "Подготовка к встречам и брифы", "junior": "Собирает информацию о встрече по чек-листу: участники, цель, контекст. Результат: бриф за 1 час до встречи по шаблону", "middle": "Готовит полноценные брифы с бэкграундом участников, историей взаимодействий, материалами. Результат: CEO приходит на встречу полностью подготовленным, экономия 30 мин на встречу", "senior": "Структурирует встречу: agenda, аргументы, риски, рекомендации, follow-up. Ведёт заметки. Результат: после встречи — готовый протокол с action items и ответственными в течение 2 часов"}, {"name": "Переписка и коммуникации", "junior": "Пишет письма по шаблонам. Сортирует входящую почту по срочности. Результат: 0 пропущенных важных писем, ответы по шаблонам в течение 2 часов", "middle": "Самостоятельно ведёт деловую переписку, делает переводы. Фильтрует 70% писем, не требующих внимания CEO. Результат: CEO тратит на почту не более 30 мин/день", "senior": "Пишет от имени CEO сложные письма: инвесторам, партнёрам, медиа. Готовит one-pagers, речевые заготовки. Результат: CEO только утверждает финальную версию, без правок в 80% случаев"}, {"name": "Исследования и аналитика", "junior": "Собирает информацию по заданным источникам в структурированный вид. Результат: таблица/документ с данными в течение 24 часов", "middle": "Проводит исследование с выводами и рекомендациями. Сравнивает варианты по критериям. Результат: готовый отчёт с резюме для принятия решения", "senior": "Готовит финальные материалы для решений: приоритизация, риски, ROI, дедлайны. Результат: CEO принимает решение за 15 минут на основе материалов"}, {"name": "Работа с подрядчиками", "junior": "Находит подрядчиков по списку критериев. Собирает КП. Результат: 3-5 вариантов с ценами в течение 48 часов", "middle": "Ведёт полный цикл коммуникации: бриф → КП → выбор → контроль выполнения. Результат: задача закрыта без участия CEO", "senior": "Строит и ведёт базу проверенных подрядчиков. Тестирует новых, заменяет неэффективных. Результат: надёжный пул подрядчиков с рейтингом, время поиска нового — 2 часа"}, {"name": "Юридическая базовая проверка", "junior": "Проверяет сроки договоров, напоминает о продлении. Хранит документы в порядке. Результат: 0 просроченных договоров, архив документов в актуальном состоянии", "middle": "Читает базовые договоры, выделяет ключевые условия и риски. Результат: summary договора на 1 страницу перед подписанием", "senior": "Проверяет NDA, условия сделок, предупреждает CEO об опасных пунктах до подписания. Результат: CEO не подписывает договор без review, 0 юридических проблем из-за невнимательности"}, {"name": "Организация деловых поездок", "junior": "Бронирует билеты и отели по заданным параметрам. Результат: подтверждённые брони за 72 часа до вылета", "middle": "Организует поездку под ключ: визы, страховки, трансферы, расписание встреч. Результат: CEO получает полный travel-pack за 1 неделю до поездки", "senior": "Планирует сложные маршруты с fast-track, VIP-сервисами, резервными опциями. Сопровождает CEO. Результат: CEO полностью сфокусирован на целях поездки, 0 организационных вопросов"}, {"name": "Быт CEO (дом, логистика)", "junior": "Выполняет бытовые поручения по списку в срок. Результат: все задачи закрыты в оговорённые сроки", "middle": "Самостоятельно решает бытовые вопросы: находит, сравнивает, координирует подрядчиков. Результат: CEO не участвует в выборе и координации", "senior": "Организует жизнь CEO на новом месте с нуля: жильё, авто, сервисы, договора. Результат: полная инфраструктура за 2 недели при релокации"}, {"name": "Авто / техника / гаджеты", "junior": "Заказывает технику по спецификации. Организует доставку и настройку. Результат: техника готова к использованию в срок", "middle": "Подбирает оптимальные варианты по критериям (цена/качество), сопровождает покупку. Результат: CEO выбирает из 2-3 лучших опций", "senior": "Управляет жизненным циклом всей техники: покупка, страховка, обслуживание, обновление, замена. Результат: 0 неожиданных поломок, всё работает"}, {"name": "Работа с семьёй CEO", "junior": "Выполняет поручения по списку: подарки, записи к врачам, бронирования. Результат: все поручения закрыты в срок", "middle": "Организует семейные мероприятия, поездки, координирует няню/помощников. Результат: CEO не участвует в операционной координации семейных дел", "senior": "Ведёт всю семейную инфраструктуру: образование детей, медицина, поездки, безопасность. Результат: семейные процессы идут автономно, CEO включается только для ключевых решений"}, {"name": "Здоровье и поддержка привычек", "junior": "Записывает CEO к врачам, заказывает витамины, еду по списку. Результат: все записи и заказы выполнены в срок", "middle": "Строит расписание: тренеры, чекапы, режим сна. Следит за соблюдением. Результат: wellness-расписание соблюдается на 80%", "senior": "Удерживает wellness-ритм CEO как система: сон, спорт, питание, чекапы. Результат: CEO в оптимальной физической форме, регулярные чекапы без пропусков"}, {"name": "Личные финансы CEO", "junior": "Оплачивает счета вовремя, делает напоминания о платежах. Результат: 0 просроченных платежей", "middle": "Ведёт таблицу расходов, сверяет по картам, готовит сводку. Результат: CEO видит финансовую картину за 5 минут в месяц", "senior": "Анализирует и оптимизирует траты, ведёт личный P&L, даёт рекомендации. Результат: экономия 10-15% на регулярных тратах, полная финансовая прозрачность"}, {"name": "Контент и публичность", "junior": "Вычитывает и публикует контент по указанию. Следит за расписанием публикаций. Результат: контент публикуется по графику без ошибок", "middle": "Пишет посты и тексты по tone of voice CEO. Отвечает на комментарии. Результат: 2-3 качественных поста в неделю", "senior": "Ведёт соцсети CEO как медиа-менеджер: контент-план, подкасты, медиа-запросы, репутация. Результат: рост аудитории на 20%+ в год, 0 репутационных кризисов"}, {"name": "Страны / миграции / легализация", "junior": "Проверяет сроки виз, документов. Напоминает о продлении. Результат: 0 просроченных документов", "middle": "Знает налоговые статусы и требования для основных стран. Готовит документы к подаче. Результат: визы получены без отказов", "senior": "Ведёт все документы CEO и семьи: визы, резиденции, налоговые статусы. Результат: полная документальная готовность к жизни в любой стране"}, {"name": "Языки", "junior": "Английский B1-B2: понимает переписку, может перевести базовые документы. Результат: справляется с 80% рутинной англоязычной коммуникации", "middle": "Английский C1: свободно ведёт деловую переписку, делает переводы документов. Результат: полностью закрывает англоязычную коммуникацию", "senior": "Английский C1-C2 (fluent) + желательно второй язык. Результат: может представлять CEO в международной коммуникации"}, {"name": "Цифровые инструменты и ИИ", "junior": "Уверенно работает в Word, Excel, Google Calendar, Notion. Делает базовые таблицы и документы. Результат: все документы оформлены корректно", "middle": "Делает аналитику в Excel/Notion, регулярно использует ChatGPT для ускорения работы. Результат: задачи выполняются на 30% быстрее благодаря инструментам", "senior": "Использует Notion/ChatGPT/Slack/CRM как 'второй мозг'. Автоматизирует процессы. Результат: внедрено 3+ автоматизации, сокращающих рутину на 5+ часов в неделю"}, {"name": "Ведение To-do и 'второй мозг' CEO", "junior": "Заносит все задачи в трекер, держит список актуальным. Результат: 100% задач в системе, ничего не потеряно", "middle": "Структурирует задачи по проектам, приоритетам, срокам. Напоминает о важном. Результат: CEO всегда видит топ-5 приоритетов дня", "senior": "Ведёт 'второй мозг' CEO: фиксирует идеи, инсайты, связывает с контекстом. Результат: CEO может вернуться к любой мысли с полным контекстом"}, {"name": "Конфиденциальность и этика", "junior": "Понимает важность конфиденциальности, не обсуждает рабочие вопросы вне работы. Результат: 0 утечек информации", "middle": "Разграничивает уровни доступа к информации, знает что и кому можно сообщать. Результат: корректная коммуникация с учётом статуса собеседника", "senior": "Обеспечивает информационную безопасность CEO: шифрование, безопасные каналы, NDA с подрядчиками. Результат: полная защита конфиденциальной информации CEO"}, {"name": "Эмоциональный интеллект и стрессоустойчивость", "junior": "Сохраняет спокойствие в стрессовых ситуациях, не переносит негатив на CEO. Результат: стабильное качество работы независимо от нагрузки", "middle": "Считывает состояние CEO, адаптирует стиль коммуникации. Предупреждает выгорание. Результат: CEO получает поддержку в нужной форме", "senior": "Управляет стрессом CEO через организацию процессов. Становится эмоциональным буфером. Результат: CEO защищён от операционного стресса, сохраняет энергию для стратегии"}, {"name": "Нетворкинг и управление контактами", "junior": "Ведёт базу контактов CEO в актуальном состоянии. Результат: любой контакт найден за 1 минуту", "middle": "Поддерживает отношения от имени CEO: поздравления, follow-up, напоминания о важных датах. Результат: CEO не забывает о важных контактах", "senior": "Строит и развивает сеть контактов CEO: организует встречи, готовит к нетворкинг-мероприятиям. Результат: CEO расширяет полезные связи системно"}, {"name": "Проактивность и инициативность", "junior": "Выполняет задачи без напоминаний, сообщает о статусе. Результат: CEO не тратит время на контроль исполнения", "middle": "Предлагает улучшения процессов, замечает проблемы до того, как о них скажет CEO. Результат: 2-3 инициативы в месяц", "senior": "Действует на опережение: готовит решения до возникновения проблем, инициирует системные улучшения. Результат: CEO удивляется, что вопрос уже решён"}], "Директор по продукту": [{"name": "Product Strategy (Продуктовая стратегия)", "junior": "Выполняет готовую продуктовую стратегию • Понимает что такое продуктовая стратегия - долгосрочный план развития продукта на 1-3 года • Может разложить продуктовые цели на конкретные фичи (функции продукта) • Следует установленным продуктовым метрикам: DAU (дневные активные пользователи), MAU (месячные активные пользователи), retention (удержание) • Участвует в планировании продуктовых релизов как исполнитель • Умеет читать продуктовую документацию и понимать свою роль в развитии продукта", "middle": "Создает продуктовую стратегию для своей области на 6-12 месяцев • Проводит анализ продуктового рынка и конкурентов • Формулирует продуктовое видение для своего направления • Создает product roadmap (дорожная карта продукта) - план развития продукта по кварталам • Связывает продуктовые цели с бизнес-целями компании • Проводит user research (исследования пользователей) для понимания потребностей • Использует фреймворки: Jobs-to-be-Done, User Story Mapping", "senior": "Определяет продуктовую стратегию компании на 2-3 года с гарантированным product-market fit • Создает продуктовое видение всей компании • Анализирует тренды рынка и технологий для прогнозирования будущего • Создает портфель продуктов и управляет product portfolio • Обеспечивает alignment всех продуктовых команд • Интегрирует продуктовую стратегию с общей бизнес-стратегией • Использует продвинутые методы: Platform Strategy, Ecosystem Thinking, Innovation Framework"}, {"name": "User Experience Design (UX/UI дизайн)", "junior": "Понимает основы пользовательского опыта • Знает базовые принципы UX - как сделать продукт удобным для пользователя • Понимает что такое user journey (путь пользователя) - как пользователь взаимодействует с продуктом • Может создать simple wireframes (схемы экранов) в Figma или других инструментах • Понимает базовые принципы UI - как должны выглядеть кнопки, формы, навигация • Собирает feedback от пользователей и передает дизайнерам", "middle": "Создает UX концепции и управляет дизайн-процессами • Проводит user research: интервью с пользователями, usability testing (тестирование удобства) • Создает personas (портреты типичных пользователей) и user scenarios • Строит detailed user journeys и customer journey maps • Работает с дизайнерами над созданием mockups и prototypes • Проводит A/B тесты дизайнерских решений • Использует методы: Design Thinking, Human-Centered Design", "senior": "Строит design system и культуру user-centric дизайна • Создает design system - единые стандарты дизайна для всех продуктов компании • Внедряет design ops - процессы для масштабирования дизайна • Строит research ops - системы для постоянного изучения пользователей • Интегрирует дизайн в product development process • Создает design culture в компании • Использует advanced методы: Service Design, Systems Thinking в дизайне"}, {"name": "Data Analytics (Продуктовая аналитика)", "junior": "Читает и понимает продуктовые метрики • Понимает основные продуктовые метрики: conversion rate (конверсия), churn rate (отток), ARPU • Умеет работать с аналитическими инструментами: Google Analytics, Amplitude, Mixpanel • Может построить простые отчеты и дашборды • Понимает что такое funnel analysis (анализ воронки) - где пользователи \"отваливаются\" • Отслеживает performance своих фич после релиза", "middle": "Проводит глубокую продуктовую аналитику • Строит complex funnels и cohort analysis для понимания поведения пользователей • Проводит statistical analysis и A/B тесты • Создает predictive models для прогнозирования поведения пользователей • Использует SQL для работы с базами данных • Сегментирует пользователей по поведению и характеристикам • Применяет методы: RFM анализ, Behavioral Analytics, Retention Analysis", "senior": "Строит data-driven культуру и advanced analytics • Создает comprehensive analytics infrastructure для всех продуктов • Внедряет machine learning для персонализации и прогнозирования • Строит real-time analytics и automated insights • Создает self-service analytics для всех продуктовых команд • Интегрирует внешние данные и third-party analytics • Использует advanced техники: Causal Inference, Experimentation Platform"}, {"name": "Technical Product Management (Техническое управление продуктом)", "junior": "Понимает основы технической разработки • Знает базовые концепции разработки: frontend (то что видит пользователь), backend (серверная часть), API (интерфейс для связи систем) • Понимает software development lifecycle - как создается программное обеспечение • Может читать technical specifications и понимать техническую документацию • Знает что такое MVP (Minimum Viable Product) - минимальная версия продукта для тестирования гипотез • Участвует в планировании технических задач", "middle": "Управляет техническими продуктовыми решениями • Работает с техническим долгом - накопленными техническими проблемами которые замедляют разработку • Участвует в архитектурных решениях продукта • Управляет интеграциями с внешними системами и APIs • Планирует технические миграции и апгрейды • Балансирует новые фичи и техническую работу • Понимает scalability (масштабируемость) и performance вопросы", "senior": "Строит техническую стратегию продукта и platform thinking • Создает technical product strategy и technology roadmap • Управляет platform development - создает платформы которые используют другие команды • Принимает решения о build vs buy vs partner • Управляет technical debt portfolio • Создает API strategy для экосистемы партнеров • Интегрирует emerging technologies (AI, blockchain, IoT) в продуктовую стратегию"}, {"name": "Go-to-Market for Products (Продуктовый GTM)", "junior": "Участвует в запуске продуктовых фич • Помогает планировать product launches • Создает release notes - описания что нового в продукте • Участвует в подготовке материалов для маркетинга и продаж • Собирает первые отзывы пользователей после запуска • Понимает основы product positioning - как позиционировать продукт на рынке", "middle": "Руководит запуском продуктов и фич • Создает complete go-to-market strategy для новых продуктов • Координирует работу с маркетингом, продажами, саппортом • Создает product messaging и value proposition • Планирует beta testing и soft launches • Управляет product adoption и onboarding процессами • Анализирует конкурентов и создает competitive positioning", "senior": "Строит систему вывода продуктов на рынок и expansion strategy • Создает repeatable GTM framework для всех продуктов • Управляет product portfolio expansion • Строит partnerships для product distribution • Создает международную product expansion strategy • Интегрирует GTM с product development process • Управляет product lifecycle от запуска до sunset"}, {"name": "Agile & Lean Product Development (Гибкая разработка продуктов)", "junior": "Работает в agile процессах • Понимает основы Scrum и Kanban методологий • Участвует в планировании sprints (2-недельных циклов разработки) • Пишет user stories - описания функций с точки зрения пользователя • Участвует в daily standups, retrospectives, sprint planning • Понимает что такое backlog - список задач для разработки • Работает с agile инструментами: Jira, Trello, Asana", "middle": "Управляет agile процессами в продуктовой команде • Выступает как Product Owner в Scrum процессе • Приоритизирует product backlog по бизнес-ценности • Проводит backlog grooming и story estimation • Управляет release planning и roadmap execution • Внедряет continuous delivery practices • Применяет Lean Startup методы: Build-Measure-Learn, validated learning", "senior": "Создает agile culture и масштабирует agile практики • Внедряет Scaled Agile Framework (SAFe) для больших команд • Создает agile product operating model • Строит continuous discovery и continuous delivery practices • Внедряет OKRs (Objectives and Key Results) для продуктовых команд • Создает experimentation culture и rapid prototyping • Интегрирует agile с business planning процессами"}, {"name": "Product Marketing", "junior": "Поддерживает продуктовый маркетинг • Помогает создавать materials для продаж: one-pagers, презентации, демо • Участвует в создании case studies и success stories • Помогает обучать sales team новым продуктовым фичам • Собирает customer feedback для маркетинговых материалов • Понимает basics of pricing strategy", "middle": "Создает продуктовую маркетинговую стратегию • Развивает product positioning и messaging framework • Проводит competitive analysis и создает battlecards для продаж • Создает customer segmentation и targeting strategy • Управляет product launches от маркетинговой стороны • Работает с pricing strategy и packaging • Создает sales enablement materials и проводит обучения", "senior": "Строит integrated product marketing function • Создает comprehensive product marketing strategy • Интегрирует product marketing с product development • Управляет product portfolio messaging • Создает customer advocacy programs • Строит competitive intelligence системы • Развивает thought leadership и content strategy"}, {"name": "Product Operations (Продуктовые операции)", "junior": "Поддерживает продуктовые процессы • Помогает организовывать продуктовые процессы и meetings • Ведет простую документацию и отчетность • Поддерживает roadmap и backlog актуальными • Помогает с coordination между командами • Использует продуктовые инструменты: Productboard, Aha!, Roadmunk", "middle": "Оптимизирует продуктовые процессы и операции • Создает product development processes и workflows • Внедряет product management tools и automation • Создает dashboards и reporting для продуктовых метрик • Управляет cross-team coordination и dependencies • Оптимизирует resource allocation между проектами • Создает knowledge management для продуктовых команд", "senior": "Строит product operations function и scalable processes • Создает comprehensive product ops framework • Строит data infrastructure для product decisions • Внедряет automation в product processes • Создает center of excellence для product management • Строит product governance и standards • Интегрирует product ops с business operations"}, {"name": "Stakeholder Management (Управление заинтересованными сторонами)", "junior": "Работает с основными stakeholders • Регулярно общается с разработчиками, дизайнерами, маркетологами • Собирает требования от internal customers • Передает feedback между командами • Участвует в cross-functional meetings • Поддерживает базовую коммуникацию с leadership", "middle": "Управляет expectations и alignment множества stakeholders • Работает с C-level executives, sales, marketing, support, legal • Создает stakeholder communication plans • Управляет conflicting priorities разных групп • Проводит regular stakeholder updates и demos • Строит coalition building для поддержки продуктовых инициатив • Переводит между техническим и бизнес языком", "senior": "Строит strategic partnerships и ecosystem thinking • Создает long-term stakeholder relationship strategy • Управляет board-level communication о продуктовой стратегии • Строит external partnerships и ecosystem relationships • Создает customer advisory boards • Интегрирует stakeholder management в strategic planning • Развивает thought leadership в продуктовом сообществе"}, {"name": "Customer Empathy (Эмпатия к клиентам)", "junior": "Понимает потребности пользователей • Регулярно читает customer feedback и support tickets • Участвует в customer interviews • Понимает основные pain points пользователей • Может объяснить value proposition продукта с точки зрения пользователя • Следит за NPS (Net Promoter Score) и CSAT (Customer Satisfaction)", "middle": "Глубоко изучает поведение и потребности клиентов • Проводит регулярные user research sessions • Создает detailed customer personas и journey maps • Анализирует behavioral data для понимания usage patterns • Участвует в customer support для прямого контакта с пользователями • Проводит customer development interviews • Использует ethnographic research methods", "senior": "Создает customer-obsessed culture в продуктовой организации • Встраивает customer voice во все продуктовые решения • Создает systems для continuous customer feedback • Развивает organization-wide customer empathy • Создает customer advisory programs • Интегрирует customer metrics в business planning • Строит customer-centric innovation processes"}, {"name": "Strategic Thinking (Стратегическое мышление)", "junior": "Понимает как продукт связан со стратегией • Знает как продуктовые решения влияют на business metrics • Может связать features с business outcomes • Понимает competitive landscape • Думает на 3-6 месяцев вперед • Понимает trade-offs между разными продуктовыми решениями", "middle": "Создает продуктовую стратегию для своей области • Анализирует market trends и technology trends • Создает strategic options и scenario planning • Балансирует short-term delivery и long-term vision • Проводит competitive analysis и identifies white spaces • Создает product positioning и differentiation strategy • Использует strategic frameworks: Porter's Five Forces, Blue Ocean", "senior": "Формирует product vision и долгосрочную стратегию компании • Создает compelling product vision на 3-5 лет • Интегрирует product strategy с overall business strategy • Анализирует emerging technologies и market disruptions • Создает platform thinking и ecosystem strategy • Развивает strategic partnerships и M&A opportunities • Применяет systems thinking к продуктовой стратегии"}, {"name": "Communication & Storytelling (Коммуникация и сторителлинг)", "junior": "Ясно объясняет продуктовые концепции • Может объяснить сложные продуктовые решения простым языком • Создает понятные презентации для разных аудиторий • Пишет clear user stories и requirements • Ведет продуктивные meetings и workshops • Документирует решения и rationale", "middle": "Создает compelling narratives для продуктовых инициатив • Рассказывает истории которые мотивируют команды • Создает persuasive business cases для новых инициатив • Адаптирует communication style для разных stakeholders • Проводит effective product demos и presentations • Создает visual storytelling через data и mockups • Использует storytelling для change management", "senior": "Строит narrative strategy и thought leadership • Создает company-wide product narrative • Развивает external thought leadership • Создает compelling vision communications • Строит storytelling capabilities в продуктовой организации • Интегрирует storytelling в product marketing • Создает crisis communication capabilities"}, {"name": "Problem Solving (Решение проблем)", "junior": "Решает продуктовые проблемы структурированно • Использует structured approaches для problem solving • Применяет root cause analysis для продуктовых issues • Генерирует multiple solutions для проблем • Умеет prioritize problems по impact и effort • Использует data для validation решений", "middle": "Решает complex продуктовые и бизнес проблемы • Применяет design thinking для innovation • Использует hypothesis-driven problem solving • Проводит trade-off analysis между competing solutions • Создает frameworks для recurring problem types • Балансирует analytical и creative thinking • Применяет lean startup methods для problem solving", "senior": "Создает problem-solving culture и systematic approaches • Строит organization-wide problem solving capabilities • Создает innovation processes и frameworks • Развивает first principles thinking • Создает learning culture из failures • Интегрирует customer problems в strategic planning • Строит systematic innovation processes"}, {"name": "Leadership & Team Building (Лидерство и создание команды)", "junior": "Ведет небольшую продуктовую команду • Мотивирует команду разработки и дизайнеров • Дает clear direction и priorities • Проводит regular 1-on-1s с team members • Помогает resolve conflicts в команде • Создает positive team culture", "middle": "Строит и развивает продуктовые команды • Нанимает и развивает product talent • Создает high-performing cross-functional teams • Развивает других product managers • Создает career development paths • Строит collaborative culture между функциями • Управляет remote и distributed teams", "senior": "Формирует продуктовую организацию и leadership pipeline • Строит scalable product organization • Создает product leadership development programs • Формирует product culture и values • Создает center of excellence для product management • Развивает next generation product leaders • Интегрирует product leadership в company culture"}, {"name": "Innovation Mindset (Инновационное мышление)", "junior": "Открыт к новым идеям и подходам • Регулярно изучает новые продуктовые trends и technologies • Предлагает improvements к существующим процессам • Экспериментирует с новыми tools и methods • Учится у других продуктов и industries • Не боится пробовать новые approaches", "middle": "Создает innovation processes в продуктовой команде • Внедряет regular hackathons и innovation sessions • Создает experimentation framework • Поощряет calculated risk-taking • Создает safe-to-fail environment • Выделяет время и ресурсы на innovation • Применяет design thinking workshops", "senior": "Строит innovation culture и systematic innovation • Создает company-wide innovation framework • Строит innovation metrics и tracking • Интегрирует innovation в business planning • Создает partnerships с startups и universities • Развивает emerging technology capabilities • Строит innovation portfolio management"}, {"name": "User-Centric Thinking (Пользователе-центричное мышление)", "junior": "Всегда думает о пользователе при принятии решений • Задает вопрос \"как это поможет пользователю?\" перед каждым решением • Регулярно читает user feedback • Понимает main user journeys • Приоритизирует user value над internal convenience • Защищает user interests в product decisions", "middle": "Встраивает user perspective во все продуктовые процессы • Создает regular touchpoints с пользователями • Интегрирует user research в product development • Создает user-centered design processes • Измеряет success через user outcomes • Создает empathy building activities для команды • Использует jobs-to-be-done framework", "senior": "Создает organization-wide user-centric culture • Встраивает user-centricity в company values • Создает systems для continuous user feedback • Интегрирует user metrics в business planning • Развивает user advocacy programs • Создает user-centric innovation processes • Строит customer advisory capabilities"}, {"name": "Data-Driven Decision Making (Решения на основе данных)", "junior": "Использует данные для обоснования продуктовых решений • Всегда ищет data перед принятием решений • Понимает key product metrics • Может интерпретировать basic analytics • Ставит под сомнение decisions не подкрепленные данными • Измеряет impact своих решений", "middle": "Создает data-driven процессы в продуктовой команде • Внедряет experimentation и A/B testing • Создает dashboards для product metrics • Использует data для prioritization • Проводит data analysis для product insights • Создает measurement frameworks для new features • Балансирует quantitative и qualitative data", "senior": "Строит data-driven product culture и advanced analytics • Создает comprehensive product data infrastructure • Внедряет advanced analytics и machine learning • Строит predictive product models • Создает self-service analytics для всех teams • Интегрирует external data sources • Развивает data literacy в product organization"}, {"name": "Continuous Learning (Непрерывное обучение)", "junior": "Постоянно развивается в продуктовой области • Регулярно читает product blogs, книги, подкасты • Участвует в product meetups и conferences • Изучает best practices других компаний • Получает feedback и работает над improvement • Экспериментирует с новыми methods и tools", "middle": "Создает learning culture в продуктовой команде • Организует knowledge sharing sessions • Внедряет regular retrospectives и learning reviews • Создает internal training programs • Поощряет experimentation и learning from failures • Развивает mentoring relationships • Создает communities of practice", "senior": "Строит learning organization и knowledge management • Создает systematic learning processes • Строит knowledge management systems • Интегрирует learning в performance management • Создает external learning partnerships • Развивает thought leadership capabilities • Строит organizational memory и best practices"}, {"name": "Ownership & Accountability (Ответственность и подотчетность)", "junior": "Берет полную ответственность за свои продуктовые решения • Отвечает за outcomes своих features • Не перекладывает ответственность на других • Следит за performance своих решений after launch • Быстро реагирует когда что-то идет не так • Учится на своих mistakes", "middle": "Создает culture of ownership в продуктовой команде • Делегирует ownership другим team members • Создает clear accountability для product outcomes • Измеряет success через business impact • Создает transparent reporting о product performance • Поощряет taking calculated risks • Создает psychological safety для ownership", "senior": "Строит accountability culture в продуктовой организации • Создает systems для measuring product impact • Интегрирует accountability в performance management • Создает transparent goal setting и tracking • Развивает extreme ownership principles • Создает learning from failures processes • Строит long-term thinking и sustainable practices"}], "Руководитель отдела продаж": [{"name": "Решение проблем", "junior": "Решает стандартные проблемы команды продаж по готовым инструкциям и процедурам. Эскалирует сложные вопросы руководству для получения решения. Применяет базовые методы анализа проблем в продажах. Фокусируется на быстрых тактических решениях без глубокого анализа. Требует поддержки при решении нестандартных ситуаций.", "middle": "Самостоятельно анализирует и решает сложные проблемы в области продаж и управления командой. Проводит анализ коренных причин снижения конверсий и результативности команды. Разрабатывает системные решения для повторяющихся проблем в воронке продаж. Балансирует краткосрочные и долгосрочные решения. Обучает команду методам решения проблем.", "senior": "Решает стратегические проблемы, влияющие на всю систему продаж компании. Трансформирует системные проблемы в конкурентные преимущества через инновационные подходы. Создает методологии решения проблем для всего отдела продаж. Предвосхищает и предотвращает потенциальные проблемы через проактивное планирование. Становится экспертом по решению критических проблем продаж."}, {"name": "Goal Cascading (каскадирование целей)", "junior": "Понимает связь между целями компании и индивидуальными целями продавцов. Транслирует готовые цели от руководства команде без адаптации. Отслеживает выполнение установленных целей по базовым метрикам. Проводит регулярные встречи по обсуждению прогресса целей. Корректирует цели только по указанию вышестоящего руководства.", "middle": "Самостоятельно декомпозирует стратегические цели компании на операционные цели команды и индивидуальные планы. Адаптирует цели под специфику каждого продавца и территории. Создает систему промежуточных целей и контрольных точек для контроля прогресса. Балансирует амбициозность целей с их достижимостью. Регулярно пересматривает и корректирует цели на основе рыночных условий.", "senior": "Создает комплексную систему целеполагания, интегрирующую стратегические, тактические и индивидуальные цели. Разрабатывает инновационные подходы к мотивации через целеполагание. Влияет на формирование общекорпоративных целей продаж. Создает культуру ответственности и самостоятельного целеполагания в команде. Становится экспертом по системам целеполагания для других подразделений."}, {"name": "Pipeline-менеджмент", "junior": "Отслеживает базовые метрики воронки продаж команды по стандартным отчетам. Проводит еженедельные обзоры воронки с продавцами. Использует готовые шаблоны для анализа воронки. Фокусируется на количественных метриках без глубокого анализа качества. Реагирует на проблемы воронки после их возникновения.", "middle": "Создает детальную систему мониторинга и управления воронкой на всех этапах продаж. Анализирует конверсии между этапами и выявляет узкие места. Прогнозирует результаты на основе качественного анализа воронки. Внедряет лучшие практики управления сделками для всей команды. Оптимизирует длительность цикла продаж и повышает процент закрытых сделок.", "senior": "Создает предиктивные модели и аналитику для управления воронкой на стратегическом уровне. Интегрирует управление воронкой с общей стратегией продаж компании. Разрабатывает собственные методологии оценки качества возможностей. Создает эталонные показатели воронки для отрасли. Трансформирует управление воронкой в конкурентное преимущество компании."}, {"name": "Прогноз выручки", "junior": "Готовит базовые прогнозы выручки на основе исторических данных и текущей воронки. Использует простые математические модели прогнозирования. Обновляет прогнозы ежемесячно или по требованию руководства. Точность прогнозов составляет 70-80%. Прогнозирует только на 1-2 месяца вперед с приемлемой точностью.", "middle": "Создает точные прогнозы выручки, интегрируя множественные факторы (сезонность, рыночные тренды, качество воронки). Использует продвинутые методы прогнозирования и статистические модели. Достигает точности прогнозов 85-90% на горизонте 3-6 месяцев. Создает сценарные прогнозы (оптимистичный, реалистичный, пессимистичный). Регулярно калибрует модели прогнозирования.", "senior": "Создает сложные прогностические модели с использованием продвинутой аналитики и машинного обучения. Интегрирует внешние рыночные данные и конкурентную разведку в прогнозы. Достигает точности прогнозов 90%+ на горизонте до 12 месяцев. Влияет на стратегическое планирование компании через точные прогнозы продаж. Создает прогностические модели, используемые в других департаментах."}, {"name": "Управление командой", "junior": "Управляет командой до 8 продавцов, обеспечивая выполнение базовых показателей эффективности. Проводит регулярные индивидуальные встречи и командные совещания. Использует стандартные методы мотивации и контроля. Делегирует простые задачи и контролирует их выполнение. Решает конфликты в команде с помощью отдела кадров или вышестоящего руководства.", "middle": "Эффективно управляет командой 8-15 продавцов, создавая высокопроизводительную культуру продаж. Развивает индивидуальные планы развития для каждого члена команды. Создает систему взаимного обучения и обмена знаниями. Самостоятельно решает сложные конфликты и управляет низкой результативностью. Становится наставником для младших продавцов и развивает их в руководителей команд.", "senior": "Управляет крупными командами продаж (15+ человек) и сложными матричными структурами. Создает самоуправляемые команды с высоким уровнем вовлеченности. Разрабатывает и внедряет инновационные системы управления эффективностью. Становится магнитом для талантов, привлекающим лучших исполнителей в компанию. Влияет на кадровую стратегию компании в области продаж."}, {"name": "Процесс и CRM-дисциплина", "junior": "Обеспечивает базовое использование системы управления отношениями с клиентами командой для ввода данных по сделкам. Контролирует заполнение обязательных полей в системе. Генерирует стандартные отчеты из системы для анализа активности команды. Следит за соблюдением базовых процессов продаж. Эскалирует проблемы с процессами и системой в IT или руководству.", "middle": "Создает и внедряет детальные процессы продаж с четкими этапами и критериями перехода. Максимизирует использование системы управления клиентами для управления командой и анализа результативности. Создает индивидуальные панели управления и автоматизированные рабочие процессы в системе. Обеспечивает 95%+ соответствие процессам работы с системой. Оптимизирует процессы продаж на основе аналитики системы.", "senior": "Создает лучшие в классе операции продаж с полной интеграцией системы управления клиентами в бизнес-процессы. Разрабатывает продвинутые настройки системы и интеграции с другими системами. Использует данные системы для стратегического принятия решений и предиктивной аналитики. Создает процессы, становящиеся эталоном для отрасли. Влияет на выбор и развитие стратегии системы управления клиентами компании."}, {"name": "Аналитика продаж", "junior": "Анализирует базовые метрики продаж (выручка, объем, коэффициенты конверсии) с использованием готовых отчетов. Готовит еженедельные и месячные отчеты для руководства по установленным шаблонам. Выявляет очевидные тренды в результативности команды. Использует Excel или базовые инструменты бизнес-аналитики для анализа данных. Фокусируется на исторических данных без предиктивного анализа.", "middle": "Проводит глубокий анализ результативности продаж с использованием продвинутой аналитики. Создает индивидуальные показатели эффективности и метрики для оценки различных активностей продаж. Использует когортный анализ, моделирование атрибуции для понимания динамики продаж. Создает практические инсайты для оптимизации процессов продаж. Внедряет принятие решений на основе данных в команде продаж.", "senior": "Создает комплексную аналитическую структуру для всей организации продаж. Использует продвинутые статистические методы и машинное обучение для оптимизации продаж. Интегрирует аналитику продаж с маркетинговой и продуктовой аналитикой. Создает предиктивные модели для прогнозирования продаж и оптимизации команды. Становится лидером мнений в области аналитики продаж в компании."}, {"name": "Call Quality Control", "junior": "Проводит базовый мониторинг звонков команды, используя случайную выборку. Оценивает качество звонков по стандартным критериям (открытие, презентация, закрытие). Предоставляет простую обратную связь продавцам после прослушивания записей. Ведет простую статистику по качеству звонков. Эскалирует критические проблемы качества руководству.", "middle": "Создает системный подход к мониторингу и улучшению качества звонков всей команды. Разрабатывает детальные оценочные карты для различных аспектов результативности звонков. Проводит регулярные коучинговые сессии на основе анализа качества звонков. Использует записи звонков для создания примеров лучших практик. Достигает измеримого улучшения коэффициентов конверсии через контроль качества.", "senior": "Создает комплексную структуру качества звонков с продвинутой аналитикой и анализом с использованием искусственного интеллекта. Внедряет коучинг в реальном времени и автоматизированную оценку качества. Создает персонализированные тренинговые программы на основе индивидуального анализа звонков. Использует анализ разговоров для стратегических инсайтов. Трансформирует качество звонков в конкурентное преимущество компании."}, {"name": "Использование AI в продажах", "junior": "Понимает базовые возможности инструментов искусственного интеллекта в продажах и использует простые автоматизированные решения. Внедряет готовые функции на основе ИИ в систему управления клиентами (оценка лидов, шаблоны писем). Использует базовые чат-боты для квалификации лидов. Экспериментирует с инструментами ИИ под руководством более опытных коллег. Фокусируется на простых случаях использования без сложной настройки.", "middle": "Стратегически внедряет решения на основе ИИ для оптимизации различных аспектов процесса продаж. Использует предиктивную аналитику для приоритизации лидов и оценки возможностей. Внедряет анализ разговоров для анализа звонков продаж и коучинга. Создает процессы продаж на основе ИИ, повышающие производительность команды. Обучает команду эффективному использованию инструментов ИИ в ежедневной работе.", "senior": "Становится евангелистом ИИ, трансформирующим операции продаж через передовые технологии искусственного интеллекта. Разрабатывает индивидуальные решения ИИ для конкретных бизнес-потребностей. Интегрирует ИИ во все аспекты управления продажами и стратегии. Создает культуру и процессы продаж, основанные на ИИ. Влияет на общекорпоративную стратегию ИИ через призму продаж."}, {"name": "Outbound Strategy (исходящие продажи)", "junior": "Выполняет базовые активности исходящих продаж по готовым спискам и шаблонам. Использует стандартные каналы исходящих продаж (холодные звонки, письма) без сложной последовательности. Отслеживает базовые метрики активностей исходящих продаж (сделанные звонки, отправленные письма, ответы). Работает с предоставленными списками лидов без глубокого исследования или сегментации. Фокусируется на объемных метриках без оптимизации коэффициентов конверсии.", "middle": "Создает комплексную стратегию исходящих продаж с многоканальным подходом и сложной последовательностью. Разрабатывает целевые сообщения для различных сегментов и персон. Использует продвинутые инструменты поиска потенциальных клиентов и исследования для высококачественного охвата. Оптимизирует время, частоту и содержание кампаний исходящих продаж. Достигает показателей отклика и конверсии в встречи выше среднего.", "senior": "Создает инновационные стратегии исходящих продаж, становящиеся конкурентным преимуществом для компании. Интегрирует исходящие продажи с входящим маркетингом для бесшовного опыта потенциальных клиентов. Использует передовые технологии (ИИ, автоматизация, предиктивная аналитика) для оптимизации исходящих продаж. Создает масштабируемые процессы исходящих продаж, работающие на корпоративном уровне. Становится лидером мнений в стратегиях исходящих продаж."}, {"name": "Targeting & Ideal Customer Profile", "junior": "Работает с готовыми сегментами клиентов и портретом идеального клиента, определенными маркетингом или высшим руководством. Использует базовые критерии для квалификации потенциальных клиентов (размер компании, отрасль, география). Применяет простую оценку лидов без сложного анализа. Фокусируется на очевидно подходящих клиентах без глубокого рыночного анализа. Периодически пересматривает портрет идеального клиента на основе обратной связи от команды.", "middle": "Создает детальный портрет идеального клиента на основе комплексного анализа существующих клиентов и рыночных исследований. Разрабатывает сложную стратегию сегментации с множественными измерениями (фирмографика, технографика, поведенческие). Использует аналитику данных для непрерывного уточнения портрета идеального клиента и стратегии таргетинга. Создает различные подходы для разных сегментов клиентов. Достигает более высоких показателей выигрыша через улучшенный таргетинг.", "senior": "Создает динамическую структуру таргетинга на основе данных с предиктивными элементами. Интегрирует конкурентную разведку и рыночные тренды в разработку портрета идеального клиента. Создает подходы, ориентированные на конкретные аккаунты для стратегических сегментов. Влияет на разработку продукта через глубокие клиентские инсайты. Становится экспертом по рыночной разведке для всей компании."}, {"name": "Создание системы отбора и адаптации", "junior": "Участвует в процессе найма, используя стандартные вопросы интервью и критерии оценки. Проводит базовый онбординг новых продавцов по готовой программе. Назначает наставника или ментора для новых сотрудников. Отслеживает базовые этапы адаптации (первая сделка, достижение плана). Использует стандартные тренинговые материалы без адаптации под конкретные потребности.", "middle": "Создает комплексную структуру найма с поведенческими интервью и практическими оценками. Разрабатывает структурированную программу онбординга с четкими этапами и метриками успеха. Создает программу наставничества и возможности взаимного обучения для новых сотрудников. Адаптирует тренинги под индивидуальные стили обучения и уровни опыта. Достигает более быстрого выхода на продуктивность для новых сотрудников.", "senior": "Создает лучшую в классе систему привлечения и развития талантов. Разрабатывает инновационные методы оценки и предиктивные модели найма. Создает комплексные пути развития от младших до старших ролей в продажах. Интегрирует непрерывное обучение и развитие навыков в ежедневные операции. Становится экспертом по развитию талантов, влияющим на общекорпоративные кадровые практики."}, {"name": "Создание системы мотивации", "junior": "Использует стандартные схемы комиссионных и базовые программы признания. Проводит регулярные командные встречи с празднованием успехов и достижений. Применяет простые индивидуальные стимулы (бонусы за достижение целей). Организует базовые мероприятия по командообразованию и социальные события. Эскалирует вопросы мотивации в отдел кадров.", "middle": "Создает комплексную систему мотивации, сочетающую финансовые и нефинансовые стимулы. Разрабатывает креативные программы признания и возможности карьерного развития. Использует элементы геймификации для повышения вовлеченности и результативности. Создает индивидуальные планы мотивации, учитывающие личные драйверы каждого продавца. Достигает высокой удовлетворенности сотрудников и удержания в команде.", "senior": "Создает инновационную структуру мотивации на основе данных, максимизирующую индивидуальную и командную результативность. Интегрирует поведенческую психологию в дизайн систем мотивации. Создает долгосрочные карьерные пути и возможности развития лидерства. Влияет на общекорпоративную стратегию компенсации и мотивации. Становится экспертом в психологии результативности и командной мотивации."}, {"name": "Velocity Thinking (мышление скорости)", "junior": "Понимает важность скорости в процессах продаж и стремится ускорить базовые активности. Отслеживает метрики, основанные на времени (время отклика, скорость последующих действий). Использует базовые инструменты автоматизации для ускорения рутинных задач. Фокусируется на быстрых победах без долгосрочной оптимизации скорости. Реагирует на медленные процессы после того, как проблемы становятся очевидными.", "middle": "Создает системный подход к ускорению всех ключевых процессов продаж. Анализирует узкие места в цикле продаж и внедряет решения для их устранения. Использует продвинутые инструменты и рабочие процессы для максимизации скорости команды. Балансирует скорость с качеством, не компрометируя клиентский опыт. Создает культуру, ориентированную на скорость, в команде.", "senior": "Трансформирует организацию в высокоскоростную машину продаж через инновации процессов. Создает предиктивные системы для выявления и предотвращения узких мест скорости. Интегрирует мышление скорости во все аспекты стратегии и операций продаж. Использует передовые технологии для достижения прорывных улучшений скорости. Становится экспертом по скорости, влияющим на операции всей компании."}, {"name": "Кросс-функциональная работа", "junior": "Поддерживает базовое сотрудничество с командами маркетинга, продукта и клиентского успеха. Участвует в регулярных межфункциональных встречах и общих проектах. Эскалирует межведомственные вопросы руководству для решения. Обменивается базовой информацией с другими департаментами согласно установленным процессам. Фокусируется на целях собственного департамента без глубокой интеграции с другими функциями.", "middle": "Создает прочные партнерства с ключевыми департаментами, согласовывая цели и общие метрики успеха. Активно сотрудничает в стратегических инициативах, требующих межфункциональной экспертизы. Разрабатывает общие процессы с маркетингом для управления лидами и оптимизации пути клиента. Становится связующим звеном между продажами и другими департаментами для стратегического планирования. Влияет на дорожную карту продукта через клиентские инсайты и рыночную обратную связь.", "senior": "Становится межфункциональным лидером, управляющим общекорпоративными инициативами через призму продаж. Создает интегрированные стратегии выхода на рынок совместно с множественными департаментами. Влияет на стратегию компании через глубокое межфункциональное сотрудничество и рыночные инсайты. Развивает в других департаментах понимание потребностей продаж и рыночной динамики. Становится участником стратегического планирования на исполнительном уровне за пределами области продаж."}, {"name": "Кризис-менеджмент", "junior": "Реагирует на кризисы в продажах по установленным процедурам эскалации. Внедряет базовые действия по реагированию на кризис для минимизации немедленного воздействия. Сообщает о статусе кризиса руководству и следует руководству для решения. Фокусируется на краткосрочном контроле ущерба без стратегического планирования кризиса. Зависит от старшего руководства для стратегии кризиса и основных решений.", "middle": "Самостоятельно управляет умеренными кризисами продаж через системный подход и четкие планы действий. Разрабатывает планы на случай непредвиденных обстоятельств для общих кризисных сценариев (спады рынка, конкурентные угрозы). Поддерживает моральный дух команды и результативность в сложные периоды через эффективную коммуникацию. Координируется с другими департаментами для комплексного реагирования на кризис. Учится на кризисах и внедряет превентивные меры.", "senior": "Становится экспертом по управлению кризисами, способным управлять крупными ситуациями, угрожающими бизнесу. Разрабатывает комплексные структуры управления кризисами и системы раннего предупреждения. Трансформирует кризисы в конкурентные преимущества через инновационные ответы. Поддерживает высокую результативность команды и удовлетворенность клиентов во время крупных нарушений. Влияет на общекорпоративную готовность к кризисам и стратегии реагирования."}, {"name": "Этика и комплаенс", "junior": "Следует базовым требованиям соответствия и этическим руководящим принципам в ежедневных активностях продаж. Сообщает о нарушениях этики согласно политикам компании. Использует утвержденные материалы продаж и сообщения без несанкционированных модификаций. Обеспечивает соблюдение командой установленных законных и этических границ. Участвует в обязательном обучении по соответствию.", "middle": "Создает комплексную структуру соответствия для всей организации продаж. Разрабатывает этические практики продаж и обучает команду сложным сценариям соответствия. Проактивно выявляет потенциальные риски соответствия и внедряет превентивные меры. Создает культуру этичного поведения и прозрачности в процессах продаж. Становится контактным лицом для вопросов соответствия в департаменте продаж.", "senior": "Становится этическим лидером, влияющим на общекорпоративную культуру соответствия и стандарты. Разрабатывает ведущие в отрасли этические практики продаж и становится лидером мнений. Интегрирует соответствие бесшовно в бизнес-стратегию без компрометации результативности. Влияет на регуляторные стандарты через участие в отрасли и лидерство мнений. Создает этические структуры, принимаемые другими компаниями в отрасли."}, {"name": "Развитие команды и конверсий", "junior": "Проводит базовые коучинговые сессии с фокусом на улучшение индивидуальных метрик результативности. Использует стандартные тренинговые программы для развития навыков команды. Выявляет очевидные пробелы в навыках и предоставляет базовые тренинговые ресурсы. Отслеживает индивидуальные коэффициенты конверсии и предоставляет простую обратную связь. Фокусируется на исправлении проблем после их возникновения.", "middle": "Создает комплексные программы развития, нацеленные на конкретные навыки для каждого члена команды. Использует аналитику данных для выявления паттернов результативности и адаптации коучинговых подходов. Внедряет программы взаимного обучения и создает центры превосходства внутри команды. Разрабатывает специализированные тренинги для разных ролей продаж и уровней опыта. Достигает измеримых улучшений в коэффициентах конверсии команды через системное развитие.", "senior": "Создает двигатель развития талантов мирового класса, последовательно производящий лучших исполнителей. Внедряет передовые методологии обучения и системы непрерывного обучения. Создает внутренние академии и программы сертификации для превосходства в продажах. Развивает членов команды в лидеров и экспертов предметной области. Трансформирует подход к развитию в конкурентное преимущество через превосходные возможности талантов."}], "Head of SMM": [{"name": "Решение проблем", "junior": "Работает строго по брифу и контент-плану. Запускает посты и сторис по готовым шаблонам. Не анализирует причины низкого охвата. Эскалирует проблемы руководителю. Фокус на тактических задачах. Примеры: публикация контента по расписанию, базовое ведение аккаунта, ответы на комментарии по скрипту", "middle": "Самостоятельно анализирует падение охвата и ER. Выявляет закономерности в данных соц. сетей. Адаптирует форматы под изменения алгоритмов. Проводит A/B тестирование публикаций. Предлагает улучшения контент-стратегии. KPI: рост ER на 20-40%, рост охвата на 15-30%", "senior": "Выявляет системные узкие места контент-воронки. Диагностирует причины слабой конверсии из охвата в регистрации. Перестраивает всю SMM-архитектуру. Создает нестандартные механики роста. Влияет на продуктовую упаковку через инсайты из соц. сетей. KPI: рост органических регистраций в 2-3 раза, CR из охвата +50%"}, {"name": "Формулирование и каскадирование фокусов и целей", "junior": "Работает по задачам, поставленным сверху. Не понимает связи контента с бизнес-результатами. Выполняет разрозненные публикации без привязки к воронке. Горизонт планирования: 1-2 недели. Примеры: заполнение контент-плана по шаблону, выполнение задач из постановки", "middle": "Ставит SMART-цели по каналам на месяц/квартал. Планирует контент-спринты и формирует бэклог. Декомпозирует квартальные цели на месячные планы. Проводит ретроспективы. KPI: достижение 80%+ целей спринта, выполнение контент-плана на 90%+", "senior": "Формулирует годовую SMM-стратегию под бизнес-цели. Каскадирует стратегию в OKR команды. Синхронизирует контент-план с воронкой продаж и продуктовым календарем. Создает систему измерения влияния SMM на выручку. KPI: 90%+ выполнение стратегических целей, рост органических регистраций 30%+ квартал к кварталу"}, {"name": "Построение контент-завода", "junior": "Создает контент самостоятельно, ограничен собственной производительностью. Не выстраивает системных процессов производства. Работает реактивно - по мере появления задач. Объем: до 20-30 единиц в месяц. Примеры: ведение 1-2 аккаунтов, создание постов и сторис по шаблонам", "middle": "Выстраивает редакционный конвейер с командой 2-4 человека. Создает брифы, шаблоны и чек-листы для производства. Внедряет контент-план и editorial calendar. Начинает автоматизировать рутинные процессы. Объем: 60-100 единиц в месяц. KPI: системность выпуска 85%+, снижение time-to-publish на 30%", "senior": "Проектирует полноценный контент-завод: команда 5-10+ человек + AI-инструменты. Строит end-to-end процессы от идеи до дистрибуции. Внедряет генеративный AI в производство. Создает масштабируемую систему 200+ единиц/месяц. Автоматизирует дистрибуцию по платформам. KPI: 200+ единиц/месяц стабильно, time-to-market сокращен в 3 раза, 70%+ рутины автоматизировано"}, {"name": "Рост аудитории и подписчиков", "junior": "Ведет аккаунт без системной стратегии роста. Полагается на органический рост без активных механик. Не тестирует форматы для привлечения аудитории. Не анализирует источники новых подписчиков. Подход: публикуй и жди", "middle": "Внедряет механики роста: коллаборации, кросс-постинг, интерактивы, гивэвэи. Анализирует источники прироста подписчиков. Тестирует форматы (reels, shorts, карусели) для охвата. Выходит на новые платформы по приоритету. KPI: рост подписчиков 15-25% в квартал, выход на 2-3 новые платформы", "senior": "Создает viral loops и системные механики привлечения. Выстраивает партнерскую сеть для роста охвата. Запускает ambassador-программы. Анализирует и масштабирует лучшие форматы через AI. Строит предсказуемую систему роста по каждой платформе. KPI: рост подписчиков 40%+ в квартал, 5+ активных платформ, органический охват x3 за год"}, {"name": "Конверсия охвата в регистрации", "junior": "Размещает посты с общими CTA без оптимизации. Не отслеживает путь от поста до регистрации. Не тестирует офферы и формулировки. Фокус на лайках и охвате, а не регистрациях. Инструменты: стандартные ссылки в bio, базовые CTA в постах", "middle": "Выстраивает воронку: контент → CTA → посадочная → регистрация. Тестирует разные CTA, форматы и офферы. Сегментирует контент по этапам воронки (awareness/consideration/conversion). Отслеживает CR по платформам. KPI: CR из охвата в регистрации растет на 20-40%, цена органической регистрации снижается на 25%", "senior": "Строит омниканальную систему конверсии через все платформы. Внедряет retargeting через контент (nurturing sequence). Создает персонализированные воронки под сегменты аудитории. Автоматизирует follow-up через чат-боты. Использует predictive контент для максимизации конверсии. KPI: CR из органики сопоставим с платным трафиком, стоимость органической регистрации ниже платной на 30%+"}, {"name": "Аналитика и принятие решений на основе данных", "junior": "Собирает стандартную статистику из кабинетов соц. сетей. Смотрит на охваты, лайки, подписчиков. Не связывает SMM-метрики с бизнес-результатами. Фокус на vanity metrics. Инструменты: встроенная аналитика Instagram/VK/Telegram, простые таблицы", "middle": "Строит сводные дашборды по всем платформам. Связывает контент-метрики с регистрациями и выручкой. Проводит когортный анализ вовлеченности. Рассчитывает стоимость органической регистрации. Готовит executive-отчеты для руководства. KPI: прозрачность ROI по каналам 90%+, подготовка отчетов автоматизирована на 60%", "senior": "Создает единую систему аналитики SMM + продажи. Строит предиктивные модели: какой контент даст регистрации. Внедряет attribution для органических каналов. Автоматизирует принятие решений о контенте на основе данных. Влияет на стратегию всего маркетинга через SMM-инсайты. KPI: точность прогнозов регистраций 85%+, SMM обеспечивает 30%+ предсказуемой выручки от органики"}, {"name": "Управление командой", "junior": "Не управляет людьми напрямую. Может ставить задачи 1-2 фрилансерам. Не выстраивает системных процессов взаимодействия. Фокус на личной эффективности. Scope: самостоятельная работа, взаимодействие с 1-2 подрядчиками", "middle": "Управляет командой 2-5 человек (копирайтер, дизайнер, SMM-специалист). Проводит регулярные синхронизации и 1:1. Ставит задачи, дает обратную связь, развивает навыки. Участвует в найме. KPI: удержание команды 90%+, производительность команды растет на 20%+ в квартал", "senior": "Строит организационную структуру контент-завода (7-12+ человек). Внедряет PDP для всех сотрудников. Формирует редакционную культуру и стандарты качества. Выстраивает систему мотивации и роста внутри команды. Развивает внутренних лидеров. KPI: eNPS команды 50+, внутренние промоушены 20%+ в год, время закрытия вакансий менее 30 дней"}, {"name": "Организация редакционных процессов", "junior": "Следует установленному контент-плану. Не видит процесс целиком. Эскалирует проблемы производства руководству. Соблюдает дедлайны по своим задачам. Примеры: публикация по расписанию, заполнение таблиц, базовые согласования", "middle": "Выстраивает редакционный процесс от идеи до публикации. Создает брифы, чек-листы, шаблоны. Внедряет инструменты управления контентом (Notion, Trello, Airtable). Сокращает time-to-publish. Контролирует качество. KPI: сокращение цикла производства на 30%, % контента вышедшего в срок 90%+", "senior": "Проектирует end-to-end редакционную архитектуру. Строит интегрированные системы управления контентом. Внедряет AI для ускорения каждого этапа производства. Создает процессы масштабирования и тиражирования успешных форматов. Результат: 200+ единиц/мес без потери качества, time-to-publish сокращен в 3 раза, автономность контент-завода 80%+"}, {"name": "Управление гипотезами / Growth-подход", "junior": "Запускает контент без формулировки гипотез. Не структурирует эксперименты. Не документирует, что сработало. Полагается на интуицию. Подход: пробуем форматы хаотично, без системы", "middle": "Формулирует четкие гипотезы по форматам и офферам. Проводит A/B тесты с измеримыми результатами. Ведет базу знаний по экспериментам. Масштабирует то, что работает. KPI: 10+ гипотез в месяц, 25%+ success rate, 3+ выигравших теста внедрено в регулярную работу", "senior": "Создает культуру continuous experimentation в SMM. Внедряет growth loops для органического роста. Автоматизирует тестирование форматов через AI. Строит систему быстрого масштабирования побед. KPI: рост ключевых метрик 20%+ в квартал через эксперименты, 100+ гипотез в год, экспоненциальный рост охвата"}, {"name": "Инструменты и AI в SMM", "junior": "Работает с базовым набором: кабинеты соц. сетей, Canva, ChatGPT для текстов. Ограниченное понимание автоматизации. Не интегрирует инструменты в систему. Инструменты: Instagram/VK/TG, Canva, базовые планировщики", "middle": "Активно тестирует и внедряет новые инструменты для команды. Строит стек: планировщик + аналитика + дизайн + AI-текст + дистрибуция. Автоматизирует рутинные задачи. Интегрирует платформы между собой. KPI: 5+ новых инструментов внедрено за год, автоматизация 40%+ рутины. Инструменты: SMMplanner, Lately, Metricool, CapCut, Midjourney, GPT-4", "senior": "Проектирует полноценный AI-powered контент-стек. Использует генеративный AI для масштабного производства. Создает собственные промпты и рабочие процессы. Внедряет автодистрибуцию по платформам. KPI: AI обеспечивает 50%+ прироста объема контента, full-stack автоматизация дистрибуции. Инструменты: кастомные GPT, Make/n8n, специализированные AI-платформы"}, {"name": "Понимание аудитории и контентное позиционирование", "junior": "Создает контент по готовым брифам /* ================= CLAUDE ================= */
async function callClaude({system,messages,max_tokens,effort}){
  const key=($("#apikey").value||"").trim();if(!key)throw new Error("no-key");
  const model=$("#model").value;
  const body={model,max_tokens:max_tokens||8000,system:[{type:"text",text:system,cache_control:{type:"ephemeral"}}],messages};
  if(effort&&(model==="claude-opus-5"||model==="claude-sonnet-5"))body.output_config={effort};
  const res=await fetch(API_URL,{method:"POST",headers:{"content-type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify(body)});
  const data=await res.json().catch(()=>({}));
  if(!res.ok||data.type==="error")throw new Error((data.error&&data.error.message)||("HTTP "+res.status));
  return (data.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("").trim();
}
function errText(e){if(e.message==="no-key")return "Вставь ключ Claude API слева.";if(/Failed to fetch|NetworkError/i.test(e.message))return "Нет связи с api.anthropic.com (открой в Chrome).";return e.message||"Ошибка.";}
/* устойчивый парсер с починкой обрыва */
function balanceClose(s){let inStr=false,esc=false;const st=[];for(let i=0;i<s.length;i++){const ch=s[i];if(inStr){if(esc)esc=false;else if(ch==="\\")esc=true;else if(ch==='"')inStr=false;continue;}if(ch==='"')inStr=true;else if(ch==='{'||ch==='[')st.push(ch==='{'?'}':']');else if(ch==='}'||ch===']')st.pop();}let o=s;if(inStr)o+='"';o=o.replace(/[,\s]+$/,"");for(let i=st.length-1;i>=0;i--)o+=st[i];return o.replace(/,\s*([}\]])/g,"$1");}
function lastTopComma(s){let inStr=false,esc=false,last=-1;for(let i=0;i<s.length;i++){const ch=s[i];if(inStr){if(esc)esc=false;else if(ch==="\\")esc=true;else if(ch==='"')inStr=false;continue;}if(ch==='"')inStr=true;else if(ch===',')last=i;}return last;}
function parseJSON(s){let t=String(s||"").replace(/^﻿/,"").trim().replace(/^```[a-z]*\s*/i,"").replace(/```\s*$/,"").trim();const a=t.indexOf("{");if(a>0)t=t.slice(a);const b=t.lastIndexOf("}");if(b>0){try{return JSON.parse(t.slice(0,b+1).replace(/,\s*([}\]])/g,"$1"));}catch(_){}}let w=t;for(let k=0;k<500;k++){try{return JSON.parse(balanceClose(w));}catch(_){}const c=lastTopComma(w);if(c<0)break;w=w.slice(0,c);}throw new SyntaxError("не-JSON");}

/* ===== Диктофон (по кнопке, как диктофон — не Meet) ===== */
let DREC=null;
function openDictaphone(title,sub,onDone){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  const ov=document.createElement('div');ov.className='dov';
  ov.innerHTML='<div class="doc"><h3>'+esc(title||'Диктофон')+'</h3><div class="sub">'+esc(sub||'Нажми микрофон и говори. Повторное нажатие — пауза. Потом «Вставить текст».')+'</div>'+
    '<button class="mic" id="dmic">🎙</button>'+
    '<div class="dtrans" id="dtrans"><span style="color:#8a8b7e">Здесь появится расшифровка…</span></div>'+
    '<div class="dwrap"><button class="btn ghost" id="dcancel">Отмена</button><button class="btn primary" id="dok">Вставить текст</button></div>'+
    (SR?'':'<div class="note" style="margin-top:10px">Живая расшифровка работает в Chrome. В другом браузере — надиктуй системным способом и вставь руками.</div>')+'</div>';
  document.body.appendChild(ov);
  let text='',listening=false;
  const trans=ov.querySelector('#dtrans'),mic=ov.querySelector('#dmic');
  function paint(interim){trans.innerHTML=(text?esc(text):'')+(interim?'<span class="interim"> '+esc(interim)+'</span>':'')||'<span style="color:#8a8b7e">Здесь появится расшифровка…</span>';trans.scrollTop=trans.scrollHeight;}
  function stop(){if(DREC){try{DREC.stop();}catch(_){}}listening=false;mic&&mic.classList.remove('rec');}
  function close(){stop();DREC=null;ov.remove();}
  mic.onclick=()=>{
    if(!SR){alert('Живая расшифровка доступна в Chrome.');return;}
    if(listening){stop();return;}
    DREC=new SR();DREC.lang='ru-RU';DREC.continuous=true;DREC.interimResults=true;
    DREC.onresult=e=>{let interim='';for(let i=e.resultIndex;i<e.results.length;i++){const r=e.results[i];if(r.isFinal)text+=(text?' ':'')+r[0].transcript.trim();else interim+=r[0].transcript;}paint(interim);};
    DREC.onerror=ev=>{trans.innerHTML+='<div class="interim">⚠ '+esc(ev.error||'')+' (разреши доступ к микрофону)</div>';};
    DREC.onend=()=>{listening=false;mic.classList.remove('rec');};
    try{DREC.start();listening=true;mic.classList.add('rec');}catch(_){}
  };
  ov.querySelector('#dcancel').onclick=close;
  ov.querySelector('#dok').onclick=()=>{const t=text.trim();close();if(t&&onDone)onDone(t);};
  ov.onclick=e=>{if(e.target===ov)close();};
}
window.openDictaphone=openDictaphone;

/* контекст для генераторов */
function ctxText(){
  let t="КОМПАНИЯ: "+(S.company||"—")+" · НИША: "+(S.niche||"—")+" · РОЛЬ: "+(S.role||"—")+"\n";
  t+="ТОП-3 РЕЗУЛЬТАТА ЗА КВАРТАЛ: "+(S.top3.filter(Boolean).join(" | ")||"—")+"\n\n";
  t+="БРИФ ДОЛЖНОСТИ:\n";
  BRIEF.forEach(bl=>{const ans=(S.brief[bl.id]||[]);bl.qs.forEach((q,i)=>{if(ans[i])t+="• "+q+": "+ans[i]+"\n";});});
  if(S.portrait&&S.portrait.skills){t+="\nПОРТРЕТ НАВЫКОВ (выбранные грейды):\n";S.portrait.skills.forEach(sk=>{const g=(S.portrait.sel&&S.portrait.sel[sk.name])||"";const top=(S.portrait.top5||[]).includes(sk.name)?" [ТОП-5]":"";if(g)t+="• "+sk.name+": целевой грейд "+g+top+"\n";});}
  return t;
}

  const vals=SC_STAGES.map(s=>scNum(c.sc&&c.sc[s.k])).filter(v=>v!==null);

  const stop=SC_STAGES.some(s=>{const v=scNum(c.sc&&c.sc[s.k]);return v!==null&&v<=4;});
  return {sum:sum,avg:avg,n:vals.length,stop:stop};

function todayISO(){const t=new Date();return new Date(t.getTime()-t.getTimezoneOffset()*60000).toISOString().slice(0,10);}

      v.days=[];

      src.forEach(x=>v.days.push({d:x.d,v:Object.assign({},x.v)}));

    }
    if(!v.opened)v.opened=(v.days[0]&&v.days[0].d)||todayISO();
