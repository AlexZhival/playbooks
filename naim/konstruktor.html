ёт тренды в нише, а не следует им"}, {"name": "Personal Brand Development (Развитие личного бренда)", "junior": "Поддерживает личный бренд по заданным стандартам • Следует гайдлайнам по визуальной подаче, тону, стилю • Ведёт соцсети по контент-плану, отвечает на комментарии • Поддерживает профессиональный образ: внешний вид, речь, подача • Понимает свою ЦА и что для неё важно • Готовит простые промо-материалы: посты, анонсы", "middle": "Системно развивает бренд и управляет позиционированием • Чёткое позиционирование: «Я — это [X] для [Y] аудитории» • Управляет присутствием на 3+ платформах одновременно • Выстраивает storytelling: личная история, ценности, кейсы трансформаций • Организует коллаборации с другими экспертами и медиа • Инвестирует в образ: физическая форма, визаж, ораторство • Растит лояльную базу с целевым engagement rate", "senior": "Бренд стал самостоятельным активом, генерирующим доверие и продажи • Признанный лидер мнений: приглашения на подкасты, конференции, медиа • Бренд = канал продаж: аудитория покупает потому что доверяет эксперту • Управляет репутацией: мониторинг, антикризис, работа с негативом • Бренд-экосистема: каналы, подкасты, рассылки, мероприятия • Legacy-контент — материалы, приносящие трафик и доверие годами • «Эффект ореола» — всё, связанное с именем эксперта, воспринимается как качество"}, {"name": "Product Development (Разработка продуктов)", "junior": "Участвует в создании продукта как эксперт-консультант • Даёт экспертный контент для модулей и уроков • Проверяет фактическую корректность материалов • Записывает уроки по готовым сценариям • Тестирует продукт как первый пользователь • Даёт обратную связь методологу и продюсеру", "middle": "Лидирует разработку продукта от концепции до запуска • Формулирует уникальную методологию на основе экспертизы • Разрабатывает структуру программы: модули, логика, результат на выходе • Проектирует «путь трансформации» клиента от точки А к точке Б • Интегрирует обратную связь учеников в улучшение продукта • Обеспечивает целевую доходимость до конца программы • Запускает новый продукт каждые 6–12 месяцев", "senior": "Строит продуктовую линейку как экосистему с растущим LTV • Продуктовая лестница: бесплатный контент → недорогой → флагман → премиум • Каждый продукт усиливает продажи следующего (cross-sell, upsell) • Внедряет инновации: геймификация, AI-персонализация, комьюнити • NPS ≥ 8, повторные покупки на целевом уровне • Масштабирует продукты на новые рынки и аудитории • Продуктовая линейка генерирует предсказуемый ежемесячный доход"}, {"name": "Video & Media Platform Management (Управление видео и медиа-платформами)", "junior": "Понимает базовые механики платформ и участвует в производстве • Знает метрики: просмотры, CTR превью, retention, подписки • Готовится к съёмкам: учит текст, работает с суфлёром • Понимает разницу форматов: лонг, шортс, стрим, подкаст • Участвует в выборе тем на основе данных от команды • Даёт комментарии по монтажу и визуалу", "middle": "Управляет ростом каналов и системно повышает качество • Анализирует аналитику платформ: какой контент растёт и почему • Оптимизирует retention: хук → проблема → решение → CTA • Управляет SEO и дистрибуцией контента • Тестирует форматы, выявляет «формулы успеха» для канала • Растит каналы ≥ 20% в год по аудитории • Координирует продакшн-пайплайн: съёмки → монтаж → публикация", "senior": "Медиа-каналы = предсказуемая машина трафика и прогрева • Каналы стабильно дают целевой уровень просмотров и вовлечённости • Выстроена воронка: контент → регистрация → вебинар → продажа • Алгоритмы платформ «работают на канал» — контент получает рекомендации • Контент-план привязан к бизнес-календарю запусков • Команда продакшна работает автономно • Эксперт фокусируется только на содержании и съёмке"}, {"name": "Public Speaking & Presentation (Публичные выступления и презентации)", "junior": "Выступает перед камерой и небольшой аудиторией • Уверенно говорит на камеру 10–15 мин без потери структуры • Использует понятный язык, избегает жаргона • Проводит прямой эфир / вебинар по готовому сценарию • Работает с базовыми инструментами: презентация, доска • Получает положительную обратную связь от аудитории", "middle": "Удерживает внимание большой аудитории и конвертирует в действие • Вебинары на 500+ участников с целевым CR • Владеет приёмами: паузы, истории, вопросы залу, интерактив • Адаптирует подачу: новички vs продвинутые, онлайн vs оффлайн • Выступает на внешних конференциях и мероприятиях • Структура: боль → усиление → решение → доказательства → CTA • Инвестирует в ораторское мастерство как профнавык", "senior": "Выступления = мощный инструмент продаж и укрепления бренда • Каждое выступление генерирует измеримый бизнес-результат • Хедлайнер на крупных отраслевых мероприятиях • TEDx-уровень подачи: эмоция + структура + инсайт • «Ивент-воронка»: выступление → контент → прогрев → продажа • Обучает других спикеров команды навыкам выступлений • Приглашения выступить = маркер экспертного авторитета"}, {"name": "Audience Analytics & Metrics (Аналитика аудитории и метрик)", "junior": "Понимает базовые метрики и читает отчёты • Знает: просмотры, подписчики, engagement rate, CTR • Читает дашборды, понимает тренды «растёт / падает» • Передаёт наблюдения команде аналитики • Понимает связь контент → бизнес на базовом уровне • Отслеживает свои личные KPI", "middle": "Принимает решения по контенту и продуктам на основе данных • Анализирует retention-кривые: где аудитория уходит и почему • Сегментирует аудиторию: кто смотрит, кто покупает, кто уходит • Связывает контент-метрики с воронкой продаж • A/B тесты тем, превью, форматов • Отслеживает NPS и доходимость программ • Формулирует гипотезы на основе данных и проверяет их", "senior": "Строит систему метрик, связывающую контент с P&L компании • Полная картина: контент → трафик → регистрации → продажи → LTV • Unit-экономика контента: стоимость производства vs генерируемая выручка • Прогнозирует результаты запусков на основе данных • Задаёт требования к аналитической инфраструктуре • Данные = основа стратегических решений по развитию • Прозрачность ROI каждого направления экспертной деятельности"}, {"name": "Expertise Development (Развитие профессиональной экспертизы)", "junior": "Учится по рекомендациям, поддерживает базовый уровень • Проходит обязательные курсы и сертификации • Читает профессиональную литературу • Поддерживает профессиональный образ и форму • Посещает отраслевые мероприятия как участник • Применяет новые знания в контенте по подсказке наставника", "middle": "Системно инвестирует в рост и сразу интегрирует новые знания • ≥ 2 крупных обучения в год в профессиональной области • Каждое знание → контент, модуль продукта или методика • Развивает смежные навыки: ораторство, визуал, копирайтинг • Поддерживает профессиональный образ и подачу • ≥ 20% времени в календаре — на профразвитие • Формирует сеть профконтактов для обмена опытом", "senior": "Признанный лидер экспертизы в нише, задаёт стандарты • Создаёт собственные методологии, которые цитируют другие • Публикуется, участвует в исследованиях • Первым тестирует и внедряет новейшие подходы • Интеграция нового знания в продукт за 1–2 месяца • Рост в глубину (специализация) и в ширину (смежные области) • Профразвитие = приоритет №1, защищённый в календаре"}, {"name": "Monetization & Funnel Architecture (Монетизация и архитектура воронок)", "junior": "Понимает как контент связан с продажами • Знает воронку: контент → подписка → прогрев → продажа • Ставит CTA в контент по инструкции • Понимает что такое запуск, прогрев, вебинар, автоворонка • Участвует в запусках как эксперт-спикер • Понимает влияние своей работы на выручку", "middle": "Проектирует свою часть воронки и влияет на конверсию • Создаёт прогревочный контент, повышающий готовность к покупке • Вебинары/эфиры с измеримым CR в продажу • Улучшает «мостик» контент → продажи: доходимость, вовлечение • Работает с отделом продаж: поставляет прогретых лидов • Контент-календарь синхронен с бизнес-календарём запусков • Тестирует офферы и темы прогрева", "senior": "Экспертная деятельность = предсказуемая и масштабируемая выручка • Контент-экосистема = машина привлечения и прогрева • Каждый вебинар — предсказуемая конверсия на основе данных • Монетизация через несколько каналов и форматов • Поднимает уровень знаний аудитории до продукта • Модель повторных продаж через доверие и результат • Воронка автономна: команда исполняет, эксперт — на контенте"}, {"name": "Creative Thinking & Vision (Креативное мышление и видение)", "junior": "Генерирует идеи в рамках заданного направления • Предлагает темы на основе трендов и запросов аудитории • Придумывает интересный заход для видео или поста • Участвует в брейнштормах, развивает чужие идеи • Замечает интересные форматы у других и предлагает адаптации • Находит примеры и метафоры для сложных тем", "middle": "Создаёт концепции и форматы, выделяющие бренд среди конкурентов • Придумывает уникальные серии, рубрики и форматы • Видит неочевидные связи, создаёт «инсайтный» контент • Превращает сложные знания в увлекательные истории • Создаёт продуктовые концепции на стыке экспертизы и спроса • Экспериментирует: коллабы, челленджи, документальные проекты • «Чувствует» что зайдёт аудитории до подтверждения данными", "senior": "Задаёт видение развития бренда и продуктов на 2–3 года • Стратегическое видение: куда движется ниша и как быть лидером • «Прорывные» идеи, создающие новые категории продуктов • Синтез трендов, потребностей аудитории и бизнес-целей • Legacy-проекты — контент и продукты, работающие годами • Команда вдохновлена видением и понимает «зачем мы это делаем» • Культура «мы не повторяем — мы создаём»"}, {"name": "Communication & Influence (Коммуникация и влияние)", "junior": "Ясно доносит свои мысли и экспертизу • Объясняет сложные темы простым языком • Уверенно общается с командой: задачи, обратная связь • Слушает аудиторию и считывает её запросы • Поддерживает позитивную коммуникацию в команде • Отвечает на вопросы аудитории с эмпатией и авторитетом", "middle": "Влияет на поведение аудитории и эффективно работает с командой • Мотивирует аудиторию к действию через контент • Эффективно делегирует творческие задачи • Ведёт переговоры с партнёрами, гостями, организаторами • Управляет конфликтами: негатив в комментах, несогласие в команде • Формулирует чёткое ТЗ с первого раза • Строит доверительные отношения с ключевыми людьми", "senior": "Лидер мнений, меняющий мышление аудитории и вдохновляющий команду • Меняет убеждения аудитории через экспертный контент • Формирует культуру: «эксперт — партнёр, а не исполнитель» • Влияет на стратегические решения компании • Сообщество вокруг бренда, участники = амбассадоры • Команда автономна, потому что понимает видение и стандарты • К мнению эксперта прислушивается вся индустрия"}, {"name": "Self-Management & Energy (Самоменеджмент и управление ресурсом)", "junior": "Выполняет график и поддерживает базовую продуктивность • Приходит на съёмки подготовленным и в рабочем состоянии • Соблюдает дедлайны контент-плана • Поддерживает здоровье и форму на базовом уровне • Переключается между режимами: съёмка, создание, отдых • Не выгорает от рутинных задач", "middle": "Управляет временем и энергией как стратегическим ресурсом • Разделяет время на «зоны»: творчество, съёмки, обучение, отдых • Защищает творческое время от операционки • Инвестирует в восстановление: спорт, сон, подготовка к съёмкам • Делегирует всё, что не требует личного участия • Планирует неделю с временем «поднять голову и подумать» • Поддерживает уровень энергии для харизматичной подачи", "senior": "Максимальная продуктивность, фокус на зонах наибольшего влияния • 80% времени — экспертная деятельность (контент, продукты, обучение) • ≤ 20% — координация, потому что команда автономна • Все «пожиратели времени» делегированы: созвоны по мелочам, администрирование • Профессиональная подготовка — обязательный элемент расписания • Выделенное время на обучение и саморазвитие • Эксперт в ресурсном состоянии для долгосрочной игры"}, {"name": "Audience Obsession (Одержимость аудиторией)", "junior": "Слушает аудиторию и реагирует на запросы • Читает комментарии, отвечает на вопросы • Собирает обратную связь от участников программ • Понимает боли и запросы ЦА • Относится к аудитории с уважением и эмпатией • Передаёт инсайты от аудитории команде", "middle": "Контент и продукты исходят из глубокого понимания аудитории • Регулярно общается с клиентами: эфиры, разборы, Q&A • Продуктовые решения на основе обратной связи • Знает сегменты: новички, продвинутые, скептики • Проектирует путь клиента от первого касания до повторной покупки • Измеряет и улучшает NPS • Вовлечённость растёт от квартала к кварталу", "senior": "Аудитория — центр всех бизнес-решений, доверие — главный актив • Повторные покупки и рекомендации = основной канал роста • NPS на уровне лучших в нише, аудитория сама продвигает бренд • Каждый продукт решает реальную проблему, а не «продаёт мечту» • Доверие настолько высоко, что покупают без долгого прогрева • Комьюнити, где участники помогают друг другу и растут вместе • Аудитория чувствует: «этот эксперт реально заботится о моём результате»"}, {"name": "Continuous Learning & Growth (Непрерывное обучение и рост)", "junior": "Учится по необходимости и запросу • Проходит обязательные обучения и сертификации • Открыт к обратной связи и корректировке подхода • Интересуется новинками в своей области • Читает профессиональную литературу • Применяет полученные знания в работе", "middle": "Обучение = постоянная привычка, интегрированная в процесс • ≥ 2 крупных обучения в год + интеграция в контент и продукты • Ищет лучших учителей в мире, а не ближайших и удобных • Делится знаниями с командой и аудиторией • Экспериментирует с новыми форматами и подходами • Каждая неудача = урок → контент или улучшение продукта • Инвестирует в профессиональное и личностное развитие", "senior": "Задаёт стандарт обучения для компании и индустрии • «Первый ученик» — команда видит постоянный рост эксперта • Новейшие подходы интегрируются в продукты за 1–2 месяца • Создаёт собственные методологии — стандарт в нише • Бюджет на обучение = стратегическая инвестиция компании • Система: обучение → тест → контент → продукт → выручка • Рост экспертизы = рост бизнеса, вся компания это понимает"}, {"name": "Partnership Mindset (Партнёрское мышление)", "junior": "Понимает что является частью команды • Уважает роли и вклад других участников • Вовремя предоставляет свою часть: контент, записи, фидбэк • Готов помочь коллегам когда нужно • Участвует в обсуждениях конструктивно • Понимает что бизнес-результат — общая ответственность", "middle": "Действует как партнёр, а не «звезда» или «наёмный сотрудник» • Решения с учётом интересов бизнеса, а не только своих • Берёт ответственность за метрики: выручку, конверсии, рост • Инициирует проекты, не ждёт задач • Продуктивные отношения с каждым отделом • Готов к сложным разговорам: результаты, фидбэк, корректировка • Вкладывается в развитие команды, а не только в своё", "senior": "Эксперт и бизнес = единая система, рост одного усиливает другое • Стратегические решения принимаются совместно • Экспертная деятельность синхронизирована с бизнес-целями • Мотивация привязана к результатам компании, а не только к личным KPI • Строит команду, которая усиливает эксперта, а не зависит от него • Модель, где эксперт фокусируется на зонах наибольшего влияния • Взаимное уважение и чёткое разделение ответственности"}], "Recruiter HR Generalist": [{"name": "Sourcing & поиск кандидатов", "junior": "Размещает вакансии на hh.ru, SuperJob, в Telegram-каналах по шаблону. Использует базовые фильтры поиска в резюме-базе. Ждёт входящих откликов и обрабатывает их. Знает, какие поля заполнять в вакансии, чтобы она была видна в поиске. Результат: получает 20+ откликов на стандартную вакансию в течение 3-5 дней.", "middle": "Ведёт активный поиск: Boolean-операторы в hh.ru и LinkedIn, холодные сообщения кандидатам, работа с нишевыми Telegram-каналами. Под каждую вакансию выстраивает микс из 3-5 каналов. Строит и ведёт базу кандидатов, не теряет «почти подходящих» - они становятся приоритетом на следующую похожую роль. Результат: 80% вакансий закрывается в срок без привлечения агентств.", "senior": "Выстраивает систему sourcing как конкурентное преимущество компании: реферальная программа с механикой и финансовой мотивацией, AI-скоринг откликов через ChatGPT-промпты (экономия 3-3,5 часа в день), партнёрства с вузами и профсообществами. Каждый канал считается по ROI. Знает стоимость кандидата из каждого источника. Результат: стоимость вывода 1 сотрудника снижается на 30-50% по отношению к рынку (с ~30 000 до 5 000 руб. на массовых позициях)."}, {"name": "Скрининг и проведение интервью", "junior": "Проводит телефонный скрининг по готовому чек-листу: уточняет мотивацию, зарплатные ожидания, опыт по ключевым требованиям. Задаёт вопросы по резюме, отсеивает явно нерелевантных. Опирается на шаблон, нестандартные ситуации выносит руководителю. Результат: передаёт нанимающему менеджеру 3-5 финалистов, прошедших базовую проверку.", "middle": "Проводит структурированное интервью по компетенциям методом STAR: ситуация → задача → действие → результат. Оценивает не только hard skills, но и soft skills и культурный fit. Разбирает кейсы и ситуационные вопросы. Умеет «раскрыть» зажатого кандидата и удержать разговор с уверенным. Даёт нанимающему менеджеру структурированную обратную связь по каждому кандидату. Результат: 70% офферов принимается, 80%+ прошедших испытательный срок.", "senior": "Разрабатывает Interview Guide под каждую роль: список компетенций, индикаторы A/B/C уровня, обязательные вопросы, красные флаги. Проводит калибровочные сессии с нанимающими менеджерами, выравнивает понимание «кто нам нужен». Обучает руководителей проводить интервью и снижать субъективность оценки. Результат: оценка кандидатов единообразна по всей компании, % «случайных» наймов стремится к нулю."}, {"name": "Воронка найма и ATS", "junior": "Ведёт таблицу кандидатов в Excel или Google Sheets. Фиксирует статусы, даты, комментарии. Следит, чтобы ни один кандидат не «потерялся». Знает, на каком этапе находится каждый человек. Результат: воронка прозрачна для руководителя, нет потерянных кандидатов, актуальные статусы всегда под рукой.", "middle": "Настраивает и ведёт ATS (Huntflow, HireBase, Talantix): этапы, теги, поля, права доступа. Считает метрики воронки: conversion rate по этапам, time-to-hire, cost-per-hire. Видит, где воронка «провисает», и предлагает конкретные действия. Готовит еженедельный отчёт по воронке для руководителя. Результат: данные позволяют принимать решения об оптимизации процесса, а не просто фиксировать факты.", "senior": "Строит автоматизированную воронку: авто-ответы кандидатам, триггерные напоминания, AI-скоринг резюме, интеграция ATS с HRIS и CRM. Система работает без ручного контроля на рутинных этапах. Внедряет AI-рекрутинговые инструменты (Neuro.net / Tomoru для первичного скрининга на массовых позициях, N8N-автоматизации). Результат: рекрутер экономит 2-3 часа в день, данные синхронизированы между системами, стоимость вывода падает кратно."}, {"name": "Онбординг и адаптация", "junior": "Готовит Welcome-пакет: документы, доступы, знакомство с командой, первый рабочий день по чек-листу. Контролирует оформление. Передаёт новому сотруднику понимание «к кому идти с каким вопросом». Результат: новый сотрудник оформлен в первый день, не потерян на старте, чувствует что его ждали.", "middle": "Ведёт план адаптации 30-60-90 дней: что должен знать и уметь новый сотрудник к каждой вехе. Проводит check-in встречи на 2-й неделе, в конце первого месяца и на выходе испытательного срока. Собирает обратную связь от нового сотрудника и от его руководителя. Фиксирует риски и управляет ими. Результат: 85%+ сотрудников успешно проходят испытательный срок, руководитель не «теряет» нового человека.", "senior": "Проектирует onboarding-систему для всей компании: LMS с обязательными курсами, ролевые треки адаптации (разные для продаж, продукта, операционки), база знаний, автоматизированные напоминания и чек-листы. Замеряет NPS онбординга. Регулярно обновляет программу на основе данных. Результат: время до полной продуктивности нового сотрудника сокращено на 30-40%, онбординг работает без постоянного ручного контроля HR."}, {"name": "Кадровое делопроизводство (КДП)", "junior": "Оформляет трудовые договоры, приказы о приёме/увольнении/переводе по шаблонам. Ведёт личные дела сотрудников. Заполняет документы без ошибок, проверяет подписи и даты. Результат: все документы оформлены корректно и в срок, база личных дел актуальна.", "middle": "Самостоятельно ведёт полное КДП: приём, перевод, отпуска, больничные, увольнения — включая «сложные» кейсы (сокращение, дисциплинарные взыскания). Знает ТК РФ / локальное трудовое право. Консультирует руководителей по трудовым вопросам. Результат: 0 штрафов по итогам проверок, руководители не совершают незаконных действий по незнанию.", "senior": "Выстраивает систему КДП как процесс: шаблоны документов, регламенты, автоматизация через КЭДО (кадровый электронный документооборот). Готовит компанию к трудовым и налоговым проверкам. Знает, как структурировать оформление при нестандартных моделях занятости (самозанятые, ИП, гибридные команды). Результат: КДП работает как система, а не как ручная рутина; HR-аудит проходит без замечаний."}, {"name": "HR-метрики и аналитика", "junior": "Считает базовые показатели: количество закрытых вакансий, time-to-hire, активные позиции в работе. Ведёт таблицы в Excel. Предоставляет данные по запросу руководителя. Результат: данные собраны, актуальны, нет «потерянных» цифр.", "middle": "Самостоятельно считает и интерпретирует: turnover (общий и по категориям A/B/C), eNPS и его динамику, retention на испытательном сроке, укомплектованность штата, стоимость вывода сотрудника. Делает выводы: «вот что это значит и вот что я предлагаю делать». Готовит HR-дашборд для CEO раз в месяц. Результат: руководитель принимает HR-решения на основе данных, а не ощущений.", "senior": "Строит HR-аналитику как систему: дашборд в Google Looker / Power BI, когортный анализ оттока (кто уходит — по стажу, по отделу, по менеджеру), прогноз потребности в найме под бизнес-план. Мониторит активность сотрудников на hh.ru (открытые резюме = ранний сигнал риска ухода). Результат: HR-функция работает проактивно — проблемы обнаруживаются до того, как человек подаёт заявление."}, {"name": "AI-инструменты в рекрутинге", "junior": "Использует ChatGPT для написания текстов вакансий, писем кандидатам, базовых скриптов скрининга. Знает, что такое AI-скоринг резюме, но не внедрял самостоятельно. Результат: тексты вакансий создаются быстрее, качество коммуникации с кандидатами выше.", "middle": "Применяет AI-скоринг резюме: составляет структурированный промпт с критериями вакансии (высокий/средний/низкий приоритет), загружает пачку резюме, получает ранжированный список с комментариями. Экономит 3-3,5 часа скрининга в день. Использует AI для генерации вопросов интервью под конкретный профиль. Результат: скрининг 100+ откликов занимает 20-30 минут вместо нескольких часов.", "senior": "Проектирует AI-воронку найма: голосовые роботы для первичного скрининга массовых позиций (Neuro.net, Tomoru), N8N-автоматизации для всей цепочки касаний с кандидатом. Оценивает AI-инструменты по главной метрике: стоимость вывода 1 сотрудника. Если нет экономического эффекта — закрывает эксперимент. Если есть — масштабирует. Результат: стоимость вывода линейного сотрудника с 30 000 руб. сокращается до 5 000 руб. (кейс Skyeng)."}, {"name": "Коммуникация с кандидатами", "junior": "Вежливо и вовремя отвечает на все отклики. Даёт обратную связь по итогам интервью — даже отказным кандидатам. Не исчезает после «мы вам перезвоним». Результат: кандидаты не жалуются на игнорирование, отзывы об HR на hh.ru нейтральные или положительные.", "middle": "Умеет «продавать» компанию сильному кандидату, который выбирает между несколькими офферами. Работает с возражениями: деньги, удалёнка, название должности, испытательный срок. Знает, что важно конкретному кандидату, и акцентирует именно это. Результат: 80%+ офферов принимается с первого раза, кандидаты выходят вовремя.", "senior": "Управляет Candidate Experience как системой: от первого касания до выхода на работу. Формирует HR-бренд через качество коммуникации с рынком — каждый отказной кандидат остаётся амбассадором компании. Отвечает на негативные отзывы на hh.ru в течение 48 часов. Результат: входящий поток кандидатов растёт органически, рейтинг работодателя на hh.ru ≥ 4.0."}, {"name": "Работа с нанимающим менеджером", "junior": "Уточняет профиль вакансии по стандартному брифу: требования, задачи, условия, сроки. Согласовывает кандидатов и даты интервью. Информирует менеджера о статусе его вакансий. Результат: нанимающий менеджер всегда в курсе, нет сюрпризов и потерянных договорённостей.", "middle": "Управляет ожиданиями: когда требования нереалистичны — показывает данные рынка и корректирует запрос. Инициирует калибровочную встречу после первых 2-3 кандидатов, чтобы выровнять критерии оценки. Умеет сказать «такого кандидата за такие деньги не существует» и предложить альтернативу. Результат: вакансии не «зависают» из-за завышенных ожиданий, первый оффер чаще всего принимается.", "senior": "Выступает консультантом для руководителей по рынку труда: зарплатные вилки, дефицитные профили, сроки закрытия, альтернативные решения (растить изнутри vs нанять). Руководители приходят к рекрутеру проактивно — за советом, а не только с горящей вакансией. Результат: найм планируется заблаговременно, компания не оказывается в ситуации «нужен человек вчера»."}, {"name": "Самоорганизация и приоритеты", "junior": "Ведёт 3-5 вакансий параллельно. Соблюдает договорённости по срокам при наличии внешнего контроля. Фиксирует все задачи и статусы в системе, ничего не держит «в голове». Результат: ни одна вакансия не «потеряна», дедлайны выполняются при нормальной нагрузке.", "middle": "Ведёт 8-15 вакансий одновременно, самостоятельно расставляет приоритеты: горящие позиции — сначала, менее срочные — не забыты. Сам отслеживает, где нужно ускориться, не ждёт, когда его спросят. Чётко понимает, что можно делегировать ресёрчеру, а что требует его личного участия. Результат: срочные вакансии закрываются в 2x быстрее нормы без потери качества.", "senior": "Управляет портфелем вакансий как системой, а не как списком задач. Распределяет нагрузку внутри команды, выстраивает процессы так, чтобы производительность не зависела от личного героизма. Видит узкие места раньше, чем они становятся проблемой. Результат: HR-команда закрывает вдвое больше вакансий без роста штата."}, {"name": "Ориентация на бизнес-результат", "junior": "Понимает, что каждая незакрытая вакансия — это стоп для бизнеса. Выполняет план по выводам, не ищет объяснений почему «рынок сложный». Результат: плановые вакансии закрыты в срок на 90%+.", "middle": "Видит прямую связь: скорость найма → укомплектованность штата → выручка. Считает стоимость незакрытой вакансии для бизнеса и использует это в разговоре с руководителем. Ищет способы ускорить процесс, не снижая качество отбора. Результат: time-to-hire ниже рыночного бенчмарка на 20%+.", "senior": "Управляет HR-рекрутинговой функцией как бизнес-юнитом со своим ROI. Может обосновать каждую статью бюджета: сколько это стоит и что приносит. Предлагает инициативы, которые снижают стоимость найма и увеличивают качество команды одновременно. Результат: HR воспринимается как инвестиция с измеримой отдачей, а не как центр затрат."}, {"name": "Конфиденциальность и этика", "junior": "Соблюдает базовые правила работы с персональными данными: не пересылает резюме посторонним, хранит данные в защищённых местах, не разглашает информацию об отказных кандидатах. Результат: 0 инцидентов с утечкой данных, кандидаты доверяют компании.", "middle": "Знает и применяет 152-ФЗ о персональных данных в работе: согласие на обработку, сроки хранения, правила удаления. Использует нейтральные, неискажённые критерии отбора — без дискриминации по полу, возрасту, внешности, месту жительства. Результат: компания защищена от претензий со стороны кандидатов и регуляторов.", "senior": "Выстраивает культуру этичного найма в компании: антидискриминационная политика, прозрачные критерии оценки, стандарты обратной связи кандидатам. Формирует репутацию работодателя, с которым безопасно и уважительно взаимодействовать — даже при отказе. Результат: HR-бренд компании не несёт репутационных рисков на рынке труда."}, {"name": "Непрерывное развитие и AI First", "junior": "Следит за HR-трендами: читает профильные Telegram-каналы (SoftRecruiting и др.), пробует новые инструменты по чужим рекомендациям. Результат: 1-2 новых инструмента или практики применяются в работе каждый квартал.", "middle": "Самостоятельно изучает и тестирует новые AI-инструменты в рекрутинге: AI-скоринг, голосовые роботы, автоматизации. Делится опытом с коллегами, документирует что сработало, а что — нет. Результат: HR-команда находится в топ по технологичности среди конкурентов в нише.", "senior": "Формирует AI First-культуру в HR: кандидаты без базовых AI-навыков на релевантных позициях не рассматриваются, AI-обучение обязательно для всех в HR-команде. Ведёт собственную базу знаний: что работает в рекрутинге, что нет, почему. Результат: HR-команда — один из лидеров по эффективности и технологичности в компании."}], "HRD": [{"name": "HR-стратегия и организационное проектирование", "junior": "Понимает бизнес-модель компании и связывает HR-задачи с бизнес-целями. Составляет HR-план на квартал по приоритетам CEO. Знает, что нужно решить прямо сейчас, а что — системная задача на горизонте. Результат: HR-план согласован с CEO, задачи расставлены по приоритетам, нет работы «в стол».", "middle": "Разрабатывает HR-стратегию на год: бизнес-цели → HR-задачи → конкретные инициативы → KPI. Проектирует структуру HR-отдела под размер и стадию компании. Определяет, какие HR-функции закрывает сам, какие делегирует, какие отдаёт на аутсорс. Результат: HR работает как целостная система, а не как набор несвязанных функций.", "senior": "Строит HR как бизнес-юнит с бюджетом, P&L и измеримым ROI. Проектирует оргструктуру компании на 2-3 года вперёд под стратегию роста. Рассчитывает потребность в персонале через WFM (Workforce Management): не фиксированный штат, а динамическая модель под план по лидам и выручке. Результат: компания всегда укомплектована в соответствии с бизнес-планом, HR-стратегия — часть общей стратегии на совете директоров."}, {"name": "Система найма и HR-бренд", "junior": "Знает все инструменты рекрутинга, лично ведёт поиск на топ-позиции (C-1, C-2). Умеет оценить кандидата на уровень C-suite: не только компетенции, но и ценностное совпадение, готовность работать в конкретной культуре. Результат: ключевые руководители наняты в срок, без привлечения агентств на большинство позиций.", "middle": "Выстраивает систему найма: профили должностей с грейдами Junior/Middle/Senior, воронки для каждой роли, SLA по срокам закрытия, Interview Guides. Управляет командой рекрутеров: ставит задачи, контролирует метрики, развивает. Результат: time-to-hire не превышает рыночный бенчмарк, стоимость найма снижается год к году.", "senior": "Строит HR-бренд работодателя как конкурентное преимущество: EVP (Employee Value Proposition), работа с отзывами на hh.ru, реферальная программа, партнёрства с вузами. Внедряет AI-рекрутинг: скоринг резюме, AI-роботы для массового найма. % вакансий, закрытых через рефералов, становится ключевым KPI. Результат: 30%+ вакансий закрываются через рефералов, входящий поток кандидатов растёт без увеличения бюджета на рекламу."}, {"name": "Оценка, развитие и удержание (Performance & L&D)", "junior": "Знает методологию оценки компетенций: STAR, 360, Assessment Center. Проводит Performance Review по шаблону. Умеет дать обратную связь сотруднику так, чтобы она мотивировала, а не демотивировала. Результат: ежегодная оценка проведена в срок, каждый сотрудник понимает свой результат.", "middle": "Проектирует систему оценки компании: грейды, матрицы компетенций (Junior/Middle/Senior), карьерные треки. Связывает оценку с ростом зарплаты и планом развития. Строит Performance Review как инструмент роста, а не формальную процедуру. Результат: сотрудники понимают, что нужно сделать для повышения; субъективность при принятии решений о росте устранена.", "senior": "Строит L&D-систему (Learning & Development): корпоративный университет или LMS, ролевые программы развития, менторинг, talent pipeline. Формирует преемственность: список кандидатов на каждую ключевую позицию с планом их подготовки. Знает, кто в компании потенциальный A-player следующего уровня. Результат: 70-80% ключевых позиций закрываются внутренним кандидатом, компания не зависит от рынка при каждом уходе руководителя."}, {"name": "C&B — Компенсации, льготы и удержание", "junior": "Знает структуру C&B: оклад, KPI-бонус, бенефиты. Умеет провести рыночный мониторинг зарплат через hh.ru и открытые источники. Понимает, что разные категории сотрудников мотивируют разные факторы (McKinsey: деньги важны junior, влияние — топам). Результат: предложения по зарплатам не выглядят оторванными от рынка, компания не теряет кандидатов на этапе оффера.", "middle": "Проектирует систему мотивации под разные роли: грейдовые вилки, бонусные схемы (фиксированный % vs KPI-зависимый), нематериальные льготы. Внедряет гибкий подход к бенефитам: вместо стандартного ДМС для всех — баллы на выбор (Benefactory-модель). Использует данные AMT Консалт для ежегодной калибровки. Результат: turnover A-players < 2% в месяц, компания конкурентоспособна по предложению.", "senior": "Строит Total Reward: деньги + нематериальная мотивация + карьера + культура. Выстраивает систему раннего предупреждения об оттоке: ежемесячный мониторинг резюме сотрудников на hh.ru, eNPS 2 раза в год через Happy Job, Performance Review с выделением A/B+/B/C сегментов. Работает на удержание ДО подачи заявления. Результат: retention A-players > 95% в год, компания — работодатель выбора в своей нише."}, {"name": "People Analytics и HR-метрики", "junior": "Ведёт HR-дашборд: turnover, eNPS, укомплектованность, time-to-hire. Предоставляет ежемесячный отчёт CEO. Отвечает за актуальность цифр и умеет объяснить их смысл. Результат: CEO всегда видит состояние HR-функции и может принять решение на основе данных.", "middle": "Строит People Analytics: когортный анализ оттока (кто уходит — по стажу, отделу, менеджеру), ROI на обучение, выручка на 1 сотрудника в динамике, ФОТ/выручка по бенчмаркам (AMT Консалт). Делает выводы: «вот что происходит и вот что нужно делать». Результат: HR-решения принимаются на основе данных, а не интуиции.", "senior": "Внедряет предиктивную аналитику: модели прогноза вероятности увольнения, потребности в найме под бизнес-план. Автоматизирует HR-отчётность. Использует инструменты мониторинга: eNPS через Happy Job, мониторинг активности резюме на hh.ru как ранний сигнал риска. Результат: HR-функция работает проактивно — предотвращает потери, а не реагирует на факт ухода."}, {"name": "HR-технологии и AI First", "junior": "Использует ATS, HRIS, LMS. Знает ключевые HR-tech инструменты рынка. Выбирает инструменты под задачи, а не под бренд. Понимает, что внедрение AI — это не тренд, а вопрос «зачем и что это даст». Результат: все базовые HR-процессы автоматизированы, ручной рутины минимум.", "middle": "Внедряет HR-tech стек под конкретные задачи: AI-скоринг резюме, eNPS-платформы (Happy Job), голосовые роботы для массового найма (Neuro.net, Tomoru), автоматизация коммуникаций (N8N). Оценивает каждый инструмент по ROI. Нет экономического эффекта — закрывает эксперимент. Результат: HR-команда закрывает в 2x больше задач без роста штата.", "senior": "Строит AI First как стратегию HR-трансформации: аудит CJM (candidate/employee journey map), AI-трансформационный план, корпоративное обучение AI обязательно для всех в HR. Все вендоры оцениваются на вектор развития в сторону AI. Кандидаты без AI-навыков на релевантных позициях не нанимаются. Результат: HR-функция — один из лидеров AI-внедрения в компании; ФОТ/выручка снижается при росте качества команды."}, {"name": "Корпоративная культура и HR-бренд", "junior": "Проводит eNPS-опросы по расписанию. Организует корпоративные мероприятия. Знает, что происходит в коллективе — кто чем недоволен, где напряжение. Реагирует на сигналы, не ждёт эскалации. Результат: eNPS замеряется регулярно, динамика известна, острые ситуации не застают врасплох.", "middle": "Управляет eNPS как инструментом предотвращения оттока: отслеживает динамику, раскрывает причины снижения, запускает точечные улучшения. Работает с HR-брендом: отвечает на отзывы на hh.ru, транслирует EVP через внешние каналы. Строит неформальную культуру через мероприятия и внутренние коммуникации. Результат: eNPS растёт год к году; негативные отзывы обрабатываются в течение 48 часов.", "senior": "Проектирует корпоративные компетенции совместно с консалтинговым партнёром (Ecopsy-подход): ценности переводятся в поведенческие индикаторы и встраиваются в найм как первый фильтр. Если кандидат не проходит оценку по культурному fit — собеседование по hard skills не проводится. Принцип: не удерживать тех, кто не подходит, а изначально нанимать людей, которые не захотят уходить. Результат: cultural mismatch как причина ухода < 5%; компания — работодатель с сильной идентичностью."}, {"name": "Стратегическое мышление", "junior": "Переводит бизнес-цели в HR-задачи. Понимает, какие инициативы дадут результат, а какие — просто «занятость». Не тратит ресурс на низкоприоритетные активности. Результат: HR-план логически вытекает из стратегии компании, CEO не объясняет зачем каждая инициатива.", "middle": "Видит HR как рычаг роста бизнеса, а не как функцию поддержки. Инициирует HR-проекты, влияющие на выручку и маржу: ускорение найма в продажи, снижение оттока ключевых людей, систему грейдов, удерживающую A-players. Умеет посчитать и защитить ROI каждой инициативы. Результат: минимум 1 HR-инициатива в год с доказанным влиянием на бизнес-показатели.", "senior": "Участвует в разработке бизнес-стратегии как равноправный член C-level команды. Видит оргструктуру, культуру и людей как инструменты достижения стратегических целей. HR-стратегия — отдельный блок на стратегических сессиях совета директоров. Результат: бизнес-стратегия и HR-стратегия — единый документ, а не два параллельных."}, {"name": "Управление командой и развитие людей", "junior": "Ставит задачи HR-команде, контролирует исполнение. Проводит 1-on-1 встречи. Даёт обратную связь — чёткую, конкретную, без «в целом всё хорошо». Результат: HR-команда знает приоритеты, дедлайны соблюдаются.", "middle": "Развивает каждого члена HR-команды: у каждого есть план развития, зоны роста, следующая карьерная ступень. Делегирует не для разгрузки себя, а для роста человека. Создаёт культуру обратной связи внутри команды. Результат: 80%+ HR-команды оцениваются как A/B+ на Performance Review; сотрудники растут до следующего уровня, не уходя из компании.", "senior": "Строит HR-команду как A-team: нанимает людей сильнее себя в своих областях, создаёт преемника для своей роли. HR-отдел работает автономно — не «ломается», когда HRD в отпуске или на проекте. Результат: HR-отдел — образцово-показательная команда для остального бизнеса."}, {"name": "Партнёрство с бизнесом (HRBP-мышление)", "junior": "Регулярно встречается с руководителями подразделений. Знает KPI каждого отдела, а не только «что написано в HR-плане». Решает реальные бизнес-проблемы через HR-инструменты. Результат: руководители воспринимают HR как коллегу, а не как «кадровика с документами».", "middle": "Выступает доверенным советником для топ-менеджеров: помогает с оргвопросами, конфликтами в команде, решениями об увольнении или повышении. Руководители приходят к HRD проактивно — не только когда «всё горит». Результат: HRD в курсе ситуации во всех командах; проблемы решаются до эскалации.", "senior": "Управляет организационными изменениями (change management) на уровне компании. Строит систему HRBP: отдельный HR-партнёр для крупных подразделений, ~1 HRBP на 100-150 сотрудников. Каждый бизнес-юнит чувствует, что HR — это партнёр в его росте, а не контролёр. Результат: HR сопровождает все стратегические изменения бизнеса без сбоев в команде."}, {"name": "Влияние и управление без прямой власти", "junior": "Аргументирует HR-решения через данные и логику. Получает согласование от руководителей без апелляции к «так положено по политике». Результат: HR-инициативы не блокируются на уровне согласования.", "middle": "Продвигает непопулярные решения через правильно выстроенную коммуникацию: увольнение «любимчика» CEO, реструктуризация отдела, снижение бонусов в кризис. Управляет конфликтами между руководителями. Результат: сложные HR-решения реализуются без репутационных потерь для компании.", "senior": "Формирует HR-повестку на уровне совета директоров. Умеет «продать» HR-инвестицию инвесторам и акционерам: не через эмоции («люди — наш главный актив»), а через цифры и логику. Любое решение о людях обосновано экономически. Результат: HR-бюджет защищается и утверждается на уровне инвестиций, а не операционных затрат."}, {"name": "Ownership и личный пример", "junior": "Отвечает за результат HR-функции — не перекладывает на «бизнес не помогает» или «рынок сложный». Если план не выполнен — ищет причины в своих действиях, а не во внешних факторах. Результат: HR-KPI выполняются на 90%+ без постоянного внешнего контроля.", "middle": "Принимает решения в зоне неопределённости — не ждёт идеальных условий и полной информации. Берёт ответственность за ошибки публично, не ищет виноватых в команде. Это задаёт стандарт для всего HR-отдела. Результат: HR-проекты стартуют и завершаются в срок, даже когда условия меняются.", "senior": "Создаёт культуру ownership за пределами HR: через инструменты оценки, обратной связи и найма транслирует стандарт ответственности на всю организацию. Каждый сотрудник компании понимает, что результат — это его ответственность, а не менеджера. Результат: культура ownership — видимое конкурентное преимущество компании."}, {"name": "Бизнес-мышление и ROI-ориентированность", "junior": "Понимает P&L компании. Умеет посчитать стоимость незакрытой вакансии, стоимость ошибочного найма, ROI программы обучения. Результат: все HR-предложения содержат экономическое обоснование, CEO не объясняет «зачем деньги».", "middle": "Предлагает HR-решения, которые снижают затраты или увеличивают выручку: автоматизация найма, снижение оттока, ускорение онбординга. Оперирует метриками: стоимость вывода сотрудника, выручка на 1 FTE, ФОТ/выручка. Результат: минимум 2 инициативы в год с доказанным экономическим эффектом.", "senior": "Управляет HR-бюджетом как инвестиционным портфелем: каждая статья обоснована ROI. Может защитить HR-стратегию перед инвесторами и советом директоров в терминах бизнес-результата, а не «развитие людей». Результат: HR-функция воспринимается как центр ценности, а не центр затрат."}, {"name": "AI First и непрерывное развитие", "junior": "Изучает HR-тренды и AI-инструменты. Тестирует новые подходы — не ждёт, когда «все перейдут». Результат: 2-3 новые практики внедрены в HR-систему каждый квартал.", "middle": "Формирует культуру обучения в HR-команде: у каждого есть личный план развития, AI-обучение обязательно. Ежемесячные AI-дни: каждый делится, что внедрил за месяц. Инструменты без AI-вектора развития — под вопросом при следующей ревизии стека. Результат: HR-команда в топ-25% по технологичности среди конкурентов.", "senior": "Строит AI First как стратегию: AI-трансформационный план HR-функции, внутренние AI-амбасадоры, AI-премия для самых активных внедрителей. Кандидаты без базовых AI-навыков на релевантных позициях не проходят отбор. Все CRM / ATS / HRIS оцениваются на AI-вектор развития. Результат: компания — один из лидеров HR-tech в своей нише; AI снижает стоимость HR-функции при росте качества команды."}], "Проджект Менеджер": [{"name": "Project Planning & Execution (Планирование и исполнение проектов)", "junior": "Выполняет задачи внутри проекта по готовому плану • Работает с таск-трекерами: Asana, Jira, Notion, Trello — ведёт свои задачи • Понимает структуру проекта: цель, этапы, дедлайны, ответственные • Декомпозирует свой блок задач на подзадачи с оценкой времени • Соблюдает дедлайны и сообщает о рисках задержки заранее • Ведёт базовую документацию: чек-листы, протоколы встреч • Участвует в стендапах и статус-митингах как исполнитель", "middle": "Самостоятельно планирует и ведёт проекты от начала до конца • Создаёт проектные планы: WBS (Work Breakdown Structure), диаграммы Ганта, критический путь • Определяет милестоуны, зависимости между задачами и буферы времени • Ведёт 3–5 проектов параллельно с разными командами • Управляет scope: что входит в проект, а что нет (scope management) • Проводит kick-off, промежуточные ревью и ретроспективы • Адаптирует методологию под проект: Waterfall для фикс-скоупа, Agile для итеративных", "senior": "Управляет портфелем проектов компании и формирует проектную культуру • Управляет 10+ проектами через систему приоритизации (ICE, WSJF, MoSCoW) • Балансирует ресурсы между проектами: кто на чём, где bottleneck • Создаёт PMO-процессы: инициация → планирование → исполнение → контроль → закрытие • Внедряет portfolio-level roadmap: все проекты на одной карте с зависимостями • Формирует систему lessons learned: каждый проект обогащает следующий • Проектная функция работает предсказуемо: сроки выполняются в 85%+ случаев"}, {"name": "Funnel Design & Optimization (Проектирование и оптимизация воронок)", "junior": "Понимает структуру воронки и отслеживает метрики • Знает этапы воронки: awareness → interest → consideration → purchase → retention • Понимает ключевые метрики каждого этапа: охваты, CR, CPL, CAC, LTV • Может прочитать воронку в аналитике и найти «узкое место» • Помогает команде собирать данные для анализа воронки • Понимает разницу между маркетинговой и продуктовой воронками • Готовит базовые отчёты по этапам воронки", "middle": "Проектирует и оптимизирует воронки для конкретных продуктов и запусков • Проектирует воронку под задачу: лонч нового продукта, вебинарная воронка, автоворонка • Определяет контрольные точки и KPI для каждого этапа • Находит и устраняет «протечки»: где и почему теряем конверсию • Координирует команды для оптимизации: маркетинг делает креатив, продажи — скрипт, продукт — лендинг • Проводит A/B тесты на каждом этапе воронки • Рост конверсии воронки от квартала к кварталу на основе данных", "senior": "Строит систему воронок как growth-машину компании • Проектирует архитектуру воронок для всей компании: acquisition, activation, retention, revenue, referral (AARRR) • Создаёт playbook запусков: каждый новый запуск идёт по проверенному шаблону • Управляет unit-экономикой воронок: CAC, LTV, payback period по каждому каналу • Строит предиктивные модели: прогнозирует выручку на основе верха воронки • Интегрирует воронки с аналитикой: real-time дашборды по каждому этапу • Воронки работают как система: изменение в одном месте учитывает влияние на всю цепочку"}, {"name": "Growth Experiments & Hypothesis Testing (Growth-эксперименты и тестирование гипотез)", "junior": "Участвует в экспериментах как исполнитель • Понимает что такое гипотеза: «Если мы сделаем X, то метрика Y изменится на Z%» • Выполняет задачи в рамках эксперимента: настройка, сбор данных, отчёт • Помогает формулировать гипотезы на основе наблюдений • Понимает что такое MVP (минимально жизнеспособный продукт) эксперимента • Документирует результаты экспериментов по шаблону • Знает базовые метрики эксперимента: конверсия, sample size, significance", "middle": "Самостоятельно формулирует, запускает и анализирует growth-эксперименты • Генерирует гипотезы на основе данных, обратной связи и конкурентного анализа • Приоритизирует гипотезы по фреймворкам: ICE (Impact, Confidence, Ease), RICE • Проектирует эксперимент: что тестируем, как измеряем, когда принимаем решение • Координирует быструю реализацию: MVP за 1–2 недели, а не месяц • Анализирует результаты и масштабирует успешные эксперименты • Ведёт backlog гипотез и отчётность: X запущено, Y успешных, Z внедрено", "senior": "Строит систему непрерывного экспериментирования на уровне компании • Внедряет experimentation framework: от идеи до масштабирования • Создаёт культуру «тестируй, прежде чем масштабировать» • Управляет портфелем экспериментов: баланс quick wins и стратегических ставок • Конверсия успешных гипотез ≥ 30% за счёт качества приоритизации • Интегрирует результаты экспериментов в стратегическое планирование • Growth-процесс работает автономно: команды сами генерируют и тестируют гипотезы"}, {"name": "Launch Management (Управление запусками)", "junior": "Участвует в запуске продукта / кампании как координатор задач • Ведёт чек-лист запуска: что сделано, что осталось • Отслеживает статус задач от разных команд • Напоминает об дедлайнах и эскалирует задержки • Помогает с подготовкой материалов: презентации, лендинги, рассылки • Участвует в разборе результатов запуска • Документирует ход запуска для будущих проектов", "middle": "Лидирует запуск от планирования до post-launch анализа • Создаёт launch plan: таймлайн, ответственные, зависимости, risk mitigation • Координирует 5+ команд одновременно: маркетинг, продажи, продукт, контент, техподдержка • Управляет go / no-go решениями: готовы ли мы к запуску • Мониторит метрики в реальном времени в первые дни после запуска • Проводит post-launch ретроспективу: что сработало, что улучшить • Каждый следующий запуск проходит быстрее и предсказуемее предыдущего", "senior": "Строит масштабируемую систему запусков для всей компании • Создаёт Launch Playbook: шаблоны, процессы, роли, чек-листы для любого типа запуска • Запуски идут «на конвейере»: новый продукт, новый рынок, новый канал — по одной методологии • Управляет календарём запусков: нет конфликтов между командами за ресурсы • Прогнозирует результаты запуска на основе данных предыдущих • Интегрирует launch management с growth-системой: каждый запуск = эксперимент • Запуски — конкурентное преимущество: компания выводит продукты быстрее рынка"}, {"name": "Stakeholder & Requirements Management (Управление стейкхолдерами и требованиями)", "junior": "Собирает требования от одного заказчика и фиксирует их • Проводит встречу с заказчиком, фиксирует запрос в структурированном виде • Задаёт уточняющие вопросы: «что значит успешный результат?» • Оформляет требования в формате user stories или ТЗ по шаблону • Согласовывает ТЗ с заказчиком до начала работы • Передаёт требования исполнителям без потери смысла • Информирует заказчика о статусе выполнения", "middle": "Управляет требованиями от нескольких стейкхолдеров с конфликтующими приоритетами • Проводит discovery: выявляет реальную потребность за запросом • Приоритизирует требования при ограниченных ресурсах: что делаем, что откладываем • Управляет изменениями scope: change request процесс с оценкой влияния • Согласовывает trade-offs между стейкхолдерами: скорость vs качество vs объём • Создаёт прозрачную систему приоритизации: каждый понимает почему его задача в очереди • Строит доверительные отношения: стейкхолдеры не обходят PM, а работают через процесс", "senior": "Формирует систему управления требованиями на уровне компании • Создаёт intake process: как любой стейкхолдер может подать запрос на проект • Внедряет governance: кто принимает решения, как эскалировать, как приоритизировать • Управляет стратегическим бэклогом: от целей компании → к проектам → к задачам • Балансирует стратегические инициативы и операционные запросы • Стейкхолдеры всех уровней доверяют проектной функции и работают в единой системе • Требования прослеживаются от бизнес-цели до конкретной задачи (traceability)"}, {"name": "Risk & Dependency Management (Управление рисками и зависимостями)", "junior": "Идентифицирует очевидные риски и сообщает о них • Понимает что такое риск: событие, которое может помешать достижению цели • Замечает задержки и блокеры в своей работе и сообщает руководителю • Ведёт простой риск-реестр: что может пойти не так, вероятность, влияние • Понимает зависимости: «моя задача не начнётся, пока не готова задача X» • Участвует в обсуждении рисков на статус-митингах • Не скрывает проблемы — эскалирует сразу", "middle": "Проактивно управляет рисками и зависимостями в проектах • Создаёт риск-реестр с оценкой вероятности и влияния (probability × impact matrix) • Разрабатывает mitigation plans: что делаем, чтобы риск не наступил • Создаёт contingency plans: что делаем, если риск наступил • Управляет зависимостями между проектами: карта зависимостей, критический путь • Проводит регулярные risk review с командой • Эскалирует вовремя: проблема попадает к руководству до того, как стала критической", "senior": "Строит систему управления рисками на уровне портфеля проектов • Создаёт enterprise risk framework: типы рисков, процессы управления, ответственные • Управляет межпроектными зависимостями: изменение в проекте A автоматически отражается на B • Внедряет early warning system: метрики-предвестники проблем • Строит risk-adjusted планирование: сроки и бюджеты учитывают вероятность рисков • Ретроспективный анализ рисков: какие реализовались, почему не предвидели • Компания готова к неожиданностям: при реализации риска есть готовый план действий"}, {"name": "Agile & Process Design (Agile-методологии и проектирование процессов)", "junior": "Работает внутри Agile-процесса как участник команды • Понимает Scrum-ритуалы: стендап, планирование спринта, ретро, демо • Работает с Kanban-доской: бэклог → в работе → на ревью → готово • Понимает что такое спринт, story points, velocity • Участвует в оценке задач и планировании спринта • Следует принятым процессам команды • Понимает разницу между Scrum, Kanban и Waterfall на базовом уровне", "middle": "Внедряет и адаптирует методологии под конкретные команды и проекты • Выбирает методологию под задачу: Scrum для разработки, Kanban для поддержки, Waterfall для фикс-скоупа • Фасилитирует Agile-ритуалы: ведёт планирование, ретро, демо • Проектирует процессы для кросс-функциональных команд • Оптимизирует процессы: убирает лишние встречи, ускоряет согласования • Внедряет метрики процесса: lead time, cycle time, WIP limits • Адаптирует процессы на основе ретроспектив: каждый спринт — улучшение", "senior": "Проектирует операционную систему управления проектами для всей компании • Создаёт гибридную методологию: Agile + элементы Waterfall + OKR, адаптированную под бизнес • Внедряет SAFe / LeSS или кастомный фреймворк для масштабирования Agile • Стандартизирует процессы: любая новая команда может начать работать за 1 неделю • Создаёт систему непрерывного улучшения процессов (Kaizen) • Процессы не мешают, а ускоряют: команды благодарны за структуру, а не раздражены бюрократией • Операционная модель масштабируется с ростом компании без потери скорости"}, {"name": "Budget & Resource Management (Управление бюджетом и ресурсами)", "junior": "Отслеживает расходы в рамках выделенного бюджета • Понимает бюджет проекта: что включено, сколько осталось • Ведёт трекинг расходов по задачам • Сообщает о перерасходе или экономии • Понимает стоимость ресурсов: час разработчика, стоимость подрядчика • Готовит простые отчёты по расходам • Не принимает решения о тратах без согласования", "middle": "Планирует и управляет бюджетами проектов, оптимизирует загрузку ресурсов • Составляет бюджет проекта: ресурсы, подрядчики, инструменты, буфер • Управляет resource allocation: кто на каком проекте, на сколько % загружен • Проводит trade-off анализ: больше людей = быстрее, но дороже • Контролирует burn rate: сколько тратим в неделю vs план • Обосновывает бюджет перед руководством: ROI проекта, payback period • Находит способы сделать быстрее/дешевле без потери качества", "senior": "Управляет бюджетом и ресурсами портфеля проектов • Распределяет бюджет между проектами на основе стратегических приоритетов • Управляет capacity planning: сколько проектов компания может вести одновременно • Оптимизирует mix инхаус vs аутсорс vs автоматизация • Прогнозирует потребности в ресурсах на квартал/год вперёд • Каждый проект имеет прозрачный ROI, доступный руководству • Ресурсы компании используются эффективно: нет простоев и нет перегрузок"}, {"name": "Data Literacy & Analytics for PM (Работа с данными и аналитикой для PM)", "junior": "Читает дашборды и понимает базовые метрики • Понимает ключевые бизнес-метрики: CR, CAC, LTV, ARPU, churn • Читает дашборды в BI-инструментах: тренды, фильтры, drill-down • Может найти ответ на простой вопрос в данных • Использует Excel / Google Sheets для базового анализа • Понимает что такое воронка и как считать конверсию на каждом этапе • Формулирует выводы в формате «метрика → тренд → причина»", "middle": "Принимает проектные решения на основе данных • Ставит ТЗ аналитику: какие данные нужны, в каком разрезе, для какого решения • Формулирует гипотезы и определяет метрики успеха до начала проекта • Анализирует результаты экспериментов: статзначимость, сегменты, edge cases • Строит простые модели в Excel: сценарии, unit-экономика, прогнозы • Работает с SQL на базовом уровне: может сделать простую выгрузку самостоятельно • Каждый проект имеет чёткие метрики успеха, определённые до старта", "senior": "Интегрирует аналитику в каждый этап проектного управления • Внедряет data-driven project management: решения по приоритизации на данных • Строит predictive модели для проектов: прогноз сроков, бюджетов, рисков • Создаёт систему проектной аналитики: velocity, throughput, ROI по типам проектов • Использует данные для ресурсного планирования и capacity management • Проектирует метрики успеха на уровне портфеля, а не отдельного проекта • Данные прошлых проектов — основа для планирования будущих"}, {"name": "Tools & Technical Proficiency (Инструменты и технические навыки)", "junior": "Работает в основных инструментах PM • Таск-трекер: Asana / Jira / Notion / Trello — создание задач, дедлайны, статусы • Google Workspace: Docs, Sheets, Slides для документации • Коммуникации: Slack / Teams для координации • Miro / FigJam для визуализации процессов и брейнштормов • Базовый Excel / Google Sheets: формулы, таблицы, фильтры • Может настроить простую автоматизацию: Zapier / Make для уведомлений", "middle": "Выстраивает проектную инфраструктуру и автоматизирует рутину • Настраивает workflows в Jira / Asana: статусы, автоматические переходы, дашборды • Строит проектные дашборды: загрузка команды, статус проектов, burndown • Автоматизирует отчётность: статусы проектов обновляются автоматически • Интегрирует инструменты между собой: таск-трекер ↔ Slack ↔ аналитика • Работает с no-code/low-code: Zapier, Make, Retool для автоматизации процессов • Базовый SQL для самостоятельных выгрузок данных", "senior": "Проектирует технический стек проектного управления для компании • Выбирает и внедряет инструменты: оценка fit, пилот, миграция, обучение • Строит единую экосистему: PM tool ↔ CRM ↔ BI ↔ коммуникации ↔ документация • Автоматизирует проектные процессы: от заявки до ретроспективы • Создаёт шаблоны проектов: новый проект запускается за 1 день, а не неделю • Понимает основы разработки: может общаться с инженерами на одном языке • Технический стек масштабируется с ростом компании и количества проектов"}, {"name": "Communication & Facilitation (Коммуникация и фасилитация)", "junior": "Чётко доносит информацию и ведёт базовые встречи • Формулирует мысли структурно: проблема → контекст → предложение • Пишет понятные сообщения в чатах и письмах • Ведёт протокол встречи: решения, ответственные, дедлайны • Задаёт уточняющие вопросы, не додумывает за заказчика • Умеет слушать и резюмировать услышанное • Не боится признать «я не знаю, но разберусь»", "middle": "Фасилитирует сложные обсуждения и управляет конфликтами • Ведёт встречи с 5–10 участниками: удерживает фокус, управляет таймингом • Фасилитирует брейнштормы, ретроспективы, decision-making сессии • Управляет конфликтами: разные команды хотят разное — PM находит решение • Адаптирует коммуникацию: разработчику — одно, CEO — другое, маркетологу — третье • Проводит демо и презентации результатов для стейкхолдеров • Создаёт среду, где проблемы озвучиваются рано, а не замалчиваются", "senior": "Формирует культуру прозрачной коммуникации в компании • Проводит стратегические сессии с C-level: от данных к решениям • Создаёт коммуникационные стандарты: как отчитываемся, как эскалируем, как принимаем решения • Фасилитирует кросс-функциональные воркшопы по стратегии и планированию • Управляет коммуникацией в кризисных ситуациях: проект горит — все знают, что делать • Строит культуру, где прозрачность = норма, а не «донос на коллегу» • Команды эффективно коммуницируют между собой без участия PM в каждой переписке"}, {"name": "Leadership Without Authority (Лидерство без формальной власти)", "junior": "Влияет на коллег через вовлечённость и ответственность • Берёт на себя задачи, которые «ничьи», но важные • Помогает коллегам, даже если это не его обязанность • Показывает пример: соблюдает дедлайны, держит слово • Не перекладывает ответственность • Мотивирует через позитив: отмечает вклад других • Понимает что PM не начальник, а координатор — и это нормально", "middle": "Мотивирует и направляет кросс-функциональные команды • Вдохновляет команду на результат, даже когда люди не подчиняются PM напрямую • Формулирует «зачем»: команда понимает ценность проекта, а не просто выполняет задачи • Управляет через влияние: убеждает, а не приказывает • Создаёт psychologically safe environment: люди не боятся говорить о проблемах • Делегирует ответственность за результат, а не только задачи • Развивает людей в команде: даёт обратную связь, помогает расти", "senior": "Формирует лидерскую культуру в проектных командах • Создаёт distributed leadership: в каждом проекте лидерство распределено между участниками • Менторит других PM-ов и проектных лидеров • Формирует культуру accountability: каждый чувствует ownership за результат • Управляет стратегическими изменениями через влияние, не через директивы • Команды работают проактивно: не ждут указаний, а инициируют улучшения • Проектная функция воспринимается как enabler, а не bottleneck"}, {"name": "Problem Solving & Decision Making (Решение проблем и принятие решений)", "junior": "Решает стандартные проблемы и эскалирует нестандартные • Применяет логику: если A и B, то C • Декомпозирует проблему на части: «что конкретно не работает?» • Предлагает 2–3 варианта решения, а не только «у нас проблема» • Умеет отличить срочное от важного • Принимает решения в рамках своей ответственности, не парализуясь • Эскалирует правильно: описывает проблему + варианты + рекомендацию", "middle": "Структурирует сложные проблемы и принимает решения при неполной информации • Применяет фреймворки: MECE, 5 Why, Ishikawa, decision matrix • Принимает решения при дефиците информации: «80% данных — достаточно» • Учитывает trade-offs: скорость vs качество, short-term vs long-term • Проводит postmortem после неудачных решений: что учесть в следующий раз • Документирует decision log: какое решение, почему, какие альтернативы отклонены • Не парализуется analysis paralysis — принимает решение и двигается вперёд", "senior": "Создаёт систему принятия решений и решения проблем для компании • Внедряет decision-making framework: кто принимает решения, как эскалировать (RACI, RAPID) • Создаёт playbooks для типовых проблем: если X — делаем Y • Обучает команды структурированному решению проблем • Принимает стратегические решения на стыке данных, интуиции и экспертизы • Каждое важное решение документировано и доступно для ретроспективного анализа • Компания принимает решения быстро и качественно — это культура, а не зависимость от одного человека"}, {"name": "Ownership & Accountability (Ответственность и подотчётность)", "junior": "Отвечает за свой блок задач и доводит до конца • Не ждёт напоминаний — отслеживает свои дедлайны • Если что-то не получается — сообщает заранее • Проверяет качество своей работы перед сдачей • Признаёт ошибки и учится на них • Не говорит «это не моя зона ответственности» когда горит общий результат", "middle": "Берёт ответственность за бизнес-результат проекта, а не только за процесс • Отвечает не за «задачи сделаны», а за «цель достигнута» • Проактивно находит и решает проблемы до того, как они стали блокерами • Берёт ответственность за результат кросс-функциональной команды • Управляет не только scope, но и outcomes: проект принёс бизнес-результат • Создаёт культуру accountability в проектной команде • Каждый проект завершается measurement of impact, а не просто «задачи закрыты»", "senior": "Несёт ответственность за эффективность проектной функции компании • Результат проектной функции измеряется в бизнес-терминах: выручка, экономия, рост • Формирует культуру accountability во всей компании: каждый отвечает за результат • Строит систему, где ответственность распределена и прозрачна (RACI) • Готов обосновать ROI проектной функции перед C-level • Проектная команда — источник гордости, а не место для finger-pointing • Компания доверяет PM-функции стратегические инициативы"}, {"name": "Speed & Bias for Action (Скорость и склонность к действию)", "junior": "Не откладывает задачи и соблюдает сроки • Начинает задачу сразу, не прокрастинирует • Если задача займёт < 15 минут — делает сейчас • Не тратит 3 дня на идеальный план — начинает с «достаточно хорошего» • Понимает разницу между «сделать идеально» и «сделать вовремя» • Быстро реагирует на запросы и блокеры • Не ждёт идеальных условий для старта", "middle": "Ускоряет проекты через приоритизацию и устранение блокеров • Устраняет блокеры в день обнаружения, а не «на следующей неделе» • Быстро прототипирует решения: MVP за 1–2 недели • Отсекает scope creep: «это не в MVP, добавим во второй итерации» • Параллелит задачи где возможно вместо последовательного выполнения • Создаёт ритм: еженедельные демо, быстрые decision-making сессии • Каждую неделю — видимый прогресс по каждому проекту", "senior": "Формирует культуру скорости и непрерывной поставки результатов • Внедряет принцип «лучше сделать и откорректировать, чем планировать бесконечно» • Создаёт процессы, которые ускоряют, а не замедляют • Time-to-market новых проектов сокращается каждый квартал • Команды привыкли к ритму: идея → прототип → тест → масштабирование • Устраняет организационные bottleneck-и: согласования, бюрократия, ожидание решений • Скорость — конкурентное преимущество компании"}, {"name": "Continuous Improvement (Непрерывное улучшение)", "junior": "Открыт к обратной связи и улучшает свою работу • Принимает обратную связь без защитной реакции • Замечает что можно улучшить в своих процессах • Предлагает идеи по улучшению на ретроспективах • Учится на ошибках: если сделал что-то неэффективно — меняет подход • Осваивает новые инструменты и практики • Делится полезными находками с командой", "middle": "Внедряет улучшения в проектных процессах на системном уровне • Каждая ретроспектива → конкретные action items, которые реально внедряются • Анализирует причины задержек и провалов, устраняет системные проблемы • Автоматизирует повторяющуюся рутину: если делаем 3-й раз — автоматизируем • Бенчмаркит процессы: как делают лидеры рынка, чему можно научиться • Строит базу знаний: templates, playbooks, lessons learned • Метрики процессов улучшаются каждый квартал: быстрее, точнее, дешевле", "senior": "Формирует культуру постоянного улучшения (Kaizen) во всей компании • Непрерывное улучшение встроено в каждый проект: не «если будет время», а обязательный этап • Создаёт learning organization: ошибки — источник роста, а не повод для наказания • Внедряет best practices из других индустрий и компаний • Формирует internal PM community: обмен опытом, менторинг, развитие • Проектная функция — эталон операционного совершенства в компании • Компания адаптируется к изменениям быстрее конкурентов за счёт культуры улучшений"}, {"name": "Transparency & Collaboration (Прозрачность и сотрудничество)", "junior": "Работает открыто и делится информацией • Делится статусом задач без запроса: коллеги знают что происходит • Не скрывает проблемы — говорит о них сразу • Помогает коллегам когда видит, что нужна помощь • Ведёт рабочую документацию в общем доступе • Конструктивен в обсуждениях: критикует идею, а не человека • Понимает что успех проекта = общая заслуга, а не личная", "middle": "Создаёт прозрачную среду в кросс-функциональных проектах • Все стейкхолдеры видят статус проекта в реальном времени без запроса • Проводит регулярные синхронизации между командами • Создаёт единую точку правды по проекту: один документ, одна доска • Строит bridges между отделами: маркетинг понимает ограничения разработки и наоборот • Управляет ожиданиями: все знают что будет, когда и почему • Конфликты решаются через данные и открытый диалог, а не через эскалацию", "senior": "Формирует культуру радикальной прозрачности и кросс-функционального сотрудничества • Информация о проектах доступна всем: roadmap, статусы, результаты, lessons learned • Кросс-функциональное сотрудничество — норма, а не исключение • Внедряет open decision-making: решения и их обоснование публичны • Создаёт процессы, где siloes разрушаются: общие OKR, shared ownership • Компания работает как одна команда, а не как набор конкурирующих отделов • Прозрачность создаёт доверие, доверие ускоряет всё"}], "Production Head": [{"name": "Контент-стратегия (Content Strategy)", "junior": "Понимает логику контент-плана и работает по заданной стратегии • Выполняет контент-план, составленный руководителем или маркетингом • Понимает разницу между контентом для охвата, вовлечения и конверсии • Умеет подбирать темы по запросам и трендам используя базовые инструменты (Wordstat, поиск YouTube) • Знает форматы контента для YouTube/Reels/Shorts и их особенности • Участвует в брейнштормах, предлагает темы по шаблону", "middle": "Самостоятельно разрабатывает и ведёт контент-стратегию канала • Формирует контент-стратегию: позиционирование канала, рубрики, воронка от контента к продукту • Составляет контент-план на месяц/квартал с привязкой к запускам и продуктовому календарю • Анализирует конкурентов и лидеров ниши, адаптирует лучшие практики • Синхронизирует контент-план с маркетингом и продажами • Проверяет гипотезы по форматам и темам, корректирует стратегию по данным", "senior": "Строит контент-стратегию как часть бизнес-стратегии компании • Разрабатывает долгосрочную стратегию присутствия бренда в видео (12–18 мес.) • Выстраивает контентную воронку: осведомлённость → доверие → лид → покупка • Определяет роль каждого канала в общей маркетинговой экосистеме • Участвует в продуктовых решениях: какой контент под какой оффер работает лучше • Формирует tone of voice и визуальный язык бренда для всего производимого контента"}, {"name": "Сценарный навык и сторибординг (Scripting & Storytelling)", "junior": "Пишет сценарии по готовой структуре и шаблону • Работает по заданной структуре ролика (крюк → проблема → решение → CTA) • Пишет базовый скрипт: тезисы, ключевые фразы, переходы • Понимает принцип «крюка» в первые 5–15 секунд • Умеет адаптировать экспертный текст в разговорный сценарий • Принимает правки от руководителя и дорабатывает сценарий", "middle": "Самостоятельно пишет сценарии с фокусом на удержание и конверсию • Пишет сценарии с сильным крюком, нарративом и встроенными CTA • Использует сторителлинг: герой, конфликт, трансформация — применительно к образовательному контенту • Адаптирует сценарии под разные форматы (длинное видео / Shorts / Reels) • Работает со спикером/экспертом: брифует, структурирует его речь, редактирует • Анализирует метрики удержания и корректирует структуру сценариев на основе данных", "senior": "Разрабатывает сценарные фреймворки и управляет качеством всего контента • Создаёт фреймворки и шаблоны сценариев для команды под разные задачи и форматы • Строит систему оценки качества сценариев до съёмки • Обеспечивает единый нарратив бренда во всех форматах и каналах • Управляет балансом экспертного и развлекательного контента для разных сегментов аудитории • Использует психологию принятия решений (триггеры, социальное доказательство, срочность) в сценарной логике"}, {"name": "Видеопроизводство (Video Production)", "junior": "Участвует в съёмке, обеспечивает базовое техническое качество • Умеет работать с базовым съёмочным оборудованием: камера, штатив, петличный микрофон • Контролирует базовые параметры: экспозиция, фокус, баланс белого • Настраивает простой свет (кольцевая лампа, 3-точечная схема) • Организует рабочее место для съёмки: задний план, реквизит • Понимает требования платформ к техническому качеству видео", "middle": "Самостоятельно управляет съёмочным процессом от подготовки до финального материала • Планирует и организует съёмочный день: тайминг, локация, свет, звук, реквизит • Работает с операторами и подрядчиками: ставит задачи, принимает материал • Управляет качеством записи: технический контроль звука, картинки, ракурсов • Умеет снимать в нестандартных условиях (натура, мероприятия, мобильная съёмка) • Организует съёмочный процесс так, чтобы максимизировать количество контента за день", "senior": "Строит производственную систему, обеспечивающую стабильный поток качественного контента • Проектирует производственный конвейер: от брифа до публикации с SLA на каждый этап • Управляет комбинированной командой (штат + подрядчики) как единым механизмом • Выстраивает студийную инфраструктуру: оборудование, декорации, процессы • Оптимизирует производственный цикл: сокращает Time-to-Publish без потери качества • Строит систему контроля качества на каждом этапе производства"}, {"name": "Монтаж и постпродакшен (Editing & Post-Production)", "junior": "Монтирует видео по заданному шаблону и стилю • Монтирует в одном из основных редакторов: Premiere Pro, DaVinci, CapCut • Работает по монтажному шаблону: нарезка, склейка, базовые переходы • Добавляет субтитры, нижние трети, простую графику • Делает базовую цветокоррекцию и аудиоочистку • Экспортирует материал в нужных форматах под разные платформы", "middle": "Монтирует контент с высоким удержанием, управляет постпродакшеном • Монтирует с фокусом на удержание зрителя: ритм, динамика, паттерн-интеррапты • Создаёт и поддерживает визуальный стиль канала: графика, цвет, шрифты, анимации • Управляет дизайнером и моушн-специалистом: ставит задачи, принимает результат • Делает обложки (превью) с высоким CTR: тестирует варианты, анализирует результат • Адаптирует длинный контент в Shorts/Reels: вырезает сильные моменты, добавляет хуки", "senior": "Формирует стандарты постпродакшена и управляет качеством визуального бренда • Разрабатывает брендбук канала: визуальный стиль, графические стандарты, шрифты • Создаёт и актуализирует библиотеку шаблонов для ускорения производства • Выстраивает систему A/B-тестирования обложек и заголовков • Управляет всем постпродакшеном как отдельным производственным потоком • Внедряет AI-инструменты в постпродакшен: автомонтаж, генерация обложек, AI-субтитры"}, {"name": "Аналитика контента (Content Analytics)", "junior": "Читает базовые метрики и понимает их смысл • Умеет читать аналитику YouTube Studio: просмотры, время просмотра, подписчики • Понимает ключевые метрики: CTR, AVD, ERR, охват • Знает разницу между метриками охвата и метриками конверсии • Использует данные аналитики для выбора следующей темы • Фиксирует результаты вышедшего контента по шаблону", "middle": "Самостоятельно анализирует контент и принимает решения на основе данных • Анализирует поведение зрителя: точки падения, виральные фрагменты, источники трафика • Проводит сравнительный анализ роликов: что сработало, почему, что повторить • Настраивает UTM-метки и отслеживает конверсию зрителей в лиды • Формирует еженедельный/ежемесячный контент-отчёт для CEO • Переводит данные аналитики в конкретные изменения в производстве", "senior": "Строит аналитическую систему, связывающую контент с бизнес-результатами • Выстраивает сквозную аналитику: от просмотра до покупки по каждому ролику • Строит дашборды для оперативного мониторинга обоих каналов • Внедряет культуру data-driven решений в команде продакшена • Использует предиктивную аналитику для планирования контент-стратегии • Регулярно презентует аналитику и выводы CEO, связывая контент с выручкой"}, {"name": "Управление командой продакшена (Team & Production Mgmt)", "junior": "Выполняет задачи в рамках производственного процесса, соблюдает дедлайны • Работает по поставленному плану производства без задержек • Взаимодействует с подрядчиками по чёткому ТЗ • Ведёт задачи в таск-трекере, своевременно сигнализирует о блокерах • Контролирует базовое качество на своём участке работы • Участвует в постпродакшн-созвонах и синхронизациях", "middle": "Самостоятельно управляет производственным процессом и командой подрядчиков • Планирует производственный цикл: даты съёмок, монтажа, публикации • Ставит задачи операторам, монтажёрам, дизайнерам — ясно, с критериями приёмки • Контролирует качество и сроки на каждом этапе производства • Управляет бюджетом продакшена: планирование затрат, работа с подрядчиками • Решает нештатные ситуации (перенос съёмки, замена подрядчика) без потери графика", "senior": "Строит производственную систему и управляет командой как бизнес-единицей • Формирует структуру команды продакшена: штат + пул подрядчиков под задачи • Выстраивает процессы найма, онбординга и оценки специалистов продакшена • Управляет производительностью команды: нормы, метрики, ретроспективы • Строит производственный конвейер, масштабируемый при росте объёма контента • Управляет бюджетом всего продакшена, оптимизирует стоимость единицы контента"}, {"name": "Понимание платформ (Platform & Distribution)", "junior": "Знает особенности основных платформ и их требования • Понимает алгоритмику YouTube: роль CTR, AVD, карточек и конечных заставок • Знает требования к форматам: соотношение сторон, длина, обложки, субтитры • Понимает разницу между длинным видео, Shorts и Reels • Базово разбирается в SEO для видео: теги, описания, заголовки • Следит за обновлениями платформ и сообщает о значимых изменениях", "middle": "Управляет дистрибуцией контента и оптимизирует его под алгоритмы платформ • Оптимизирует контент под алгоритмы: заголовки, описания, теги, главы видео • Управляет расписанием публикаций: время выхода, частота, паузы • Адаптирует один контент под несколько платформ: YouTube, Telegram, Instagram, VK • Строит систему кросс-промоушена между каналами и соцсетями • Анализирует алгоритмические изменения и адаптирует стратегию публикаций", "senior": "Формирует экосистему присутствия бренда во всех видеоканалах • Разрабатывает мультиплатформенную стратегию дистрибуции контента • Управляет взаимодействием всех каналов как воронкой: охват → вовлечение → конверсия • Оценивает и тестирует новые платформы и форматы до их массового использования • Управляет платным продвижением контента (Яндекс.Директ, таргет) в связке с органикой • Обеспечивает атрибуцию трафика с каждого канала до покупки"}, {"name": "AI-инструменты в продакшене (AI for Content)", "junior": "Знает AI-инструменты и применяет готовые решения в работе • Использует AI для транскрибации видео и генерации субтитров (Whisper, Clipping) • Применяет ChatGPT/Claude для генерации идей тем, заголовков, описаний • Использует AI-сервисы для создания превью и обложек (Midjourney, Canva AI) • Знает инструменты автомонтажа (Descript, Opus Clip) на уровне пользователя • Следит за новыми AI-инструментами для продакшена", "middle": "Внедряет AI-инструменты в производственный процесс, измеряет эффект • Интегрирует AI-транскрибацию в постпродакшн-пайплайн: автосубтитры, тайм-коды • Использует AI для нарезки лучших фрагментов длинного видео в Shorts/Reels • Применяет AI для генерации вариантов заголовков и обложек с последующим A/B-тестом • Использует AI-голос и синтез речи для быстрого созд
