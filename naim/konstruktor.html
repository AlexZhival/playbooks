я креаторами: учет, выплаты, дашборды, автоматизация вывода данных. Повышает управляемость сети. Автоматизирует рутину.", "senior": "Проектирует технологическую основу направления: системы управления сетью, автоматизация выплат и аналитики, интеграции. Делает автоматизацию условием масштаба. Строит систему, управляющую сотнями креаторов без ручного труда."}, {"name": "AI в UGC-контенте", "junior": "Пользуется AI для простых задач (сценарии, хуки, обработка данных). Экспериментирует под руководством.", "middle": "Внедряет AI в процессы: генерация и отбор подач, аналитика контента, автоматизация, поиск гипотез. Считает эффект, обучает команду.", "senior": "Формирует подход к AI в направлении: где ИИ дает рычаг в производстве, аналитике, гипотезах и масштабе. Внедряет продвинутые решения. Создает AI-нативную культуру производства."}, {"name": "Управление инхаус-командой", "junior": "Выполняет задачи в команде, ведет свой участок. Не управляет командой.", "middle": "Управляет инхаус-командой (менеджеры креаторов, аналитик, контент-стратег, комьюнити-менеджер), строит нормы и метрики. Мотивирует и развивает. Отвечает за результат команды.", "senior": "Строит команду направления и распределение ресурса, отвечает за найм и развитие руководителей. Растит преемников, задает культуру и метрики. Управляет через людей."}, {"name": "Тиражирование модели (менторство, регионы)", "junior": "Работает в текущей модели. Не думает о тиражировании.", "middle": "Тиражирует рабочие практики на новые группы креаторов и регионы. Внедряет менторов для групп. Масштабирует модель, сохраняя качество.", "senior": "Проектирует масштабируемую модель направления: менторская структура, регионы, воспроизводимые стандарты. Делает рост сети управляемым и предсказуемым. Строит модель, которую можно тиражировать без потери экономики."}, {"name": "Бренд-безопасность и соответствие", "junior": "Проверяет контент на соответствие бренд-требованиям по чек-листу. Сообщает о рисках.", "middle": "Обеспечивает бренд-безопасность и соответствие контента стратегиям и требованиям (в т.ч. маркировка). Настраивает контроль на потоке. Формирует стандарты.", "senior": "Встраивает бренд-безопасность и соответствие в производство без потери объема. Управляет репутационными и правовыми рисками контента на масштабе. Задает стандарты безопасного UGC."}, {"name": "Кросс-функциональная работа", "junior": "Взаимодействует со смежными по текущим вопросам, эскалирует спорное. Работает на задачи отдела.", "middle": "Выстраивает партнерство с коммерцией, маркетплейсами и диджитал-отделом. Согласует цели и метрики стыка (контент в заказы). Ведет совместные проекты.", "senior": "Оркеструет направление внутри маркетинга и коммерции: связка UGC с продажами, маркетплейсами и перформансом. Влияет на стратегию со стороны UGC. Защищает стратегию и бюджет перед руководством."}, {"name": "Управление рисками UGC-направления", "junior": "Реагирует на сбои (отток, брак, срыв объема) по процедуре. Тушит локально.", "middle": "Заранее видит риски (отток креаторов, качество на масштабе, минусовой ROI) и строит планы. Разруливает нестандартное сам. Внедряет превентивные меры.", "senior": "Строит управление рисками направления: устойчивость сети, качество на масштабе, вывод в целевой ROI. Проводит направление через кризисы без срыва объема и экономики. Превращает устойчивость в преимущество."}], "Руководитель инфлюенс маркетинга": [{"name": "Решение проблем", "junior": "Решает типовые проблемы по размещениям (срыв выхода, задержка контента, недокрут) в рамках задачи. Эскалирует нестандартное выше. Тушит точечно, без разбора первопричины.", "middle": "Самостоятельно диагностирует системные сбои (рост CPM, падение конверсии размещений, срывы объема) и находит первопричину. Строит решения на уровне процесса, а не симптома. Обучает команду разбирать проблемы.", "senior": "Работает с проблемами уровня всего направления: экономика, масштаб, управляемость на потоке. Превращает ограничения (зависимость от блогеров, рост ставок) в управляемые решения. Создает методологию, предвосхищает сбои и берет ответственность за экономику направления."}, {"name": "Стратегия инфлюенс-маркетинга (платное + бартер)", "junior": "Исполняет заданный план размещений, мыслит горизонтом кампании. Не формирует стратегию, работает внутри схемы.", "middle": "Строит план направления на квартал: микс платного и бартера, площадки, форматы, объемы, бюджет. Оптимизирует под охваты и заказы. Пересматривает под изменения площадок и рынка блогеров.", "senior": "Формирует стратегию инфлюенс-маркетинга: как система дает охваты и продажи при целевой экономике и на масштабе. Проектирует баланс платного и бартера, площадок и форматов под бизнес-цели. Влияет на маркетинг-стратегию со стороны инфлюенса."}, {"name": "Поиск, отбор и база блогеров", "junior": "Ищет блогеров по заданным критериям, ведет базу. Проверяет базовые метрики профиля. Работает по утвержденному пулу.", "middle": "Строит и сегментирует базу блогеров по тирам, тематикам и эффективности. Отбирает по качеству аудитории и экономике, отсекает слабых. Развивает пул под задачи объема и охвата.", "senior": "Строит систему работы с рынком блогеров: как быстро находить эффективных под любую задачу и прогнозировать результат. Знает игроков рынка, держит базу как актив. Делает доступ к качественным блогерам конкурентным преимуществом."}, {"name": "Переговоры и медиабаинг", "junior": "Ведет коммуникацию с блогерами по скриптам, согласует стандартные условия. Не меняет структуру сделки.", "middle": "Ведет переговоры по ставкам, бартеру, форматам и условиям. Добивается лучшей цены и охвата, снижает CPM. Отвечает за коммерческие условия размещений.", "senior": "Ведет стратегические переговоры и ключевые размещения как ЛПР. Конструирует нестандартные сделки и долгосрочные условия, влияющие на экономику направления. Задает стандарты баинга и переговоров для команды."}, {"name": "Бартерные интеграции на масштабе", "junior": "Оформляет бартерные интеграции по регламенту, контролирует выход. Работает с потоком по инструкции.", "middle": "Масштабирует бартер: наращивает объем интеграций при низком CPM, держит качество и управляемость. Строит процессы потока (отбор, бриф, контроль выхода). Отвечает за объем и стоимость бартера.", "senior": "Проектирует систему бартерных интеграций на масштабе (стандарты, бенчмарки, процессы), позволяющую держать большой объем без потери качества и удорожания. Делает масштаб бартера при минимальном CPM ядром модели. Превращает бартер в источник дешевого охвата и социального доказательства."}, {"name": "Платные размещения и управление бюджетом", "junior": "Размещает платную рекламу по заданному плану и бюджету. Отслеживает выход и базовые метрики. Не распределяет бюджет.", "middle": "Управляет платными размещениями: подбор, ставки, форматы, эффективность. Распределяет бюджет между блогерами ради охвата и заказов. Оптимизирует CPM и стоимость заказа.", "senior": "Управляет бюджетом направления и его распределением между закупкой и бартером. Строит модель, где платное и бартер усиливают друг друга при целевой экономике. Отвечает за отдачу инвестиций в размещения."}, {"name": "Экономика инфлюенса (CPM, CPO, ROI)", "junior": "Считает базовые метрики размещений по шаблону (охват, CPM). Не связывает результат с экономикой. Смотрит на факт.", "middle": "Считает экономику каждого формата через CPM, CPO и ROI, соотносит результат с затратами. Находит выгодные форматы и блогеров, отсекает неэффективные. Управляет стоимостью заказа.", "senior": "Выстраивает и пересобирает экономику направлений: CPM, CPO, ROI, баланс платное/бартер, бюджет. Управляет экономикой как системой, а не отчетом. Принимает решения на стыке объема, цены и отдачи, отвечает за экономику направления."}, {"name": "Масштабирование без удорожания инструментов", "junior": "Работает в текущем объеме по готовым процессам. Не думает о масштабе, наращивает руками.", "middle": "Наращивает объем, сохраняя CPM и качество за счет процессов и стандартов. Находит узкие места роста. Балансирует масштаб и управляемость.", "senior": "Проектирует системы масштабирования: стандарты, бенчмарки, процессы, позволяющие держать большой поток интеграций без потери качества и роста стоимости. Делает масштабируемость без удорожания принципом. Строит модель, которая растет без пропорционального роста затрат."}, {"name": "Контент интеграций и нативность", "junior": "Собирает и оформляет контент интеграций, контролирует выход по чек-листу. Не влияет на подачу.", "middle": "Управляет качеством и нативностью интеграций, брифует блогеров под бренд. Повышает вовлечение и конверсию контента. Отвечает за бренд-фит размещений.", "senior": "Строит стандарты контента интеграций: нативность, бренд-фит, конвертящие форматы на масштабе. Связывает качество подачи с продажами. Делает нативное присутствие бренда системой, а не разовыми удачами."}, {"name": "Аналитика охватов и продаж", "junior": "Собирает статистику по шаблонам, сверяет факты размещений. Смотрит в историю. Не строит аналитику.", "middle": "Строит аналитику направления: охваты, заказы, CPM, стоимость заказа, эффективность блогеров и форматов. Делает дашборды для мониторинга. Внедряет решения на данных.", "senior": "Формирует аналитическую систему направления, связывает размещения с продажами (атрибуция). Ставит ТЗ аналитику и на дашборды. Делает данные основой решений по бюджету и форматам."}, {"name": "Воронка входящих заявок и партнерств", "junior": "Обрабатывает входящие заявки по регламенту воронки. Заносит и распределяет по инструкции.", "middle": "Строит и ведет воронку входящих заявок с распределением по направлениям. Повышает конверсию и качество лидов из входящих. Отвечает за поток входящих партнерств.", "senior": "Проектирует систему входящих заявок и партнерств с нуля: единая воронка, автоматическое распределение, прирост лидов. Превращает входящий поток в управляемый источник размещений. Масштабирует на смежные направления."}, {"name": "Амбассадорские и долгосрочные партнерства", "junior": "Ведет текущие долгосрочные размещения по плану. Не выстраивает партнерства.", "middle": "Развивает амбассадоров и долгосрочные партнерства с блогерами: постоянное присутствие, лучшие условия, лояльность. Управляет пулом постоянных лиц бренда.", "senior": "Строит стратегию амбассадорства и долгосрочных партнерств как актив: постоянное нативное присутствие бренда через лояльных блогеров. Конструирует ключевые партнерства лично. Делает устойчивое присутствие конкурентным преимуществом."}, {"name": "Экспертиза платформ (Instagram, TikTok, Telegram)", "junior": "Работает на заданных площадках по текущим форматам. Знает базовые механики. Не адаптирует под площадки.", "middle": "Владеет спецификой площадок (Instagram, TikTok, Telegram и др.): форматы, механики, тренды, что конвертит. Адаптирует размещения под каждую площадку. Тестирует новые форматы.", "senior": "Держит экспертизу по площадкам как преимущество: где, в каком формате и как получать охват и продажи. Первым выходит в новые площадки и форматы. Задает подход к площадкам для команды."}, {"name": "AI в инфлюенс-маркетинге", "junior": "Пользуется AI для простых задач (тексты брифов, обработка данных, подбор). Экспериментирует под руководством.", "middle": "Внедряет AI в процессы: подбор и оценка блогеров, аналитика размещений, генерация брифов и отчетов, автоматизация рутин. Считает эффект, обучает команду.", "senior": "Формирует подход к AI в направлении: где ИИ дает рычаг в поиске блогеров, аналитике, прогнозе и масштабе. Внедряет продвинутые решения. Создает AI-нативную культуру в команде."}, {"name": "Управление командой", "junior": "Ставит задачи менеджерам по блогерам, контролирует исполнение по чек-листу. Решает конфликты с помощью руководителя.", "middle": "Управляет командой менеджеров и аналитиком, строит нормы и метрики, проводит разборы. Мотивирует и развивает, обеспечивает единое понимание целей. Отвечает за результат команды.", "senior": "Строит команду направления (менеджеры по направлениям, аналитик), отвечает за цели, найм и развитие. Растит сильных, задает культуру и метрики. Управляет через людей, а не вручную."}, {"name": "Процессы и CRM-дисциплина (Битрикс)", "junior": "Заносит данные в Битрикс и таблицы, сверяет факты размещений. Работает по регламенту. Не проектирует процессы.", "middle": "Описывает и оптимизирует процессы работы с блогерами в CRM (Битрикс): этапы, скрипты, контроль. Обеспечивает дисциплину и прозрачность потока. Автоматизирует рутину.", "senior": "Проектирует операционную модель направления: процессы, стандарты, CRM под поток тысяч интеграций. Внедряет изменения как проекты. Создает систему, которая масштабируется без сбоев."}, {"name": "Бренд-безопасность, репутация и маркировка рекламы", "junior": "Соблюдает требования к размещениям и маркировке рекламы по регламенту. Сообщает о рисках. Использует утвержденные материалы.", "middle": "Обеспечивает бренд-безопасность и репутацию: отбор блогеров по рискам, соответствие требованиям, маркировка рекламы (ОРД/ЕРИР). Настраивает контроль на потоке. Формирует стандарты безопасности размещений.", "senior": "Встраивает бренд-безопасность, репутацию и маркировку в модель без потери объема. Управляет репутационными и правовыми рисками размещений на масштабе. Задает стандарты честной и безопасной работы с блогерами."}, {"name": "Кросс-функциональная работа", "junior": "Взаимодействует со смежными по текущим вопросам, эскалирует спорное. Работает на задачи направления.", "middle": "Выстраивает партнерство с продуктом, коммерцией и перформанс-маркетингом. Согласует цели и метрики стыка (охваты в заказы). Ведет совместные проекты.", "senior": "Оркеструет направление внутри маркетинга и коммерции: связка инфлюенса с продажами, продуктом и перформансом. Влияет на маркетинг-стратегию со стороны инфлюенса. Защищает стратегию и бюджет перед руководством."}, {"name": "Управление рисками в инфлюенс-маркетинге", "junior": "Реагирует на сбои (отмена, срыв выхода) по процедуре. Тушит локально. Действует по чужому плану.", "middle": "Заранее видит риски (зависимость от блогеров, рост ставок, репутация) и строит планы на случай. Разруливает нестандартное сам. Внедряет превентивные меры.", "senior": "Строит управление рисками направления: диверсификация блогеров и площадок, защита экономики и репутации на масштабе. Проводит направление через кризисы без срыва объема. Превращает устойчивость в преимущество."}], "CRM Head": [{"name": "CRM-настройка (CRM Configuration)", "junior": "Настраивает базовые элементы CRM по шаблону • Добавляет и настраивает поля сущностей (сделки, контакты, компании) • Создаёт воронки и этапы по готовому ТЗ для отдела продаж • Подключает простые виджеты (визуальные, запрет действий без задач, предотвращение дублей) • Настраивает базовые автодействия: уведомления, смена ответственного • Работает строго по инструкции; при нестандартных ситуациях обращается к руководителю", "middle": "Самостоятельно проектирует и реализует конфигурации любой сложности • Строит цепочки автодействий с условиями: маршрутизация, графики, триггеры по просрочке • Настраивает взаимодействие между несколькими воронками (продажи, маркетинг, продукт) • Реализует логику обязательных полей и контроля заполненности • Настраивает виджеты с расширенным функционалом (триггерные, распределение заявок) • Самостоятельно тестирует бизнес-процессы после настройки, собирает обратную связь от отделов", "senior": "Проектирует архитектуру CRM-системы как единой экосистемы для всей компании • Разрабатывает логику системы с учётом всех отделов, БП, интеграций и масштабирования • Планирует функционал с учётом числа пользователей, нагрузки и перспективы роста • Ставит задачи в разработку на кастомные модули и нестандартные виджеты • Выступает техническим экспертом при выборе и смене CRM-платформы • Обеспечивает актуальность всей технической документации по системе"}, {"name": "Автоматизация бизнес-процессов (Process Automation)", "junior": "Настраивает простые автоматизации по готовым схемам • Понимает что такое бизнес-процесс и как он описывается • Описывает простые линейные БП (шаг за шагом, без ветвлений) • Настраивает базовые триггеры, напоминания и автоматические статусы • Работает по чек-листу; не изобретает новые решения самостоятельно • Фиксирует результаты настройки и информирует пользователей об изменениях", "middle": "Самостоятельно строит автоматизации со сложной логикой и разветвлёнными сценариями • Описывает сложные БП с условиями и альтернативными ветками • Реализует воронку дожима лидов: цепочки касаний, таймеры, эскалации руководителю • Строит систему автоматического распределения трафика по менеджерам • Настраивает триггеры для обнаружения ошибок и аномалий в сделках • Оптимизирует существующие автоматизации на основе данных и обратной связи", "senior": "Проектирует и управляет комплексной системой автоматизации для всего бизнеса • Создаёт архитектуру автоматизаций с учётом взаимодействия всех систем и отделов • Разрабатывает принципиально новые подходы — не воспроизводит готовые шаблоны • Внедряет no-code/low-code платформы и RPA-инструменты для масштабирования • Декомпозирует верхнеуровневые бизнес-задачи на автоматизируемые блоки • Обеспечивает масштабируемость всех решений при росте команды и бизнеса"}, {"name": "Каналы коммуникации (Comm. Channels & Messengers)", "junior": "Настраивает базовые каналы по готовым инструкциям • Подключает IP-телефонию к CRM по чек-листу (базовая интеграция) • Настраивает простые уведомления в мессенджерах (Telegram, WhatsApp) • Подключает email-канал к CRM: входящие/исходящие письма в карточке сделки • Понимает принцип работы каждого канала и его ограничения • Сообщает о сбоях в работе каналов, документирует решения", "middle": "Самостоятельно выстраивает мультиканальную коммуникацию и управляет ею • Настраивает сложные сценарии маршрутизации звонков (очереди, IVR, перехват) • Реализует мультиканальные цепочки касаний: звонок → мессенджер → email → SMS • Настраивает интеграцию мессенджеров с CRM через готовые коннекторы и API • Управляет правилами распределения обращений между каналами и менеджерами • Настраивает запись и хранение переговоров, связку звонков с карточками сделок", "senior": "Проектирует омниканальную коммуникационную инфраструктуру компании • Строит единую архитектуру всех каналов с центральным хранением истории в CRM • Оценивает и внедряет новые каналы и платформы (VoIP, CPaaS, омни-решения) • Обеспечивает единый клиентский профиль вне зависимости от канала обращения • Настраивает аналитику по каналам: стоимость контакта, конверсия, скорость ответа • Формирует стандарты и регламенты работы с каналами для всей компании"}, {"name": "Чат-боты и диалоговая автоматизация (Chatbots & Flows)", "junior": "Понимает принципы работы чат-ботов и умеет настраивать простые сценарии • Разбирается в логике диалоговых деревьев (ветвление по ответу пользователя) • Настраивает приветственные боты и простые FAQ-боты по готовому ТЗ • Подключает готового бота к каналу (Telegram, WhatsApp) по инструкции • Тестирует базовые сценарии, находит и документирует ошибки • Понимает разницу между rule-based и AI-ботами", "middle": "Самостоятельно проектирует и внедряет чат-ботов для квалификации и поддержки • Разрабатывает сценарии ботов для квалификации лидов: сбор данных, scoring, маршрутизация • Настраивает ботов в no-code конструкторах (Salebot, BotHelp, SendPulse и др.) • Интегрирует бота с CRM: автоматическое создание сделок, заполнение полей, смена статусов • Реализует ботов для внутренних процессов: напоминания менеджерам, сбор обратной связи • Анализирует метрики ботов (retention, conversion, drop-off) и оптимизирует сценарии", "senior": "Строит экосистему диалоговой автоматизации с использованием AI • Проектирует многоканальную бот-архитектуру: единые сценарии под разные платформы • Внедряет AI-ботов на базе GPT/LLM для ответов на свободные вопросы клиентов • Настраивает гибридных ботов: автоматический ответ + плавный перехват оператором • Строит систему обучения бота на основе накопленных диалогов • Измеряет и оптимизирует ROI бот-автоматизации по отношению к ручному труду"}, {"name": "Интеграции сервисов (System Integrations)", "junior": "Настраивает интеграции по готовым решениям из маркетплейса • Понимает принцип взаимодействия систем через API и вебхуки на базовом уровне • Подключает готовые интеграции (телефония, мессенджеры, формы лидогенерации) • Работает по чек-листу настройки; не изменяет логику самостоятельно • Умеет читать базовую техническую документацию по интеграциям • Своевременно сообщает о проблемах с интеграциями", "middle": "Настраивает сложные интеграции, читает API-документацию и работает с Postman • Настраивает интеграции, требующие кастомизации и дополнительных согласований • Читает и понимает API-документацию; может самостоятельно проверить запросы в Postman • Интегрирует CRM с ERP, BI-аналитикой, email-платформами, рекламными кабинетами • Формулирует понятные ТЗ для разработчиков на нестандартные интеграции • Тестирует интеграции после внедрения, выявляет и документирует баги", "senior": "Проектирует интеграционную архитектуру всего технологического стека компании • Описывает взаимодействие всех систем и потоки данных между ними • Ставит задачи на разработку кастомных коннекторов без готовых решений • Выбирает оптимальные инструменты интеграции (middleware, iPaaS, API gateway) • Обеспечивает надёжность и мониторинг всех интеграций (uptime, алертинг, логирование) • Формирует стандарты интеграционного слоя и документирует их для команды"}, {"name": "ERP-системы (ERP Configuration)", "junior": "Работает в ERP как продвинутый пользователь, вносит данные по инструкции • Знает чем ERP отличается от CRM и для чего используется каждая система • Работает в ERP на уровне продвинутого пользователя (справочники, отчёты) • Вносит настройки по шаблону и описанному ТЗ • Понимает основные модули: финансы, склад, HR, документооборот • Передаёт нестандартные задачи по ERP профильным специалистам", "middle": "Самостоятельно настраивает базовый контур ERP и обеспечивает синхронизацию с CRM • Настраивает справочники, роли, права доступа и базовые рабочие процессы в ERP • Обеспечивает двустороннюю синхронизацию данных между CRM и ERP • Настраивает базовые отчёты и выгрузки из ERP для бизнес-аналитики • Выявляет узкие места в ERP-процессах и формулирует задачи на доработку • Обучает ключевых пользователей работе с ERP в рамках своего контура", "senior": "Проектирует интеграцию ERP в единую цифровую экосистему компании • Оценивает соответствие ERP-решений стратегии и требованиям всех отделов • Управляет процессом внедрения или миграции ERP: план, сроки, приёмка • Обеспечивает сквозную передачу мастер-данных между всеми системами компании • Ставит задачи вендорам и разработчикам, контролирует качество реализации • Обеспечивает актуальность справочников и целостность данных во всём контуре"}, {"name": "AI-инструменты (AI & Automation Tools)", "junior": "Знает ключевые AI-инструменты и применяет готовые решения • Понимает возможности AI применительно к операционным задачам (не в теории) • Использует AI-транскрибацию звонков (Speechify, Fathom, Whisper-решения) • Применяет ChatGPT/Claude для генерации скриптов, шаблонов, описаний БП • Тестирует готовые AI-виджеты в CRM и оценивает их применимость • Следит за новыми AI-инструментами релевантными для своей роли", "middle": "Самостоятельно внедряет AI-инструменты в рабочие процессы отделов • Интегрирует AI-транскрибацию с CRM: автоматическое заполнение полей, итоги звонков • Настраивает AI-скоринг лидов по поведенческим и демографическим признакам • Внедряет AI-ассистентов для менеджеров: подсказки, следующий шаг, шаблоны ответов • Использует AI-классификацию обращений для автоматической маршрутизации • Измеряет эффект от внедрения: экономия времени, рост конверсии, снижение ошибок", "senior": "Строит AI-слой как стратегическую часть технологической инфраструктуры • Проектирует комплексную AI-архитектуру: от сбора данных до применения моделей • Оценивает и внедряет LLM-решения для автоматизации сложных коммуникационных задач • Строит систему обучения и дообучения моделей на данных компании • Управляет балансом человек/AI: где автоматизировать, где оставить человека • Формирует AI-стратегию компании совместно с CEO и коммерческим директором"}, {"name": "Аналитика и дашборды (Basic Analytics & Dashboards)", "junior": "Работает с готовыми отчётами, настраивает базовые фильтры • Читает и интерпретирует дашборды воронки продаж • Настраивает базовые фильтры и стандартные отчёты в CRM • Работает с выгрузками в Excel / Google Sheets • Понимает основные метрики: конверсия, скорость обработки, количество сделок • Понимает свою роль: обеспечивает технический слой данных, не является аналитиком", "middle": "Строит базовые дашборды и обеспечивает качество данных для аналитики • Создаёт операционные дашборды в CRM, Google Looker Studio, Power BI (базовый уровень) • Настраивает автоматическую выгрузку данных из CRM в аналитические системы • Обеспечивает корректность и актуальность данных: дедупликация, валидация полей • Определяет какие данные нужны бизнесу и обеспечивает их сбор на уровне CRM • Взаимодействует с аналитиком: передаёт чистые, структурированные данные", "senior": "Проектирует единый аналитический слой для всей коммерческой функции • Проектирует структуру данных в CRM с учётом требований BI и отчётности • Обеспечивает единый источник данных (single source of truth) для всех отделов • Выстраивает автоматизированный data pipeline из CRM в BI-инструменты • Контролирует качество данных системно: стандарты, регламенты, мониторинг • Инициирует новые метрики для оценки эффективности автоматизаций"}, {"name": "Описание БП и документация (BPM & Documentation)", "junior": "Описывает линейные БП по шаблону, ведёт базовую документацию • Фиксирует простые бизнес-процессы в виде текстовых инструкций • Использует готовые шаблоны ТЗ и схем процессов • Конкретизирует цели задачи при сборе требований от заказчика • Информирует пользователей об изменениях в процессах • При нестандартных ситуациях обращается к руководителю", "middle": "Самостоятельно описывает сложные разветвлённые процессы и составляет ТЗ • Описывает БП с условиями, ветвлениями и исключениями • Видит и фиксирует «скрытые» шаги процесса (неочевидные зависимости) • Составляет ТЗ по бизнес-требованиям и согласовывает с заказчиком • Описывает условия взаимодействия нескольких БП между собой • Поддерживает документацию в актуальном состоянии после изменений", "senior": "Проектирует систему БП и управляет единым хранилищем документации • Декомпозирует верхнеуровневые процессы до уровня атомарных задач • Создаёт и поддерживает единое хранилище документации по всем БП компании • Формирует стандарты описания процессов и шаблоны ТЗ для команды • Выявляет противоречия между процессами разных отделов и предлагает решения • Управляет ожиданиями заказчика — выходит с инициативой, а не только по запросу"}, {"name": "Системное и аналитическое мышление (Systems Thinking)", "junior": "Разбивает задачи на части, работает по инструкции • Собирает данные для задачи из нескольких источников • Разбивает задачу на составные элементы и шаги • Видит прямые причинно-следственные связи между событиями • Предлагает стандартные решения на основе инструкций • Замечает очевидные риски и своевременно сообщает о них", "middle": "Видит системные взаимосвязи, строит гипотезы и находит первопричины • Анализирует большие объёмы данных, быстро отделяет главное от второстепенного • Определяет узкие места в процессах и предлагает конкретные решения • Находит первопричину проблемы, а не только устраняет симптом • Формирует гипотезы на основе анализа и проверяет их • Критически оценивает надёжность источников информации", "senior": "Разрабатывает системные решения для сложных и нетиповых задач • Выявляет неочевидные закономерности и взаимозависимости систем • Строит сценарии развития событий с учётом рисков и ограничений • Принимает решения при неполной информации, управляет неопределённостью • Критически оценивает предложения команды и внешних подрядчиков • Формирует культуру системного мышления в команде"}, {"name": "Коммуникация с заказчиком (Stakeholder Comm.)", "junior": "Чётко передаёт информацию, задаёт уточняющие вопросы • Формулирует мысли понятно и без технического жаргона • Задаёт уточняющие вопросы для прояснения требований • Информирует заказчика об этапах выполнения задачи • Принимает обратную связь без защитной реакции • Соблюдает деловой этикет в письменной и устной коммуникации", "middle": "Самостоятельно ведёт заказчика от брифа до приёмки результата • Проводит брифинг: выявляет истинные потребности, а не только озвученный запрос • Предлагает альтернативные технические решения с обоснованием • Управляет ожиданиями: сообщает о рисках и блокерах заблаговременно • Уверенно общается с руководителями уровня выше своего • Умеет влиять на решение через аргументацию, примеры и данные", "senior": "Выходит к заказчику с инициативой и управляет ожиданиями всех стейкхолдеров • Проактивно обнаруживает скрытые проблемы ещё до обращения заказчика • Формирует шаблоны взаимодействия с заказчиком для всей команды • Управляет конфликтами интересов между несколькими заинтересованными сторонами • Обеспечивает поддержку изменений на уровне руководства компании • Создаёт культуру доверия между техническим блоком и бизнес-подразделениями"}, {"name": "Решение проблем (Problem Solving)", "junior": "Решает стандартные задачи по инструкции • Применяет известные решения к типовым ситуациям • Следует инструкциям и чек-листам • При нестандартных задачах запрашивает помощь руководителя • Фиксирует проблему и найденное решение для базы знаний • Не принимает решения без согласования в спорных случаях", "middle": "Самостоятельно решает нестандартные задачи, предлагает варианты решений • Анализирует первопричину проблемы — не только устраняет симптом • Комбинирует известные подходы под новые контексты • Предлагает несколько вариантов решения с оценкой плюсов, минусов и рисков • Работает в условиях неопределённости без постоянного сопровождения • Быстро адаптируется при изменении требований или ограничений", "senior": "Разрабатывает системные решения, предотвращающие повторение проблем • Создаёт стандарты и шаблоны, исключающие класс типовых ошибок • Формирует базу знаний и обеспечивает её использование командой • Принимает решения при высокой неопределённости с управляемым риском • Инициирует структурные изменения на основе выявленных закономерностей • Объясняет сложные технические решения бизнес-заказчику простым языком"}, {"name": "Ownership (Принятие ответственности)", "junior": "Берёт ответственность за порученные задачи и доводит до результата • Завершает задачи без напоминаний, соблюдает дедлайны • Признаёт ошибки — не ищет виноватых • Заблаговременно предупреждает о рисках срыва задачи • Инициирует исправление проблем, которые замечает • Не ждёт идеальных условий: находит способ сделать", "middle": "Берёт ответственность за работоспособность систем и бизнес-результат автоматизаций • Отвечает за работоспособность всех настроенных систем — и после сдачи задачи • Инициирует улучшения без прямого запроса, видит задачи до их постановки • Думает на шаг вперёд: оценивает последствия технических решений для бизнеса • Берёт сложные кросс-функциональные задачи, не перекладывает ответственность • Формирует менталитет владельца в своих взаимодействиях с командой", "senior": "Отвечает за технологическую эффективность всей компании • Связывает технические решения с измеримыми бизнес-метриками • Берёт на себя сложные межфункциональные конфликты и разрешает их • Принимает риски при внедрении изменений и управляет ими системно • Создаёт культуру ответственности за данные и качество процессов в команде • Показывает пример экстремальной ответственности — воспринимает бизнес как своё"}, {"name": "Data-First Thinking (Мышление на основе данных)", "junior": "Использует данные для принятия решений по задаче • Читает и понимает базовые отчёты и дашборды • Проверяет корректность данных перед использованием • Не делает выводы без фактической основы • Понимает ключевые метрики коммерческого блока • Фиксирует данные по задачам для последующего анализа", "middle": "Инициирует сбор нужных данных и строит процессы на их основе • Определяет какие данные необходимы для оценки эффективности БП — ещё до настройки • Обеспечивает корректный технический сбор данных на уровне CRM • Оспаривает решения без данных; предлагает способы измерить результат • Связывает технические изменения с измеримыми бизнес-результатами • Обучает команду и заказчиков важности данных в ежедневной работе", "senior": "Делает данные основой всей системы управления бизнес-процессами • Выстраивает единую архитектуру данных коммерческого блока • Обеспечивает консистентность и качество данных во всех системах • Использует данные для обоснования приоритетов и инвестиций в автоматизацию • Создаёт культуру измерения результатов в команде и у всех внутренних заказчиков • Инициирует новые метрики для оценки ценности технических внедрений"}, {"name": "Continuous Improvement (Постоянное совершенствование)", "junior": "Совершенствует своё владение инструментами и фиксирует находки • Следит за обновлениями CRM-платформы и смежных сервисов • Применяет полученные знания и ищет способы улучшить свою работу • Задаёт вопросы, учится на обратной связи, не повторяет одних и тех же ошибок • Документирует найденные решения для передачи знаний • Открыт к новым методам, инструментам и подходам", "middle": "Инициирует улучшения процессов на основе наблюдений и данных • Регулярно проводит ревизию существующих автоматизаций • Предлагает оптимизации — не дожидается задачи сверху • Изучает лучшие практики рынка (CRM, AI, автоматизация) и внедряет их • Делится знаниями с командой, создаёт шаблоны и инструкции • Предлагает A/B-тесты для сравнения эффективности разных настроек", "senior": "Строит системный процесс непрерывного совершенствования • Встраивает регулярный аудит автоматизаций в рабочий ритм команды • Управляет бэклогом улучшений с приоритизацией по бизнес-ценности • Создаёт культуру экспериментирования и быстрой проверки гипотез • Масштабирует удачные решения на всю организацию • Управляет технологическим радаром компании: что изучать, что внедрять, что убирать"}], "Бизнес Аналитик": [{"name": "SQL & Database Management (SQL и управление базами данных)", "junior": "Пишет базовые запросы для извлечения данных • SELECT, WHERE, GROUP BY, ORDER BY, простые JOIN (INNER, LEFT) • Понимает структуру реляционных баз данных: таблицы, ключи, связи • Может написать запрос по готовому ТЗ: «выгрузи продажи за месяц по менеджерам» • Работает в SQL-клиентах: DBeaver, DataGrip, pgAdmin • Понимает разницу между базами: PostgreSQL, MySQL, ClickHouse на базовом уровне • Выгружает данные в Excel/CSV для дальнейшей обработки", "middle": "Оптимизирует запросы и строит сложные аналитические выборки • CTE (Common Table Expressions), подзапросы, CASE WHEN, COALESCE • Window-функции: ROW_NUMBER, RANK, LAG, LEAD, SUM OVER, PARTITION BY • Создаёт индексы, анализирует EXPLAIN-планы, оптимизирует время выполнения • Работает с миллионами строк без деградации производительности • Создаёт представления (views) и материализованные представления для BI • Понимает партиционирование таблиц и агрегированные витрины данных", "senior": "Проектирует аналитическую инфраструктуру данных • Проектирует хранилища данных (DWH): Star Schema, Snowflake Schema • Создаёт слои данных: raw → staging → marts → business layer • Настраивает и оптимизирует аналитические БД: ClickHouse, BigQuery, Redshift • Управляет миллиардами строк с SLA отклика < 5 секунд • Внедряет стандарты именования, документации и версионирования SQL • Принимает архитектурные решения: какую БД использовать для каких задач"}, {"name": "BI-инструменты (Power BI / Tableau / Looker / Data Studio)", "junior": "Создаёт простые отчёты и визуализации по шаблону • Подключается к источнику данных и строит базовые графики: столбцы, линии, круговые • Добавляет фильтры, срезы, базовую интерактивность • Работает в одном BI-инструменте уверенно • Форматирует отчёты: цвета, подписи, заголовки • Публикует отчёты и настраивает базовый доступ для пользователей • Обновляет данные по расписанию через встроенные функции", "middle": "Разрабатывает сложные интерактивные дашборды с drill-down • Строит многостраничные дашборды с навигацией и детализацией • Создаёт вычисляемые метрики: DAX (Power BI), LOD (Tableau), LookML (Looker) • Проектирует модели данных внутри BI: связи таблиц, иерархии, фильтрация • Реализует drill-down от уровня компании до конкретной сделки • Оптимизирует производительность: инкрементальное обновление, агрегации • Владеет 2+ BI-инструментами, может обосновать выбор под задачу", "senior": "Проектирует BI-архитектуру и стандарты визуализации для всей компании • Создаёт единую BI-платформу: шаблоны, библиотека компонентов, гайдлайн визуализации • Внедряет semantic layer / business logic layer для единой трактовки метрик • Проектирует self-service аналитику: пользователи сами строят отчёты в рамках стандартов • Управляет lifecycle дашбордов: создание → тестирование → публикация → поддержка → архивация • Настраивает row-level security, governance и контроль доступа • Оценивает и внедряет новые BI-инструменты при необходимости"}, {"name": "Data Modeling (Моделирование данных)", "junior": "Понимает базовую структуру таблиц и связей • Читает ER-диаграммы, понимает связи 1:1, 1:N, N:N • Знает что такое первичный ключ, внешний ключ, индекс • Может описать структуру данных для простой задачи • Понимает разницу между нормализацией и денормализацией на базовом уровне • Работает с готовыми моделями данных, не ломая их", "middle": "Строит оптимальные модели данных для аналитических задач • Проектирует Star Schema и Snowflake Schema для аналитических витрин • Создаёт fact-таблицы и dimension-таблицы с правильной гранулярностью • Строит SCD (Slowly Changing Dimensions) для отслеживания исторических изменений • Оптимизирует модели под конкретные запросы и BI-инструменты • Документирует модели данных: data dictionary, lineage, описание полей • Проводит ревью моделей и вносит изменения без потери обратной совместимости", "senior": "Создаёт корпоративную модель данных на уровне всей компании • Проектирует Enterprise Data Model: единая модель для всех отделов и продуктов • Внедряет Data Mesh / Data Fabric подходы при масштабировании • Управляет эволюцией модели: версионирование, миграции, обратная совместимость • Обеспечивает единую «правду» (Single Source of Truth) по всем метрикам • Принимает решения об архитектуре данных в контексте бизнес-стратегии • Модель данных масштабируется на новые направления бизнеса без переписывания"}, {"name": "ETL/ELT & Data Pipelines (Пайплайны обработки данных)", "junior": "Настраивает простые загрузки данных • Импортирует данные из CSV, Excel, Google Sheets в базу данных • Настраивает базовые коннекторы в BI-инструментах • Понимает что такое ETL (Extract → Transform → Load) и зачем он нужен • Может настроить автоматическое обновление данных по расписанию • Отслеживает и сообщает об ошибках загрузки", "middle": "Автоматизирует и оптимизирует пайплайны обработки данных • Строит ETL/ELT-пайплайны в инструментах: dbt, Airflow, Prefect, Luigi • Настраивает инкрементальную загрузку (только новые/изменённые данные) • Обрабатывает данные из разных источников: API, базы, файлы, стриминг • Внедряет проверки качества данных (data quality checks) в пайплайны • Мониторит работу пайплайнов: алерты при сбоях, логирование, метрики • Оптимизирует время обработки: параллелизация, батчи, партиционирование", "senior": "Проектирует и внедряет аналитическую инфраструктуру данных • Проектирует архитектуру данных от источника до дашборда: CDC, event streaming, batch • Внедряет оркестраторы (Airflow, Dagster) с автоматическим масштабированием • Строит real-time и near-real-time пайплайны (Kafka, Spark Streaming) • Управляет data lineage: от какого источника какая метрика как считается • Внедряет Infrastructure as Code для аналитической инфраструктуры • Обеспечивает SLA по свежести данных для всех критических дашбордов"}, {"name": "Python / R для аналитики (Программирование для анализа данных)", "junior": "Запускает и адаптирует готовые скрипты • Работает в Jupyter Notebook / Google Colab • Использует pandas для базовой обработки: чтение файлов, фильтрация, группировка • Строит простые графики через matplotlib / seaborn • Может адаптировать чужой код под свою задачу • Понимает базовые конструкции: переменные, циклы, функции, условия • Устанавливает и использует библиотеки через pip", "middle": "Пишет аналитические скрипты и автоматизирует обработку данных • pandas, numpy, scipy — уверенная обработка данных любого объёма • Строит аналитические модели: когортный анализ, прогнозирование, кластеризация • Автоматизирует регулярные задачи: выгрузки, отчёты, проверки качества • Работает с API: requests, автоматический сбор данных из внешних систем • Использует scikit-learn для базового ML: регрессия, классификация • Чистый код: функции, модули, обработка ошибок, логирование", "senior": "Разрабатывает аналитические библиотеки и ML-решения для бизнеса • Создаёт внутренние Python-библиотеки для стандартизации аналитики • Разрабатывает прогнозные модели: revenue forecasting, churn prediction, LTV prediction • Внедряет ML в продакшн: модели работают автоматически и влияют на решения • Оптимизирует производительность: vectorization, Dask/Spark для больших данных • Строит системы автоматического обнаружения аномалий на основе ML • Менторит команду, проводит код-ревью, задаёт стандарты разработки"}, {"name": "Data Visualization & UX (Визуализация данных и UX дашбордов)", "junior": "Следует готовым шаблонам и гайдлайнам визуализации • Выбирает правильный тип графика для задачи: линия для тренда, столбцы для сравнения • Соблюдает базовые правила: подписи осей, легенда, читаемые цвета • Размещает элементы на дашборде по заданному макету • Понимает принцип «от общего к частному» в расположении данных • Не перегружает дашборд лишними элементами", "middle": "Создаёт UX-решения для дашбордов, ориентированные на задачи пользователя • Проектирует дашборды по принципу information hierarchy: ключевые метрики → детали → действия • Применяет принципы дата-визуализации: Tufte, Few, Cairo • Создаёт дашборды для разных ролей: CEO видит одно, маркетолог — другое • Проводит UX-исследования: наблюдает как пользователи работают с дашбордами • Создаёт tooltips, аннотации, контекстные подсказки для самообъяснения данных • Тестирует и итерирует: каждый дашборд улучшается после обратной связи", "senior": "Формирует корпоративные стандарты визуализации и data storytelling • Создаёт Design System для BI: шрифты, цвета, компоненты, шаблоны • Внедряет стандарты так, что любой новый дашборд сразу выглядит профессионально • Обучает команду принципам data storytelling: данные рассказывают историю, а не просто показывают цифры • Дашборды не требуют пояснений — пользователь понимает всё сам • Создаёт библиотеку best practices с примерами хороших и плохих визуализаций • Визуализация данных становится конкурентным преимуществом компании"}, {"name": "API Integration & Data Engineering (Интеграция API и инженерия данных)", "junior": "Использует готовые API-запросы и коннекторы • Понимает что такое API, REST, JSON, HTTP-методы (GET, POST) • Подключает готовые коннекторы к источникам данных (CRM, рекламные кабинеты) • Тестирует API через Postman или аналоги • Может запустить готовый скрипт интеграции • Понимает формат данных: JSON, XML, CSV", "middle": "Настраивает интеграции с внешними источниками и автоматизирует сбор данных • Пишет скрипты для автоматического сбора данных из API (Python requests, aiohttp) • Интегрирует CRM, рекламные платформы, платёжные системы, вебхуки • Обрабатывает пагинацию, rate limiting, retry-логику • Настраивает webhook-обработчики для event-driven архитектуры • Управляет API-ключами и безопасностью интеграций • Мониторит работу интеграций: алерты при сбоях, валидация данных", "senior": "Создаёт систему интеграции данных корпоративного уровня • Проектирует архитектуру сбора данных: какие источники, как часто, с каким SLA • Внедряет iPaaS / CDC-решения: Fivetran, Airbyte, Debezium • Строит event-driven архитектуру с Kafka/RabbitMQ для real-time данных • Обеспечивает отказоустойчивость: при падении одного источника система продолжает работать • Управляет schema registry и контрактами данных между системами • Интеграционная инфраструктура масштабируется с ростом бизнеса без переписывания"}, {"name": "A/B Testing & Experimentation (A/B тестирование и эксперименты)", "junior": "Читает и интерпретирует отчёты по тестам • Понимает что такое A/B тест: контрольная группа, тестовая группа, метрика • Читает результаты тестов и понимает «статистически значимо / не значимо» • Знает базовые метрики: conversion rate, p-value, confidence interval • Помогает команде формулировать гипотезы • Готовит простые отчёты по результатам тестов", "middle": "Самостоятельно проектирует, проводит и анализирует эксперименты • Рассчитывает размер выборки (sample size) для нужной статистической мощности • Проектирует тесты: сплитование трафика, длительность, метрики успеха • Проводит статистический анализ: t-test, chi-square, Mann-Whitney, bootstrap • Анализирует результаты по сегментам: тест работает для всех или только для части • Строит байесовские модели для оценки экспериментов • Документирует и каталогизирует все проведённые эксперименты", "senior": "Строит систему и культуру экспериментирования в компании • Внедряет платформу для A/B тестирования: конфигурация тестов, автоматический анализ • Создаёт фреймворк приоритизации гипотез (ICE, RICE и кастомные) • Автоматизирует отчётность: результаты тестов приходят автоматически с рекомендациями • Обучает команды правильно формулировать и проверять гипотезы • Управляет портфелем экспериментов: какие тесты запущены, какие в очереди • Экспериментирование становится частью процесса принятия решений в компании"}, {"name": "Data Governance & Quality (Управление данными и качество)", "junior": "Соблюдает правила доступа и базовые стандарты • Понимает зачем нужна безопасность данных и кто к чему имеет доступ • Следует установленным правилам именования таблиц и полей • Сообщает об обнаруженных аномалиях и ошибках в данных • Проверяет свои выгрузки на корректность перед отправкой • Понимает что такое GDPR / защита персональных данных на базовом уровне", "middle": "Настраивает систему контроля качества данных и управления доступами • Настраивает role-based access control: кто видит какие данные • Внедряет data quality checks: полнота, уникальность, консистентность, актуальность • Создаёт data dictionary: описание каждой таблицы и поля, бизнес-логика • Настраивает алерты при нарушении качества данных • Проводит регулярные аудиты данных: что устарело, что дублируется • Внедряет data lineage: прослеживаемость от источника до дашборда", "senior": "Формирует политику управления данными на уровне компании • Создаёт Data Governance Framework: стандарты, процессы, ответственные, SLA • Внедряет data catalog (Amundsen, DataHub) для самостоятельного поиска данных • Управляет compliance: GDPR, 152-ФЗ, отраслевые стандарты • Создаёт систему мониторинга качества данных в реальном времени • Данные компании — управляемый актив с понятным владельцем каждой таблицы • Любой сотрудник может найти нужные данные, понять их и доверять им"}, {"name": "Anomaly Detection & Alerting (Обнаружение аномалий и алертинг)", "junior": "Интерпретирует алерты и сообщает о проблемах • Понимает что такое аномалия: резкое отклонение от нормы • Получает алерты и передаёт информацию ответственному • Может визуально определить аномалию на графике • Знает базовые пороги: если метрика отклонилась на X% — это сигнал • Документирует обнаруженные аномалии", "middle": "Настраивает правила, фильтры и автоматические алерты • Настраивает rule-based алерты: пороговые значения, процентные отклонения • Создаёт алерты в BI-инструментах и системах мониторинга (Grafana, PagerDuty) • Фильтрует ложные срабатывания: настраивает чувствительность • Создаёт эскалационную матрицу: кто получает алерт, через сколько эскалация • Анализирует причины аномалий: drill-down до корневой причины • Строит baseline-модели для автоматического определения «нормы»", "senior": "Разрабатывает ML-модели для автоматического обнаружения аномалий • Внедряет statistical и ML-based anomaly detection: Isolation Forest, Prophet, ARIMA • Создаёт систему real-time мониторинга критических метрик • Строит предиктивные модели: предупреждает о проблемах ДО того, как они станут критическими • Автоматически определяет root cause аномалий через data decomposition • Система обучается на обратной связи: каждый ложный алерт улучшает модель • Аномалии обнаруживаются системой до того, как их заметят люди"}, {"name": "Stakeholder Management (Управление стейкхолдерами)", "junior": "Работает с 1–2 заказчиками, выполняет их запросы • Принимает задачу, уточняет требования, делает в срок • Общается в контексте «заказчик → исполнитель» • Задаёт уточняющие вопросы до начала работы • Показывает результат и принимает обратную связь • Понимает кто его основной заказчик и что для него важно", "middle": "Управляет 5–10 стейкхолдерами, приоритизирует запросы • Собирает требования у разных отделов и переводит «хотелки» в ТЗ • Управляет очередью запросов: что важнее, что подождёт, почему • Проактивно показывает инсайты: «я заметил в данных X, это важно для вас» • Проводит демо и обучение по новым дашбордам • Управляет ожиданиями: реалистичные сроки, прозрачность загрузки • Строит отношения доверия: к аналитику идут за советом, а не только за выгрузкой", "senior": "Ведёт BI-направление для C-Level и формирует аналитическую стратегию • Работает напрямую с CEO, CFO, COO — переводит данные на язык стратегических решений • Участвует в стратегических сессиях как «голос данных» • Формирует roadmap аналитики исходя из бизнес-приоритетов • Управляет балансом между стратегическими проектами и операционными запросами • Создаёт культуру, где руководители принимают решения на основе данных • Аналитика воспринимается бизнесом как стратегический партнёр, а не сервис"}, {"name": "Critical Thinking & Problem Solving (Критическое мышление и решение проблем)", "junior": "Анализирует простые кейсы и находит очевидные ответы в данных • Может ответить на вопрос «что произошло?» по готовому дашборду • Проверяет данные на здравый смысл: «эта цифра выглядит странно» • Структурирует свою работу: от задачи → к данным → к ответу • Задаёт вопрос «почему?» когда видит аномалию • Не принимает первый найденный ответ как единственный", "middle": "Структурирует сложные проблемы и находит корневые причины • Декомпозирует бизнес-проблему на аналитические подзадачи • Применяет фреймворки: MECE, 5 Why, Ishikawa для анализа причин • Видит «за деревьями лес»: отдельные метрики → целостная картина • Находит неочевидные паттерны в данных и формулирует гипотезы • Различает корреляцию и причинно-следственную связь • Ставит под сомнение данные: «а точно ли это считается правильно?»", "senior": "Решает стратегические бизнес-задачи через данные • Формулирует стратегические вопросы, на которые должна ответить аналитика • Строит аналитические модели для стратегических решений: выход на новый рынок, запуск продукта • Создаёт сценарные модели: «что будет, если X? а если Y?» • Внедряет culture of questioning: команда привыкает проверять данными • Предвосхищает вопросы бизнеса: анализ готов до того, как его запросили • Каждое стратегическое решение подкреплено data-driven анализом"}, {"name": "Communication & Data Storytelling (Коммуникация и презентация данных)", "junior": "Чётко формулирует выводы из данных • Может объяснить свой анализ коллегам простым языком • Формулирует ответ в формате: «метрика X выросла/упала на Y% потому что Z» • Не перегружает сообщение лишними деталями • Готовит короткие письменные саммари по выгрузкам • Может ответить на вопрос «и что с этим делать?» на базовом уровне", "middle": "Ведёт презентации и обучает команды работе с данными • Проводит демо дашбордов для отделов: показывает не кнопки, а ценность • Строит презентации по принципу data storytelling: контекст → инсайт → рекомендация • Обучает коллег самостоятельно работать с BI (data literacy программы) • Адаптирует язык и глубину под аудиторию: маркетологу — одно, финансисту — другое • Создаёт документацию и гайды по использованию аналитических инструментов • Превращает «сухие цифры» в actionable insights: данные → решение", "senior": "Проводит стратегические сессии с руководством на языке данных • Выступает перед C-level с аналитическими рекомендациями • Строит нарратив: не «вот 50 графиков», а «вот 3 вещи, которые нужно сделать» • Визуализирует сложные взаимосвязи так, что их понимает любой руководитель • Создаёт культуру, где данные — язык общения в компании • Аналитические материалы используются в стратегических презентациях компании • Каждый отчёт отвечает на вопрос «so what?» и «what next?»"}, {"name": "Data-Driven Culture (Культура принятия решений на данных)", "junior": "Принимает решения на основе данных под руководством старшего • Не говорит «мне кажется» — ищет подтверждение в данных • Перед любым выводом проверяет цифры • Задаёт коллегам вопрос «а какие данные это подтверждают?» • Документирует свои аналитические находки • Учится отличать «данные говорят» от «я интерпретирую»", "middle": "Самостоятельно использует данные и обучает других • Формирует привычку data-first в своей команде • Создаёт дашборды, которые команды используют ежедневно • Проводит обучения: как читать данные, как задавать правильные вопросы • Строит систему: гипотеза → данные → решение → замер результата • Помогает командам переходить от «интуитивных» решений к обоснованным • Создаёт шаблоны для типовых аналитических задач", "senior": "Продвигает культуру данных в масштабах всей компании • Каждый отдел принимает решения на данных — это норма, а не исключение • Внедряет data literacy программы: каждый сотрудник умеет читать дашборды • Создаёт self-service аналитику: команды сами находят ответы без запроса аналитику • Формирует governance: единые определения метрик, процессы валидации • Аналитика встроена в каждый бизнес-процесс: от найма до запуска продукта • Компания известна на рынке как data-driven организация"}, {"name": "Ownership & Result Orientation (Ответственность и ориентация на результат)", "junior": "Отвечает за свой блок задач и доводит дело до конца • Выполняет задачи в срок, не оставляет «хвосты» • Не ждёт напоминаний — сам отслеживает дедлайны • Если что-то не получается — сообщает заранее, не в последний момент • Проверяет свою работу перед сдачей • Отвечает за качество своих выгрузок и отчётов", "middle": "Отвечает за целое направление и управляет приоритетами • Берёт ответственность не за «задачу», а за «бизнес-результат» • Самостоятельно приоритизирует бэклог: что принесёт максимальный эффект • Проактивно находит и решает проблемы: не ждёт запроса • Управляет техническим долгом: балансирует скорость и качество • Отвечает за uptime и работоспособность аналитической инфраструктуры • Измеряет эффект своей работы: «мой дашборд ускорил принятие решений на X»", "senior": "Несёт полную ответственность за BI-направление компании • Результаты аналитики измеряются в бизнес-терминах: сколько сэкономили, ускорили, предотвратили • Формирует стратегию развития аналитики на 1–2 года • Строит команду и процессы, которые работают без ручного управления • Каждый проект завершается retrospective и measurement of impact • Аналитика не просто «считает» — она напрямую влияет на рост бизнеса • Готов обосновать ROI аналитической функции перед руководством"}, {"name": "Speed & Execution (Скорость и исполнение)", "junior": "Выполняет задачи в установленные сроки • Соблюдает дедлайны по задачам • Не затягивает с простыми запросами: выгрузка — в тот же день • Умеет оценить время на задачу и сообщить заказчику • Не перфекционит: сдаёт «80% готово» вовремя, а не «100%» с опозданием • Знает когда спросить, а когда разобраться самому", "middle": "Управляет приоритетами и ускоряет time-to-insight • Быстро прототипирует дашборды: «грязная» версия за день, полировка потом • Автоматизирует повторяющиеся запросы вместо ручной работы • Параллелит задачи: пока данные загружаются — делает визуализацию • Создаёт шаблоны и модули для ускорения новых проектов • Управляет бэклогом: отсекает задачи, которые не влияют на бизнес • Time-to-Insight сокращается каждый квартал за счёт автоматизации", "senior": "Формирует культуру скорости и непрерывных улучшений • Создаёт процессы, которые позволяют отвечать на запрос за часы, а не дни • Self-service аналитика: 80% запросов команды решают сами, без аналитика • Непрерывный deployment: обновления дашбордов без простоя • Каждый процесс регулярно проходит ретроспективу: что ускорить • Внедряет DevOps-практики в аналитику: CI/CD, version control, testing • Аналитика работает быстрее, чем бизнес успевает запрашивать"}, {"name": "Collaboration & Transparency (Сотрудничество и прозрачность)", "junior": "Работает в команде и делится результатами • Делится своими выгрузками и находками с коллегами • Участвует в командных обсуждениях конструктивно • Документирует свою работу так, чтобы коллега мог разобраться • Задаёт вопросы когда чего-то не понимает • Помогает коллегам с простыми запросами", "middle": "Координирует кросс-командные аналитические задачи • Работает с маркетингом, продажами, продуктом одновременно • Создаёт единую отчётность, понятную всем отделам • Формирует прозрачные процессы: статус задач, очередь, приоритеты • Проводит аналитические синхронизации между командами • Документирует все метрики и бизнес-логику в доступном месте • Любой сотрудник может найти актуальные данные без обращения к аналитику", "senior": "Создаёт культуру прозрачных данных и кросс-функционального сотрудничества • Данные компании доступны каждому сотруднику в рамках его роли • Внедряет политику open data: все метрики открыты, логика задокументирована • Управляет многокомандными аналитическими проектами • Создаёт процессы, где аналитика = мост между отделами • Knowledge base по аналитике актуален и используется ежедневно • Уход одного аналитика не ломает аналитику — всё задокументировано"}, {"name": "Innovation & Learning Agility (Инновации и обучаемость)", "junior": "Применяет готовые решения и осваивает новые инструменты • Открыт к новым инструментам, не боится пробовать • Проходит обучения по инструментам и технологиям • Следит за обновлениями используемых платформ • Применяет лучшие практики из туториалов и документации • Делится найденными полезными решениями с командой", "middle": "Внедряет новые подходы и активно экспериментирует • Тестирует новые инструменты и библиотеки, оценивает fit для компании • Внедряет подходы из смежных областей: ML, data engineering, product analytics • Автоматизирует рутину: если делаешь что-то 3-й раз — напиши скрипт • Участвует в профессиональных сообществах, конференциях, митапах • Быстро адаптируется к новым требованиям бизнеса • Предлагает улучшения, а не только выполняет задачи", "senior": "Формирует культуру постоянного улучшения и задаёт стандарты • Создаёт R&D-процесс в аналитике: часть времени — на эксперименты • Внедряет прорывные подходы: AI-assisted analytics, automated insights • Обучает команду и создаёт программы развития аналитиков • Формирует технический roadmap: какие технологии внедрять в ближайший год • Создаёт внутренние стандарты, которые можно использовать как индустриальные • Аналитическая функция — драйвер инноваций в компании, а не обслуживающий сервис"}], "Маркетолог автоворонщик": [{"name": "Архитектура автоворонок и CJM", "junior": "Собирает воронку по готовому шаблону или схеме руководителя. Понимает базовую логику: лид-магнит → трипваер → основной офер. Не строит CJM самостоятельно. Не учитывает разные сегменты и точки входа. Линейные сценарии без ветвлений. Подход: повторяет то, что уже работает у других.", "middle": "Самостоятельно проектирует воронку под конкретный продукт и аудиторию. Строит CJM с учетом 2-3 сегментов и разных точек входа. Использует ветвления по поведению пользователя (открыл/не открыл, кликнул/не кликнул). Связывает воронку с этапами осознанности по Ханту. Декомпозирует путь от трафика до повторной покупки. Подход: проектирует под цели запуска, а не копирует.", "senior": "Проектирует системы из нескольких связанных воронок (top/middle/bottom of funnel, реактивация, допродажи). Строит ecosystem-подход: основная воронка + сателлиты + ремаркетинг + работа с базой. Закладывает growth loops и виральные механики. Адаптирует архитектуру под разные продукты в линейке (трипваер, основной курс, премиум). Создает фреймворк проектирования воронок для команды. Подход: воронка как продукт со своим roadmap."}, {"name": "Продающие тексты и сценарии воронки (копирайтинг)", "junior": "Пишет тексты по готовым шаблонам и формулам (AIDA, PAS). Собирает письма из референсов конкурентов. Не умеет глубоко работать со смыслами и болями ЦА. Слабо различает прогревный и продающий контент. Тексты шаблонные, без отстройки от рынка. Подход: переписывает чужое под себя.", "middle": "Самостоятельно проводит CustDev и собирает речь клиента. Пишет цепочки писем и сценарии бота под конкретный сегмент и боль. Использует storytelling, кейсы, отработку возражений. Различает форматы: прогрев, продажа, дожим, реактивация. Адаптирует тексты под канал (email vs Telegram vs WhatsApp). Подход: пишет под измеряемую конверсию.", "senior": "Создает редполитику и tone of voice воронки на уровне бренда. Проектирует драматургию запуска: смыслы, инсайты, переломные точки прогрева. Создает уникальные методологические смыслы (термины, фреймворки, манифесты). Управляет командой копирайтеров и сценаристов. Создает библиотеку проверенных смысловых блоков (swipe file). Подход: смыслы как актив, а не как разовый контент."}, {"name": "Работа с сервисами автоматизации (GetCourse, Salebot, BotHelp, SendPulse и др.)", "junior": "Уверенно работает в одном основном сервисе (например, GetCourse) на базовом уровне. Настраивает простые цепочки писем и линейные сценарии бота. Использует готовые шаблоны процессов и сообщений. Не умеет работать с условиями, переменными, API. Зовет на помощь при нестандартных задачах. Подход: работает в рамках интерфейса.", "middle": "Свободно работает в 2-3 платформах (GetCourse + Salebot/BotHelp + сервис рассылок). Строит сложные сценарии с условиями, таймерами, метками, переменными. Настраивает интеграции через webhook и API. Связывает рассылку, бота и CRM в единый процесс. Дебажит и оптимизирует существующие автоматизации. Подход: использует платформу на 80% возможностей.", "senior": "Эксперт в стеке автоматизации, выбирает платформы под задачу бизнеса. Проектирует сложные системы с десятками сценариев и сотнями ветвлений. Пишет ТЗ программистам на доработки и интеграции. Внедряет no-code/low-code инструменты (Make, n8n, Zapier) для сшивки сервисов. Обучает команду, создает регламенты и базу знаний по автоматизациям. Подход: проектирует MarTech-стек, а не настраивает инструменты."}, {"name": "Лид-магниты, трипваеры и продуктовая упаковка воронки", "junior": "Собирает лид-магниты по запросу (PDF-чек-лист, гайд) на базе материалов команды. Не участвует в выборе оферов и продуктовой упаковке. Не различает функции лид-магнита, трипваера и основного офера. Использует первый пришедший в голову формат. Подход: выполняет задачу 'нужен лид-магнит'.", "middle": "Подбирает форматы лид-магнита и трипваера под сегмент и этап осознанности. Тестирует 2-3 варианта офера до выкатки в прод. Связывает лид-магнит с проблемой, которую решает основной продукт. Предлагает идеи трипваеров (мини-курс, диагностика, разбор, интенсив за 990 руб.). Считает unit-экономику трипваера отдельно. Подход: офер - это продукт со своей метрикой.", "senior": "Проектирует продуктовую матрицу воронки: серия лид-магнитов, лесенка трипваеров, основной + premium + допродажа. Влияет на разработку продуктовой линейки совместно с продюсером и методистом. Создает уникальные категорийные оферы (новые форматы для рынка). Управляет ассортиментной стратегией воронки на горизонте года. Связывает офер с позиционированием бренда и долгосрочным LTV. Подход: продуктовая упаковка как стратегический рычаг роста."}, {"name": "Запуски и автовебинарные воронки", "junior": "Поддерживает технически уже работающие автовебинарные воронки. Меняет даты, ссылки, настройки повторов по чек-листу. Не участвует в проектировании сценария вебинара. Не понимает структуру продающего вебинара (история-боль-инсайт-офер-дожим). Помогает на запусках в роли исполнителя. Подход: техническая поддержка процесса.", "middle": "Полностью собирает автовебинарную воронку с нуля: трафик → регистрация → дожимы до вебинара → продажа → дожим до оплаты. Участвует в разработке сценария вебинара совместно с экспертом. Запускает живые запуски с прогревом 5-10 дней. Считает доходимость, конверсию в заявку, конверсию в оплату по каждому шагу. Тестирует разные форматы (вебинар, мини-курс, марафон, челлендж). Подход: запуск как управляемый проект.", "senior": "Проектирует мульти-запуски и evergreen-воронки, работающие 24/7. Создает методологию запусков для компании: чек-листы, регламенты, шаблоны. Управляет несколькими параллельными запусками разных продуктов. Внедряет гибридные модели (автовебинар + менеджеры + дожимы в боте). Анализирует и переносит лучшие практики между продуктами линейки. Подход: запуски как воспроизводимая система, а не разовое событие."}, {"name": "Сквозная аналитика и метрики воронки", "junior": "Смотрит готовые отчеты в GetCourse / Яндекс.Метрике / рекламных кабинетах. Понимает базовые метрики: CPL, CTR, конверсия в оплату. Считает в Excel простые сводки по запросу. Не строит сквозную аналитику от рекламы до повторной покупки. Не различает атрибуцию по моделям. Подход: фиксирует то, что показывают системы.", "middle": "Настраивает UTM-разметку и сквозную аналитику от клика до оплаты. Собирает дашборды в Google Sheets / Roistat / Power BI / Yandex DataLens. Считает unit-экономику воронки в разрезе источников и когорт. Понимает модели атрибуции (last-click, first-click, linear) и применяет их под задачу. Выявляет узкие места воронки на основе данных. Подход: метрика как инструмент управления.", "senior": "Проектирует архитектуру сквозной аналитики компании: что считаем, где храним, как визуализируем. Внедряет multi-touch attribution и когортный анализ как стандарт. Строит предиктивные модели (LTV, отток, окупаемость когорт). Использует SQL для работы напрямую с базами. Связывает маркетинговые метрики с финансовыми показателями компании. Подход: данные как актив для принятия стратегических решений."}, {"name": "Тестирование гипотез и growth-подход", "junior": "Запускает тесты по указанию руководителя. Меняет один элемент за раз (тема письма, заголовок лендинга). Не считает статистическую значимость. Не документирует результаты системно. Делает выводы на малых выборках. Подход: 'давайте попробуем'.", "middle": "Формулирует гипотезы по структуре (что, зачем, как измерим, что считаем успехом). Приоритизирует backlog гипотез по ICE/RICE. Запускает A/B-тесты с корректным сплитом и достаточной выборкой. Ведет таблицу гипотез с результатами и learnings. Масштабирует выигравшие варианты, откатывает проигравшие. Подход: эксперимент как стандарт работы.", "senior": "Внедряет growth-процесс в команде: ритуалы, бэклог, скоринг, ретро. Строит growth-команду или внутренний growth-процесс с другими ролями. Использует продвинутые методы (multi-armed bandit, sequential testing). Создает культуру экспериментов: knowledge base, библиотека learnings, обучение команды. Связывает growth-цикл с OKR компании. Подход: growth-процесс как двигатель роста бизнеса."}, {"name": "Лендинги, квизы, формы (UX и конверсия)", "junior": "Собирает лендинги в конструкторах (Tilda, Taplink, GetCourse). Использует готовые блоки и шаблоны. Не углубляется в UX, ограничен дизайном из конструктора. Не настраивает события и цели для аналитики. Не тестирует CRO-гипотезы. Подход: 'красиво и по ТЗ'.", "middle": "Собирает структуру лендинга под задачу: продающие блоки, логика прогрева, отработка возражений. Работает с дизайнером по ТЗ и брендгайду. Настраивает цели в Метрике/Аналитике, события в пиксели. Запускает CRO-тесты (заголовки, CTA, формы, квизы). Знает основы UX, типографики, мобильной верстки. Подход: лендинг как инструмент конверсии.", "senior": "Проектирует системы лендингов и квизов под разные сегменты и сценарии. Внедряет персонализацию (динамический контент по UTM, поведенческим сигналам). Управляет CRO-программой: бэклог гипотез, регулярные тесты, отчетность. Связывает CRO с unit-экономикой воронки целиком. Создает шаблоны и компонентную библиотеку лендингов для команды. Подход: CRO как непрерывный процесс."}, {"name": "Работа с CRM и сегментация базы", "junior": "Заводит лидов в CRM по чек-листу. Использует базовые теги и сегменты, созданные другими. Не строит сегментацию самостоятельно. Не работает с реактивацией базы. Не интегрирует CRM с воронками. Подход: 'хранилище контактов'.", "middle": "Самостоятельно проектирует систему тегов и сегментов под бизнес. Настраивает интеграции CRM с воронками, рассылками, ботами. Запускает реактивационные кампании по холодной базе. Сегментирует по поведению, RFM, источнику, продуктовому интересу. Передает квалифицированные лиды в отдел продаж по регламенту. Подход: CRM как двигатель повторных продаж.", "senior": "Проектирует архитектуру работы с базой на уровне компании (CDP-подход). Внедряет lead scoring и автоматическую квалификацию лидов. Строит lifecycle-маркетинг: онбординг, активация, удержание, реактивация, win-back. Управляет LTV через продуманные допродажи и cross-sell цепочки. Связывает CRM-данные с продуктовой аналитикой и финансами. Подход: база как ключевой актив компании."}, {"name": "Платный трафик на воронку", "junior": "Запускает простые кампании по готовым настройкам в одном канале. Не подбирает стратегию закупа самостоятельно. Базовое понимание метрик трафика (CPC, CTR, CPM). Не оптимизирует кампании, ждет указаний. Не связывает трафик с метриками воронки. Подход: исполнитель ТЗ от трафик-менеджера.", "middle": "Самостоятельно ведет 1-2 канала на уровне специалиста (VK Ads / Яндекс.Директ / Telegram Ads). Подбирает аудитории, креативы, посадочные под сегмент. Оптимизирует кампании по CPL и конверсии в оплату, а не по кликам. Тестирует креативы и связки трафик-лендинг-воронка. Считает окупаемость трафика по когортам. Подход: трафик как часть unit-экономики.", "senior": "Управляет мультиканальным трафиком (платный + органический + партнерский + influence). Координирует команду закупщиков или агентство, ставит KPI и контролирует. Балансирует портфель каналов под бизнес-задачу (рост, окупаемость, доля рынка). Внедряет attribution и incrementality testing для честной оценки каналов. Видит трафик в связке с продуктом и брендом. Подход: трафик как стратегический ресурс роста."}, {"name": "Финансовая грамотность и unit-экономика воронки", "junior": "Понимает базовые показатели: цена, выручка, конверсия. Считает CPL и CTR. Не различает выручку и маржу. Не учитывает себестоимость продукта и комиссии. Не считает окупаемость когорты во времени. Подход: смотрит на верхние метрики.", "middle": "Считает полную unit-экономику воронки: CPL, CPO, CAC, AOV, LTV, маржинальность. Понимает разницу между выручкой, маржой и cash flow. Строит модели окупаемости когорт на горизонте 30/60/90 дней. Прогнозирует выручку запуска до его старта. Защищает бюджет на основе расчетов. Подход: unit-экономика как язык работы.", "senior": "Управляет P&L воронки и маркетингового направления. Влияет на ценообразование, продуктовую упаковку, monetization-стратегию. Строит сценарные финансовые модели (оптимистичный/реалистичный/пессимистичный). Защищает инвестиции в маркетинг перед C-level через ROI и payback. Связывает воронку с финансами компании и cash flow. Подход: маркетинг как функция P&L."}, {"name": "Решение проблем и устранение узких мест воронки", "junior": "Замечает падение метрик с задержкой. Эскалирует проблему руководителю без диагностики. Не умеет локализовать узкое место в воронке. Реагирует на симптомы, а не на причины. Применяет одни и те же стандартные решения. Подход: 'у нас упала конверсия, что делать?'", "middle": "Регулярно мониторит метрики по шагам воронки. Локализует узкое место (где конкретно проседает: трафик, регистрация, доходимость, оплата). Выдвигает 2-3 гипотезы причин и проверяет их. Внедряет точечные исправления и измеряет эффект. Документирует разборы для команды. Подход: проблема как точка роста.", "senior": "Видит системные ограничения воронки и бизнеса в целом. Различает локальные неисправности и архитектурные дефекты. Перестраивает воронку при достижении ее потолка. Создает диагностические фреймворки для команды. Превращает проблемы воронки в стратегические инсайты для бизнеса. Подход: системный взгляд на эффективность."}, {"name": "Понимание EdTech-продукта и образовательного CJM", "junior": "Знает в общих чертах, что продает компания. Не различает форматы онлайн-образования (курс, интенсив, наставничество, клуб, академия). Не учитывает специфику принятия решения в EdTech (длинный CJM, сомнения, рассрочка). Работает с продуктом как с любым другим товаром. Подход: 'продаем как все'.", "middle": "Глубоко понимает продукт: программу, методологию, результаты студентов. Учитывает специфику EdTech CJM: длинный прогрев, важность доказательств, страхи (не дойду, не получится). Адаптирует воронку под формат продукта (короткий курс vs длинная программа vs клуб). Работает с возражениями про время, деньги, веру в результат. Использует кейсы, отзывы, метрики студентов. Подход: 'продаем образовательный результат'.", "senior": "Влияет на упаковку продукта на уровне формата, обещания, методологии. Видит тренды EdTech и адаптирует воронки под изменения рынка. Понимает разницу B2C/B2B/B2G в онлайн-образовании. Влияет на retention и образовательный результат через коммуникации воронки. Связывает воронку с миссией и долгосрочной ценностью продукта. Подход: маркетинг как часть образовательного опыта."}, {"name": "Стратегическое мышление и планирование воронок", "junior": "Планирует на горизонте недели-двух. Работает по задачам в Trello/Notion от руководителя. Не участвует в квартальном планировании. Не видит связи между разными активностями. Подход: операционное исполнение.", "middle": "Планирует свой блок работы на квартал: какие воронки запустить, какие гипотезы протестировать. Связывает план воронок с целями компании по выручке. Балансирует операционку и развитие. Защищает свой план перед руководителем с цифрами. Подход: тактическое планирование с привязкой к KPI.", "senior": "Формирует стратегию развития воронок на горизонт года-двух. Проектирует портфель воронок под продуктовую линейку и сегменты. Закладывает развитие новых каналов и форматов. Каскадирует стратегию в OKR команды. Защищает стратегию перед C-level и собственником. Подход: стратег функции воронок."}, {"name": "Работа с командой и подрядчиками", "junior": "Не управляет людьми. Взаимодействует с дизайнером, копирайтером, верстальщиком как заказчик задач. Ставит задачи неполно, требует переделок. Не оценивает качество работы подрядчиков. Подход: 'я скажу что нужно'.", "middle": "Координирует работу 2-4 подрядчиков (дизайнер, копирайтер, таргетолог, монтажер). Пишет четкие ТЗ с критериями приемки. Контролирует сроки и качество, дает обратную связь. Подбирает подрядчиков под задачу, оценивает портфолио. Управляет бюджетом подрядчиков. Подход: 'я отвечаю за результат команды'.", "senior": "Управляет командой 5+ человек (junior/middle специалисты + подрядчики). Нанимает, онбордит, развивает сотрудников. Внедряет процессы планирования, ретро, 1:1. Создает культуру результата и ответственности. Делегирует операционку, фокусируется на стратегии и сложных кейсах. Подход: 'я строю команду, которая делает результат'."}, {"name": "Работа с гипотезами на уровне смыслов и позиционирования", "junior": "Работает с готовыми смыслами и позиционированием. Не различает уровни гипотез (канал, креатив, офер, смысл, позиционирование). Тестирует только верхний уровень (заголовки, картинки). Подход: 'тестирую то, что просят'.", "middle": "Тестирует гипотезы на уровне офера и смыслов (какую боль закрываем, как формулируем результат). Понимает разницу между тестом креатива и тестом смысла. Проводит CustDev и собирает речь клиента до запуска кампаний. Адаптирует смыслы под сегменты. Подход: 'тестирую гипотезы о клиенте'.", "senior": "Тестирует гипотезы на уровне позиционирования и категории. Влияет на формулировку ключевого обещания продукта. Связывает смыслы воронки с долгосрочным брендом. Создает уникальные категорийные смыслы (новые термины, фреймворки). Подход: 'смыслы как стратегический рычаг'."}, {"name": "AI-инструменты в работе автоворонщика", "junior": "Использует ChatGPT/Claude для генерации текстов писем и постов. Применяет готовые промпты, найденные в интернете. Не редактирует AI-выдачу глубоко. Не использует AI для анализа данных. Подход: 'AI как ассистент-копирайтер'.", "middle": "Использует AI для разных задач: копирайтинг, разбор отзывов, кластеризация ЦА, генерация гипотез. Пишет собственные промпты под задачу с учетом контекста бизнеса. Применяет AI для анализа диалогов с менеджерами и звонков. Использует AI-инструменты для авто-сегментации и персонализации. Подход: 'AI как способ ускорить рутину'.", "senior": "Внедряет AI-агентов в воронку: квалификация лидов, авто-ответы в боте, персонализация коммуникаций. Создает кастомные GPT/AI-ассистенты под задачи команды. Использует AI для предиктивной аналитики и скоринга. Внедряет AI-инструменты как стандарт работы команды и обучает им. Подход: 'AI как операционный рычаг команды'."}, {"name": "Документирование воронок и передача знаний", "junior": "Не ведет документации. Знание воронки 'в голове'. При уходе в отпуск воронку поддержать сложно. Подход: 'я и так все помню'.", "middle": "Документирует свои воронки: схема в Miro/Figma, регламент работы, чек-листы запуска. Ведет таблицу гипотез и результатов. Передает воронку коллеге без потери качества. Подход: 'документация как страховка'.", "senior": "Создает базу знаний по воронкам компании: шаблоны, фреймворки, кейсы, learnings. Внедряет стандарты документирования для всей команды. Превращает индивидуальные знания в командный актив. Обучает команду через внутренние материалы. Подход: 'знания как актив компании'."}], "Эксперт & амбассадор": [{"name": "Content Strategy & Creation (Контент-стратегия и создание контента)", "junior": "Создаёт контент по готовому контент-плану и шаблонам • Снимает видео/сторис по заданным темам и сценариям • Понимает основные форматы: лонг-видео, шортсы, подкасты, посты • Умеет работать перед камерой, выдерживает базовый хронометраж • Готовит материал к съёмке: тезисы, реквизит, локацию • Выпускает контент по плану, соблюдает дедлайны", "middle": "Формирует контент-стратегию канала на квартал и управляет воронкой контента • Разрабатывает сценарии с учётом глубины просмотра и удержания • Строит контент-воронку: развлекательный → образовательный → продающий • Анализирует аналитику каждого выпуска и корректирует стратегию • Тестирует форматы, хуки и темы через A/B подход • Стабильно удерживает целевой уровень просмотров • Координирует продакшн-команду: монтажёр, оператор, дизайнер", "senior": "Создаёт медиа-экосистему с предсказуемым трафиком на целевом уровне • Контент-стратегия на год, привязанная к бизнес-целям и запускам • Создаёт «вирусные» концепции и серии, генерирующие органический рост • Управляет несколькими каналами и форматами одновременно • Интегрирует контент с продуктовой линейкой и прогревами • Формирует стандарты качества, по которым команда работает автономно • Зада
